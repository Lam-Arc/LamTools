<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Sunday · stage</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #08080a; }

      /* Determinism first: the picture has to be a pure function of the time
         the driver asks for. Anything driven by CSS runs on wall-clock time
         and would make two renders of the same frame differ. */
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        caret-color: transparent !important;
      }
      html { scroll-behavior: auto !important; }

      #stage { position: absolute; inset: 0; }
      .ambient { position: absolute; inset: 0;
        background:
          radial-gradient(1200px 700px at 50% 44%, rgba(255,255,255,0.05), rgba(255,255,255,0) 62%),
          radial-gradient(1500px 780px at 50% 116%, rgba(101,84,217,0.12), rgba(0,0,0,0) 60%),
          #0a0a0c; }
      .grain { position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; }

      /* The product lives in its own document. Its root lays itself out for the
         size it is given, so the film frames it in a real box: a change of this
         box is a change of the product's own layout, not a scaled picture. */
      #frame { position: absolute; border: 0; display: block; overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 40px 90px rgba(0,0,0,0.45); }
      #overlay { position: absolute; inset: 0; pointer-events: none; }

      .cursor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
        background: #f2f3f7; box-shadow: 0 0 0 6px rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.5); }
      .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(101,84,217,0.9); transform-origin: 50% 50%; }

      #caption { position: absolute; left: 120px; bottom: 22px; }
      #caption:not(.on) { display: none; }
      .cap-title { font-size: 24px; letter-spacing: 0.04em; color: rgba(238,240,244,0.82); }
      .cap-hint { margin-top: 5px; font-size: 18px; letter-spacing: 0.05em; color: rgba(238,240,244,0.42); }

      #hud { position: absolute; right: 120px; bottom: 26px; font-size: 19px; letter-spacing: 0.08em;
        color: rgba(238,240,244,0.36); font-variant-numeric: tabular-nums; }
      #hud:not(.on) { display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="ambient"></div>
      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1920" height="1080" filter="url(#g)" />
      </svg>
      <iframe id="frame" title="Sunday"></iframe>
      <div id="overlay"></div>
      <div id="caption"><div class="cap-title" id="capTitle"></div><div class="cap-hint" id="capHint"></div></div>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
