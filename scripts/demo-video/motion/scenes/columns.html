<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>columns</title>
<script src="_kit.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080a; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #eef0f4; }

  .ambient { position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 44%, rgba(255,255,255,0.05), rgba(255,255,255,0) 62%),
      radial-gradient(1500px 780px at 50% 116%, rgba(101,84,217,0.12), rgba(0,0,0,0) 60%),
      #0a0a0c; }
  .grain { position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; }

  /* One surface, three regions.  Not cards: the panel is a single rectangle and
     the columns are its sections, sharing edges — dividers are hairlines. */
  .panel { position: absolute; left: 120px; top: 96px; width: 1680px; height: 888px;
    border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.022));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 40px 90px rgba(0,0,0,0.45); }
  .panel-top { position: absolute; left: 0; right: 0; top: 0; height: 1.5px; z-index: 3;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0)); }

  .col { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .col-surface { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(180deg, rgba(101,84,217,0.10), rgba(101,84,217,0.02)); }
  .col-divider { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.14); z-index: 2; }

  .col-title { position: absolute; left: 44px; top: 300px; font-size: 40px; font-weight: 600; white-space: nowrap; }
  .col-sub { position: absolute; left: 44px; top: 358px; font-size: 21px; color: rgba(238,240,244,0.45); white-space: nowrap; }
  .col-row { position: absolute; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.09); }
  .col-meter { position: absolute; left: 44px; top: 596px; font-size: 20px; letter-spacing: 0.06em;
    color: rgba(238,240,244,0.40); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* the slot a column is about to drop into */
  .slot { position: absolute; top: 0; height: 888px; width: 1px; opacity: 0; z-index: 4;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0)); }

  .cap { position: absolute; left: 92px; bottom: 78px; background: rgba(8,8,10,0.78);
    border-radius: 12px; padding: 16px 26px 18px; }
  .cap-title { font-size: 28px; letter-spacing: 0.04em; color: rgba(238,240,244,0.9); }
  .cap-hint { margin-top: 8px; font-size: 21px; letter-spacing: 0.05em; color: rgba(238,240,244,0.48); }
  .cap-hint em { font-style: normal; color: rgba(101,84,217,0.95); }

  .track { position: absolute; left: 120px; right: 120px; bottom: 26px; height: 26px; }
  .track-line { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(255,255,255,0.16); }
  .track-block { position: absolute; top: 8px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.16); }
  .track-block.active { background: rgba(101,84,217,0.85); }
  .track-name { position: absolute; top: -16px; font-size: 18px; letter-spacing: 0.06em; color: rgba(238,240,244,0.45); }
  .track-head { position: absolute; top: 2px; width: 1.5px; height: 22px; background: #6554d9; }
  .hud-time { position: absolute; right: 120px; bottom: 60px; font-size: 21px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.36); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <svg class="grain" width="1920" height="1080" aria-hidden="true">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1920" height="1080" filter="url(#g)" />
  </svg>

  <div class="panel" id="panel">
    <div class="panel-top"></div>
    <div class="col" id="col0"><div class="col-surface" id="surf0"></div><div id="body0"></div></div>
    <div class="col" id="col1"><div class="col-surface" id="surf1"></div><div id="body1"></div></div>
    <div class="col" id="col2"><div class="col-surface" id="surf2"></div><div id="body2"></div></div>
    <div class="col-divider" id="div0"></div>
    <div class="col-divider" id="div1"></div>
    <div class="slot" id="slot0"></div>
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
  </div>

  <div class="cap" id="cap"><div class="cap-title" id="capTitle"></div><div class="cap-hint" id="capHint"></div></div>
  <div class="hud-time" id="hudTime"></div>
  <div class="track"><div class="track-line"></div><div id="trackBlocks"></div><div class="track-head" id="trackHead"></div></div>

<script>
const { seg, lerp, ease, style } = window.MotionKit

/* ---------------------------------------------------------------------------
 * Three regions of ONE surface, laid out horizontally and joined edge to edge.
 *
 *  - they are inserted alternately: the first drops in from above, the second
 *    rises from below, the third drops in from above again
 *  - then the widths redistribute: the first widens (the other two give up
 *    space), then the middle one widens, then the third
 *  - no gaps, no per-region rounding: the dividers are hairlines, so the three
 *    read as sections of a single rectangle
 * ------------------------------------------------------------------------ */

const PANEL = { x: 120, y: 96, w: 1680, h: 888 }
const EQ = PANEL.w / 3            // 560 — equal thirds
const WIDE = 1000
const NARROW = (PANEL.w - WIDE) / 2  // 340 — what the other two shrink to

const COLS = [
  { id: 0, title: '实现功能', sub: '一句话到能用的应用', from: 'top' },
  { id: 1, title: '办公', sub: '报表 · 文档 · 演示', from: 'bottom' },
  { id: 2, title: '做小游戏', sub: '能玩的那种', from: 'top' },
]

const STEPS = [
  { id: 'C1', at: 0.30, dur: 0.70, note: '第一块从上方落入' },
  { id: 'C2', at: 1.15, dur: 0.70, note: '第二块从下方落入（交错）' },
  { id: 'C3', at: 2.00, dur: 0.70, note: '第三块从上方落入' },
  { id: 'C4', at: 3.40, dur: 0.90, note: '第一块拓宽 —— 另外两块交出宽度' },
  { id: 'C5', at: 5.30, dur: 0.90, note: '中间这块拓宽' },
  { id: 'C6', at: 7.20, dur: 0.90, note: '第三块拓宽' },
]
const TOTAL = 9.4

const els = {}
const $ = (id) => (els[id] = els[id] || document.getElementById(id))

function buildBodies() {
  COLS.forEach((col, i) => {
    let html = `<div class="col-title">${col.title}</div><div class="col-sub">${col.sub}</div>`
    for (let r = 0; r < 3; r += 1) {
      html += `<div class="col-row" style="left:44px;top:${420 + r * 30}px;width:${220 - r * 46}px"></div>`
    }
    html += `<div class="col-meter" id="meter${i}"></div>`
    $(`body${i}`).innerHTML = html
  })
}
buildBodies()

function buildTrack() {
  let html = ''
  for (const step of STEPS) {
    html += `<div class="track-block" data-block="${step.id}" style="left:${((step.at / TOTAL) * 100).toFixed(2)}%;width:${((step.dur / TOTAL) * 100).toFixed(2)}%"></div>`
    html += `<div class="track-name" style="left:${((step.at / TOTAL) * 100).toFixed(2)}%">${step.id}</div>`
  }
  $('trackBlocks').innerHTML = html
}
buildTrack()

/** which column owns the width at a given moment */
function ownerAt(t) {
  if (t < STEPS[3].at) return -1
  if (t < STEPS[4].at) return 0
  if (t < STEPS[5].at) return 1
  return 2
}

window.sceneMeta = { duration: TOTAL, width: 1920, height: 1080 }

window.renderFrame = (t) => {
  const owner = ownerAt(t)

  /* width redistribution, blended while a step runs */
  let blend = 1
  let fromOwner = owner
  for (let i = 3; i < STEPS.length; i += 1) {
    const step = STEPS[i]
    if (t >= step.at && t < step.at + step.dur) {
      blend = ease.expoOut(seg(t, step.at, step.at + step.dur))
      fromOwner = i === 3 ? -1 : i - 4
    }
  }
  const widthFor = (i) => {
    const w0 = fromOwner === -1 ? EQ : i === fromOwner ? WIDE : NARROW
    const w1 = owner === -1 ? EQ : i === owner ? WIDE : NARROW
    return lerp(w0, w1, blend)
  }

  /* the three columns share the panel's full width, joined edge to edge */
  const widths = [widthFor(0), widthFor(1), widthFor(2)]
  const total = widths[0] + widths[1] + widths[2]
  const scale = PANEL.w / total
  const xs = [0, widths[0] * scale, (widths[0] + widths[1]) * scale]
  const w = widths.map((value) => value * scale)

  COLS.forEach((col, i) => {
    const node = $(`col${i}`)
    const step = STEPS[i]
    const insert = ease.softBack(seg(t, step.at, step.at + step.dur))
    const dir = col.from === 'top' ? -1 : 1
    const travel = (1 - insert) * dir * (PANEL.h + 40)

    style(node, {
      left: `${xs[i].toFixed(2)}px`,
      width: `${w[i].toFixed(2)}px`,
      transform: `translateY(${travel.toFixed(2)}px)`,
      opacity: Math.min(1, seg(t, step.at, step.at + 0.12) * 1.5),
    })

    // the focused section gets a faint surface tint, not a border of its own
    const emphasis = owner === i ? 1 : 0
    let em = emphasis
    for (let s = 3; s < STEPS.length; s += 1) {
      const step = STEPS[s]
      const active = s - 3
      if (t >= step.at && t < step.at + step.dur) {
        const p = ease.expoOut(seg(t, step.at, step.at + step.dur))
        const was = active - 1
        em = i === active ? p : i === was ? 1 - p : 0
      }
    }
    style($(`surf${i}`), { opacity: em * 0.85 })
    $(`meter${i}`).textContent = `${Math.round(w[i])} px${em > 0.5 ? ' · 焦点' : ''}`

    // slot guide: a hairline standing where this section will drop in
    const guide = seg(t, step.at - 0.5, step.at + 0.12)
    style($(`slot${i}`), {
      opacity: guide > 0 && guide < 1 ? Math.sin(Math.PI * guide) * 0.75 : 0,
      left: `${xs[i].toFixed(2)}px`,
    })
  })

  // hairline dividers sit exactly on the shared edges
  style($('div0'), { left: `${xs[1].toFixed(2)}px`, opacity: seg(t, STEPS[1].at, STEPS[1].at + 0.3) })
  style($('div1'), { left: `${(xs[2]).toFixed(2)}px`, opacity: seg(t, STEPS[2].at, STEPS[2].at + 0.3) })

  /* captions + hud */
  let current = STEPS[0]
  for (const step of STEPS) if (t >= step.at) current = step
  $('capTitle').textContent = `${current.id} · ${current.note}`
  $('capHint').innerHTML =
    owner === -1
      ? `三等分，每块 ${EQ} px；合起来是一整块 ${PANEL.w} × ${PANEL.h} 的矩形`
      : `焦点块 ${WIDE} px，其余各 ${NARROW} px（横向相连，不是卡片）`
  $('hudTime').textContent = `${t.toFixed(1)}s / ${TOTAL.toFixed(1)}s`
  document.querySelectorAll('[data-block]').forEach((node) => {
    node.classList.toggle('active', node.dataset.block === current.id)
  })
  style($('trackHead'), { left: `${((t / TOTAL) * 100).toFixed(3)}%` })
}

window.__sceneReady = true
</script>
</body>
</html>
