<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>blocking · act two</title>
<script src="_kit.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080a; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #eef0f4; }

  .ambient { position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 44%, rgba(255,255,255,0.05), rgba(255,255,255,0) 62%),
      radial-gradient(1500px 780px at 50% 116%, rgba(101,84,217,0.12), rgba(0,0,0,0) 60%),
      #0a0a0c; }
  .grain { position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; }

  .panel { position: absolute; left: 120px; top: 96px; width: 1680px; height: 888px;
    border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.018));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 40px 90px rgba(0,0,0,0.45); }

  /* ---- what act one left on stage ---- */
  #product { position: absolute; inset: 0; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)); }
  .prod-tag { position: absolute; left: 44px; bottom: 40px; font-size: 20px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.34); }
  .tile { position: absolute; border-radius: 10px; background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }

  /* ---- the three columns ---- */
  .col { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .col-surface { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(180deg, rgba(101,84,217,0.10), rgba(101,84,217,0.02)); }
  .col-title { position: absolute; left: 44px; top: 300px; font-size: 40px; font-weight: 600; white-space: nowrap; }
  .col-sub { position: absolute; left: 44px; top: 358px; font-size: 21px; color: rgba(238,240,244,0.45); white-space: nowrap; }
  .col-line { position: absolute; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.09); }
  .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.16); }

  /* ---- chat column ---- */
  #chat { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .bubble { position: absolute; border-radius: 14px; background: rgba(101,84,217,0.16);
    box-shadow: inset 0 0 0 1px rgba(101,84,217,0.30); }
  .bubble-text { position: absolute; left: 20px; top: 14px; right: 18px; font-size: 20px; line-height: 1.45;
    color: rgba(240,242,246,0.94); }
  .row { position: absolute; left: 44px; right: 22px; height: 26px; }
  .row-dot { position: absolute; left: 0; top: 7px; width: 11px; height: 11px; border-radius: 50%;
    background: rgba(101,84,217,0.95); }
  .row-text { position: absolute; left: 24px; top: 2px; font-size: 19px; white-space: nowrap;
    color: rgba(238,240,244,0.62); }
  .row-src { color: rgba(238,240,244,0.40); }
  .row-hi { color: rgba(196,187,252,0.95); }

  /* ---- work area ---- */
  #work { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .w-title { position: absolute; border-radius: 6px; background: rgba(255,255,255,0.26); }
  .w-cell { position: absolute; height: 14px; border-radius: 4px; background: rgba(255,255,255,0.09); transform-origin: 0 50%; }
  .w-bar { position: absolute; border-radius: 4px 4px 0 0; background: rgba(101,84,217,0.45); transform-origin: 50% 100%; }
  .w-frame { position: absolute; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); }
  .dl { position: absolute; height: 12px; border-radius: 3px; background: rgba(255,255,255,0.12); transform-origin: 0 50%; }
  .dl.add { background: rgba(120,200,150,0.34); }
  .dl.del { background: rgba(214,120,120,0.26); }
  .dl-gutter { position: absolute; width: 3px; border-radius: 2px; background: rgba(255,255,255,0.20); }
  .cal-cell { position: absolute; border-radius: 5px; background: rgba(255,255,255,0.09); }
  .dir-row { position: absolute; height: 30px; border-radius: 6px; background: rgba(255,255,255,0.07); }
  .deck { position: absolute; border-radius: 8px; background: rgba(255,255,255,0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); }

  /* ---- docked arrangements ---- */
  .mark { position: absolute; right: 40px; height: 34px; border-radius: 10px;
    background: rgba(101,84,217,0.16); box-shadow: inset 0 0 0 1px rgba(101,84,217,0.32); }
  .mark-dot { position: absolute; left: 12px; top: 12px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(150,135,245,0.95); }
  .mark-text { position: absolute; left: 30px; top: 6px; font-size: 18px; white-space: nowrap;
    color: rgba(226,222,250,0.92); }
  .mark-glow { position: absolute; inset: 0; border-radius: 10px; background: #ffffff; opacity: 0; }

  /* ---- time passing ---- */
  #time { position: absolute; inset: 0; opacity: 0; }
  .time-scrim { position: absolute; inset: 0; background: rgba(8,8,10,0.88); }
  .flow-row { position: absolute; left: 300px; right: 300px; height: 52px; border-radius: 8px;
    background: rgba(255,255,255,0.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .flow-line { position: absolute; left: 20px; top: 20px; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.16); }
  .flow-date { position: absolute; right: 20px; top: 16px; font-size: 19px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.42); font-variant-numeric: tabular-nums; }

  .cursor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: #f2f3f7; box-shadow: 0 0 0 6px rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.5); }
  .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(101,84,217,0.9); transform-origin: 50% 50%; }

  #endcard { position: absolute; inset: 0; background: #08080a; opacity: 0; }
  .endcard-name { position: absolute; left: 0; right: 0; top: 450px; text-align: center;
    font-size: 96px; font-weight: 600; letter-spacing: 0.01em; }
  .endcard-sub { position: absolute; left: 0; right: 0; top: 594px; text-align: center;
    font-size: 24px; letter-spacing: 0.26em; color: rgba(238,240,244,0.42); }

  .cap { position: absolute; left: 92px; bottom: 78px; background: rgba(8,8,10,0.78);
    border-radius: 12px; padding: 16px 26px 18px; }
  .cap-title { font-size: 28px; letter-spacing: 0.04em; color: rgba(238,240,244,0.9); }
  .cap-hint { margin-top: 8px; font-size: 21px; letter-spacing: 0.05em; color: rgba(238,240,244,0.48); }
  .hud-time { position: absolute; right: 120px; bottom: 60px; font-size: 21px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.36); font-variant-numeric: tabular-nums; }
  .track { position: absolute; left: 120px; right: 120px; bottom: 26px; height: 26px; }
  .track-line { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(255,255,255,0.16); }
  .track-tick { position: absolute; top: 6px; width: 1px; height: 5px; background: rgba(255,255,255,0.28); }
  .track-block { position: absolute; top: 8px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.16); }
  .track-block.active { background: rgba(101,84,217,0.85); }
  .track-name { position: absolute; top: -16px; font-size: 17px; letter-spacing: 0.05em; color: rgba(238,240,244,0.45); }
  .track-head { position: absolute; top: 2px; width: 1.5px; height: 22px; background: #6554d9; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <svg class="grain" width="1920" height="1080" aria-hidden="true">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1920" height="1080" filter="url(#g)" />
  </svg>

  <div class="panel" id="panel">
    <div id="colLayer"></div>
    <div id="product"><div class="prod-tag">上一段留在台上的成品 · 小游戏</div><div id="prodInner"></div></div>
    <div id="work"><div id="workInner"></div></div>
    <div id="chat"><div id="chatInner"></div></div>
    <div class="divider" id="splitDivider" style="opacity:0"></div>
    <div id="marks"></div>
    <div id="time"><div class="time-scrim"></div><div id="timeFlow"></div></div>
    <div id="flyLayer"></div>
  </div>

  <div id="endcard">
    <div class="endcard-name">Sunday</div>
    <div class="endcard-sub">LAMTOOLS</div>
  </div>

  <div class="cap" id="cap"><div class="cap-title" id="capTitle"></div><div class="cap-hint" id="capHint"></div></div>
  <div class="hud-time" id="hudTime"></div>
  <div class="track"><div class="track-line"></div><div id="trackBlocks"></div><div class="track-head" id="trackHead"></div></div>

<script>
const { seg, lerp, ease, style, stagger } = window.MotionKit

/* ---------------------------------------------------------------------------
 * STAGING SHEET — act two. Blocking only: which container sits where, when it
 * enters and leaves, and how the three sections hand over to each other.
 * No product UI and no fine motion yet.
 *
 *   F  the game rolls away, the columns come back, office is opened, the report
 *      is made — reading last week's out of the library, storing this week's
 *      back into it — and a weekly arrangement is set
 *   G  a second arrangement, then a run with nobody there
 *   H  a flash through the other faces, the columns again, the name
 *
 * 100 BPM: beat 0.6s, bar 2.4s. 45.6s = 76 beats = 19 bars.
 * Panel-local coordinates (0..1680, 0..888).
 * ------------------------------------------------------------------------ */

const PANEL = { w: 1680, h: 888 }
const NARROW = 340
const WIDE = 1000
const MID_X = NARROW
const CHAT_W = 640
const WORK_X = CHAT_W + 1
const WORK_W = PANEL.w - WORK_X
const BEAT = 0.6

const BEATS = [
  { id: 'F1', at: 0.0, dur: 2.4, note: '上一段的成品上卷退场，三块重新露出来' },
  { id: 'F2', at: 2.4, dur: 1.2, note: '光标点中间那块（办公）' },
  { id: 'F3', at: 3.6, dur: 1.2, note: '办公接管整块表面' },
  { id: 'F4', at: 4.8, dur: 1.2, note: '分栏：对话 + 工作区' },
  { id: 'F5', at: 6.0, dur: 2.4, note: '你说：按上次的格式，把上周的报表做一份' },
  { id: 'F6', at: 8.4, dur: 2.4, note: '过程行① 读了 资料库/报表/上周 ← 资料库·读' },
  { id: 'F7', at: 10.8, dur: 4.8, note: '右半边：报表按拍长出来' },
  { id: 'F8', at: 15.6, dur: 1.8, note: '过程行② 存入 资料库/报表/本周 ← 资料库·写' },
  { id: 'F9', at: 17.4, dur: 2.4, note: '你说：以后每周五都给我一份' },
  { id: 'F10', at: 19.8, dur: 1.8, note: '这句确认浮起，飞到右上角变成一枚长期标记' },
  { id: 'F11', at: 21.6, dur: 1.8, note: '时间过去：会话流向上卷过' },
  { id: 'F12', at: 23.4, dur: 2.4, note: '某个周五：东西已经在那儿了' },
  { id: 'G1', at: 25.8, dur: 2.4, note: '你说：每天早上九点帮我看一下代码改动' },
  { id: 'G2', at: 28.2, dur: 1.8, note: '第二枚标记落到右上角，和第一枚并排' },
  { id: 'G3', at: 30.0, dur: 1.8, note: '时间过去（同一套手法）' },
  { id: 'G4', at: 31.8, dur: 4.2, note: '无人值守：没有光标、没有说话人，只有它在动' },
  { id: 'G5', at: 36.0, dur: 2.4, note: '停在三条意见上；右上角那枚标记轻轻亮一下' },
  { id: 'H1', at: 38.4, dur: 2.4, note: '换台：日历 / 整理好的目录 / 演示' },
  { id: 'H2', at: 40.8, dur: 2.4, note: '三块回来' },
  { id: 'H3', at: 43.2, dur: 2.4, note: '暗场，名字落定' },
]
const TOTAL = 45.6

const COLS = [
  { title: '实现功能', sub: '一句话到能用的应用' },
  { title: '办公', sub: '报表 · 文档 · 演示' },
  { title: '做小游戏', sub: '能玩的那种' },
]

const ME1 = { id: 'F5', text: '按上次的格式，把上周的报表做一份' }
const ME2 = { id: 'F9', text: '以后每周五都给我一份' }
const ME3 = { id: 'G1', text: '每天早上九点帮我看一下代码改动' }
const READ = { id: 'F6', main: '读了 资料库 / 报表 / 上周', src: '按它的格式来' }
const WRITE = { id: 'F8', main: '存入 资料库 / 报表 / 本周', src: '' }
const WATCH = [
  { at: 32.4, main: '读了 3 处改动', src: 'src / core / ui' },
  { at: 33.6, main: '看了 7 个文件', src: '' },
  { at: 34.8, main: '留了 3 条意见', src: '' },
]
const DIFF = [['add', 300], ['add', 220], ['del', 140], ['', 260], ['add', 340], ['', 180], ['add', 250], ['del', 120]]

const beat = (id) => BEATS.find((b) => b.id === id)
const at = (id) => beat(id).at
const els = {}
const $ = (id) => (els[id] = els[id] || document.getElementById(id))

window.sceneMeta = { duration: TOTAL, width: 1920, height: 1080 }

/* ------------------------------------------------------------ static DOM */
function buildDom() {
  let cols = ''
  COLS.forEach((col, i) => {
    let inner = `<div class="col-surface" id="surf${i}"></div>
      <div class="col-title">${col.title}</div><div class="col-sub">${col.sub}</div>`
    for (let r = 0; r < 3; r += 1) {
      inner += `<div class="col-line" style="left:44px;top:${420 + r * 30}px;width:${220 - r * 46}px"></div>`
    }
    cols += `<div class="col" id="col${i}">${inner}</div>`
  })
  cols += `<div class="divider" id="div0"></div><div class="divider" id="div1"></div>`
  $('colLayer').innerHTML = cols

  // what act one left: the finished game, standing still
  const G = { cols: 4, rows: 3, size: 116, gap: 20 }
  const gw = G.cols * G.size + (G.cols - 1) * G.gap
  const gh = G.rows * G.size + (G.rows - 1) * G.gap
  const gx = (PANEL.w - gw) / 2
  let prod = ''
  for (let r = 0; r < G.rows; r += 1) {
    for (let c = 0; c < G.cols; c += 1) {
      prod += `<div class="tile" style="left:${gx + c * (G.size + G.gap)}px;top:${96 + r * (G.size + G.gap)}px;width:${G.size}px;height:${G.size}px"></div>`
    }
  }
  $('prodInner').innerHTML = prod

  // the report, as it will be built
  let rep = ''
  rep += `<div class="w-frame" id="repFrame" style="left:180px;top:96px;width:680px;height:560px;opacity:0"></div>`
  rep += `<div class="w-title" id="repTitle" style="left:200px;top:120px;width:300px;height:22px;opacity:0"></div>`
  for (let r = 0; r < 6; r += 1) {
    for (let c = 0; c < 4; c += 1) {
      rep += `<div class="w-cell" id="cell${r}-${c}" style="left:${200 + (c === 0 ? 0 : 220 + (c - 1) * 150)}px;top:${190 + r * 44}px;width:${c === 0 ? 180 : 120}px;opacity:0"></div>`
    }
  }
  for (let b = 0; b < 6; b += 1) {
    const h = 60 + ((b * 71) % 130)
    rep += `<div class="w-bar" id="bar${b}" style="left:${220 + b * 96}px;top:${640 - h}px;width:64px;height:${h}px;opacity:0"></div>`
  }
  $('workInner').innerHTML = rep

  // chat: your lines and the rows between them. The two sessions never share
  // the column — the weekly delivery clears the first one away.
  let chat = `<div class="bubble" id="me1" style="left:136px;top:40px;width:460px;height:72px;opacity:0">
      <div class="bubble-text">${ME1.text}</div></div>`
  chat += `<div class="row" id="read" style="top:136px;opacity:0">
      <div class="row-dot"></div>
      <div class="row-text"><span class="row-hi">${READ.main}</span> <span class="row-src">${READ.src}</span></div></div>`
  chat += `<div class="row" id="write" style="top:194px;opacity:0">
      <div class="row-dot"></div>
      <div class="row-text"><span class="row-hi">${WRITE.main}</span></div></div>`
  chat += `<div class="bubble" id="me2" style="left:196px;top:268px;width:400px;height:64px;opacity:0">
      <div class="bubble-text">${ME2.text}</div></div>`
  chat += `<div class="row" id="deliver" style="top:30px;opacity:0">
      <div class="row-dot" style="background:rgba(150,135,245,0.9)"></div>
      <div class="row-text"><span class="row-src">每周五 ·</span> <span class="row-hi">已经做好放在那儿了</span></div></div>`
  chat += `<div class="bubble" id="me3" style="left:116px;top:92px;width:480px;height:72px;opacity:0">
      <div class="bubble-text">${ME3.text}</div></div>`
  WATCH.forEach((w, i) => {
    chat += `<div class="row" id="w${i}" style="top:${188 + i * 58}px;opacity:0">
      <div class="row-dot"></div>
      <div class="row-text"><span class="row-hi">${w.main}</span> <span class="row-src">${w.src}</span></div></div>`
  })
  $('chatInner').innerHTML = chat

  $('marks').innerHTML = `
    <div class="mark" id="mark1" style="top:26px;width:154px;opacity:0">
      <div class="mark-dot"></div><div class="mark-text">每周五</div><div class="mark-glow" id="markGlow1"></div></div>
    <div class="mark" id="mark2" style="top:74px;width:174px;opacity:0">
      <div class="mark-dot"></div><div class="mark-text">每天 09:00</div><div class="mark-glow" id="markGlow2"></div></div>`

  const dates = ['03-04', '03-12', '03-21', '04-02', '04-15', '04-28', '05-09', '05-20', '06-03', '06-17', '07-01']
  let flow = ''
  for (let i = 0; i < 11; i += 1) {
    flow += `<div class="flow-row" data-flow="${i}">
      <div class="flow-line" style="width:${180 + ((i * 53) % 240)}px"></div>
      <div class="flow-date">${dates[i]}</div></div>`
  }
  $('timeFlow').innerHTML = flow
}
buildDom()

function buildTrack() {
  let html = ''
  for (let b = 0; b <= Math.round(TOTAL / BEAT); b += 1) {
    html += `<div class="track-tick" style="left:${(((b * BEAT) / TOTAL) * 100).toFixed(3)}%;height:${b % 4 === 0 ? 9 : 5}px;top:${b % 4 === 0 ? 4 : 6}px;opacity:${b % 4 === 0 ? 0.5 : 0.24}"></div>`
  }
  for (const b of BEATS) {
    html += `<div class="track-block" data-block="${b.id}" style="left:${((b.at / TOTAL) * 100).toFixed(2)}%;width:${((b.dur / TOTAL) * 100).toFixed(2)}%"></div>`
    html += `<div class="track-name" style="left:${((b.at / TOTAL) * 100).toFixed(2)}%">${b.id}</div>`
  }
  $('trackBlocks').innerHTML = html
}
buildTrack()

/* ------------------------------------------------------------------ render */
window.renderFrame = (t) => {
  let fly = ''

  // a time jump clears the column; the only thing that survives it is the mark
  // at top-right. sess1 is the first conversation, sess2 the second — the third
  // (the unattended run) never clears, it ends the section.
  const sess1 = 1 - seg(t, at('F11'), at('F11') + 0.9)
  const sess2 = 1 - seg(t, at('G3'), at('G3') + 0.9)
  // the copy that is simply there on Friday morning
  const arr1 = seg(t, at('F12'), at('F12') + 0.9)

  /* ---------- F1: the finished thing rolls away, the columns come back ---------- */
  const gone = ease.quintOut(seg(t, 0.2, 2.0))
  style($('product'), { transform: `translateY(${(-PANEL.h * gone).toFixed(1)}px)`, opacity: 1 - gone })
  const colsIn = seg(t, 1.2, 2.4)
  const colsOut = ease.quintOut(seg(t, at('F3') + 0.2, at('F3') + 0.9))
  // the columns say their own thing, then step aside for the office one
  let colAlpha = Math.max(colsIn * (1 - colsOut), 0)

  /* ---------- F2/F3: click the middle column, it takes the surface ---------- */
  const claim = ease.cubicInOut(seg(t, at('F3'), at('F3') + beat('F3').dur))
  const colW = [NARROW, WIDE, NARROW]
  COLS.forEach((_, i) => {
    const ownX = i === 0 ? 0 : i === 1 ? MID_X : MID_X + WIDE
    const w = lerp(colW[i], i === 1 ? PANEL.w : 0, claim)
    const x = lerp(ownX, 0, claim)
    style($(`col${i}`), { left: `${x.toFixed(1)}px`, width: `${Math.max(w, 0).toFixed(1)}px`, opacity: colAlpha })
    style($(`surf${i}`), { opacity: i === 1 ? 0.85 * (1 - claim * 0.9) * colsIn : 0 })
  })
  style($('div0'), { left: `${MID_X}px`, opacity: colAlpha * (1 - claim) })
  style($('div1'), { left: `${MID_X + WIDE}px`, opacity: colAlpha * (1 - claim) })

  const target = { x: MID_X + 140, y: 430 }
  const curP = ease.sineInOut(seg(t, at('F2') - 0.6, at('F2') + 0.6))
  const press = Math.sin(Math.PI * seg(t, at('F2') + 0.6, at('F2') + 0.93))
  if (t >= at('F2') - 0.8 && t < at('F3') + 0.6) {
    const alpha = seg(t, at('F2') - 0.6, at('F2') - 0.3) * (1 - seg(t, at('F3'), at('F3') + 0.5))
    fly += `<div class="cursor" style="left:${lerp(PANEL.w - 140, target.x, curP).toFixed(1)}px;top:${lerp(PANEL.h - 140, target.y, curP).toFixed(1)}px;opacity:${alpha.toFixed(3)};transform:scale(${(1 - press * 0.35).toFixed(3)})"></div>`
    const rp = seg(t, at('F2') + 0.63, at('F2') + 1.5)
    if (rp > 0 && rp < 1) {
      fly += `<div class="ripple" style="left:${target.x - 40}px;top:${target.y - 40}px;width:80px;height:80px;opacity:${(Math.sin(Math.PI * rp) * 0.9).toFixed(3)};transform:scale(${lerp(0.3, 3.2, ease.expoOut(rp)).toFixed(3)})"></div>`
    }
  }

  /* ---------- F4: split into chat + work ---------- */
  const split = ease.cubicInOut(seg(t, at('F4'), at('F4') + beat('F4').dur))
  const chatW = lerp(PANEL.w, CHAT_W, split)
  style($('chat'), { width: `${chatW.toFixed(1)}px`, opacity: split > 0 ? 1 : 0 })
  style($('work'), { left: `${lerp(0, WORK_X, split).toFixed(1)}px`, width: `${lerp(PANEL.w, WORK_W, split).toFixed(1)}px`, opacity: split > 0 ? 1 : 0 })
  style($('splitDivider'), { left: `${chatW.toFixed(1)}px`, opacity: split })

  /* ---------- your lines, each on its own cue ---------- */
  const say = (id, node, live) => {
    const p = seg(t, at(id) + 0.1, at(id) + 0.7)
    style($(node), { opacity: ease.quintOut(p) * live, transform: `translateY(${((1 - ease.expoOut(p)) * 12).toFixed(1)}px)` })
  }
  say(ME1.id, 'me1', sess1)
  say(ME2.id, 'me2', sess1)
  say(ME3.id, 'me3', sess2)

  /* ---------- the two rows that carry the library: once they happen they stay ---------- */
  const showRow = (id, node, live) => {
    const p = seg(t, at(id), at(id) + 0.5)
    style($(node), { opacity: ease.quintOut(p) * live, transform: `translateY(${((1 - ease.expoOut(p)) * 8).toFixed(1)}px)` })
  }
  showRow(READ.id, 'read', sess1)
  showRow(WRITE.id, 'write', sess1)
  // what the weekly arrangement actually produced, with nobody asking
  {
    const p = seg(t, at('F12'), at('F12') + 0.5)
    const away = seg(t, at('H1'), at('H1') + 0.6)
    style($('deliver'), { opacity: ease.quintOut(p) * (1 - away) * sess2, transform: `translateY(${((1 - ease.expoOut(p)) * 8).toFixed(1)}px)` })
  }

  /* ---------- F7: the report builds, piece by piece ---------- */
  const B = at('F7')
  const unseen = seg(t, at('G3') + 1.2, at('G3') + 1.8)
  // it is on screen while it is being made (first session) and again on Friday,
  // complete, with nobody having asked for it
  const live = Math.max(sess1, arr1 * sess2) * (1 - unseen)
  style($('repFrame'), { opacity: Math.min(seg(t, B + 0.4, B + 1.0) * 0.5, 0.5 * live) })
  style($('repTitle'), { opacity: Math.min(1, seg(t, B, B + 0.5) * 2) * live })
  for (let r = 0; r < 6; r += 1) {
    for (let c = 0; c < 4; c += 1) {
      const p = stagger(t, r * 4 + c, { start: B + 0.6, each: 0.11, dur: 0.4 })
      style($(`cell${r}-${c}`), { opacity: Math.min(1, p * 2.2) * live, transform: `scaleX(${ease.expoOut(p).toFixed(4)})` })
    }
  }
  for (let b = 0; b < 6; b += 1) {
    const p = stagger(t, b, { start: B + 2.4, each: 0.24, dur: 0.5 })
    style($(`bar${b}`), { opacity: Math.min(1, p * 1.8) * live, transform: `scaleY(${ease.quintOut(p).toFixed(4)})` })
  }

  /* ---------- G4: the unattended run — the diff takes the work area ---------- */
  if (unseen > 0) {
    DIFF.forEach(([kind, w], i) => {
      const p = seg(t, at('G4') + i * 0.22, at('G4') + i * 0.22 + 0.4)
      if (p <= 0) return
      fly += `<div class="dl-gutter" style="left:${WORK_X + 190}px;top:${188 + i * 40}px;height:18px;opacity:${(p * unseen).toFixed(3)}"></div>`
      fly += `<div class="dl ${kind}" style="left:${WORK_X + 206}px;top:${190 + i * 40}px;width:${(w * p).toFixed(1)}px;opacity:${(p * unseen).toFixed(3)}"></div>`
    })
    // something reads down the diff
    const scanP = ease.sineInOut(seg(t, at('G4') + 0.4, at('G4') + 3.6))
    fly += `<div style="position:absolute;left:${WORK_X + 180}px;top:${(175 + scanP * 330).toFixed(1)}px;width:520px;height:3px;border-radius:2px;background:linear-gradient(90deg, rgba(101,84,217,0), rgba(150,135,245,0.6), rgba(101,84,217,0));opacity:${(unseen * 0.75).toFixed(3)}"></div>`
    // and the three remarks it leaves behind
    for (let i = 0; i < 3; i += 1) {
      const p = seg(t, at('G5') - 0.9 + i * 0.5, at('G5') - 0.4 + i * 0.5)
      if (p <= 0) continue
      fly += `<div style="position:absolute;left:${WORK_X + 200}px;top:${548 + i * 44}px;width:${420 - i * 40}px;height:16px;border-radius:6px;background:rgba(101,84,217,0.30);opacity:${(ease.quintOut(p) * 0.95).toFixed(3)}"></div>`
    }
  }

  /* ---------- G4: the watching rows arrive by themselves ---------- */
  WATCH.forEach((w, i) => {
    const p = seg(t, w.at, w.at + 0.5)
    const away = seg(t, at('H1'), at('H1') + 0.6)
    style($(`w${i}`), { opacity: ease.quintOut(p) * (1 - away), transform: `translateY(${((1 - ease.expoOut(p)) * 8).toFixed(1)}px)` })
  })

  /* ---------- a spoken arrangement becomes a long-lived mark ---------- */
  const dock = (id, node, y, w, label) => {
    const p = ease.cubicInOut(seg(t, at(id) + 0.3, at(id) + 1.4))
    const pop = ease.softBack(seg(t, at(id), at(id) + 0.35))
    const x = lerp(400, PANEL.w - 40 - w, p)
    const yy = lerp(y + 150, y, p)
    const alpha = Math.min(1, Math.max(0, pop)) * seg(t, at(id), at(id) + 0.2)
    if (alpha > 0.01 && t < at(id) + 1.7) {
      fly += `<div class="mark" style="right:auto;left:${x.toFixed(1)}px;top:${yy.toFixed(1)}px;width:${w}px;opacity:${alpha.toFixed(3)};transform:scale(${(0.82 + 0.18 * p).toFixed(3)})">
        <div class="mark-dot"></div><div class="mark-text">${label}</div></div>`
    }
    style($(node), { opacity: seg(t, at(id) + 1.4, at(id) + 1.7) })
  }
  dock(ME2.id, 'mark1', 26, 154, '每周五')
  dock(ME3.id, 'mark2', 74, 174, '每天 09:00')
  // it checks in when the unattended run finishes
  const pulse = Math.sin(Math.PI * seg(t, at('G5') + 0.6, at('G5') + 1.8))
  style($('markGlow2'), { opacity: (Math.max(0, pulse) * 0.22).toFixed(3) })

  /* ---------- time passing: the session flow rolls up ---------- */
  const flow1 = seg(t, at('F11'), at('F11') + beat('F11').dur)
  const flow2 = seg(t, at('G3'), at('G3') + beat('G3').dur)
  const flow = Math.max(flow1 > 0 && flow1 < 1 ? flow1 : 0, flow2 > 0 && flow2 < 1 ? flow2 : 0)
  style($('time'), { opacity: flow > 0 ? Math.min(1, Math.sin(Math.PI * flow) * 2.4) : 0 })
  if (flow > 0) {
    document.querySelectorAll('[data-flow]').forEach((node) => {
      const i = Number(node.dataset.flow)
      style(node, { top: `${(190 + i * 60 - ease.sineInOut(flow) * 620).toFixed(1)}px`, opacity: Math.max(0, 1 - Math.abs(i - 5) * 0.15) })
    })
  }
  // what is waiting after each jump
  const arrived1 = arr1 * sess2 * (1 - unseen)
  if (arrived1 > 0) {
    fly += `<div style="position:absolute;left:${WORK_X + 180}px;top:96px;width:680px;height:560px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(101,84,217,${(0.30 * arrived1).toFixed(3)});opacity:${arrived1.toFixed(3)}"></div>`
    fly += `<div style="position:absolute;left:${WORK_X + 200}px;top:120px;width:300px;height:22px;border-radius:6px;background:rgba(255,255,255,0.26);opacity:${arrived1.toFixed(3)}"></div>`
    fly += `<div style="position:absolute;left:${WORK_X + 150}px;top:168px;font-size:19px;letter-spacing:0.05em;color:rgba(150,135,245,0.85);opacity:${arrived1.toFixed(3)}">这是周五早上已经在那儿的那一份</div>`
  }

  /* ---------- H1: a flash through the other faces ---------- */
  const flash = seg(t, at('H1'), at('H1') + beat('H1').dur)
  if (flash > 0 && flash < 1) {
    const which = Math.min(2, Math.floor(flash * 3))
    const local = ease.quintOut(Math.min(1, ((flash * 3) % 1) * 1.6))
    const veil = Math.min(1, (1 - flash) * 3)
    let inner = ''
    if (which === 0) {
      for (let r = 0; r < 4; r += 1) for (let c = 0; c < 5; c += 1) {
        inner += `<div class="cal-cell" style="left:${240 + c * 110}px;top:${230 + r * 110}px;width:92px;height:92px;opacity:${(local * ((r * 5 + c) % 3 === 0 ? 1 : 0.45)).toFixed(3)}"></div>`
      }
    } else if (which === 1) {
      for (let r = 0; r < 7; r += 1) {
        inner += `<div class="dir-row" style="left:280px;top:${210 + r * 46}px;width:${520 - (r % 3) * 90}px;opacity:${(local * 0.9).toFixed(3)}"></div>`
      }
    } else {
      for (let i = 0; i < 3; i += 1) {
        inner += `<div class="deck" style="left:${240 + i * 190}px;top:${250 + i * 40}px;width:300px;height:180px;opacity:${(local * (1 - i * 0.18)).toFixed(3)}"></div>`
      }
    }
    fly += `<div style="position:absolute;left:${WORK_X}px;top:0;width:${WORK_W}px;height:${PANEL.h}px;opacity:${veil.toFixed(3)}">${inner}</div>`
  }

  /* ---------- H2/H3: the columns again, then the name ---------- */
  const back = ease.quintOut(seg(t, at('H2'), at('H2') + 1.0))
  const dark = ease.sineInOut(seg(t, at('H3') + 0.3, at('H3') + 1.4))
  if (back > 0) {
    COLS.forEach((_, i) => {
      style($(`col${i}`), {
        left: `${(i === 0 ? 0 : i === 1 ? MID_X : MID_X + WIDE).toFixed(1)}px`,
        width: `${(i === 1 ? WIDE : NARROW).toFixed(1)}px`,
        opacity: back * (1 - dark),
      })
      style($(`surf${i}`), { opacity: 0.85 * back * (1 - dark) })
    })
    style($('div0'), { left: `${MID_X}px`, opacity: back * (1 - dark) })
    style($('div1'), { left: `${MID_X + WIDE}px`, opacity: back * (1 - dark) })
    style($('chat'), { opacity: (1 - back) * (1 - dark) })
    style($('work'), { opacity: (1 - back) * (1 - dark) })
    style($('splitDivider'), { opacity: (1 - back) * split * (1 - dark) })
    style($('colLayer'), { opacity: Math.max(colAlpha, back * (1 - dark)) })
  }
  style($('marks'), { opacity: 1 - back * (1 - dark) })
  style($('endcard'), { opacity: dark })

  /* ---- captions + hud ---- */
  let current = BEATS[0]
  for (const b of BEATS) if (t >= b.at) current = b
  $('capTitle').textContent = `${current.id} · ${current.note}`
  $('capHint').textContent = t < at('F5')
    ? '第二段开场：成品退场 → 回到三块 → 点开办公（复用第一段学过的语法，压缩一半）'
    : t < at('F9')
      ? '资料库只以过程行出现：读了什么、存到哪 —— 不出现资料库页面'
      : t < at('G1')
        ? '一句话变成一个长期存在的标记，并留在界面上'
        : t < at('H1')
          ? '无人值守：没有光标、没有说话人，只有它在动'
          : '快闪其它面孔 → 三块回来 → 名字落定'
  $('hudTime').textContent = `${t.toFixed(1)}s / ${TOTAL.toFixed(1)}s · 100 BPM`
  document.querySelectorAll('[data-block]').forEach((node) => {
    node.classList.toggle('active', node.dataset.block === current.id)
  })
  style($('trackHead'), { left: `${((t / TOTAL) * 100).toFixed(3)}%` })

  $('flyLayer').innerHTML = fly
}

window.__sceneReady = true
</script>
</body>
</html>
