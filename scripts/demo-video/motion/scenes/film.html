<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>plan · 三段式整体排布</title>
<script src="_kit.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080a; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #eef0f4; }

  .ambient { position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 44%, rgba(255,255,255,0.05), rgba(255,255,255,0) 62%),
      radial-gradient(1500px 780px at 50% 116%, rgba(101,84,217,0.12), rgba(0,0,0,0) 60%),
      #0a0a0c; }
  .grain { position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; }

  .panel { position: absolute; left: 120px; top: 96px; width: 1680px; height: 888px;
    border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.018));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 40px 90px rgba(0,0,0,0.45); }

  .col { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .uiwin-clip { position: absolute; left: 0; top: 60px; right: 0; overflow: hidden; opacity: 0; z-index: 3; }
  .uiwin { position: absolute; left: 0; top: 0; width: 1120px; height: 888px; object-fit: cover; opacity: 0; }
  #treePanel { position: absolute; inset: 0; padding-top: 24px; z-index: 3; }
  .tree-head { margin: 0 0 10px 16px; font-size: 15px; letter-spacing: 0.08em; color: rgba(238,240,244,0.5); }
  .tree-row { display: flex; justify-content: space-between; align-items: baseline; padding-right: 14px;
    font-size: 14.5px; line-height: 34px; color: rgba(238,240,244,0.76); }
  .tree-name.is-new { color: rgba(150,220,175,0.95); }
  .tree-size { font-size: 12px; color: rgba(238,240,244,0.32); font-variant-numeric: tabular-nums; }
  /* 右栏那张比栏位宽一点：成片只取右侧，把应用自带的窄侧栏挡在画面外 */
  #uiLibFiles { object-position: right top; }
  .col-surface { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)); }
  .col-title { position: absolute; left: 40px; top: 636px; font-size: 42px; font-weight: 600; white-space: nowrap;
    text-shadow: 0 2px 24px rgba(4,4,6,0.85); }
  .col-sub { position: absolute; left: 40px; top: 698px; font-size: 20px; color: rgba(238,240,244,0.55); white-space: nowrap;
    text-shadow: 0 2px 18px rgba(4,4,6,0.85); }
  .col-scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; opacity: 0; z-index: 4;
    background: linear-gradient(0deg, rgba(6,6,9,0.97) 0%, rgba(6,6,9,0.93) 30%, rgba(6,6,9,0.5) 64%, rgba(6,6,9,0) 100%); }
  .mini-head { position: absolute; left: 20px; top: 22px; font-size: 18px; letter-spacing: 0.06em;
    color: rgba(238,240,244,0.60); white-space: nowrap; }
  /* 开场三块里的真实预览：挡在标题下方，一开场就交代这三块各自是什么 */
  .poster { position: absolute; left: 0; right: 0; top: 0; height: 888px; overflow: hidden; z-index: 1;
    border-radius: 0; opacity: 0;
    box-shadow: inset 0 -520px 300px -120px rgba(6,6,9,0.96), inset 0 0 220px 40px rgba(6,6,9,0.5);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.34) 68%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.34) 68%, rgba(0,0,0,0) 100%); }
  .poster-img { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    opacity: 0.9; filter: saturate(0.96) brightness(0.92); }
  /* 中栏是竖的：整页整页往下滚，页脚与图表都在，画面一直在走 */
  .poster--slides { overflow: hidden; }
  .poster--slides .poster-scroll { display: flex; flex-direction: column; gap: 22px; padding: 26px 0; }
  .poster--slides .poster-img { position: static; width: 100%; height: 409px; object-fit: contain; object-position: center top; }
  /* 还原回三块那一刻，三块是要被看清的：遮罩与压暗都收掉 */
  .poster.is-bright { box-shadow: inset 0 -320px 220px -140px rgba(6,6,9,0.8);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.94) 74%, rgba(0,0,0,0.6) 100%);
    mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.94) 74%, rgba(0,0,0,0.6) 100%); }
  .poster.is-bright .poster-img { opacity: 1; filter: none; }
  /* 开场左块：真实源码铺满（产品的产物之一，就是这几行） */
  .code-page { position: absolute; inset: 0; padding: 26px 30px; background: rgba(8, 10, 14, 0.72);
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 16px; line-height: 25.5px;
    white-space: pre; overflow: hidden; }
  .code-page-head { position: relative; z-index: 2; display: flex; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.10); background: linear-gradient(180deg, rgba(8,10,14,0.97), rgba(8,10,14,0.9));
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; letter-spacing: 0.06em; color: rgba(238,240,244,0.42); }
  .code-page-head span:first-child { color: rgba(238,240,244,0.74); }

  .poster-code { padding: 14px 16px; background: rgba(8,10,14,0.6); border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 14px; line-height: 22px; white-space: pre; }

  .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.16); }
  .thumb { position: absolute; border-radius: 8px; background: rgba(255,255,255,0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); }
  .doc { position: absolute; left: 18px; right: 14px; height: 40px; border-radius: 8px;
    background: rgba(255,255,255,0.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .doc-sq { position: absolute; left: 10px; top: 11px; width: 18px; height: 18px; border-radius: 5px;
    background: rgba(101,84,217,0.45); }
  .doc-line { position: absolute; left: 38px; top: 16px; height: 9px; border-radius: 4px; background: rgba(255,255,255,0.18); }
  .doc-hi { position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(150,135,245,0.8);
    background: rgba(101,84,217,0.16); opacity: 0; }

  /* 聚焦栏内部 */
  .bubble { position: absolute; border-radius: 13px; background: rgba(255,255,255,0.11);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.13); }
  .bubble.me { background: rgba(101,84,217,0.18); box-shadow: inset 0 0 0 1px rgba(101,84,217,0.32); }
  .bubble-text { position: absolute; left: 18px; top: 13px; right: 16px; font-size: 18px; line-height: 1.4;
    color: rgba(240,242,246,0.94); }
  .prow { position: absolute; left: 34px; height: 24px; }
  .prow-dot { position: absolute; left: 0; top: 6px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(150,135,245,0.95); }
  .prow-text { position: absolute; left: 22px; top: 2px; font-size: 17px; white-space: nowrap;
    color: rgba(238,240,244,0.62); }
  .tile { position: absolute; border-radius: 9px; background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .sub { position: absolute; top: 0; height: 888px; overflow: hidden;
    background: rgba(255,255,255,0.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .sub-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }

  /* 代码段 */
  .cline { position: absolute; height: 12px; border-radius: 3px; transform-origin: 0 50%; }
  .cline-num { position: absolute; left: 16px; width: 22px; text-align: right; font-size: 12px;
    color: rgba(238,240,244,0.20); font-variant-numeric: tabular-nums; }
  .cline.add { background: rgba(120,200,150,0.34); }
  .band-tag { position: absolute; left: 40px; top: 22px; font-size: 18px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.40); white-space: nowrap; }
  .band-hair { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.16); opacity: 0; }

  /* 定时卡片 + 时间流逝 */
  .job { position: absolute; left: 22px; right: 20px; top: 70px; border-radius: 12px;
    background: rgba(255,255,255,0.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); padding: 16px 16px 18px; }
  .job-title { font-size: 20px; font-weight: 600; color: rgba(238,240,244,0.92); white-space: nowrap; }
  .job-when { margin-top: 8px; font-size: 16px; letter-spacing: 0.05em; color: rgba(190,180,250,0.9);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .job-sub { margin-top: 12px; font-size: 15px; color: rgba(238,240,244,0.45); white-space: nowrap; }
  .job-dot { position: absolute; right: 16px; top: 20px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(150,135,245,0.85); }
  .job-flash { position: absolute; inset: 0; border-radius: 12px; background: #ffffff; opacity: 0; }
  .now-line { position: absolute; left: 18px; right: 18px; height: 1px;
    background: linear-gradient(90deg, rgba(101,84,217,0), rgba(150,135,245,0.85), rgba(101,84,217,0)); }
  .now-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #a99cf7;
    box-shadow: 0 0 12px rgba(150,135,245,0.9); }
  .tick { position: absolute; left: 20px; font-size: 16px; letter-spacing: 0.06em;
    color: rgba(238,240,244,0.38); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tick.hot { color: rgba(196,187,252,0.95); }

  /* 资料库卡片（压在虚化代码区上方）：底下先垫一层暗场，卡片才读得清 */
  #libLayer { background: rgba(9, 10, 13, 0.88); backdrop-filter: blur(3px); z-index: 6; }
  .lib-card { position: absolute; left: 16px; right: 16px; top: 20px; border-radius: 12px;
    background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.11); padding: 14px 14px 10px; }
  .lib-title { font-size: 18px; letter-spacing: 0.06em; color: rgba(238,240,244,0.72); white-space: nowrap; }
  .lib-doc { position: absolute; left: 14px; right: 14px; height: 34px; border-radius: 8px;
    background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .lib-name { position: absolute; left: 12px; top: 8px; font-size: 15px; color: rgba(238,240,244,0.80); white-space: nowrap; }
  .lib-count { position: absolute; right: 12px; top: 9px; font-size: 13.5px; color: rgba(238,240,244,0.34); font-variant-numeric: tabular-nums; }
  #libFiles { position: absolute; left: 0; right: 0; top: 226px; }
  .lib-file { margin: 0 0 0 16px; font-size: 12.5px; line-height: 27px; color: rgba(238,240,244,0.44); white-space: nowrap; }

  /* 成果区 */
  .page { position: absolute; border-radius: 10px; background: rgba(255,255,255,0.07);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); overflow: hidden; }
  .page-line { position: absolute; height: 10px; border-radius: 4px; background: rgba(255,255,255,0.14); transform-origin: 0 50%; }
  .page-bar { position: absolute; border-radius: 3px 3px 0 0; background: rgba(101,84,217,0.5); transform-origin: 50% 100%; }

  .cursor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: #f2f3f7; box-shadow: 0 0 0 6px rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.5); }
  .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(101,84,217,0.9); transform-origin: 50% 50%; }

  /* 代码段主画面：真实源码正文 */
  #codePanel { position: absolute; left: 24px; top: 56px; right: 24px; height: 604px; border-radius: 12px;
    background: rgba(8, 10, 14, 0.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); overflow: hidden; }
  .code-head { position: absolute; left: 20px; top: 16px; right: 20px; display: flex; justify-content: space-between;
    font-size: 14px; letter-spacing: 0.04em; color: rgba(238,240,244,0.34); }
  .code-file { color: rgba(238,240,244,0.70); }
  #codeBody { position: absolute; left: 22px; right: 22px; top: 50px; bottom: 16px; white-space: pre; overflow: hidden;
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 15.5px; line-height: 23px; }
  .cl { color: rgba(232,236,244,0.84); }
  .cl-com { color: rgba(138,168,148,0.78); }
  .cl-key { color: rgba(182,170,250,0.96); }
  .cl-num { color: rgba(226,190,140,0.9); }
  .cl-caret { display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: rgba(150,135,245,0.9); }

  /* 成果流：真实幻灯片 */
  #feedHead { position: absolute; left: 22px; right: 22px; top: 8px; display: flex; justify-content: space-between;
    font-size: 14px; letter-spacing: 0.06em; color: rgba(238,240,244,0.46); }
  #feedHead b { font-weight: 600; color: rgba(238,240,244,0.74); }
  #feedView { position: absolute; left: 20px; right: 20px; top: 36px; bottom: 24px; overflow: hidden; border-radius: 12px;
    background: #232630; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); }
  #feedTrackL, #feedTrackR { position: absolute; top: 0; bottom: 0; width: calc(50% - 12px); }
  .feed-fade { will-change: opacity; }
  #feedTrackL { left: 0; }
  #feedTrackR { right: 0; }
  .fcard { position: absolute; width: 100%; height: 201px; border-radius: 10px; overflow: hidden;
    background: #14161c; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 14px 30px rgba(0,0,0,0.3); }
  /* contain + 底部让出题注条：整页复盘都在卡里，脚注不会被切，胶囊也不压字 */
  .fcard img { display: block; width: 100%; height: calc(100% - 20px); object-fit: contain; object-position: center top; opacity: 0; }
  .fcard-ghost { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 7px;
    align-items: center; justify-content: center; font-size: 12.5px; letter-spacing: 0.1em; color: rgba(238,240,244,0.34); }
  .fcard-ghost .ghost-chip { padding: 2px 8px; border-radius: 999px; font-size: 10.5px; letter-spacing: 0.12em;
    background: rgba(255,255,255,0.07); color: rgba(238,240,244,0.4); }
  .fcard-ghost::after { content: ''; position: absolute; inset: 8px 8px 26px; border-radius: 7px;
    border: 1px dashed rgba(255,255,255,0.14); }
  .fcard-tag { position: absolute; left: 9px; bottom: 7px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,0.46); font-size: 11px; letter-spacing: 0.04em; color: rgba(255,255,255,0.74); }
  .feed-fade { position: absolute; left: 0; right: 0; height: 120px; pointer-events: none; }
  .feed-fade--top { top: 0; background: linear-gradient(180deg, rgba(27,29,37,0.98) 12%, rgba(27,29,37,0.72) 52%, rgba(27,29,37,0)); }
  .feed-fade--bottom { bottom: 0; background: linear-gradient(0deg, rgba(27,29,37,0.98) 12%, rgba(27,29,37,0.72) 52%, rgba(27,29,37,0)); }

  /* 游戏段左半：三段子代理并行 */
  #subLayer { opacity: 0; z-index: 6; }   /* 盖在真实游戏上方 */
  /* 子代理：连续的一整条半透表面，压在真实游戏上方，游戏的颜色透过来 */
  .subcol { position: absolute; top: 60px; bottom: 58px; width: 322px; padding: 20px 20px 0;
    background: rgba(16,18,24,0.52); backdrop-filter: blur(1.2px) saturate(1.05);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); }
  .subcol[data-sub="0"] { left: 22px; border-radius: 12px 0 0 12px; }
  .subcol[data-sub="1"] { left: 344px; border-radius: 0; }
  .subcol[data-sub="2"] { left: 666px; border-radius: 0 12px 12px 0; }
  #subHead { position: absolute; left: 26px; top: 30px; font-size: 15px; letter-spacing: 0.07em; color: rgba(238,240,244,0.5); }
  .subcard { position: absolute; left: 26px; right: 26px; height: 238px; padding: 18px 20px 0; border-radius: 12px;
    background: rgba(255,255,255,0.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .subcard[data-sub="0"] { top: 72px; }
  .subcard[data-sub="1"] { top: 326px; }
  .subcard[data-sub="2"] { top: 580px; }
  .subcard-title { font-size: 17px; color: rgba(238,240,244,0.9); white-space: nowrap; }
  .subcard-state { position: absolute; right: 20px; top: 19px; font-size: 13px; letter-spacing: 0.06em; color: rgba(238,240,244,0.4); }
  .subcard.is-done .subcard-state { color: rgba(150,220,175,0.95); }
  .subcard-row { display: flex; align-items: center; margin-top: 12px; font-size: 13px; line-height: 1.3;
    color: rgba(238,240,244,0.56); white-space: nowrap; }
  .subcard-row i { width: 7px; height: 7px; border-radius: 50%; margin-right: 9px; background: rgba(150,135,245,0.85); }
  .subcard.is-done .subcard-row i { background: rgba(120,200,150,0.9); }
  .subcard-foot { position: absolute; left: 20px; right: 20px; bottom: 18px; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.10); overflow: hidden; }
  .subcard-foot i { display: block; height: 100%; width: 0%; border-radius: 2px; background: rgba(150,135,245,0.9); }
  .subcard-flash { position: absolute; inset: 0; border-radius: 12px; background: #ffffff; opacity: 0; pointer-events: none; }
  .subcard.is-done .subcard-foot i { background: rgba(120,200,150,0.95); }

  /* 游戏段的真实镜头 */
  #shots { position: absolute; inset: 0; }
  #gameFrame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center center;
    opacity: 0; will-change: opacity; }

  #endcard { position: absolute; inset: 0; background: #08080a; opacity: 0; }

  .endcard-name { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 96px; font-weight: 600; }
  #endRule { position: absolute; left: 50%; top: 566px; width: 0; height: 1px; background: rgba(238,240,244,0.3); }
  .endcard-claim { position: absolute; left: 0; right: 0; top: 596px; text-align: center;
    font-size: 28px; letter-spacing: 0.06em; color: rgba(238,240,244,0.86); }
  .endcard-sub { position: absolute; left: 0; right: 0; top: 656px; text-align: center;
    font-size: 24px; letter-spacing: 0.26em; color: rgba(238,240,244,0.42); }
  .endcard-site { position: absolute; left: 0; right: 0; top: 712px; text-align: center; opacity: 0;
    font-size: 27px; letter-spacing: 0.14em; color: rgba(238,240,244,0.9); font-variant-numeric: tabular-nums; }
  .endcard-site .caret { display: inline-block; width: 2px; height: 25px; margin-left: 5px;
    vertical-align: -4px; background: rgba(150,135,245,0.95); }

  #ringCenter { position: absolute; left: 0; right: 0; top: 58px; text-align: center; }
  #ringTime { font-size: 30px; font-weight: 600; letter-spacing: 0.04em; color: rgba(238,240,244,0.92);
    font-variant-numeric: tabular-nums; }
  #ringCap { margin-top: 6px; font-size: 15px; letter-spacing: 0.08em; color: rgba(238,240,244,0.40); }

  .cap { position: absolute; left: 120px; bottom: 22px; }
  .cap-title { font-size: 24px; letter-spacing: 0.04em; color: rgba(238,240,244,0.82); }
  .cap-hint { margin-top: 5px; font-size: 18px; letter-spacing: 0.05em; color: rgba(238,240,244,0.42); }
  .hud-time { position: absolute; right: 120px; bottom: 26px; font-size: 19px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.36); font-variant-numeric: tabular-nums; }
  .track { position: absolute; left: 120px; right: 120px; bottom: 84px; height: 26px; }
  .track-line { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(255,255,255,0.16); }
  .track-block { position: absolute; top: 8px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.16); }
  .track-block.active { background: rgba(101,84,217,0.85); }
  .track-name { position: absolute; top: -16px; font-size: 16px; letter-spacing: 0.05em; color: rgba(238,240,244,0.45); }
  .track-head { position: absolute; top: 2px; width: 1.5px; height: 22px; background: #6554d9; }
</style>
</head>
<body>
  <div class="ambient"></div>

  <div class="panel" id="panel">
    <div id="colLayer"></div>
    <div id="stageLayer"></div>
    <div id="flyLayer"></div>
  </div>

  <div id="endcard"><div class="endcard-name" id="endName">Sunday</div>
    <div id="endRule"></div>
    <div class="endcard-claim" id="endClaim">一句话，到能用的东西</div>
    <div class="endcard-sub">LAMTOOLS</div>

// 几何：三栏位置固定，只有宽度变
const KEYS = [
  { at: at('O2'), dur: 1.25, w: [280, 1120, 280], o: 1, fo: -1, from: [560, 560, 560] },
  { at: at('D1'), dur: 1.6, w: [380, 520, 780], o: 1, fo: 1, from: [280, 1120, 280] },
  { at: at('E1') - 3.6, dur: 0.95, w: [0, 0, 1680], o: 1, fo: 1, from: [380, 520, 780] },
  { at: at('E1'), dur: 1.05, w: [0, 0, 1680], o: 2, fo: 1, from: [0, 0, 1680] },
]

function geometry(t) {
  if (t < at('O2')) {
    const step = t < at('O2') ? -1 : t < at('O2') + 1.0 ? 0 : t < at('O2') + 2.0 ? 1 : 2
    const blend = step < 0 ? 1 : ease.expoOut(seg(t, at('O2') + step * 1.0, at('O2') + step * 1.0 + 0.6))
    const target = step < 0 ? [EQ, EQ, EQ] : [340, 340, 1000].map((w, i) => (i === step ? 1000 : w))
    return { w: [EQ, EQ, EQ].map((v, i) => lerp(v, target[i], blend)), o: step, p: blend, fo: -1, grab: 0, give: 0 }
  }
  let key = KEYS[1]
  let u = 0
  for (const k of KEYS) {
    if (t >= k.at) { key = k; u = seg(t, k.at, k.at + k.dur) }
  }
  // 聚焦的那块先动（向右展开），远端那块先让位，中间那块被夹着走——
  // 三块之和恒等于台面宽，所以是一个方向性的推挤波，不是三块同时缩放
  const e = snap(u)
  const others = [0, 1, 2].filter((i) => i !== key.o)
  const far = others[1]
  const w = [0, 0, 0]
  w[key.o] = lerp(key.from[key.o], key.w[key.o], e)
  w[far] = lerp(key.from[far], key.w[far], Math.min(1, u * 1.3))
  w[others[0]] = PANEL.w - w[key.o] - w[far]
  // 办公段之前：先还原回开场那个三块并排的样子，再由三块变成办公
  const back = ease.cubicInOut(clamp01(seg(t, at('D1') - 4.0, at('D1') - 2.0)))
    * (1 - ease.cubicInOut(clamp01(seg(t, at('D1') + 0.1, at('D1') + 0.9))))
  if (back > 0) {
    const eq = PANEL.w / 3
    return { w: w.map((v) => lerp(v, eq, back)), o: key.o, p: e, fo: key.fo, grab: 1, give: 1, back }
  }
  return { w, o: key.o, p: e, fo: key.fo, grab: 1, give: 1, back: 0 }
}

/* 就着真实源码做最轻的着色：注释、关键字、数字各一色，不喧宾夺主 */
let codeBodyCache = ''
function hlLine(line) {
  const esc = String(line).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  if (/^\s*(\/\*|\*|\/\/)/.test(line)) return `<span class="cl-com">${esc || '&nbsp;'}</span>`
  const cut = esc.indexOf('//')
  const head = cut >= 0 ? esc.slice(0, cut) : esc
  const tail = cut >= 0 ? `<span class="cl-com">${esc.slice(cut)}</span>` : ''
  const marked = head
    .replace(/\b(function|const|let|for|of|if|return|new)\b/g, '<span class="cl-key">$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="cl-num">$1</span>')
  return `<span class="cl">${marked || '&nbsp;'}</span>${tail}`
}

}

  const tickP = Math.sin(Math.PI * seg(t, at('C4') - 0.1, at('C4') + 0.5)) * auxA
  style($('jobFlash'), { opacity: (tickP * 0.2).toFixed(3) })
  // 到点：一圈从钟心荡开，卡片的状态行换成“刚刚”
  const ringP = seg(t, at('C4'), at('C4') + 0.7)
  if (ringP > 0 && ringP < 1 && auxA > 0.3) {
    const r = lerp(52, 104, ease.expoOut(ringP))
    fly += `<div style="position:absolute;left:${(colX(2) + 140 - r).toFixed(1)}px;top:${(360 - r).toFixed(1)}px;width:${r * 2}px;height:${r * 2}px;border-radius:50%;border:1.5px solid rgba(150,135,245,${(Math.sin(Math.PI * ringP) * 0.7).toFixed(3)})"></div>`
  }
  const jobSubText = t > at('C4') + 0.35 ? '刚刚 · 运行完成' : '上次 09:00 · 无阻塞'
  if ($('jobSub').textContent !== jobSubText) $('jobSub').textContent = jobSubText
  style($('jobSub'), { color: t > at('C4') + 0.35 ? 'rgba(190,180,250,0.9)' : 'rgba(238,240,244,0.45)' })

  // 例行检查跑起来：它在工作目录里落下一个新文件，聊天里同时出现过程行
  // 代码段主画面：真实源码一行行写出来，末尾留一个光标
  const OPEN_LINES = 12   // 打开时文件里已经有的行：面板一开始就是满的
  const written = Math.min(CODE.length - OPEN_LINES, Math.max(0, Math.floor((t - (at('C1') + 0.2)) / 0.26)))
  const shown = OPEN_LINES + written
  const codeHtml = CODE.slice(0, shown).map((line, i) => `<div>${hlLine(line)}${i === shown - 1 && shown < CODE.length ? `<span class="cl-caret" style="opacity:${(t * 2) % 1 < 0.55 ? 1 : 0.15}"></span>` : ''}</div>`).join('')
  if (codeBodyCache !== codeHtml) { $('codeTrack').innerHTML = codeHtml; codeBodyCache = codeHtml }
  // 写满一屏就跟着光标往上滚：这是这一段里最实在的一个动作
  style($('codeTrack'), { transform: `translateY(${(-Math.max(0, shown * 23 - 536)).toFixed(1)}px)` })

  /* ---- 办公段：左虚化代码 + 资料库卡片，中聊天，右成果 ---- */
  style($('libLayer'), { opacity: officeA })
  document.querySelectorAll('[id^="libDoc"]').forEach((node) => {
    style(node, { opacity: officeA })
  })
  style($('resultLayer'), { opacity: officeA })
  const readP = seg(t, at('D4'), at('D4') + 0.4) * (1 - seg(t, at('D5') + 0.6, at('D5') + 1.4)) * officeA
  style($('libHi0'), { opacity: readP.toFixed(3) })
  // 读到的那一层底下摊开它的文件；读的瞬间有一张卡片从左栏飘向中栏
  document.querySelectorAll('[data-libfile]').forEach((node) => {
    const k = Number(node.dataset.libfile)
    const p0 = seg(t, at('D4') + 0.2 + k * 0.11, at('D4') + 0.52 + k * 0.11)
    style(node, { opacity: (ease.quintOut(p0) * officeA).toFixed(3) })
  })
  if (readP > 0.05) {
    fly += `<div class="doc" style="left:${(colX(0) + 30 + (1 - ease.cubicInOut(readP)) * 40).toFixed(1)}px;top:${(104 - readP * 10).toFixed(1)}px;width:${lerp(140, 110, readP).toFixed(1)}px;height:34px;opacity:${(officeA * Math.sin(Math.PI * readP) * 0.9).toFixed(3)}"></div>`
  }
  // 成果流：两列错落（左列下沉半格），每落一张整列推进一格，从上方消失的会从下方回来
  // Agent 离场后成果接管整块表面：两列张开、卡片按同一比例长大（整页仍然完整）
  const boardW = Math.max(0, colW(2))
  const boardWide = snap(clamp01(seg(t, at('E1') - 3.4, at('E1') - 2.5)))
  const trackW = lerp(Math.max(160, (boardW - 40) / 2 - 12), 640, boardWide)
  const gutter = Math.max(0, (boardW - 40 - trackW * 2) / 3)
  style($('feedTrackL'), { width: `${trackW.toFixed(1)}px`, left: `${gutter.toFixed(1)}px`, right: 'auto' })
  style($('feedTrackR'), { width: `${trackW.toFixed(1)}px`, right: `${gutter.toFixed(1)}px`, left: 'auto' })
  const cardH = trackW / 1.778
  const slot = cardH + 18
  const CYCLE = 4 * slot                            // 每列 4 格一循环，滚出去的那张在下面等着
  const ARRIVE = [22.8, 24.6, 26.4, 28.2, 30.0, 31.8, 33.6, 35.4]
  const advance = ARRIVE.reduce((acc, a) => acc + ease.cubicInOut(clamp01(seg(t, a, a + 0.9))), 0)
  // 落卡之外也一直在缓慢滚动：展板从办公段一开始就是活的
  const creep = ease.sineInOut(clamp01(seg(t, at('D1') + 0.8, at('E1') - 0.8))) * 2.1
  const drift = (advance + creep) * slot
  const driftL = ((drift % CYCLE) + CYCLE) % CYCLE
  const driftR = (((drift + HALF) % CYCLE) + CYCLE) % CYCLE
  document.querySelectorAll('[data-fcard]').forEach((node) => {
    const i = Number(node.dataset.fcard)
    const copy = Number(node.dataset.copy)
    const k = Math.floor(i / 2)                   // 第几格（每列各一格轮一次）
    const own = i % 2 === 1 ? driftR : driftL
    const y = (((k * slot - own) % CYCLE) + CYCLE) % CYCLE - copy * CYCLE
    const arrive = ease.softBack(clamp01(seg(t, ARRIVE[i], ARRIVE[i] + 0.5)))
    const op = clamp01(seg(t, ARRIVE[i] - 0.12, ARRIVE[i] + 0.14))
    style(node, {
      top: `${y.toFixed(1)}px`,
      height: `${cardH.toFixed(1)}px`,
      opacity: officeA.toFixed(3),
      transform: `translateY(${((1 - arrive) * 26).toFixed(1)}px) scale(${lerp(0.97, 1, arrive).toFixed(4)})`,
    })
    style(node.querySelector('img'), { opacity: op.toFixed(3) })
    style(node.querySelector('.fcard-ghost'), { opacity: (1 - op).toFixed(3) })
    style(node.querySelector('.fcard-tag'), { opacity: op.toFixed(3) })
  })

  /* ---- 光标：三段都由“点中它所在的那一块”进场，同一个动作 ---- */
  const clickShot = (when, from, to) => {
    if (t < when - 1.0 || t > when + 1.0) return ''
    const travel = ease.sineInOut(seg(t, when - 0.8, when + 0.1))
    const press = Math.sin(Math.PI * seg(t, when + 0.1, when + 0.45))
    const alpha = seg(t, when - 1.0, when - 0.7) * (1 - seg(t, when + 0.6, when + 1.0))
    let out = `<div class="cursor" style="left:${lerp(from.x, to.x, travel).toFixed(1)}px;top:${lerp(from.y, to.y, travel).toFixed(1)}px;opacity:${alpha.toFixed(3)};transform:scale(${(1 - press * 0.3).toFixed(3)})"></div>`
    const rp = seg(t, when + 0.15, when + 1.0)
    if (rp > 0 && rp < 1) {
      out += `<div class="ripple" style="left:${to.x - 40}px;top:${to.y - 40}px;width:80px;height:80px;opacity:${(Math.sin(Math.PI * rp) * 0.34).toFixed(3)};transform:scale(${lerp(0.18, 1.6, ease.expoOut(rp)).toFixed(3)})"></div>`
    }
    return out
  }
  fly += clickShot(at('D1'), { x: lefts[0] + 620, y: 690 }, { x: lefts[1] + 140, y: 430 })
  fly += clickShot(at('E1'), { x: lefts[1] + 420, y: 430 }, { x: lefts[2] + 340, y: 430 })

  /* ---- 收尾 ---- */
  const dark = ease.sineInOut(seg(t, at('F1') + 0.6, at('F1') + 1.8))
  style($('endcard'), { opacity: dark })
  style($('colLayer'), { opacity: 1 - dark * 0.9 })
  style($('stageLayer'), { opacity: 1 - dark })
  // 收尾自己也在动：名字缓缓落定、一道细线拉开、主张随后出现
  const e1 = ease.quintOut(clamp01(seg(t, at('F1') + 1.0, at('F1') + 2.1)))
  const e2 = ease.expoOut(clamp01(seg(t, at('F1') + 1.6, at('F1') + 2.7)))
  const e3 = ease.quintOut(clamp01(seg(t, at('F1') + 2.2, at('F1') + 3.1)))
  const tailP = clamp01(seg(t, at('F1') + 3.2, TOTAL))
  style($('endName'), { opacity: e1, transform: `translateY(${((1 - e1) * 16).toFixed(1)}px) scale(${lerp(0.985, 1.02, e3) * lerp(1, 1.03, tailP).toFixed(4)})` })
  style($('endRule'), { width: `${(e2 * 260).toFixed(1)}px`, marginLeft: `${(-e2 * 130).toFixed(1)}px`, opacity: e2.toFixed(3) })
  style($('endClaim'), { opacity: e3.toFixed(3), transform: `translateY(${((1 - e3) * 10 - tailP * 5).toFixed(1)}px)` })
  // 官网：打字机一个字一个字敲出来（收尾这几秒也在动）
  const SITE = 'AINARIT.com'
  const siteP = ease.quintOut(clamp01(seg(t, at('F1') + 2.5, at('F1') + 3.6)))
  const siteText = SITE.slice(0, Math.round(siteP * SITE.length))
  if ($('endSiteText').textContent !== siteText) $('endSiteText').textContent = siteText
  style($('endSite'), { opacity: seg(t, at('F1') + 2.4, at('F1') + 2.7).toFixed(3), transform: `translateY(${(-tailP * 5).toFixed(1)}px)` })
  style($('endCaret'), { opacity: (t * 2) % 1 < 0.55 ? 1 : 0 })

  /* ---- 真实前端：代码段与办公段各自放产品自己画的那一窗 ---- */
  const UI_FPS = 30
  // 代码段：素材里有一段是模型在思考（几乎不动），这段按 1.9 倍走掉；
  // 后面那一段（切到定时任务屏）放慢到 0.44 倍，让"滴答到点"看得清
  const codeU = Math.max(0, t - at('O2'))
  const codeWarp = codeU <= 2.5 ? codeU
    : codeU <= 5.5 ? 2.5 + (codeU - 2.5) * 1.6
      : 2.5 + 3 * 1.6 + (codeU - 5.5) * 0.81
  setUiFrame('uiCode', Math.min(11.1, codeWarp) * UI_FPS, 0, 450)   // 代码段：从拓宽那一刻开始放，止于答案之后
  // 右窄栏：同一段素材的尾段（产品切到「定时任务」那一屏之后），慢镜看它自己走
  setUiFrame('uiJob', (342 + (codeU / 15) * 106), 342, 450, 'ui-code/film-code')
  // 左半真实界面：把"做这个小游戏"那一段按原速放完（capture 0–10s 铺在段落前半），
  // 之后停在这一屏上，只留一点极慢的推移，不要出现突然的换屏
  const gameUiP = clamp01((t - (at('E1') + 0.4)) / 11.0)
  setUiFrame('uiGame', gameUiP * 10.0 * UI_FPS, 0, 450, 'ui-code/film-code')
  setUiFrame('uiChat', (t - at('D1')) * UI_FPS, 0, 480)
  if (t < at('O2') + 1.6) setGameFrame(Math.round((t + 3.5) * GAME_FPS))   // 办公段：中栏的聊天
  const retractFade = 1 - clamp01(back)
  const inCode = o === 1 && t < at('D1')
  const inOffice = o === 1 && t >= at('D1') && back < 0.98
  const codeReveal = codeIn * (1 - codeOut) * retractFade
  // 窗口按栏位宽度整幅缩放：过渡期里产品界面是完整的，只是变窄，不会被裁掉字
  const fit = (id, capW, colIdx, extra = 1) => style($(id), {
    transform: `scale(${(Math.min(1, colW(colIdx) / capW) * extra).toFixed(4)})`,
    transformOrigin: 'left top',
  })
  fit('uiCode', 1120, 1)
  // 游戏段左半：真实界面按 1:1 取对话那一片，栏位多宽就露多宽（不缩放、不糊）
  style($('uiGame'), { left: `${(-258 - 24 * clamp01(seg(t, at('E5'), at('E7') - 1.0))).toFixed(1)}px`, top: '0px', width: '1120px', transform: 'none' })
  fit('uiChat', 520, 1)
  // 资料库在办公段里也在缓慢推近（它是真实界面，但仍要一直在动）
  const libPush = 1 + 0.06 * ease.sineInOut(clamp01(seg(t, at('D1') + 1.0, at('E1') - 0.4)))
  fit('uiLibFold', 380, 0, libPush)
  const officeReveal = officeIn * (1 - seg(t, at('E1') - 0.5, at('E1') + 0.25))
  style($('uiCode-clip'), { opacity: inCode ? codeReveal : 0 })
  style($('treePanel'), {
    opacity: inCode ? codeReveal : 0,
    top: '420px', height: '468px', paddingTop: '18px',
    background: '#171921', boxShadow: 'inset 0 0 0 1px rgba(255,255,255,0.07)',
  })
  style($('uiJob-clip'), { opacity: inCode ? codeReveal : 0 })
  // 海报只在开场与"还原回三块"那一刻出现，其余时间一律关掉
  if (t > at('O2') + 1.6 && back < 0.02) {
    for (let i = 0; i < 3; i += 1) if (i !== 0) style($(`poster${i}`), { opacity: 0 })
    if (codeA < 0.02) style($('poster0'), { opacity: 0 })
  }
  // 成果一张张落下来之后，聊天与资料库一起退场：Agent 离场，舞台交给成果
  const agentLeaves = 1 - snap(clamp01(seg(t, 30.5, 31.1)))
  style($('uiChat-clip'), { opacity: inOffice ? officeReveal * agentLeaves : 0 })
  style($('uiLibFold-clip'), { opacity: inOffice ? officeReveal * agentLeaves : 0 })

  // 成片里不再画任何仿造的产品界面：聊天、编辑器、文件树、定时卡、资料库卡、成果流全部下线
  for (const id of ['aux0', 'aux1', 'aux2']) style($(id), { opacity: 0 })
  style($('chatLayer'), { opacity: 0 })
  style($('codeLayer'), { opacity: 0 })

  $('flyLayer').innerHTML = fly

  // 画面里所有图片都解码完再交帧：否则截图会拍到上一帧或空白
  const pending = [...document.images].filter((img) => !img.complete)
  if (pending.length) {
    await Promise.all(pending.map((img) => img.decode().catch(() => {})))
  }
}

window.__sceneReady = true
</script>
</body>
</html>
