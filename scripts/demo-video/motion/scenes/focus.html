<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>focus · 谁聚焦谁变宽</title>
<script src="_kit.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080a; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #eef0f4; }

  .ambient { position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 44%, rgba(255,255,255,0.05), rgba(255,255,255,0) 62%),
      radial-gradient(1500px 780px at 50% 116%, rgba(101,84,217,0.12), rgba(0,0,0,0) 60%),
      #0a0a0c; }
  .grain { position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; }

  .panel { position: absolute; left: 120px; top: 96px; width: 1680px; height: 888px;
    border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.018));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 40px 90px rgba(0,0,0,0.45); }

  /* ---- the three columns: they never leave, only their width changes ---- */
  .col { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .col-surface { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(180deg, rgba(101,84,217,0.10), rgba(101,84,217,0.02)); }
  .col-title { position: absolute; left: 40px; top: 292px; font-size: 40px; font-weight: 600; white-space: nowrap; }
  .col-sub { position: absolute; left: 40px; top: 350px; font-size: 20px; color: rgba(238,240,244,0.45); white-space: nowrap; }
  .col-line { position: absolute; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.09); }
  .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.16); }

  /* ---- narrow state: compact header + whatever that column keeps ---- */
  .mini-head { position: absolute; left: 20px; top: 22px; font-size: 19px; letter-spacing: 0.06em;
    color: rgba(238,240,244,0.72); white-space: nowrap; }
  .thumb { position: absolute; border-radius: 8px; background: rgba(255,255,255,0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); }
  .doc { position: absolute; left: 20px; right: 16px; height: 40px; border-radius: 8px;
    background: rgba(255,255,255,0.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .doc-sq { position: absolute; left: 10px; top: 11px; width: 18px; height: 18px; border-radius: 5px;
    background: rgba(101,84,217,0.45); }
  .doc-line { position: absolute; left: 38px; top: 16px; height: 9px; border-radius: 4px;
    background: rgba(255,255,255,0.18); }
  .doc-hi { position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(150,135,245,0.75);
    background: rgba(101,84,217,0.14); opacity: 0; }

  /* ---- a spoken arrangement docks in the column that owns it ---- */
  .mark { position: absolute; left: 20px; right: 16px; height: 30px; border-radius: 9px;
    background: rgba(101,84,217,0.16); box-shadow: inset 0 0 0 1px rgba(101,84,217,0.32); }
  .mark-dot { position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(150,135,245,0.95); }
  .mark-text { position: absolute; left: 28px; top: 4px; font-size: 17px; white-space: nowrap;
    color: rgba(226,222,250,0.92); }
  .mark-glow { position: absolute; inset: 0; border-radius: 9px; background: #ffffff; opacity: 0; }

  /* ---- inside the focused column ---- */
  .chat { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .bubble { position: absolute; border-radius: 13px; background: rgba(255,255,255,0.11);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.13); }
  .bubble.me { background: rgba(101,84,217,0.18); box-shadow: inset 0 0 0 1px rgba(101,84,217,0.32); }
  .bubble-text { position: absolute; left: 18px; top: 13px; right: 16px; font-size: 18px; line-height: 1.4;
    color: rgba(240,242,246,0.94); }
  .prow { position: absolute; left: 34px; right: 18px; height: 24px; }
  .prow-dot { position: absolute; left: 0; top: 6px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(150,135,245,0.95); }
  .prow-text { position: absolute; left: 22px; top: 2px; font-size: 17px; white-space: nowrap;
    color: rgba(238,240,244,0.62); }
  .work { position: absolute; top: 0; height: 888px; overflow: hidden; }
  .tile { position: absolute; border-radius: 9px; background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .sub { position: absolute; top: 0; height: 888px; overflow: hidden;
    background: rgba(255,255,255,0.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .sub-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
  .dl { position: absolute; height: 10px; border-radius: 3px; background: rgba(255,255,255,0.12); transform-origin: 0 50%; }
  .dl.add { background: rgba(120,200,150,0.32); }
  .dl.del { background: rgba(214,120,120,0.26); }

  .cursor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: #f2f3f7; box-shadow: 0 0 0 6px rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.5); }
  .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(101,84,217,0.9); transform-origin: 50% 50%; }

  #endcard { position: absolute; inset: 0; background: #08080a; opacity: 0; }
  .endcard-name { position: absolute; left: 0; right: 0; top: 452px; text-align: center;
    font-size: 96px; font-weight: 600; }
  .endcard-sub { position: absolute; left: 0; right: 0; top: 596px; text-align: center;
    font-size: 24px; letter-spacing: 0.26em; color: rgba(238,240,244,0.42); }

  .cap { position: absolute; left: 120px; bottom: 22px; }
  .cap-title { font-size: 24px; letter-spacing: 0.04em; color: rgba(238,240,244,0.82); }
  .cap-hint { margin-top: 5px; font-size: 18px; letter-spacing: 0.05em; color: rgba(238,240,244,0.42); }
  .hud-time { position: absolute; right: 120px; bottom: 26px; font-size: 19px; letter-spacing: 0.08em;
    color: rgba(238,240,244,0.36); font-variant-numeric: tabular-nums; }
  .track { position: absolute; left: 120px; right: 120px; bottom: 84px; height: 26px; }
  .track-line { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(255,255,255,0.16); }
  .track-tick { position: absolute; top: 6px; width: 1px; height: 5px; background: rgba(255,255,255,0.28); }
  .track-block { position: absolute; top: 8px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.16); }
  .track-block.active { background: rgba(101,84,217,0.85); }
  .track-name { position: absolute; top: -16px; font-size: 16px; letter-spacing: 0.05em; color: rgba(238,240,244,0.45); }
  .track-head { position: absolute; top: 2px; width: 1.5px; height: 22px; background: #6554d9; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <svg class="grain" width="1920" height="1080" aria-hidden="true">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1920" height="1080" filter="url(#g)" />
  </svg>

  <div class="panel" id="panel">
    <div id="colLayer"></div>
    <div id="chatLayer"></div>
    <div id="gameLayer"></div>
    <div id="flyLayer"></div>
  </div>

  <div id="endcard"><div class="endcard-name">Sunday</div><div class="endcard-sub">LAMTOOLS</div></div>

  <div class="cap"><div class="cap-title" id="capTitle"></div><div class="cap-hint" id="capHint"></div></div>
  <div class="hud-time" id="hudTime"></div>
  <div class="track"><div class="track-line"></div><div id="trackBlocks"></div><div class="track-head" id="trackHead"></div></div>

<script>
const { seg, lerp, ease, style, stagger } = window.MotionKit

/* ---------------------------------------------------------------------------
 * 焦点结构：三条竖栏从头到尾都在台上，谁聚焦谁变宽。
 *
 *   开场     三块等宽落入，宽度依次重分配——把"聚焦=变宽"这条语法教给观众
 *   小游戏   焦点给第三块；另外两块缩窄、虚化，从此不离开舞台
 *   办公     焦点移过去，一笔掠过：翻出上周的、做、存回（资料库就是这一栏）
 *   定时     不占段落：一句话落成标记，时间一到，焦点被它自己拉过去
 *   收尾     焦点松开，三块回到等宽，名字落定
 *
 * 100 BPM：一拍 0.6s，一小节 2.4s。52.8s = 88 拍 = 22 小节。
 * 台面坐标 (0..1680, 0..888)。
 * ------------------------------------------------------------------------ */

const PANEL = { w: 1680, h: 888 }
const EQ = 560
const PREVIEW_WIDE = 1000
const PREVIEW_NARROW = 340
const FOCUSED = 1280
const AUX = 200
const CHAT_W = 440

const BEATS = [
  { id: 'F1', at: 0.0, dur: 1.8, note: '三块等宽交错落入' },
  { id: 'F2', at: 1.8, dur: 3.0, note: '宽度依次重分配：谁聚焦谁变宽（1 → 2 → 3）' },
  { id: 'F3', at: 4.8, dur: 1.2, note: '光标点第三块' },
  { id: 'F4', at: 6.0, dur: 2.4, note: '接管整块表面 → 让出两条窄栏：舞台从此不空' },
  { id: 'F5', at: 8.4, dur: 2.4, note: '主区里 Agent 说第一句话' },
  { id: 'F6', at: 10.8, dur: 7.2, note: '作品一点点长出来（主区 = 对话 + 工作区）' },
  { id: 'F7', at: 18.0, dur: 7.2, note: '子代理三段：递增加速，就在工作区里' },
  { id: 'F8', at: 25.2, dur: 3.0, note: '闪一下、收起、过程行回填' },
  { id: 'F9', at: 28.2, dur: 2.4, note: '汇报：老板，搞完了' },
  { id: 'F10', at: 30.6, dur: 1.8, note: '焦点移到办公——同一个动作，更快' },
  { id: 'F11', at: 32.4, dur: 4.8, note: '一笔掠过：翻出上周的 → 做 → 存回（资料库就是这条栏）' },
  { id: 'F12', at: 37.2, dur: 1.8, note: '你说"以后每周五都给我一份" → 标记落进办公栏' },
  { id: 'F13', at: 39.0, dur: 1.8, note: '你说"每天早上九点帮我看一下代码" → 标记落进实现功能栏' },
  { id: 'F14', at: 40.8, dur: 1.8, note: '时间过去' },
  { id: 'F15', at: 42.6, dur: 1.2, note: '实现功能栏那枚标记亮了——它到点自己动了，焦点被拉过去' },
  { id: 'F16', at: 43.8, dur: 3.6, note: '一笔掠过：看代码、留三条意见（无人值守）' },
  { id: 'F17', at: 47.4, dur: 1.8, note: '焦点松开，三块回到等宽——这次每一块都有东西' },
  { id: 'F18', at: 49.2, dur: 3.6, note: '暗场，名字落定' },
]
const TOTAL = 52.8
const at = (id) => BEATS.find((b) => b.id === id).at

const COLS = [
  { title: '实现功能', sub: '一句话到能用的应用', keeps: '作品' },
  { title: '办公', sub: '报表 · 文档 · 演示', keeps: '资料库' },
  { title: '做小游戏', sub: '能玩的那种', keeps: '作品' },
]
const DOCS = ['上周周报', '上上周周报', '季度汇总']
const ENTER = [18.6, 20.4, 21.6] // 子代理进场：3 拍 → 2 拍
const DONE = [25.8, 26.4, 27.0] // 完成：一拍一级联
const DIFF = [['add', 260], ['add', 190], ['del', 120], ['', 220], ['add', 290]]

const els = {}
const $ = (id) => (els[id] = els[id] || document.getElementById(id))

window.sceneMeta = { duration: TOTAL, width: 1920, height: 1080 }

/* ------------------------------------------------------------ static DOM */
function buildDom() {
  let html = ''
  COLS.forEach((col, i) => {
    html += `<div class="col" id="col${i}" style="z-index:${i === 2 ? 3 : 1}">
      <div class="col-surface" id="surf${i}"></div>
      <div class="col-title" id="title${i}">${col.title}</div>
      <div class="col-sub" id="sub${i}">${col.sub}</div>
      <div class="mini-head" id="mini${i}">${col.keeps}</div>
      <div id="keep${i}"></div>
      <div class="mark" id="mark${i}" style="opacity:0">
        <div class="mark-dot"></div><div class="mark-text" id="markText${i}"></div>
        <div class="mark-glow" id="markGlow${i}"></div></div>
    </div>`
  })
  html += `<div class="divider" id="div0"></div><div class="divider" id="div1"></div>
    <div class="divider" id="div2" style="opacity:0"></div>`
  $('colLayer').innerHTML = html

  // 每条栏"留着的东西"
  const thumbs = (i, n, top) => {
    let out = ''
    for (let k = 0; k < n; k += 1) {
      out += `<div class="thumb" data-thumb="${i}-${k}" style="left:20px;top:${top + k * 116}px;width:160px;height:104px;opacity:0"></div>`
    }
    return out
  }
  $('keep0').innerHTML = thumbs(0, 2, 62)
  let docs = ''
  DOCS.forEach((name, k) => {
    docs += `<div class="doc" data-doc="${k}" style="top:${62 + k * 52}px;opacity:0">
      <div class="doc-sq"></div><div class="doc-line" style="width:${92 - k * 14}px"></div>
      <div class="doc-hi" id="docHi${k}"></div></div>`
  })
  $('keep1').innerHTML = docs
  $('keep2').innerHTML = thumbs(2, 1, 62)

  // 主区（聚焦栏内部）：对话 + 工作区。聚焦栏换的时候只挪位置，不重建。
  let chat = ''
  for (let i = 0; i < 6; i += 1) {
    chat += `<div class="prow" data-prow="${i}" style="top:${150 + i * 52}px;opacity:0">
      <div class="prow-dot"></div><div class="prow-text" id="prowText${i}"></div></div>`
  }
  $('chatLayer').innerHTML = chat

  // 工作区的示意内容：网格 + 三块子代理矩形（只属于游戏那一段）
  const workW = FOCUSED - CHAT_W - 1
  const G = { cols: 4, rows: 3, size: 96, gap: 16 }
  const gw = G.cols * G.size + (G.cols - 1) * G.gap
  const gx = (workW - gw) / 2
  let game = ''
  for (let r = 0; r < G.rows; r += 1) {
    for (let c = 0; c < G.cols; c += 1) {
      game += `<div class="tile" data-tile="${r * G.cols + c}" style="left:${gx + c * (G.size + G.gap)}px;top:${110 + r * (G.size + G.gap)}px;width:${G.size}px;height:${G.size}px;opacity:0"></div>`
    }
  }
  const sw = (workW - 2) / 3
  for (let i = 0; i < 3; i += 1) {
    game += `<div class="sub" id="sub${i}" style="left:${gx + i * sw}px;width:${sw}px;opacity:0">
      <div class="sub-flash" id="subflash${i}"></div></div>`
  }
  $('gameLayer').innerHTML = game

  let track = ''
  for (let b = 0; b <= Math.round(TOTAL / 0.6); b += 1) {
    track += `<div class="track-tick" style="left:${(((b * 0.6) / TOTAL) * 100).toFixed(3)}%;height:${b % 4 === 0 ? 9 : 5}px;top:${b % 4 === 0 ? 4 : 6}px;opacity:${b % 4 === 0 ? 0.5 : 0.24}"></div>`
  }
  for (const b of BEATS) {
    track += `<div class="track-block" data-block="${b.id}" style="left:${((b.at / TOTAL) * 100).toFixed(2)}%;width:${((b.dur / TOTAL) * 100).toFixed(2)}%"></div>`
    track += `<div class="track-name" style="left:${((b.at / TOTAL) * 100).toFixed(2)}%">${b.id}</div>`
  }
  $('trackBlocks').innerHTML = track
}
buildDom()

/* ------------------------------------------------------------------ render */
// 三条栏的位置固定，只有宽度变：谁聚焦谁占 1280，另外两条各 200。
function widthsAt(t) {
  const moves = [
    { at: at('F4'), dur: 2.4, owner: 2, from: 'preview' },
    { at: at('F10'), dur: 1.8, owner: 1, from: 2 },
    { at: at('F15'), dur: 1.2, owner: 0, from: 1 },
    { at: at('F17'), dur: 1.8, owner: -1, from: 0 },
  ]
  let owner = -1
  let p = 0
  let from = -1
  let settling = false
  // 开场的预览：宽的那个在 1/2/3 之间轮流
  if (t < at('F4')) {
    const step = t < at('F2') ? -1 : t < at('F2') + 1.0 ? 0 : t < at('F2') + 2.0 ? 1 : 2
    const blend = step < 0 ? 1 : ease.expoOut(seg(t, at('F2') + step * 1.0, at('F2') + step * 1.0 + 0.6))
    const target = step < 0 ? [EQ, EQ, EQ] : [PREVIEW_NARROW, PREVIEW_NARROW, PREVIEW_NARROW].map((w, i) => (i === step ? PREVIEW_WIDE : w))
    const start = [EQ, EQ, EQ]
    return { widths: start.map((w, i) => lerp(w, target[i], blend)), owner: step, focusP: 0, giveP: 0 }
  }
  for (const move of moves) {
    if (t >= move.at) { owner = move.owner; from = move.from; p = ease.cubicInOut(seg(t, move.at, move.at + move.dur)); settling = move.owner === -1 }
  }
  const geo = (o) => [0, 1, 2].map((i) => (i === o ? FOCUSED : AUX))
  const start = from === -1 ? [EQ, EQ, EQ] : from === 'preview' ? [PREVIEW_NARROW, PREVIEW_NARROW, PREVIEW_WIDE] : geo(from)
  const end = owner === -1 ? [EQ, EQ, EQ] : geo(owner)
  return { widths: start.map((w, i) => lerp(w, end[i], p)), owner, focusP: settling ? 0 : p, giveP: settling ? 0 : p }
}

window.renderFrame = (t) => {
  let fly = ''
  const { widths, owner } = widthsAt(t)
  const claim = ease.cubicInOut(seg(t, at('F4'), at('F4') + 1.2))      // 接管整块表面
  const give = ease.cubicInOut(seg(t, at('F4') + 1.2, at('F4') + 2.4)) // 让出两条窄栏
  const grab = Math.max(claim, give)

  let cursorX = 0
  const xs = [0]
  COLS.forEach((_, i) => {
    const w = Math.max(0, widths[i])
    const x = i === 0 ? 0 : xs[i - 1] + Math.max(0, widths[i - 1])
    xs.push(x + w)
    if (i === 2) cursorX = x
    style($(`col${i}`), { left: `${x.toFixed(1)}px`, width: `${w.toFixed(1)}px` })
    style($(`surf${i}`), { opacity: i === owner ? 0.85 * (1 - grab * 0.9) : 0 })
  })
  style($('div0'), { left: `${xs[1].toFixed(1)}px`, opacity: widths[0] > 4 && widths[1] > 4 ? 1 : 0 })
  style($('div1'), { left: `${xs[2].toFixed(1)}px`, opacity: widths[1] > 4 && widths[2] > 4 ? 1 : 0 })

  // 窄栏虚化；聚焦栏全亮。接管那一瞬整块表面都是它。
  COLS.forEach((_, i) => {
    const wide = widths[i] > FOCUSED - 1
    const dim = wide ? 1 : lerp(1, 0.5, give)
    style($(`title${i}`), { opacity: dim * (1 - give), transform: `translateY(${(give * -6).toFixed(1)}px)` })
    style($(`sub${i}`), { opacity: dim * 0.9 * (1 - give) })
    style($(`mini${i}`), { opacity: i === owner || i < 0 ? 0 : give * dim })
  })

  /* ---- 窄栏里留着的东西 ---- */
  COLS.forEach((_, i) => {
    const show = give * (i === owner ? 0.35 : 1)
    document.querySelectorAll(`[data-thumb="${i}-0"],[data-thumb="${i}-1"]`).forEach((node) => {
      style(node, { opacity: show })
    })
  })
  DOCS.forEach((_, k) => {
    style($(`keep1`).children[k], { opacity: give })
  })
  $('keep1').querySelectorAll('.doc').forEach((node, k) => style(node, { opacity: give }))

  /* ---- 一句话落成标记，住进它属于的那条栏 ---- */
  const dock = (when, col, label, y) => {
    const p = ease.cubicInOut(seg(t, when + 0.3, when + 1.2))
    const pop = ease.softBack(seg(t, when, when + 0.3))
    const from = { x: 620, y: 700 }
    const to = { x: xs[col] + 20, y }
    if (pop > 0.01 && t < when + 1.4) {
      const x = lerp(from.x, to.x, p)
      const yy = lerp(from.y, to.y, p)
      fly += `<div class="mark" style="left:${x.toFixed(1)}px;top:${yy.toFixed(1)}px;width:${lerp(190, 160, p).toFixed(1)}px;opacity:${Math.min(1, pop).toFixed(3)}">
        <div class="mark-dot"></div><div class="mark-text">${label}</div></div>`
    }
    style($(`mark${col}`), { top: `${y}px`, opacity: seg(t, when + 1.2, when + 1.5) })
    const text = $(`markText${col}`)
    if (text.textContent !== label) text.textContent = label
  }
  dock(at('F12'), 1, '每周五', 246)
  dock(at('F13'), 0, '每天 09:00', 296)

  // 到点了自己动：那枚标记亮一下，焦点被它拉过去
  const pulse = Math.sin(Math.PI * seg(t, at('F15') - 0.3, at('F15') + 0.9))
  style($('markGlow0'), { opacity: (Math.max(0, pulse) * 0.3).toFixed(3) })

  /* ---- 资料库在这一栏里：翻出旧的 → 做 → 存回 ---- */
  const readP = Math.sin(Math.PI * seg(t, at('F11') + 0.3, at('F11') + 1.5))
  style($('docHi0'), { opacity: readP.toFixed(3) })
  const storeP = seg(t, at('F11') + 3.6, at('F11') + 4.4)
  if (storeP > 0) {
    style($('keep1').querySelectorAll('.doc')[0], { opacity: give })
  }

  /* ---- 聚焦栏内部：对话 + 工作区跟着焦点走 ---- */
  const chatW = CHAT_W
  if (owner >= 0) {
    style($('chatLayer'), { left: `${(xs[owner] + 34).toFixed(1)}px`, width: `${chatW - 34}px`, opacity: seg(t, at('F4') + 1.6, at('F4') + 2.4) })
    style($('gameLayer'), { left: `${(xs[owner] + chatW + 1).toFixed(1)}px`, width: `${FOCUSED - chatW - 1}px`, opacity: seg(t, at('F4') + 1.6, at('F4') + 2.4) * (1 - seg(t, at('F10'), at('F10') + 1.2)) })
  } else {
    style($('chatLayer'), { opacity: 0 })
    style($('gameLayer'), { opacity: 0 })
  }

  // 主区的过程行与工作区内容（示意）
  const rows = [
    { at: at('F6') + 0.6, text: '读取上次的存档' },
    { at: at('F6') + 2.4, text: '搭地面和路' },
    { at: at('F6') + 4.2, text: '放树和房子' },
    { at: at('F11') + 0.6, text: '翻出上周那份' },
    { at: at('F11') + 2.4, text: '按它的格式做这周的' },
    { at: at('F11') + 3.6, text: '存回资料库' },
  ]
  rows.forEach((row, i) => {
    const node = document.querySelector(`[data-prow="${i}"]`)
    if (!node) return
    const p = ease.quintOut(seg(t, row.at, row.at + 0.5))
    style(node, { opacity: p * 0.95 })
    const text = $(`prowText${i}`)
    if (text.textContent !== row.text) text.textContent = row.text
  })

  // 工作区：网格 + 子代理三块（示意）
  const workW = FOCUSED - CHAT_W - 1
  const G = { cols: 4, rows: 3, size: 96, gap: 16 }
  const gx = (workW - (G.cols * G.size + (G.cols - 1) * G.gap)) / 2
  document.querySelectorAll('[data-tile]').forEach((node) => {
    const p = stagger(t, Number(node.dataset.tile), { start: at('F6') + 0.3, each: 0.12, dur: 0.5 })
    style(node, { opacity: Math.min(1, p * 2.2) })
  })
  // 子代理：三块半透明矩形接住气泡、各干各的
  for (let i = 0; i < 3; i += 1) {
    const sw = (workW - 2) / 3
    const slide = ease.expoOut(seg(t, ENTER[i], ENTER[i] + 0.62))
    const leave = ease.quintOut(seg(t, DONE[i] + 0.45, DONE[i] + 1.2))
    style($(`sub${i}`), {
      opacity: Math.min(1, seg(t, ENTER[i], ENTER[i] + 0.2) * 1.6) * (1 - leave),
      transform: `translateY(${((1 - slide) * -900 + leave * -900).toFixed(1)}px)`,
    })
    style($(`subflash${i}`), { opacity: (Math.sin(Math.PI * seg(t, DONE[i], DONE[i] + 0.42)) * 0.16).toFixed(3) })
  }

  /* ---- 无人值守：看代码、留意见（一笔掠过） ---- */
  if (t >= at('F16')) {
    const unseen = seg(t, at('F15') + 0.6, at('F15') + 1.2)
    DIFF.forEach(([kind, w], i) => {
      const p = seg(t, at('F16') + i * 0.3, at('F16') + i * 0.3 + 0.4)
      if (p <= 0) return
      fly += `<div class="dl ${kind}" style="left:${(xs[0] + 60).toFixed(1)}px;top:${(200 + i * 40).toFixed(1)}px;width:${(w * p).toFixed(1)}px;opacity:${(p * unseen).toFixed(3)}"></div>`
    })
    for (let i = 0; i < 3; i += 1) {
      const p = seg(t, at('F16') + 1.8 + i * 0.4, at('F16') + 2.2 + i * 0.4)
      if (p <= 0) continue
      fly += `<div style="position:absolute;left:${(xs[0] + 60).toFixed(1)}px;top:${(430 + i * 40).toFixed(1)}px;width:${(200 - i * 30)}px;height:14px;border-radius:6px;background:rgba(101,84,217,0.30);opacity:${(ease.quintOut(p) * 0.95).toFixed(3)}"></div>`
    }
  }

  /* ---- 光标 ---- */
  const curP = ease.sineInOut(seg(t, at('F3') - 0.6, at('F3') + 0.2))
  const target = { x: cursorX + 120, y: 430 }
  const press = Math.sin(Math.PI * seg(t, at('F3') + 0.2, at('F3') + 0.5))
  if (t >= at('F3') - 0.8 && t < at('F4') + 0.6) {
    const alpha = seg(t, at('F3') - 0.6, at('F3') - 0.35) * (1 - seg(t, at('F4'), at('F4') + 0.4))
    fly += `<div class="cursor" style="left:${lerp(PANEL.w - 140, target.x, curP).toFixed(1)}px;top:${lerp(PANEL.h - 140, target.y, curP).toFixed(1)}px;opacity:${alpha.toFixed(3)};transform:scale(${(1 - press * 0.3).toFixed(3)})"></div>`
    const rp = seg(t, at('F3') + 0.25, at('F3') + 1.1)
    if (rp > 0 && rp < 1) {
      fly += `<div class="ripple" style="left:${target.x - 40}px;top:${target.y - 40}px;width:80px;height:80px;opacity:${(Math.sin(Math.PI * rp) * 0.9).toFixed(3)};transform:scale(${lerp(0.3, 3.2, ease.expoOut(rp)).toFixed(3)})"></div>`
    }
  }

  /* ---- 收尾 ---- */
  const dark = ease.sineInOut(seg(t, at('F18') + 0.4, at('F18') + 1.6))
  style($('endcard'), { opacity: dark })
  style($('colLayer'), { opacity: 1 - dark * 0.9 })

  /* ---- 字幕 + 时间轴 ---- */
  let current = BEATS[0]
  for (const b of BEATS) if (t >= b.at) current = b
  $('capTitle').textContent = `${current.id} · ${current.note}`
  $('capHint').textContent = t < at('F4')
    ? '开场把"聚焦=变宽"教给观众，后面每一次焦点移动都复用它'
    : t < at('F10')
      ? '另外两块缩窄虚化，但不离开舞台：辅助内容就住在里面'
      : t < at('F15')
        ? '办公只拿一小段：资料库就是这条栏，定时只落一枚标记'
        : t < at('F17')
          ? '定时到点自己动了，焦点被它拉过去——它不占段落，它有事件'
          : '三块回等宽，每一块都有东西'
  $('hudTime').textContent = `${t.toFixed(1)}s / ${TOTAL.toFixed(1)}s · 100 BPM`
  document.querySelectorAll('[data-block]').forEach((node) => {
    node.classList.toggle('active', node.dataset.block === current.id)
  })
  style($('trackHead'), { left: `${((t / TOTAL) * 100).toFixed(3)}%` })

  $('flyLayer').innerHTML = fly
}

window.__sceneReady = true
</script>
</body>
</html>
