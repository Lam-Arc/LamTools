<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunday</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #14161a;
        color: #e6e8eb;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #2a2f37;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
      .tag {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 999px;
        background: #232830;
        color: #9aa4b2;
        border: 1px solid #2f3540;
      }
      .tag.ok { background: #16321f; color: #7ddc9b; border-color: #245a35; }
      .tag.bad { background: #33191b; color: #f08a8a; border-color: #5a2629; }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .turn {
        border-left: 2px solid #2f3540;
        padding: 6px 0 6px 12px;
      }
      .turn .who { font-size: 11px; color: #8b95a3; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .06em; }
      .turn.user { border-left-color: #4a7fd4; }
      .turn.core { border-left-color: #3d8b5f; }
      .turn.stop { border-left-color: #b4573f; }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
      footer {
        border-top: 1px solid #2a2f37;
        padding: 10px 12px;
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        background: #1b1f25;
        border: 1px solid #2f3540;
        color: inherit;
        padding: 9px 11px;
        border-radius: 8px;
        font: inherit;
      }
      button {
        background: #2b3540;
        color: #e6e8eb;
        border: 1px solid #3a4552;
        padding: 9px 14px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      button.stop { background: #4a2320; border-color: #6a322c; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sunday</h1>
      <span class="tag" id="conn">connecting</span>
      <span class="tag" id="state">idle</span>
      <span class="tag" id="where">data: unknown</span>
    </header>
    <main id="log"></main>
    <footer>
      <input id="prompt" placeholder="Ask the core something" autocomplete="off" />
      <button id="send">Send</button>
      <button id="stop" class="stop" disabled>Stop</button>
    </footer>

    <script type="module">
      // This page talks to the core over the real protocol. It includes a
      // minimal WebSocket implementation of the same client contract the desktop
      // workbench uses, so what is proven here is the protocol and the wiring,
      // not a bespoke test channel.
      const log = document.getElementById('log')
      const connTag = document.getElementById('conn')
      const stateTag = document.getElementById('state')
      const whereTag = document.getElementById('where')
      const promptInput = document.getElementById('prompt')
      const sendButton = document.getElementById('send')
      const stopButton = document.getElementById('stop')

      function setTag(el, text, kind) {
        el.textContent = text
        el.className = kind ? `tag ${kind}` : 'tag'
      }

      function addTurn(who, text, cls) {
        const div = document.createElement('div')
        div.className = `turn ${cls}`
        const label = document.createElement('div')
        label.className = 'who'
        label.textContent = who
        const body = document.createElement('pre')
        body.textContent = text
        div.append(label, body)
        log.append(div)
        log.scrollTop = log.scrollHeight
        return body
      }

      let socket = null
      let nextId = 1
      let pending = new Map()
      let threadId = `android-${Date.now()}`
      let liveBody = null

      async function resolvePort() {
        // Prefer the port the Rust host reports over IPC. Fall back to a query
        // parameter so the same page can be opened by hand for debugging.
        const fromQuery = new URLSearchParams(location.search).get('port')
        if (fromQuery) return Number(fromQuery)
        try {
          const { invoke } = window.__TAURI__?.core ?? {}
          if (invoke) return Number(await invoke('core_port'))
        } catch (error) {
          console.warn('core_port unavailable', error)
        }
        throw new Error('the core port is unknown')
      }

      function call(method, params) {
        const id = `p${nextId++}`
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id)
            reject(new Error(`timed out: ${method}`))
          }, 120_000)
          pending.set(id, { resolve, reject, timer })
          socket.send(JSON.stringify({ id, method, params }))
        })
      }

      function handleFrame(frame) {
        if (frame.id !== undefined && pending.has(frame.id)) {
          const entry = pending.get(frame.id)
          pending.delete(frame.id)
          clearTimeout(entry.timer)
          if (frame.error) entry.reject(new Error(frame.error.message))
          else entry.resolve(frame.result ?? {})
          return
        }
        if (!frame.method) return
        const event = frame.params ?? {}
        const method = event.method ?? frame.method
        if (method === 'turn/accepted') {
          setTag(stateTag, 'running')
          stopButton.disabled = false
          return
        }
        if (method === 'item/completed') {
          const content = event.payload?.content
          if (typeof content === 'string' && content.trim()) {
            addTurn('tool', content, 'core')
          }
          return
        }
        if (method === 'turn/completed') {
          const text = String(event.payload?.text ?? '')
          if (liveBody) {
            if (text.trim()) liveBody.textContent = text
            liveBody = null
          } else if (text.trim()) {
            addTurn('core', text, 'core')
          }
          setTag(stateTag, 'idle')
          stopButton.disabled = true
          return
        }
        if (method === 'turn/cancelled' || method === 'turn/model_completed') {
          return
        }
        if (method.startsWith('item/')) {
          return
        }
      }

      async function main() {
        let port
        try {
          port = await resolvePort()
        } catch (error) {
          setTag(connTag, String(error.message ?? error), 'bad')
          return
        }
        setTag(whereTag, `port ${port}`)

        socket = new WebSocket(`ws://127.0.0.1:${port}`)
        socket.onopen = async () => {
          setTag(connTag, 'open', 'ok')
          try {
            const info = await call('initialize', {
              clientInfo: { name: 'android-host-ui', version: '0.1.0' },
              threadId,
            })
            const protocol = info.capabilities?.protocol
            setTag(connTag, protocol ? `open ${protocol}` : 'open', 'ok')
            await call('thread/start', { thread_id: threadId })
            // Prove the sandbox path and the queue round trip before the user
            // types anything: an empty queue that silently fails is the exact
            // failure this page exists to catch.
            try {
              const { invoke } = window.__TAURI__?.core ?? {}
              if (invoke) {
                const coreInfo = await invoke('core_info')
                setTag(whereTag, `port ${port} · ${coreInfo.data_dir}`)
              }
            } catch (error) {
              console.warn('core_info unavailable', error)
            }
            setTag(stateTag, 'idle')
          } catch (error) {
            setTag(connTag, String(error.message ?? error), 'bad')
          }
        }
        socket.onmessage = (event) => {
          try {
            handleFrame(JSON.parse(event.data))
          } catch (error) {
            console.warn('bad frame', error)
          }
        }
        socket.onerror = () => setTag(connTag, 'error', 'bad')
        socket.onclose = () => {
          setTag(connTag, 'closed', 'bad')
          setTag(stateTag, 'idle')
          stopButton.disabled = true
        }
      }

      async function send() {
        const text = promptInput.value.trim()
        if (!text) return
        promptInput.value = ''
        addTurn('you', text, 'user')
        liveBody = addTurn('core', '…', 'core')
        setTag(stateTag, 'running')
        stopButton.disabled = false
        try {
          await call('turn/start', {
            thread_id: threadId,
            client_message_id: `m-${Date.now()}`,
            input: [{ type: 'text', text }],
            include_snapshot: false,
          })
        } catch (error) {
          addTurn('error', String(error.message ?? error), 'stop')
          setTag(stateTag, 'idle')
          stopButton.disabled = true
        }
      }

      async function stop() {
        stopButton.disabled = true
        try {
          await call('turn/interrupt', { thread_id: threadId })
        } catch (error) {
          console.warn('stop failed', error)
        }
      }

      sendButton.addEventListener('click', send)
      stopButton.addEventListener('click', stop)
      promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault()
          send()
        }
      })

      main()
    </script>
  </body>
</html>
