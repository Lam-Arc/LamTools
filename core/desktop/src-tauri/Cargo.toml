[package]
name = "lamcore"
version = "0.3.15"
description = "Sunday desktop app"
authors = ["Lam"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.9"
mdns-sd = "0.13"
local-ip-address = "0.6"
tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
rfd = "0.17"
# Opens URLs/files in the OS default application. Used to route clicked
# hyperlinks to the system browser so they never navigate the webview.
open = "5"
# Strict URL parsing for scheme validation in open_external_url. Already a
# transitive dependency of Tauri, so adding it directly adds no new build.
url = "2"
urlencoding = "2"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }
