[package]
name = "sunday"
version = "0.3.48"
description = "Sunday desktop app"
authors = ["Lam"]
edition = "2021"

# user:“进程为什么叫 lamcore 而不是 sunday？”+(可执行文件是用户唯一能看到的进程身份，改名就是迁移，不能只改描述)
# The package is the build identity; the bin target is the file users see in
# Task Manager. Keeping an explicit bin name makes it Sunday.exe rather than
# cargo's lowercase package-name default.
[[bin]]
name = "Sunday"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.9"
mdns-sd = "0.13"
local-ip-address = "0.6"
tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
rfd = "0.17"
# Opens URLs/files in the OS default application. Used to route clicked
# hyperlinks to the system browser so they never navigate the webview.
open = "5"
# Strict URL parsing for scheme validation in open_external_url. Already a
# transitive dependency of Tauri, so adding it directly adds no new build.
url = "2"
urlencoding = "2"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
# 传输进程 → 宿主的状态行：带版本前缀的 JSON，两端共用同一份解析。
# 只引这个瘦 crate（不引 iroh）：wmi 的 windows 版本会和桌面端已有的撞车。
sunday-p2p-status = { path = "../../p2p-status" }

[target.'cfg(windows)'.dependencies]
# user:“平台能力只能在 Windows 上用 WebView2 COM 拿”+(webview2-com 之前只是 Tauri 的传递依赖，必须显式声明才能 use；
# windows 版本固定 0.61 以复用 webview2-com 0.38.2 已锁定的同一份 crate，不新增第二份 windows 构建)。
webview2-com = "0.38"
# user:“截图走 CapturePreview + 内存流”+(SHCreateMemStream 需要 Win32_UI_Shell；只加这一个 feature，
# windows crate 仍与 webview2-com 0.38.2 锁定的版本一致，不新增第二份构建)。
# user:“优先用 Windows 内置 OCR（Windows.Media.Ocr）…不联网、不分发第三方二进制”+
# (截图取字只用系统自带引擎：Media_Ocr 是识别本身，Graphics_Imaging 是系统解码图片，
#  Storage_Streams 是把字节喂给解码器的内存流，Foundation/Globalization 是异步结果与语言标识。
#  全部是同版本 windows crate 的 feature，不新增依赖、不新增第二份构建)。
# user:“同窗口 Child WebView是更好的方案，实现”+(在同版本 windows 0.61 上启用 DirectComposition 与 D3D11/DXGI 特性，先做独立的 CompositionController 最小验证实验)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }
