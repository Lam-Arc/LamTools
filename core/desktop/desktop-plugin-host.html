<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LamTools Desktop Plugin</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { font: 13px/1.5 system-ui, "Microsoft YaHei UI", sans-serif; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
      #host-error {
        display: none;
        width: 100%;
        height: 100%;
        padding: 16px;
        place-items: center;
        color: #f2f4f8;
        background: #202229;
        text-align: center;
      }
      body.has-error iframe { display: none; }
      body.has-error #host-error { display: grid; }
    </style>
  </head>
  <body>
    <iframe
      id="plugin-frame"
      title="LamTools 桌面插件"
      sandbox="allow-forms allow-same-origin allow-scripts"
    ></iframe>
    <main id="host-error" role="alert"></main>
    <script type="module" src="/src/desktopPluginHost.ts"></script>
  </body>
</html>
