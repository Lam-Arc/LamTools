<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Use 屏幕胶囊预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(circle at 50% 0%, #1d1f26 0%, #111215 55%, #0a0b0d 100%);
      color: #e8e8ec;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .preview-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* 和覆盖层一致：角度在根节点转，胶囊与光标都继承 */
      animation: cu-angle-flow 6.5s linear infinite;
    }
    @keyframes cu-angle-flow {
      to { --cu-angle: 360deg; }
    }
    /* 浅色底，用来看光标的白边和彩色填充在亮背景上的对比 */
    .preview-paper {
      position: absolute;
      top: 260px;
      width: 260px;
      height: 140px;
      border-radius: 12px;
      background: #f2f2f5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .preview-content {
      padding: 96px 64px;
      display: grid;
      gap: 14px;
      max-width: 520px;
    }
    .preview-content h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .preview-content p {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(232, 232, 236, 0.62);
    }
  </style>
</head>
<body>
  <div id="bar-preview"></div>
  <script type="module" src="./src/bar-preview.ts"></script>
</body>
</html>
