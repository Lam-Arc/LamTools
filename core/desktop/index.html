<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday</title>
  <script id="sunday-theme-bootstrap">
    (() => {
      const light = {
        angle: 112,
        stops: [['#fff0df', 0], ['#f7efff', 58], ['#edf2ff', 100]],
        text: '#17265a',
        surface: '#fffdf8',
      }
      const dark = {
        angle: 112,
        stops: [['#171926', 0], ['#241c31', 56], ['#182438', 100]],
        text: '#f4efff',
        surface: '#11131d',
      }
      const isColor = value => typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)
      const clamp = (value, min, max, fallback) => {
        const number = Number(value)
        return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback
      }
      const readPreferences = () => {
        for (const key of ['lamtools.core.ui.preferences', 'lamtools.core.ui']) {
          try {
            const raw = window.localStorage.getItem(key)
            if (!raw) continue
            const value = JSON.parse(raw)
            if (value && typeof value === 'object' && !Array.isArray(value)) return value
          } catch (_) {}
        }
        return null
      }
      const preferences = readPreferences()
      const storedMode = preferences && preferences.themeMode
      const mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'system'
        ? storedMode
        : 'system'
      const systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      const effectiveMode = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode
      const fallback = effectiveMode === 'dark' ? dark : light
      const saved = preferences && (preferences[effectiveMode + 'Theme'] || preferences.theme) || {}
      const rawStops = Array.isArray(saved.backdropStops) ? saved.backdropStops : []
      const stops = rawStops.slice(0, 8).map(stop => [
        isColor(stop && stop.color) ? stop.color : fallback.stops[0][0],
        clamp(stop && stop.position, 0, 100, 0),
      ]).sort((a, b) => a[1] - b[1])
      if (!stops.length) stops.push(...fallback.stops)
      if (stops.length > 1) {
        stops[0][1] = 0
        stops[stops.length - 1][1] = 100
      }
      const solid = stops.every(stop => stop[0].toLowerCase() === stops[0][0].toLowerCase())
      const angle = clamp(saved.backdropAngle, 0, 360, fallback.angle)
      const backdrop = solid ? stops[0][0] : `linear-gradient(${angle}deg, ${stops.map(stop => `${stop[0]} ${stop[1]}%`).join(', ')})`
      const text = isColor(saved.backdropText) ? saved.backdropText : fallback.text
      const rawSurface = Array.isArray(saved.mainStops) && saved.mainStops[0] && saved.mainStops[0].color
      const surface = isColor(rawSurface) ? rawSurface : fallback.surface
      const hex = surface.slice(1)
      const alpha = effectiveMode === 'dark' ? 0.68 : 0.64
      const splash = `rgba(${parseInt(hex.slice(0, 2), 16)}, ${parseInt(hex.slice(2, 4), 16)}, ${parseInt(hex.slice(4, 6), 16)}, ${alpha})`
      const startupTheme = { effectiveMode, backdropBackground: backdrop, backdropText: text, splashBackground: splash }
      window.__SUNDAY_STARTUP_THEME__ = startupTheme
      const style = document.documentElement.style
      style.setProperty('--startup-body-background', backdrop)
      style.setProperty('--startup-body-text', text)
      style.setProperty('--startup-splash-background', splash)
      style.setProperty('--startup-reveal-background', backdrop)
      style.setProperty('--startup-mark-shadow', effectiveMode === 'dark'
        ? 'drop-shadow(0 14px 26px rgba(0, 0, 0, 0.24))'
        : 'drop-shadow(0 12px 22px rgba(23, 36, 81, 0.12))')
    })()
  </script>
  <style>
    :root {
      --titlebar-offset: 36px;
      --startup-body-background: linear-gradient(112deg, #fff0df 0%, #f7efff 58%, #edf2ff 100%);
      --startup-body-text: #17265a;
      --startup-splash-background: rgba(255, 253, 248, 0.64);
      --startup-reveal-background: linear-gradient(112deg, #fff0df 0%, #f7efff 58%, #edf2ff 100%);
      --startup-mark-shadow: drop-shadow(0 12px 22px rgba(23, 36, 81, 0.12));
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body { overflow: hidden; background: var(--startup-body-background); color: var(--startup-body-text); font-family: system-ui, sans-serif; }

    /* Native first paint: a translucent Sunday veil and the bare mark. */
    #startup-splash {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--startup-splash-background);
      -webkit-backdrop-filter: blur(18px) saturate(1.04);
      backdrop-filter: blur(18px) saturate(1.04);
      pointer-events: none;
    }
    .startup-splash__reveal {
      position: absolute;
      inset: 0;
      background: var(--startup-reveal-background);
      clip-path: circle(0 at 50% 50%);
      will-change: clip-path, opacity;
    }
    .startup-splash__mark {
      position: relative;
      z-index: 1;
      display: grid;
      width: 112px;
      height: 112px;
      place-items: center;
      filter: var(--startup-mark-shadow);
      will-change: transform, opacity;
    }
    .startup-splash__mark svg { width: 100%; height: 100%; display: block; }
    @media (prefers-reduced-motion: reduce) {
      .startup-splash__reveal { clip-path: none; }
      .startup-splash__mark { will-change: auto; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --startup-body-background: linear-gradient(112deg, #171926 0%, #241c31 56%, #182438 100%);
        --startup-body-text: #f4efff;
        --startup-splash-background: rgba(17, 19, 29, 0.68);
        --startup-reveal-background: linear-gradient(112deg, #171926 0%, #241c31 56%, #182438 100%);
        --startup-mark-shadow: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.24));
      }
    }
  </style>
  <script>
    // Desktop: the backend port is chosen dynamically by Tauri (random free port).
    // main.ts fetches it via invoke('get_api_base') and sets __LAMTOOLS_API_BASE__.
    // Do NOT hardcode a port here — it would shadow the correct dynamic value.
  </script>
</head>
<body>

            <linearGradient id="startup-sweep" x1="80" y1="645" x2="971" y2="1160" gradientUnits="userSpaceOnUse"><stop stop-color="#10AEFD"/><stop offset="1" stop-color="#823CFC"/></linearGradient>
            <linearGradient id="startup-arch" x1="717" y1="492" x2="1078" y2="266" gradientUnits="userSpaceOnUse"><stop stop-color="#0453FD"/><stop offset="1" stop-color="#C745FD"/></linearGradient>
          </defs>
          <ellipse cx="380.5" cy="447" rx="215.5" ry="212.5" fill="url(#startup-warm)"/>
          <path fill="url(#startup-arch)" d="M1172 440c-4-20-13-37-25-50-28-32-74-56-128-69-57-14-114-4-151 13-34 15-62 33-89 58-25 23-46 50-58 78-11 26-1 51 19 65 18 13 42 13 60 3 17-9 27-25 43-41 29-28 68-37 107-36 47 0 84 21 119 59 17 17 43 15 60 6 30-16 50-47 43-86Z"/>
          <path fill="url(#startup-sweep)" d="M1209 700c-3-22-12-38-26-47-19-13-41-10-61-3-32 12-53 34-75 56-34 37-62 67-96 97-49 43-112 73-183 95-58 18-114 22-172 17-48-4-95-16-139-31-58-20-102-47-144-85-43-38-80-83-117-120-19-19-44-30-67-33-27-4-51 7-65 28-16 24-13 54-3 84 15 45 40 90 69 127 46 58 90 99 141 135 55 38 115 63 179 82 96 28 200 30 303 11 77-14 143-43 195-72 57-32 102-70 144-116 38-42 61-79 80-112 24-42 42-84 37-113Z"/>
        </svg>
    </span>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
