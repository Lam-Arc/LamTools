<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LamTools Core</title>
  <style>
    :root { --titlebar-offset: 36px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 挂载前静态底色：对齐 helpers/theme.ts DEFAULT_THEME（backdrop #202020 / text #f2efeb）。
       浅色主题下启动瞬间仍会闪一帧深色 —— 主题变量要等 JS 注入 :root 后才生效，属固有帧。 */
    html, body { width: 100%; min-height: 100%; }
    body { overflow: hidden; background: #202020; color: #f2efeb; font-family: system-ui, sans-serif; }

    /* A native Tauri window can paint before Vue has mounted. Keep that first
       frame intentional: the splash is deliberately restrained and reuses
       Core's dark neutral instead of introducing a second visual language. */
    #startup-splash {
      --startup-text: #f2efeb;
      --startup-muted: rgba(242, 239, 235, 0.56);
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--startup-text);
      background: rgba(72, 72, 72, 0.72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    #startup-splash::before {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(242, 239, 235, 0.07);
      border-radius: 50%;
      content: '';
      pointer-events: none;
    }
    .startup-splash__panel {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 228px;
      padding: 14px 16px;
      border: 1px solid rgba(242, 239, 235, 0.12);
      border-radius: 12px;
      background: rgba(242, 239, 235, 0.055);
    }
    .startup-splash__mark {
      position: relative;
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(242, 239, 235, 0.18);
      border-radius: 50%;
      background: rgba(242, 239, 235, 0.04);
    }
    .startup-splash__halo {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(242, 239, 235, 0.13);
      border-radius: 50%;
      pointer-events: none;
    }
    .startup-splash__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f2efeb;
    }
    .startup-splash__copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .startup-splash__name {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .startup-splash__status {
      color: var(--startup-muted);
      font-size: 11px;
      line-height: 1.3;
    }
    @media (prefers-reduced-motion: reduce) {
      #startup-splash::before { opacity: 0.7; }
    }
  </style>
  <script>
    // Desktop: the backend port is chosen dynamically by Tauri (random free port).
    // main.ts fetches it via invoke('get_api_base') and sets __LAMTOOLS_API_BASE__.
    // Do NOT hardcode a port here — it would shadow the correct dynamic value.
  </script>
</head>
<body>
  <div id="startup-splash" data-startup-splash role="status" aria-live="polite">
    <div class="startup-splash__panel" data-startup-panel>
      <span class="startup-splash__mark" data-startup-mark aria-hidden="true">
        <span class="startup-splash__halo" data-startup-halo></span>
        <span class="startup-splash__dot"></span>
      </span>
      <span class="startup-splash__copy">
        <strong class="startup-splash__name">LamTools Core</strong>
        <span class="startup-splash__status">正在启动工作台…</span>
      </span>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
