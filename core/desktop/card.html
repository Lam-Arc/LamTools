<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday Ping</title>
  <style>
    /* user:“卡片即窗口，把 ping 和桌宠拆分开”+(卡片窗口是一个独立文档：
       窗口本身带原生 Acrylic 磨砂，页面只画卡片的着色与内容，其余保持透明。) */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #card-app {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div id="card-app"></div>
  <script type="module" src="/src/pingCard.ts"></script>
</body>
</html>
