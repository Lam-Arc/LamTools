[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "lamtools-core"
version = "0.3.39-a1"
description = "LamTools Core SDK - protocols, types, and base interfaces"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    # user:“继续，无人值守模式，不要停下来”+(插件设置使用标准JSON Schema校验器，声明运行依赖以保证打包/新安装可用)。
    "jsonschema>=4.25.1",
    # user:“从 GitHub 等平台下载并安装”+(市场 CLI 的实际连接客户端使用 aiohttp，干净安装也必须可用)。
    "aiohttp>=3.13.0",
    # user:“QQ…安装的时候直接从 GitHub 上”+(冻结宿主提供 QQ 绑定所需的加密运行库，插件代码仍独立分发)。
    "cryptography>=46.0.0",
    # [asyncio] brings greenlet, which sqlalchemy.ext.asyncio imports at runtime.
    # It was never declared: the packaged backend only started because the
    # resolver happened to install greenlet, and a fresh environment does not —
    # the frozen binary then died with ModuleNotFoundError: greenlet.
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "python-docx>=1.2.0",
    "pypdf>=6.15.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "PyMuPDF>=1.26.4",
    # Image-payload degradation for model-visible pictures: stale images are
    # re-sent as small JPEGs instead of multi-MB originals (llm/image_payload.py).
    "pillow>=11.0.0",
    "python-multipart>=0.0.32",
    # IANA timezone database — Windows Python lacks zoneinfo data, and
    # runtime/arrange.py resolves local wall-clock via ZoneInfo("Asia/Shanghai").
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# user:“给我把 2 阶段做完，前端除外”+(SSH验收使用真实临时服务；仅开发测试依赖，桌面运行仍用系统OpenSSH)。
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "fastapi>=0.137.2", "asyncssh>=2.21.1"]
server = ["uvicorn[standard]>=0.49.0", "fastapi>=0.137.2"]
desktop = ["uvicorn[standard]>=0.49.0", "fastapi>=0.137.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lamtools_core", "src/lamtools_boot"]

[tool.hatch.build.targets.wheel.force-include]
"config/command" = "lamtools_core/resources/config/command"
"skills" = "lamtools_core/resources/skills"
# user:“宿主能力补齐和接口完善与文档更新”+(发布包带入已安装且锁定的后端依赖；构建前须独立npm ci，不碰前端)。
"runtime/windows-sandbox" = "lamtools_core/resources/windows-sandbox"
"src/lamtools_core/plugins/bundled" = "lamtools_core/resources/plugins/bundled"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
