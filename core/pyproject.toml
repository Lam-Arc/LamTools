[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "lamtools-core"
version = "0.1.0"
description = "LamTools Core SDK - protocols, types, and base interfaces"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "sqlalchemy>=2.0.51", "aiosqlite>=0.22.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "fastapi>=0.137.2"]
server = ["uvicorn>=0.49.0", "fastapi>=0.137.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lamtools_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
