<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滑条对照</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1B1D22; color: #FBF7F0; }
    body { font-family: var(--font-sans, system-ui, sans-serif); }
    :root {
      --theme-main-background: #1B1D22; --theme-main-text: #FBF7F0;
      --theme-main-soft-background: rgba(255,255,255,.045);
      --theme-main-subtle-background: rgba(255,255,255,.028);
      --theme-main-sunken-background: rgba(0,0,0,.32);
      --theme-main-border: rgba(251,247,240,.16);
      --theme-composer-background: #22242A; --theme-composer-text: #FBF7F0;
      --theme-control-background: #FBF7F0; --theme-control-text: #2E3138;
      --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;
    }
    .thinking-lab { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 28px; max-width: 1100px; }
    .card { border: 1px solid rgba(251,247,240,.14); border-radius: 14px; padding: 18px 20px 24px; background: rgba(251,247,240,.03); }
    .card h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
    .hint { margin: 0 0 20px; font-size: 11.5px; line-height: 1.6; color: rgba(251,247,240,.5); }
    .slider-slot { height: 300px; width: 120px; display: flex; align-items: stretch; justify-content: center; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 320px; }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/demo/thinking-lab.ts"></script>
</body>
</html>
