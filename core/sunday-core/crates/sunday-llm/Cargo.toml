[package]
name = "sunday-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model adapters. Streaming, retry and typed failures. No agent logic."

[dependencies]
sunday-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util = "0.3"

[dev-dependencies]
# A real TLS server for the certificate-rejection test. Both are already in the
# tree through reqwest's rustls backend; naming them here makes the test's
# dependency on a second TLS stack explicit instead of incidental.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
