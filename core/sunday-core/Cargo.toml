[workspace]
members = [
    "crates/sunday-protocol",
    "crates/sunday-store",
    "crates/sunday-platform",
    "crates/sunday-llm",
    "crates/sunday-context",
    "crates/sunday-agent",
    "crates/sunday-extensions",
    "crates/sunday-tools",
    "crates/sunday-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
sunday-protocol = { path = "crates/sunday-protocol" }
sunday-store = { path = "crates/sunday-store" }
sunday-platform = { path = "crates/sunday-platform" }
sunday-context = { path = "crates/sunday-context" }
sunday-extensions = { path = "crates/sunday-extensions" }
sunday-agent = { path = "crates/sunday-agent" }
sunday-tools = { path = "crates/sunday-tools" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
regex-lite = "0.1"
tempfile = "3"
