<html lang="zh-CN">
<head><meta charset="utf-8"><title>百度安全验证</title></head>
<body>

      <p>请输入验证码以继续访问。网络环境存在异常，请完成验证。</p>
      <img src="/captcha.png" alt="验证码">
    </div>
  </div>
</body>
</html>
