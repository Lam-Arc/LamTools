[package]
name = "sunday-p2p"
version = "0.1.0"
edition = "2021"
description = "Sunday device-to-device transport: pairing, trust, and an encrypted tunnel for Core JSON-RPC"
license = "AGPL-3.0-or-later"

# user:“P2P 作为独立、可复用的传输组件，不绑定 Python 或 Rust Agent Core”+(这个 crate
# 只知道"把一帧 JSON 送到对面并拿回一帧"，不知道自己搬的是会话、工具还是审批)。
# user:“优先考虑两端共享同一套 Rust/Iroh 传输实现”+(Windows 与 Android 都用它)。

[lib]
name = "sunday_p2p"
path = "src/lib.rs"

[[bin]]
name = "sunday-p2p"
path = "src/bin/cli.rs"

[dependencies]
# user:“尽可能免费、无需用户自行部署服务器”+(公共 relay 只做回退)。
# 关掉 portmapper：它带进来的 wmi 与桌面端已有的 windows crate 版本冲突，
# 而 UPnP 端口映射只是锦上添花——打洞与中继回退都不依赖它。
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
# 票据要能变成二维码；放在 Rust 里，两端共用一份，界面不引第三方 JS。
qrcode = { version = "0.14", features = ["image"] }
# 手机扫桌面出的码：解码放 Rust，避免再引一套 JS/原生识别。
rqrr = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Core 的事件走它自己的 WebSocket；客户端与宿主都用同一条连接搬运。
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
