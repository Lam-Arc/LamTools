  <iframe sandbox="allow-same-origin" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot; /&gt;&lt;style&gt;

:root {
  --theme-main-background: #1B1D22; --theme-main-text: #FBF7F0;
  --theme-main-solid: #f2efeb;
  --theme-main-border: rgba(251, 247, 240, .16);
  --theme-main-soft-background: rgba(255, 255, 255, .045);
  --theme-main-sunken-background: rgba(0, 0, 0, .32);
  --theme-backdrop-text: #f2efeb;
  --theme-composer-background: #22242A; --theme-composer-text: #FBF7F0;
  --theme-control-background: #FBF7F0; --theme-control-text: #2E3138;
  --theme-control-solid: #FBF7F0;
  --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;

/* user:“专门对小屏或者说分屏状态做一下适配”+(每个页面独立响应可用宽度，保持桌面控件密度与内容可达性)。 */
.core-app-page {
  container: app-page / inline-size;
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  max-width: 100%;
  overflow: hidden;
}
.split-tab-content &gt; .core-app-page { width: 100%; height: 100%; }
.core-app-page &gt; :is(.full-area-view, .full-area-column) { min-height: 0; max-width: 100%; box-sizing: border-box; }
.core-app-page &gt; .full-area-column { flex: 1 1 auto; overflow: auto; }
.core-app-page &gt; .full-area-wide { width: 100%; margin-inline: 0; }
.core-app-page--auxiliary &gt; :is(.full-area-view, .full-area-column) { width: 100%; height: 100%; margin: 0; padding: var(--space-3); }
.core-app-page :is(.settings-content, .settings-panel, .project-session-details) { min-width: 0; }
.core-app-page .project-session-details code { overflow-wrap: anywhere; }

@container app-page (max-width: 900px) {
  .core-app-page .settings-page { display: flex; flex-direction: column; gap: var(--space-3); }
  .core-app-page .settings-sidebar { flex: 0 0 auto; width: 100%; padding: 0; min-height: 0; }
  .core-app-page .settings-nav { display: flex; flex: 0 0 auto; gap: var(--space-1); overflow-x: auto; overflow-y: hidden; padding: 0 0 var(--space-2); }
  .core-app-page .settings-nav button { flex: 0 0 auto; min-height: 32px; padding-inline: var(--space-2); gap: var(--space-1); font-size: 12px; }
  .core-app-page .settings-main { flex: 1 1 auto; min-height: 0; border: 0; border-radius: 0; box-shadow: none; padding: 0 0 var(--space-3); background: transparent; }
  .core-app-page .settings-content { max-width: none; }
}

@container app-page (max-width: 640px) {
  .core-app-page :is(.materials-head, .materials-tools, .library-toolbar, .library-head, .project-session-heading, .project-session-details) { flex-wrap: wrap; }
  .core-app-page :is(.library-search, .materials-search) { flex: 1 1 100%; max-width: none; min-width: 0; }
  .core-app-page :is(.library-sections, .filter-tabs, .search-tabs) { min-width: 0; overflow-x: auto; flex-wrap: nowrap; }
  .core-app-page :is(.library-sections, .filter-tabs, .search-tabs) &gt; button { flex-shrink: 0; white-space: nowrap; }
  .core-app-page :is(.install-input, .install-sha) { min-width: 0; width: 100%; flex: 1 1 100%; box-sizing: border-box; }
  .core-app-page :is(.preview-actions, .account-actions, .history-item, .instruction-meta) { flex-wrap: wrap; }
  .core-app-page :is(.preview-head, .subhead, .row-actions, .editor-actions) { flex-wrap: wrap; gap: var(--space-2); }
  .core-app-page :is(.config-form, .editor-form, .settings-grid, .settings-grid.two, .settings-split) { grid-template-columns: minmax(0, 1fr); }
  .core-app-page .settings-tree { position: static; }
  .core-app-page .field { min-width: 0; }
  .core-app-page :is(.setting-card, .settings-surface--stack &gt; .setting-card) { padding: var(--space-3); }
  .core-app-page .settings-panel { min-height: 0; gap: var(--space-3); }
  .core-app-page .account-row-value { overflow-wrap: anywhere; }
  .core-app-page .account-device { grid-template-columns: 6px minmax(0, 1fr) auto; }
  .core-app-page .account-device-detail { grid-column: 2 / -1; overflow-wrap: anywhere; }
  .core-app-page .search-footer { flex-wrap: wrap; gap: var(--space-1); }
  .core-app-page .arrange-page { padding: var(--space-3) 0; }
  .core-app-page :is(.arrange-card, .template-card) { padding: var(--space-3); }
  .core-app-page :is(.quiet-button, .primary-button) { min-height: 28px; }
  .core-app-page .library-surface { padding-top: var(--space-2); }
}

@container app-page (max-width: 400px) {
  .core-app-page .library-surface :is(.plan-grid, .folder-grid, .materials-grid) { grid-template-columns: minmax(0, 1fr); }
  .core-app-page .settings-nav-icon { display: none; }
  .core-app-page .settings-nav button { grid-template-columns: minmax(0, 1fr); }
  .core-app-page .history-time { min-width: 0; flex-basis: 100%; }
}

/* user:“内容没有为上方标题栏让位”+(手机上的整版界面顶上没有条，浮动返回键占住那一条，
   内容让位；两个变量都由入口或宿主给出，桌面端恒为 0)。 */
.core-app-page {
  padding-top: var(--full-area-head-inset, 0px);
}

.full-area-mobile-back {
  position: fixed;
  top: calc(var(--native-safe-area-top, 0px) + 6px);
  left: 10px;
  z-index: var(--z-popover);
  width: 32px;
  height: 32px;
  background: var(--theme-main-background, rgba(27, 29, 34, 0.92));
}

/* user:“清晰展示当前设备、连接状态和运行位置”+(跟着状态栏下来，不挡内容)。 */
/* 断线时同一个位置换成橙色提示，不再让人以为还连在电脑上。 */
.core-remote-badge.is-lost {
  background: color-mix(in srgb, #ff8a3d 18%, transparent);
  color: #ffb089;
  animation: core-remote-lost-pulse 2.4s ease-in-out infinite;
}

@keyframes core-remote-lost-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.core-remote-badge {
  position: fixed;
  right: 10px;
  top: calc(var(--native-safe-area-top, 0px) + 6px);
  z-index: var(--z-popover);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--theme-main-text) 10%, transparent);
  color: color-mix(in srgb, var(--theme-main-text) 82%, transparent);
  font-size: 11px;
  line-height: 1;
  pointer-events: none;
}

﻿/**
 * Layout CSS — three-card workspace shell, settings page, drawers
 *
 * Shared workspace shell styles consumed by member products.
 *
 * CSS custom properties consumed:
 *   --theme-backdrop-background / --theme-backdrop-text    (backdrop layer)
 *   --theme-main-background / --theme-main-text            (main card layer)
 *   --theme-composer-background / --theme-composer-text    (composer bar layer)
 *   --theme-control-background / --theme-control-text      (control widgets)
 *   --left-card-width / --left-overlap / --left-peek / --left-reveal
 *   --right-drawer-width / --right-peek / --right-reveal
 *   --main-left / --main-right / --main-x-padding / --content-width
 */

@import &#x27;./optical-glass.css&#x27;;
@import &#x27;./workspace-shell.css&#x27;;
@import &#x27;./session-sidebar.css&#x27;;

/* =========================================================================
   Main card — centered content area with top rounding &amp; shadow
   ========================================================================= */
.workspace-main {
  --text: var(--theme-main-text);
  position: fixed;
  top: var(--titlebar-offset, 0px); bottom: var(--shell-bottom-inset, 6px);
  left: var(--main-left);
  right: var(--main-right);
  z-index: var(--z-main-surface, 20);
  height: calc(100vh - var(--titlebar-offset, 0px) - var(--shell-bottom-inset, 6px));
  overflow: hidden;
  padding: 44px var(--main-x-padding) var(--composer-height, 120px) var(--main-x-padding);
  border: 1px solid var(--theme-main-border);
  border-radius: var(--workspace-panel-radius-inner) var(--workspace-panel-radius-outer)
    var(--workspace-panel-radius-outer) var(--workspace-panel-radius-inner);
  background: var(--theme-main-background);
  /* user:“再加一项/图片……玻璃代表我们的低透或高透玻璃样式”+
     (图片样式按适应方式铺进主卡；玻璃样式给主卡挂毛玻璃滤镜，其余样式为 none。) */
  background-image: var(--theme-main-image, none);
  background-size: var(--theme-main-image-size, auto);
  background-repeat: var(--theme-main-image-repeat, no-repeat);
  background-position: center;
  -webkit-backdrop-filter: var(--theme-main-glass-filter, none);
  backdrop-filter: var(--theme-main-glass-filter, none);
  color: var(--theme-main-text);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition:
    left var(--dur-morph) var(--ease-inout),
    right var(--dur-morph) var(--ease-inout),
    top var(--dur-morph) var(--ease-inout),
    height var(--dur-morph) var(--ease-inout),
    padding-bottom var(--dur-slow) ease;
}

/* Workflow owns the central surface (the canvas is not a content-column
   document). Keep the main header as an overlay and let the plugin root take
   the complete main card, including the horizontal gutters. */
/* user:“replace 换主区”+主区默认内容的让位容器：display: contents 让它对
   布局完全透明——.thread 等直接子元素继续参与 .workspace-main 原本的布局
   链（这是装插件前就存在的高度与滚动结构）；replace 生效时 v-show 写入的
   内联 display:none 优先于 contents，整块让位。 */
.workspace-main-default {
  display: contents;
}

.workspace-shell--full-bleed .workspace-main {
  padding: 0;
}

/* 整版界面（搜索/资料库/定时任务）打开时输入栏隐藏，底部留白随之收回。 */
.workspace-main--no-composer {
  padding-bottom: var(--space-6);
}

/* 设置 / 插件：页名与分区都在会话栏里，主卡不再渲染标题条。
   原来留给标题条的那条高度（44px）随之收回，只留一点上沿留白，
   内容直接顶到页面顶部、独占整页。 */
.workspace-main--no-header {
  padding-top: var(--space-4);
}

/* 整版界面本体：占住聊天区域的一块可滚动面板（输入栏隐藏，高度即主卡内高）。
   横向一律裁掉：任何浮层（如下拉菜单）伸出去都不得把页面撑宽出横向滚动。 */
.full-area-view {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  --text: var(--theme-main-text);
  color: var(--text);
}

/* 整版界面统一的内容栏：与会话标题、聊天正文同一条轴线（--content-width）。
   标题、动作、内容、空态都落在这条线上，界面就不会各说各话。 */
.full-area-column {
  width: min(var(--content-width), 100%);
  margin-inline: auto;
}

/* 工作台型整版界面（设置 / 插件）用更宽的容器，内容仍然居中。 */
.full-area-wide {
  /* 工作台型界面（设置 / 插件）把主卡的两侧内边距也收回来：它们内部自带
     两栏，每一点宽度都决定右栏会不会被裁掉。 */
  width: auto;
  margin-inline: calc(var(--space-3) - var(--main-x-padding));
}

/* 顶栏右侧的动作位：整版界面把动作送到这里，与标题同一行。 */
.full-area-band-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
  flex: 0 0 auto;
}

/* 整版界面里承载内部浮层（设置/插件的编辑弹层）的定位基准。 */
.full-area-surface {
  position: relative;
}

.full-area-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* 空态：不是一句孤零零的话，而是教人怎么开始的一小块内容。
   子项一律按内容宽排（左对齐），按钮不随容器拉伸成一条通栏。 */
.full-area-empty {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-3);
  max-width: 52ch;
  padding: var(--space-5) 0 0;
}

.full-area-empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent);
  color: color-mix(in srgb, var(--text) 65%, transparent);
}

.full-area-empty-title {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: 0;
}

.full-area-empty-hint {
  margin: 0;
  font-size: 13px;
  line-height: 1.7;
  color: color-mix(in srgb, var(--text) 62%, transparent);
}

/* 整版界面里的说明文字（加载 / 出错 / 提示）统一大小与颜色。 */
.full-area-note {
  margin: 0;
  font-size: 13px;
  line-height: 1.7;
  color: color-mix(in srgb, var(--text) 62%, transparent);
}

.full-area-note--error {
  color: var(--red);
}
.workspace-shell--full-bleed .workspace-main &gt; .workspace-plugin-header {
  position: absolute;
  inset: 0 0 auto;
  z-index: var(--z-popover);
  pointer-events: none;
}
.workspace-shell--full-bleed .workspace-main &gt; :not(.workspace-runtime-overlay):not(.workspace-plugin-header) {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}

@supports (height: 100dvh) {
  .workspace-main {
    height: calc(100dvh - var(--titlebar-offset, 0px) - var(--shell-bottom-inset, 6px));
  }
}

/* =========================================================================
   Thread — scrollable message/content area
   ========================================================================= */
.thread {
  width: calc(100% + var(--main-x-padding) + var(--main-x-padding));
  margin-inline: calc(-1 * var(--main-x-padding));
  display: grid;
  grid-auto-rows: max-content;
  align-content: start;
  gap: 16px;
  flex: 1;
  min-height: 0;
  overflow: auto;
  box-sizing: border-box;
  padding-inline: var(--main-x-padding);
  padding-top: 18px;
  padding-bottom: calc(
    var(--composer-bottom-offset, 0px) +
    var(--composer-rest-bottom, 16px) +
    var(--composer-clearance, 24px)
  );
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.45) 18px, #000 44px);
  mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.45) 18px, #000 44px);
  scrollbar-color: color-mix(in srgb, var(--theme-main-text) 5%, transparent) transparent;
}

.thread::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--theme-main-text) 5%, transparent);
  border: 2px solid transparent;
  border-radius: 999px;
  background-clip: content-box;
}

.thread::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, var(--theme-main-text) var(--alpha-active), transparent);
  background-clip: content-box;
}

/* ── Core main-thread empty session ──
   This state is opt-in from the Core host. ChatThread keeps its generic empty
   slot for Sub Agent timelines and other reusable consumers. */
.thread.thread--empty-session {
  position: relative;
  display: block;
  overflow: hidden;
  padding-top: 0;
  padding-bottom: 0;
  -webkit-mask-image: none;
  mask-image: none;
}

.empty-session-hero {
  position: fixed;
  top: calc(var(--empty-session-composer-top, 50vh) - var(--space-3));
  left: calc(var(--main-left) + (100vw - var(--main-left) - var(--main-right)) / 2);
  z-index: var(--z-stage);
  /* user:“消息区自适应填满宽度”+(空会话引导块与消息列同宽，跟着填满上限走)。 */
  width: min(var(--content-fill-width, 1040px), calc(100vw - var(--main-left) - var(--main-right) - var(--main-x-padding) - var(--main-x-padding)));
  display: grid;
  justify-items: center;
  gap: var(--space-2);
  isolation: isolate;
  text-align: center;
  transform: translate(-50%, -100%);
  pointer-events: none;
}

.empty-session-logo {
  margin-bottom: var(--space-1);
  pointer-events: auto;
}

.empty-session-title {
  position: relative;
  margin: 0;
  color: var(--theme-main-text);
  font-size: clamp(20px, 2.2vw, 26px);
  font-weight: 650;
  letter-spacing: -0.025em;
  line-height: 1.2;
  text-wrap: balance;
}

/* ComposerBar is owned by WorkspaceShell, so the host state moves the same
   floating composer instead of rendering a second input implementation. */
.workspace-shell--empty-session .floating-composer {
  /* Keep the empty-session scope for host styling; placement is controlled by
     the shared composer controller below. */
  --composer-rest-bottom: 16px;
}

.thread-header {
  /* user:“消息区自适应填满宽度”+(会话标题与会话正文列同宽：同样吃填满上限，不再固定 780px)。 */
  width: min(var(--content-fill-width, 1040px), 100%);
  margin: 0 auto 14px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 46px;
  padding-bottom: 14px;
  border-bottom: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 8%, transparent);
}
.thread-header h1 { font-size: 17px; line-height: 1.2; }
.thread-header span { color: var(--muted); font-size: 12px; margin-right: 10px; }

/* The Core app&#x27;s ordinary session header occupies the band immediately below
   the native titlebar. Pull it through the shared main-surface inset and give
   it the compact post-first-fix height so its existing divider stays put.
   Specialized workflow headers intentionally have no marker. */
/* 整版界面的顶部条：铺满主卡的内容区（返回键贴最左、动作贴最右），
   标题跟着界面切换。下面的正文仍按各自的列宽居中/排布。 */
.full-area-header {
  justify-content: flex-start;
  gap: var(--space-3);
}

.full-area-back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  margin-right: var(--space-1);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #f2efeb) 10%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #f2efeb) 65%, transparent);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}

.full-area-back:hover {
  background: color-mix(in srgb, var(--theme-main-text, #f2efeb) var(--alpha-hover), transparent);
  color: var(--theme-main-text, #f2efeb);
}

.full-area-back:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

.full-area-heading {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.full-area-heading h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.2;
}

.full-area-heading span {
  margin: 0;
  color: color-mix(in srgb, var(--theme-main-text, #f2efeb) 60%, transparent);
  font-size: 12px;
}

@media (prefers-reduced-motion: reduce) {
  .full-area-back {
    transition: none;
  }
}

@media (min-width: 641px) {
  .thread-header[data-session-header] {
    height: calc(var(--space-6) + var(--space-4) - 1px);
    min-height: 0;
    margin-top: calc(-1 * var(--space-6) - var(--space-4) + var(--space-1));
    margin-right: auto;
    margin-bottom: 0;
    margin-left: auto;
    padding: 0;
  }

  /* 整版界面顶栏与会话标题栏共用同一条band：同一套高度与内缩。 */
  .thread-header[data-full-area-header] {
    /* 铺满主卡内容区：返回键贴最左、动作贴最右，不再缩进到正文列宽。 */
    width: auto;
    height: calc(var(--space-6) * 2 + var(--space-4) - var(--space-1) - 1px);
    min-height: 0;
    margin-top: calc(-1 * var(--space-6) - var(--space-4) + var(--space-1));
    margin-right: calc(var(--space-3) - var(--main-x-padding));
    margin-bottom: 0;
    margin-left: calc(var(--space-3) - var(--main-x-padding));
    padding: 0;
  }
}

/* =========================================================================
   Floating composer — bottom input bar
   ========================================================================= */
/* Composer 的几何量放在根节点上：固定定位的卡片本体与它下方那条提示带共用同一套
   左缘与宽度，两者不会各自漂移。 */
.composer-root {
  /* user:“消息区自适应填满宽度”+(输入栏与消息列共用同一填满上限，两者不再各按 780px 错位)。 */
  --composer-full-width: min(var(--content-fill-width, 1040px), calc(100vw - var(--main-left) - var(--main-right) - var(--main-x-padding) - var(--main-x-padding) - 2px));
  --composer-anchor-left: calc(var(--main-left) + (100vw - var(--main-left) - var(--main-right)) / 2);
  /* user:“宽度等于输入框宽度减去输入框圆角宽度”+(上方贴片按输入栏圆角内收，
     输入栏自身轮廓保持原样)。 */
  --composer-radius: 20px;
}

.floating-composer {
  --text: var(--theme-composer-text);
  --composer-side-width: 58px;
  container: composer / inline-size;
  position: fixed;
  left: var(--composer-anchor-left);
  top: auto;
  /* composer-bottom-offset is the single max(keyboard, safe-area) inset;
     keep it as one term so adjustResize cannot cause double compensation. */
  bottom: calc(var(--composer-bottom-offset, 0px) + var(--composer-rest-bottom, 16px));
  z-index: var(--z-composer, 40);
  width: var(--composer-full-width);
  transform: translateX(-50%);
  border: 1px solid var(--theme-main-border);
  border-radius: var(--composer-radius);
  background: var(--theme-composer-background);
  /* 输入栏同样跟随颜色样式：图片按适应方式铺，玻璃挂毛玻璃滤镜。 */
  background-image: var(--theme-composer-image, none);
  background-size: var(--theme-composer-image-size, auto);
  background-repeat: var(--theme-composer-image-repeat, no-repeat);
  background-position: center;
  -webkit-backdrop-filter: var(--theme-composer-glass-filter, none);
  backdrop-filter: var(--theme-composer-glass-filter, none);
  color: var(--theme-composer-text);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition:
    left var(--dur-morph) var(--ease-inout),
    width var(--dur-morph) var(--ease-inout),
    top var(--dur-morph) var(--ease-inout),
    bottom var(--dur-morph) var(--ease-inout);
}

/* The goal + guidance panel is a separate sibling surface anchored directly
   to the composer&#x27;s top edge. It remains outside the input form and moves with
   the same keyboard, safe-area, and centered-composer geometry.
   user:“只在上面拼接一个下方不是圆角的矩形，上边是圆角，宽度等于输入框宽度减去输入框圆角宽度”
   +(托盘与发送状态共用这条更窄的上沿，输入栏保持原本的圆角轮廓)。
   user:“你这个目标和排队区域太宽了，和圆角、底下那个圆角没有对齐，缩窄一点”
   +(左右各让出一个圆角，边缘对齐输入栏上沿的直边段)。 */
.composer-root--floating &gt; .composer-queue-panel-host {
  position: fixed;
  left: var(--composer-anchor-left);
  bottom: calc(
    var(--composer-bottom-offset, 0px) +
    var(--composer-rest-bottom, 16px) +
    var(--composer-height, 120px)
  );
  z-index: var(--z-composer, 40);
  width: calc(var(--composer-full-width) - var(--composer-radius) * 2);
  transform: translateX(-50%);
}

/* A blank session presents the composer in the usable content area. This is
   a real top position calculation, so keyboard avoidance never relies on a
   vertical transform. */
.workspace-shell--composer-center .floating-composer {
  top: calc(
    var(--titlebar-offset, 0px) +
    (100vh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2
  );
  bottom: auto;
}

.workspace-shell--composer-center .composer-root--floating &gt; .composer-queue-panel-host {
  top: calc(
    var(--titlebar-offset, 0px) +
    (100vh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2
  );
  bottom: auto;
  transform: translate(-50%, -100%);
}

.workspace-shell--composer-bottom .floating-composer {
  top: auto;
  bottom: calc(var(--composer-bottom-offset, 0px) + var(--composer-rest-bottom, 16px));
}

@supports (height: 100dvh) {
  .workspace-shell--composer-center .floating-composer {
    top: calc(
      var(--titlebar-offset, 0px) +
      (100dvh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2
    );
  }
  .workspace-shell--composer-center .composer-root--floating &gt; .composer-queue-panel-host {
    top: calc(
      var(--titlebar-offset, 0px) +
      (100dvh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2
    );
  }
}

/* Treat the empty-session copy and composer as one visual group. The
   composer remains centered for regular shells, while the empty-session
   group sits one step lower so its combined visual mass is truly centered. */
.workspace-shell--empty-session.workspace-shell--composer-center .floating-composer {
  top: var(--empty-session-composer-top);
}

.workspace-shell--empty-session.workspace-shell--composer-center .composer-root--floating &gt; .composer-queue-panel-host {
  top: var(--empty-session-composer-top);
}

.workspace-shell--empty-session.workspace-shell--composer-center {
  /* The centred slot is capped by whatever covers the bottom of the window (a
     keyboard, a system bar), so a blank session&#x27;s composer never sits behind
     the IME; the greeting above it follows the same value. */
  --empty-session-composer-top: min(
    calc(
      var(--titlebar-offset, 0px) +
      (100vh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2 +
      calc(var(--space-6) * 2)
    ),
    calc(
      100vh -
      var(--composer-height, 120px) -
      var(--composer-bottom-offset, 0px) -
      var(--composer-clearance, 24px)
    )
  );
}

@supports (height: 100dvh) {
  .workspace-shell--empty-session.workspace-shell--composer-center {
    --empty-session-composer-top: min(
      calc(
        var(--titlebar-offset, 0px) +
        (100dvh - var(--titlebar-offset, 0px) - var(--composer-height, 120px)) / 2 +
        calc(var(--space-6) * 2)
      ),
      calc(
        100dvh -
        var(--composer-height, 120px) -
        var(--composer-bottom-offset, 0px) -
        var(--composer-clearance, 24px)
      )
    );
  }
}

.composer-main-card {
  position: relative;
  z-index: 1;
}

/* Composer 扩展内容固定在卡片下方，不参与文档流，也不推动对话区。 */
.composer-root--floating &gt; .composer-extras {
  position: fixed;
  left: var(--composer-anchor-left);
  width: var(--composer-full-width);
  transform: translateX(-50%);
  bottom: var(--composer-bottom-offset, 0px);
  z-index: var(--z-composer, 40);
  /* 纯提示：不拦截指针，也不拖动手势。 */
  pointer-events: none;
}
.floating-composer.dragover {
  border-color: var(--blue);
  box-shadow:
    0 0 0 2px color-mix(in srgb, var(--blue) 22%, transparent),
    0 4px 12px rgba(0,0,0,.08),
    0 1px 2px rgba(0,0,0,.04);
}
.floating-composer:focus-within {
  border-color: var(--theme-main-border);
}
.floating-composer:has(.command-palette),
.floating-composer:has(.core-queued-input-tray) {
  overflow: visible;
}
.floating-composer textarea {
  width: 100%;
  min-height: 42px;
  max-height: 190px;
  resize: none;
  border: 0; outline: 0;
  background: transparent;
  color: var(--text);
  padding: 13px 16px 7px;
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
}
.floating-composer textarea:focus-visible {
  outline: none;
}
.floating-composer textarea::placeholder {
  color: color-mix(in srgb, var(--theme-composer-text) 52%, transparent);
}
/* user:“修复输入框缩窄时 @ 标签溢出的问题”+(@ 文件标签是可点击的原子块，编辑区
   自身不许被内容反推变宽，窄窗口和分屏都沿容器宽度收窄)。
   user:“上传附件之后，附件的标签没有做长度限制，容易把输入区撑满，导致难以点击
   继续输入，请把附件限制在 32px-64px 内，超出部分文字隐藏”+(每个文件标签固定为
   32–64px 的小胶囊，长文件名只显示省略号，完整名称留在 title 里，不再铺满整行)。 */
.inline-file-composer,
.inline-file-composer .cm-editor,
.inline-file-composer .cm-scroller,
.inline-file-composer .cm-content {
  min-width: 0;
  max-width: 100%;
}
.inline-file-composer .cm-scroller {
  /* user:“在复制进去一长段文本的时候，会把输入栏撑至巨大”+(静态样式也兜住 8 行上限，
     不依赖 CodeMirror 运行时注入的主题；变量由组件按 editorHeight.ts 写入)。 */
  max-height: var(--composer-editor-max-height, calc(8 * 1.6em + 2 * 8px));
  overflow-x: hidden;
}
.inline-file-composer .composer-file-token {
  box-sizing: border-box;
  min-width: 32px;
  max-width: 64px;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: bottom;
  white-space: nowrap;
}
/* user:“把那个@的符号去掉 换成对应的文件图标”+(消息正文里的文件引用也统一用
   30% 圆角的类型徽标；徽标文字由 CSS content 提供，复制时仍只有文件名)。 */
.file-reference-badge {
  display: inline-grid;
  place-items: center;
  box-sizing: border-box;
  width: 15px;
  height: 15px;
  overflow: hidden;
  border-radius: 30%;
  font-family: var(--font-sans);
  font-size: 6.5px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
}
.file-reference-badge::before {
  content: attr(data-label);
}
/* 显式链接（非自动识别）核实失败时仍保留错误态；自动识别的路径在
   canonicalize 里直接退回原文，不生成这个红色链接。 */
a.file-reference-link[data-reference-error=&#x27;true&#x27;] {
  color: var(--red);
}
a.file-reference-link[data-reference-error=&#x27;true&#x27;] .file-reference-badge {
  background: var(--red) !important;
}
.composer-input-wrap {
  position: relative;
  min-width: 0;
}
.composer-input-wrap textarea {
  position: relative;
  z-index: 1;
}
.composer-input-wrap textarea.composer-input--recognized {
  color: var(--blue);
  font-weight: 600;
}
.composer-feedback {
  margin: 0 0 8px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.35;
}
.composer-feedback--error {
  border: 1px solid color-mix(in srgb, var(--red) 34%, transparent);
  background: color-mix(in srgb, var(--red) 10%, transparent);
  color: color-mix(in srgb, var(--red) 64%, var(--theme-composer-text, currentColor));
}
.composer-bottom {
  padding: 8px 11px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.tool-row {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
}
.attach, .send {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 18px;
  line-height: 1;
}
.attach {
  background: transparent;
  color: color-mix(in srgb, var(--theme-composer-text) 66%, transparent);
}
.attach:hover { background: color-mix(in srgb, var(--theme-composer-text) var(--alpha-hover), transparent); }
.send {
  width: 54px;
  height: 30px;
  flex: 0 0 54px;
  border: 1px solid color-mix(in srgb, var(--theme-control-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-control-background) 70%, transparent);
  color: color-mix(in srgb, var(--theme-control-text) 72%, transparent);
  font-size: 12px;
  font-weight: 850;
}
.send:hover:not(:disabled) { filter: brightness(.94); }
.send:disabled { opacity: .38; cursor: default; }
.send--stop {
  border-color: color-mix(in srgb, var(--red) 38%, transparent);
  background: color-mix(in srgb, var(--red) 14%, transparent);
  color: var(--red);
}
.send--stop:hover {
  background: color-mix(in srgb, var(--red) 24%, transparent);
}

.composer-menu-wrap { position: relative; }
.composer-pill {
  height: 34px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  padding: 0 var(--space-3);
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 13px;
  font-weight: 650;
}
.composer-pill:hover, .composer-pill.open { filter: brightness(.94); }
.composer-pill .quality-label { color: currentColor; opacity: .68; font-weight: 600; }

.composer-menu {
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  z-index: var(--z-popover, 60);
  width: 158px;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 14%, transparent);
  border-radius: 12px;
  background: var(--theme-composer-background);
  color: var(--theme-composer-text);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: grid;
}
.composer-menu.model-menu { width: 246px; }
.composer-menu.quality-menu { width: 176px; right: 0; left: auto; }
.composer-menu-group { display: grid; gap: 2px; }
.composer-menu-group + .composer-menu-group {
  margin-top: 6px; padding-top: 6px;
  border-top: 1px solid color-mix(in srgb, var(--theme-composer-text) 9%, transparent);
}
.composer-menu-heading {
  min-height: 24px; padding: 4px 9px 2px;
  color: color-mix(in srgb, var(--theme-composer-text) 62%, transparent); font-size: 12px; font-weight: 700;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.composer-menu-item {
  min-height: 34px;
  border: 0; border-radius: 0;
  background: transparent; color: var(--theme-composer-text);
  padding: 0 10px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; font-size: 13px; text-align: left;
  position: relative;
}
.composer-menu-item::before {
  content: &quot;&quot;; position: absolute; inset: 0;
  border-radius: 0; background: transparent; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
  mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
}
.composer-menu-item.model-option { justify-content: start; padding-left: 10px; }
.composer-menu-item strong { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; position: relative; }
.composer-menu-item:hover::before { background: color-mix(in srgb, var(--theme-composer-text) var(--alpha-hover), transparent); }
.composer-menu-item.active::before { background: color-mix(in srgb, var(--theme-composer-text) var(--alpha-active), transparent); }
.composer-menu-item span { color: var(--muted); font-size: 12px; position: relative; }

.drop-hint {
  position: absolute; inset: 0; border-radius: 20px;
  display: none; place-items: center;
  background: color-mix(in srgb, var(--theme-composer-background) 82%, transparent);
  color: var(--theme-composer-text);
  font-size: 15px; pointer-events: none;
}
.floating-composer.dragover .drop-hint { display: grid; }

/* -------------------------------------------------------------------------
   Workflow composer — compact ComfyUI-style command surface
   -------------------------------------------------------------------------
   The shared composer remains one implementation. Workflow mode only
   changes its presentation: a short one-line pill is the resting state and
   interaction restores the regular composer layout, not only its width.
   WorkspaceShell supplies the value/stop classes and data attributes so this
   state is observable to tests and assistive tooling as well as CSS.
   */
.workspace-shell--workflow .floating-composer {
  --workflow-composer-rest-height: calc(var(--space-6) + var(--space-4));
  --workflow-composer-expanded-height: calc(var(--space-6) * 3 + var(--space-2));
  width: min(420px, var(--composer-full-width));
  max-width: var(--composer-full-width);
  height: var(--workflow-composer-rest-height);
  border-radius: 999px;
  transition:
    left var(--dur-morph) var(--ease-inout),
    width var(--dur-morph) var(--ease-inout),
    height var(--dur-morph) var(--ease-inout),
    top var(--dur-morph) var(--ease-inout),
    bottom var(--dur-morph) var(--ease-inout),
    border-radius var(--dur-morph) var(--ease-inout);
}
.workspace-shell--workflow-interaction-active .floating-composer,
.workspace-shell--workflow .floating-composer:focus-within,
.workspace-shell--workflow .composer-root--workflow-has-value .floating-composer,
.workspace-shell--workflow .composer-root--workflow-stop .floating-composer,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .floating-composer,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .floating-composer {
  width: var(--composer-full-width);
  height: var(--workflow-composer-expanded-height);
  border-radius: var(--radius-xl);
}

/* Hover only expands the workflow composer. The conversation is revealed
   once the composer is actually in use: focused, non-empty, or running. */
.workspace-shell--workflow:has(.floating-composer:focus-within) [data-workflow-conversation],
.workspace-shell--workflow-composer-has-value [data-workflow-conversation],
.workspace-shell--workflow-composer-stop [data-workflow-conversation],
.workspace-shell--workflow:has([data-workflow-conversation]:hover) [data-workflow-conversation],
.workspace-shell--workflow:has([data-workflow-conversation]:focus-within) [data-workflow-conversation] {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition-delay: 0s;
}
.workspace-shell--workflow .composer-main-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
}
.workspace-shell--workflow .composer-main-card &gt; .composer-input-wrap,
.workspace-shell--workflow .composer-main-card &gt; textarea {
  grid-column: 1;
  grid-row: 1;
  min-width: 0;
}
.workspace-shell--workflow .composer-main-card &gt; .composer-bottom {
  grid-column: 2;
  grid-row: 1;
  padding: var(--space-1) var(--space-2);
}
.workspace-shell--workflow .tool-row,
.workspace-shell--workflow .attachment-tray {
  display: none;
}
.workspace-shell--workflow .floating-composer textarea {
  min-height: 38px;
  max-height: 190px;
  padding: 8px 14px;
  line-height: 1.4;
}
.workspace-shell--workflow .floating-composer .core-send-stop-button {
  flex: 0 0 auto;
}

/* Expanded workflow state uses the same vertical structure as the normal
   composer: content above, controls below, and the send action at the right. */
.workspace-shell--workflow-interaction-active .floating-composer .composer-main-card,
.workspace-shell--workflow .floating-composer:focus-within .composer-main-card,
.workspace-shell--workflow .composer-root--workflow-has-value .composer-main-card,
.workspace-shell--workflow .composer-root--workflow-stop .composer-main-card,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .composer-main-card,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .composer-main-card {
  display: block;
}
.workspace-shell--workflow-interaction-active .floating-composer .composer-main-card &gt; .composer-bottom,
.workspace-shell--workflow .floating-composer:focus-within .composer-main-card &gt; .composer-bottom,
.workspace-shell--workflow .composer-root--workflow-has-value .composer-main-card &gt; .composer-bottom,
.workspace-shell--workflow .composer-root--workflow-stop .composer-main-card &gt; .composer-bottom,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .composer-main-card &gt; .composer-bottom,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .composer-main-card &gt; .composer-bottom {
  padding: var(--space-2) var(--space-3) var(--space-3);
}
.workspace-shell--workflow-interaction-active .floating-composer .tool-row,
.workspace-shell--workflow .floating-composer:focus-within .tool-row,
.workspace-shell--workflow .composer-root--workflow-has-value .tool-row,
.workspace-shell--workflow .composer-root--workflow-stop .tool-row,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .tool-row,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .tool-row,
.workspace-shell--workflow-interaction-active .floating-composer .attachment-tray,
.workspace-shell--workflow .floating-composer:focus-within .attachment-tray,
.workspace-shell--workflow .composer-root--workflow-has-value .attachment-tray,
.workspace-shell--workflow .composer-root--workflow-stop .attachment-tray,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .attachment-tray,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .attachment-tray {
  display: flex;
}
.workspace-shell--workflow-interaction-active .floating-composer textarea,
.workspace-shell--workflow .floating-composer:focus-within textarea,
.workspace-shell--workflow .composer-root--workflow-has-value .floating-composer textarea,
.workspace-shell--workflow .composer-root--workflow-stop .floating-composer textarea,
.workspace-shell--workflow .composer-root[data-workflow-composer-has-value=&#x27;true&#x27;] .floating-composer textarea,
.workspace-shell--workflow:has(.wf-convo-float:is(.is-pinned, :focus-within)) .floating-composer textarea {
  min-height: 42px;
  padding: 13px 16px 7px;
  line-height: 1.45;
}

/* The workflow conversation is one attached surface with the expanded
   composer: one seam, no opposing rounded corners or visual gap. */
.workspace-shell--workflow:has(.wf-convo-float.is-pinned) .floating-composer,
.workspace-shell--workflow:has(.wf-convo-float:hover) .floating-composer,
.workspace-shell--workflow:has(.wf-convo-float:focus-within) .floating-composer,
.workspace-shell--workflow:has(.floating-composer:focus-within) .floating-composer,
.workspace-shell--workflow-composer-has-value .floating-composer,
.workspace-shell--workflow-composer-stop .floating-composer {
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
}

@media (prefers-reduced-motion: reduce) {
  .workspace-shell--workflow .floating-composer {
    transition: none;
  }
}

/* =========================================================================
   Density overrides
   ========================================================================= */
.density-compact .thread { gap: 12px; }
.density-compact .user-bubble,
.density-compact .step-body,
.density-compact .floating-composer textarea { font-size: 14px; }
.density-compact .project-block,
.density-compact .workspace-card { border-radius: 12px; }

.density-loose .thread { gap: 20px; }
.density-loose .user-bubble,
.density-loose .step-body,
.density-loose .floating-composer textarea { font-size: 16px; }

/* =========================================================================
   Settings page layout
   ========================================================================= */
.settings-page {
  display: grid;
  /* 导航栏按标签自身宽度收窄：两个字的栏目就两字宽，六字栏目也放得下。 */
  grid-template-columns: minmax(120px, max-content) minmax(0, 1fr);
  gap: var(--space-4);
  height: 100%;
  overflow: hidden;
  /* 整版界面：底与字都跟随主区，而不是外壳/侧栏那一层。 */
  background: transparent;
  color: var(--theme-main-text, var(--text));
}

/* 会话栏当侧栏时（hideNav）：内置导航列退场，内容占满整行。 */
.settings-page.settings-page--no-nav {
  grid-template-columns: minmax(0, 1fr);
}

.settings-sidebar {
  min-width: 0;
  width: max-content;
  max-width: 100%;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, var(--text)) 78%, transparent);
  display: flex;
  flex-direction: column;
  padding: 0 0 var(--space-3);
}

.settings-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 38px;
  padding: 0 8px 14px;
}
.settings-brand strong { font-size: 20px; letter-spacing: -.02em; }

.settings-nav {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  gap: 4px;
  align-content: start;
  padding-top: 4px;
}
.settings-nav button {
  white-space: nowrap;
  padding-right: var(--space-3);
  min-height: 38px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: inherit;
  opacity: .74;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 0 10px;
  text-align: left;
  font-size: 14px;
}
.settings-nav button.active,
.settings-nav button:hover { background: color-mix(in srgb, var(--settings-backdrop-text, #fff) var(--alpha-hover), transparent); opacity: 1; }
.settings-nav button.active { background: color-mix(in srgb, var(--settings-backdrop-text, #fff) var(--alpha-active), transparent); opacity: 1; }

.settings-sidebar-footer {
  flex: 0 0 auto;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid color-mix(in srgb, var(--settings-backdrop-text, #fff) 12%, transparent);
}
.settings-sidebar .settings-entry {
  width: 100%;
  min-height: 38px;
  border: 1px solid color-mix(in srgb, var(--settings-backdrop-text, #fff) 7%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--settings-backdrop-text, #fff) 5%, transparent);
  color: inherit;
  opacity: .78;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
}
.settings-sidebar .settings-entry:hover { opacity: 1; }

.settings-main {
  --text: inherit;
  --panel-2: var(--theme-main-subtle-background, #1d1e1e);
  --line: var(--theme-main-border, #3b3a38);
  --muted: color-mix(in srgb, var(--theme-main-text, var(--text)) 62%, transparent);
  overflow-y: auto;
  overflow-x: hidden;
  margin: 0;
  padding: 0 0 var(--space-6);
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  background: var(--settings-main-background, #141515);
  color: var(--settings-main-text, var(--text));
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--settings-main-text, #fff) 5%, transparent);
}

/* 会话栏当侧栏时（hideNav）：内容不再套一层带边框的岛，直接铺满整页。 */
.settings-page--no-nav .settings-main {
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.settings-content {
  /* 紧跟导航左对齐：居中留白会让左沿对不上顶部条与导航。宽屏只做个上限，
     免得行长得离谱。 */
  width: 100%;
  max-width: 1100px;
  margin: 0;
  display: grid;
  gap: var(--space-5);
}

.settings-title {
  min-width: 0;
  display: grid;
  gap: var(--space-2);
}
.settings-title h1 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.02em; }
.settings-title p { max-width: 72ch; margin: 0; color: color-mix(in srgb, var(--settings-main-text, #fff) 58%, transparent); font-size: 13px; line-height: 1.55; }

.settings-panel {
  display: grid;
  align-content: start;
  gap: var(--space-5);
  min-width: 0;
  min-height: 360px;
  /* 设置 section 切换：v-if 重挂载时播放入场（与 SettingsShell 的 contentEnter 同节奏） */
  animation: panel-enter 260ms var(--ease-emphasized);
}

/* Every settings page uses one primary surface. Inner sections are separated
   by quiet rules so the page reads as one work area instead of stacked cards. */
.settings-surface {
  min-width: 0;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 12%, transparent);
  border-radius: var(--radius);
  background: var(--settings-card-background, #1b1c1c);
  color: var(--settings-card-text, var(--text));
  overflow: hidden;
}

.settings-surface--stack {
  display: grid;
  align-content: start;
}

.settings-surface--stack &gt; .setting-card {
  margin: 0;
  padding: var(--space-5);
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.settings-surface--stack &gt; .setting-card + .setting-card,
.settings-surface--stack &gt; .add-row {
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
}

.settings-surface--stack &gt; .add-row {
  min-height: 56px;
  border-right: 0;
  border-bottom: 0;
  border-left: 0;
  border-radius: 0;
}

.settings-surface--stack &gt; .setting-card &gt; h3 {
  margin: 0;
  color: var(--settings-main-text, var(--text));
  font-size: 15px;
  line-height: 1.35;
}

.settings-surface--stack .subhead {
  min-height: 32px;
}

.settings-panel--appearance .theme-editor-dialog {
  border-radius: var(--radius);
}

.settings-notice {
  position: sticky;
  top: 0;
  z-index: var(--z-popover, 60);
  width: min(980px, 100%);
  border: 1px solid color-mix(in srgb, var(--green) 22%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--green) 10%, transparent);
  color: color-mix(in srgb, var(--green) 64%, var(--settings-main-text, var(--theme-main-text, #fff)));
  padding: 9px 12px;
  font-size: 13px;
}

.rule-row,
.resolved-card,
.setting-card {
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 12%, transparent);
  border-radius: var(--radius-lg);
  background: var(--settings-card-background, #1b1c1c);
  color: var(--settings-card-text, var(--text));
}

.setting-card {
  padding: 14px;
  display: grid;
  gap: 14px;
}

.provider-list {
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
}
.provider-group + .provider-group {
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
}

.provider-head {
  min-height: 60px;
  padding: 10px 4px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}
.provider-head strong { display: block; font-size: 15px; }
.provider-head span,
.model-identity span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
.provider-identity,
.model-identity { min-width: 0; }
.provider-identity span,
.model-identity span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.provider-actions,
.row-actions,
.tree-head,
.subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.provider-actions { justify-content: flex-start; gap: 8px; }
.model-list,
.route-purpose-list {
  display: grid;
}
.model-row {
  min-height: 50px;
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 9%, transparent);
  background: transparent;
  padding: 8px 4px 8px 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}
.model-row strong {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-empty { margin: 0; padding: 12px 4px 14px 20px; border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 9%, transparent); color: var(--muted); font-size: 12px; }

/* user:“合并去重”+(按钮配方已并入 sunday-controls.css 的 .btn 基件，这里不再保留第二套)。 */
.add-row {
  min-height: 44px;
  border: 1px dashed color-mix(in srgb, var(--settings-main-text, #fff) 18%, transparent);
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  font-weight: 650;
  font-size: 14px;
}
.add-row:hover {
  color: var(--text);
  border-color: color-mix(in srgb, var(--settings-main-text, #fff) 32%, transparent);
}

.routing-rule-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 8%, transparent);
  border-radius: var(--radius);
  background: var(--panel-2);
  font-size: 14px;
}
.rule-row {
  padding: 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}
.rule-row strong,
.setting-card h3 {
  display: block;
  font-size: 15px;
  margin-bottom: 5px;
}
.muted,
.setting-card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.resolved-card {
  padding: 14px;
  display: grid;
  gap: 10px;
}
.resolved-row {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 6%, transparent);
}
.resolved-row:last-child { border-bottom: 0; }
.resolved-label {
  color: var(--faint);
  font-size: 13px;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}
.settings-grid.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.settings-split {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.settings-tree {
  position: sticky;
  top: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-3);
  padding: 10px;
  display: grid;
  gap: 6px;
}
.tree-head {
  min-height: 34px;
  padding: 0 2px 6px;
  border-bottom: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 7%, transparent);
}
.tree-provider {
  min-height: 44px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  padding: 8px 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  text-align: left;
}
.tree-provider span {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-provider small {
  color: var(--faint);
  font-size: 11px;
}
.tree-provider:hover,
.tree-provider.active {
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 9%, transparent);
}
.subhead { margin: 4px 0 10px; }
.subhead-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.resolved-mini {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
}
.resolved-mini strong {
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.route-purpose-row {
  min-height: 54px;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--settings-main-text, #fff) 6%, transparent);
  padding: 10px 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(230px, 330px);
  gap: 12px;
  align-items: center;
}
.route-purpose-row strong,
.route-purpose-row span {
  display: block;
}
.route-purpose-row span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}
.route-purpose-row select {
  min-height: 34px;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 8%, transparent);
  border-radius: var(--radius-sm);
  background-color: var(--settings-card-background, #111111);
  color: var(--text);
  padding: 7px 9px;
  outline: 0;
}
.route-purpose-row .ui-select { min-width: 0; }
.advanced-routes {
  margin-top: 10px;
  color: var(--muted);
}
.advanced-routes summary {
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 10px;
}

.field,
.toggle-line {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
}
.toggle-line {
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  min-height: 32px;
}
.toggle-line input[type=&quot;checkbox&quot;],
.tool-toggle input[type=&quot;checkbox&quot;],
.agent-config-row input[type=&quot;checkbox&quot;],
.switch-line input[type=&quot;checkbox&quot;] {
  appearance: none;
  width: 15px;
  height: 15px;
  min-height: 15px;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 24%, transparent);
  border-radius: 4px;
  background: var(--settings-card-background, #141515);
  padding: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.toggle-line input[type=&quot;checkbox&quot;]::after,
.tool-toggle input[type=&quot;checkbox&quot;]::after,
.agent-config-row input[type=&quot;checkbox&quot;]::after,
.switch-line input[type=&quot;checkbox&quot;]::after {
  content: &quot;&quot;;
  width: 7px;
  height: 4px;
  border-left: 2px solid var(--panel-2, #1d1e1e);
  border-bottom: 2px solid var(--panel-2, #1d1e1e);
  opacity: 0;
  transform: rotate(-45deg) translateY(-1px);
}
.toggle-line input[type=&quot;checkbox&quot;]:checked,
.tool-toggle input[type=&quot;checkbox&quot;]:checked,
.agent-config-row input[type=&quot;checkbox&quot;]:checked,
.switch-line input[type=&quot;checkbox&quot;]:checked {
  border-color: color-mix(in srgb, var(--green) 72%, transparent);
  background: var(--green);
}
.toggle-line input[type=&quot;checkbox&quot;]:checked::after,
.tool-toggle input[type=&quot;checkbox&quot;]:checked::after,
.agent-config-row input[type=&quot;checkbox&quot;]:checked::after,
.switch-line input[type=&quot;checkbox&quot;]:checked::after {
  opacity: 1;
}
.field input:not([type=&quot;checkbox&quot;]):not([type=&quot;radio&quot;]):not([type=&quot;range&quot;]):not([type=&quot;color&quot;]):not([type=&quot;file&quot;]):not([type=&quot;hidden&quot;]):not([type=&quot;button&quot;]):not([type=&quot;submit&quot;]):not([type=&quot;reset&quot;]):not([type=&quot;image&quot;]),
.agent-config-row input:not([type=&quot;checkbox&quot;]):not([type=&quot;radio&quot;]):not([type=&quot;range&quot;]):not([type=&quot;color&quot;]):not([type=&quot;file&quot;]):not([type=&quot;hidden&quot;]):not([type=&quot;button&quot;]):not([type=&quot;submit&quot;]):not([type=&quot;reset&quot;]):not([type=&quot;image&quot;]) {
  min-height: 34px;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  padding: var(--space-2);
  outline: none;
}
.field input:not([type=&quot;checkbox&quot;]):not([type=&quot;radio&quot;]):not([type=&quot;range&quot;]):not([type=&quot;color&quot;]):not([type=&quot;file&quot;]):not([type=&quot;hidden&quot;]):not([type=&quot;button&quot;]):not([type=&quot;submit&quot;]):not([type=&quot;reset&quot;]):not([type=&quot;image&quot;]):focus,
.agent-config-row input:not([type=&quot;checkbox&quot;]):not([type=&quot;radio&quot;]):not([type=&quot;range&quot;]):not([type=&quot;color&quot;]):not([type=&quot;file&quot;]):not([type=&quot;hidden&quot;]):not([type=&quot;button&quot;]):not([type=&quot;submit&quot;]):not([type=&quot;reset&quot;]):not([type=&quot;image&quot;]):focus,
.route-purpose-row select:focus {
  outline: none;
}
.field input[type=&quot;number&quot;],
.agent-config-row input[type=&quot;number&quot;] {
  appearance: textfield;
}
.field-wide {
  grid-column: 1 / -1;
}
.field-textarea {
  min-height: 110px;
  max-height: 240px;
  width: 100%;
  resize: none;
  overflow: auto;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  padding: var(--space-2);
  outline: none;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre;
}
.field-textarea:focus {
  outline: none;
}

.agent-manager {
  gap: 12px;
}
.agent-logic {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 14px;
  align-items: stretch;
}
.agent-flow-cases {
  display: grid;
  gap: 10px;
}
.agent-flow-case {
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--settings-main-text, #fff) 4%, transparent);
  padding: 12px;
}
.agent-flow-case-head {
  display: grid;
  gap: 4px;
  margin-bottom: 10px;
}
.agent-flow-case-head strong {
  color: var(--settings-card-text, var(--text));
  font-size: 13px;
}
.agent-flow-case-head span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.agent-flow-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.agent-flow-steps li {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  min-width: 0;
}
.agent-flow-steps b {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--blue) 18%, transparent);
  color: var(--settings-card-text, var(--text));
  font-size: 11px;
}
.agent-flow-steps span {
  min-width: 0;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--settings-main-text, #fff) 5%, transparent);
  padding: 6px 8px;
}
.agent-flow-steps strong,
.agent-flow-steps em {
  display: block;
}
.agent-flow-steps strong {
  color: var(--settings-card-text, var(--text));
  font-size: 12px;
}
.agent-flow-steps em {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
  line-height: 1.4;
}
.agent-detail {
  min-width: 0;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--settings-main-text, #fff) 4%, transparent);
  padding: 12px;
  display: grid;
  align-content: start;
  gap: 12px;
}
.agent-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.agent-tabs button {
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--settings-main-text, #fff) 4%, transparent);
  color: var(--settings-card-text, var(--settings-main-text, #fff));
  padding: 6px 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.agent-tabs button.active {
  border-color: var(--blue);
  background: color-mix(in srgb, var(--blue) 14%, transparent);
}
.agent-detail-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
}
.agent-detail-head strong,
.agent-detail-head span {
  display: block;
}
.agent-detail-head span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}
.agent-detail p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.agent-detail-grid,
.capability-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.agent-detail-grid span,
.capability-tags span {
  border-radius: 999px;
  background: color-mix(in srgb, var(--settings-main-text, #fff) 7%, transparent);
  color: var(--settings-card-text, var(--text));
  padding: 4px 8px;
  font-size: 12px;
}
.switch-line {
  display: inline-grid;
  grid-template-columns: auto;
  align-items: center;
}
.command-policy-list {
  display: grid;
  gap: 10px;
}
.command-policy-row {
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--settings-main-text, #fff) 4%, transparent);
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}
.command-policy-row strong,
.command-policy-row span {
  display: block;
}
.command-policy-row strong {
  color: var(--settings-card-text, var(--text));
  font-size: 13px;
}
.command-policy-row span {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.binary-segment {
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  min-width: 190px;
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  background: color-mix(in srgb, var(--settings-main-text, #fff) 5%, transparent);
}
.binary-segment button {
  min-height: 30px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  padding: 6px 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.binary-segment button.active {
  background: color-mix(in srgb, var(--blue) 18%, transparent);
  color: var(--settings-card-text, var(--text));
}
.tool-table {
  display: grid;
  gap: 0;
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
  border-radius: 12px;
  overflow: hidden;
}
.tool-table-head,
.tool-table-row {
  display: grid;
  grid-template-columns: minmax(120px, 1.1fr) minmax(90px, .7fr) minmax(0, 2fr) 56px;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
}
.tool-table-head {
  background: color-mix(in srgb, var(--settings-main-text, #fff) 6%, transparent);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.tool-table-row {
  min-height: 46px;
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 8%, transparent);
  color: var(--settings-card-text, var(--text));
  font-size: 13px;
}
.tool-table-row.disabled {
  opacity: .48;
}
.tool-table-row strong,
.tool-table-row span {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* =========================================================================
   Right panel — sections, status items
   ========================================================================= */
.side-section {
  padding-bottom: 14px;
  border-bottom: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
}
.side-section + .side-section { margin-top: 14px; }
.side-section h3 {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 720;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.activity-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 3px 0;
  font-size: 13px;
}
.activity-kind { color: var(--muted); }
.activity-text { color: var(--text); font-weight: 600; }

/* =========================================================================
   Runtime checklist overlay
   ========================================================================= */
.workspace-runtime-overlay {
  position: absolute;
  /* Keep the card below the thread header divider inside the main card. */
  top: calc(44px + 46px + var(--space-3));
  right: var(--space-4);
  z-index: var(--z-popover, 60);
  width: min(320px, calc(100% - 2 * var(--space-4)));
  pointer-events: none;
}
.workspace-runtime-overlay &gt; * {
  pointer-events: auto;
}
.workspace-shell.right-open .workspace-runtime-overlay {
  display: none;
}
.right-body .runtime-checklist-card {
  box-shadow: none;
}

/* =========================================================================
   Main page shared add-ons
   ========================================================================= */
.field-input {
  width: 100%;
  height: 38px;
  min-width: 0;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  padding: 0 var(--space-3);
  font-size: 13px;
}
.field-input::placeholder {
  color: color-mix(in srgb, var(--theme-composer-text) 52%, transparent);
}
.field-input:focus {
  outline: none;
}
/* A few settings forms reuse the field-input sizing class on native selects;
   keep those select controls on the control-area recipe. */
.field-input:is(select) {
  border-color: color-mix(in srgb, var(--theme-control-text) 12%, transparent);
  background: color-mix(in srgb, var(--theme-control-background) 70%, transparent);
  color: var(--theme-control-text);
  caret-color: auto;
}
.popover-actions,
.modal-actions,
.review-actions {
  display: flex;
  gap: 8px;
}
.popover-actions,
.modal-actions {
  justify-content: flex-end;
}
.btn-cancel {
  height: 30px;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, var(--text)) 14%, transparent);
  border-radius: 6px;
  background: transparent;
  color: var(--theme-main-text, var(--text));
  padding: 0 12px;
}
.btn-primary,
.btn-primary-sm {
  border: 0;
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  font-weight: 650;
}
.btn-primary {
  height: 34px;
  padding: 0 16px;
}
.btn-primary-sm {
  height: 30px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.btn-primary-sm:disabled {
  opacity: .4;
  cursor: default;
}
/* user:“把主题的色彩设置改成 纯色/渐变/玻璃……图片”+
   (控件区选图片/玻璃时，主要填充控件跟随适应方式与毛玻璃滤镜，其余样式为 none。) */
.composer-pill,
.send,
.btn-primary,
.btn-primary-sm {
  background-image: var(--theme-control-image, none);
  background-size: var(--theme-control-image-size, auto);
  background-repeat: var(--theme-control-image-repeat, no-repeat);
  background-position: center;
  -webkit-backdrop-filter: var(--theme-control-glass-filter, none);
  backdrop-filter: var(--theme-control-glass-filter, none);
}
.stop-btn {
  height: 26px;
  border: 1px solid var(--danger, var(--red));
  border-radius: 6px;
  background: transparent;
  color: var(--danger, var(--red));
  padding: 0 10px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.stop-btn:hover {
  background: var(--danger, var(--red));
  color: var(--theme-main-text, #f2efeb);
}
.run-status { font-size: 13px; color: var(--muted); }
.run-status.running { color: var(--green); font-weight: 600; }

.composer-model-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.composer-model-row .ui-select {
  position: relative;
  min-width: 140px;
}
.composer-model-row .ui-select-trigger {
  height: 28px;
  min-height: 28px;
  padding: 0 28px 0 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.composer-model-row .ui-select-arrow { right: 10px; }

.agents-editor {
  width: 100%;
  min-height: 320px;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: 13px;
  resize: none;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal, 80);
  background: rgba(0,0,0,.55);
  display: grid;
  place-items: center;
}
.modal-card {
  --text: var(--theme-main-text);
  min-width: 360px;
  max-width: 90vw;
  padding: 24px;
  display: grid;
  gap: 18px;
  border: 1px solid color-mix(in srgb, var(--theme-main-text) 14%, transparent);
  border-radius: var(--radius-lg);
  background: var(--theme-main-background);
  color: var(--theme-main-text);
}
.modal-card.wide { width: min(680px, 90vw); }
.modal-card h2 { font-size: 18px; }

.runtime-toolbar {
  display: grid;
  gap: 0;
  color: var(--text);
}
.runtime-widget {
  min-width: 0;
  display: grid;
  gap: 8px;
  padding: 10px 0 12px;
  border: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--theme-backdrop-text) 11%, transparent);
  border-radius: 0;
  background: transparent;
}
.runtime-widget:last-child {
  border-bottom: 0;
}
.runtime-widget-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
}
.runtime-widget-head h3 {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0;
  color: color-mix(in srgb, var(--theme-backdrop-text) 82%, transparent);
}
.runtime-widget-head p {
  margin: 4px 0 0;
  color: color-mix(in srgb, var(--theme-backdrop-text) 56%, transparent);
  font-size: 12px;
  line-height: 1.45;
}
.runtime-metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}
.runtime-metric {
  min-width: 0;
  display: grid;
  gap: 2px;
  padding: 8px;
  border: 1px solid color-mix(in srgb, var(--theme-backdrop-text) 9%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-backdrop-text) 4%, transparent);
}
.runtime-metric span {
  color: color-mix(in srgb, var(--theme-backdrop-text) 52%, transparent);
  font-size: 11px;
}
.runtime-metric strong {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--theme-backdrop-text);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.runtime-stat-line {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--theme-backdrop-text);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 750;
  white-space: nowrap;
}
.runtime-stat-list {
  display: grid;
  gap: 4px;
}
.runtime-stat-row {
  min-width: 0;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  column-gap: 8px;
  align-items: baseline;
}
.runtime-stat-row span {
  color: color-mix(in srgb, var(--theme-backdrop-text) 52%, transparent);
  font-size: 12px;
}
.runtime-stat-row strong {
  min-width: 0;
  color: var(--theme-backdrop-text);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 750;
  overflow-wrap: anywhere;
}
.review-actions button {
  height: 28px;
  border: 1px solid color-mix(in srgb, var(--theme-backdrop-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-backdrop-text) 5%, transparent);
  color: var(--theme-backdrop-text);
  padding: 0 10px;
  font-size: 12px;
}
.review-actions button.danger {
  border-color: color-mix(in srgb, var(--red) 42%, transparent);
  color: color-mix(in srgb, var(--red) 88%, white 8%);
}
.review-actions button.primary {
  border-color: color-mix(in srgb, var(--green) 38%, transparent);
  background: color-mix(in srgb, var(--green) 16%, transparent);
  color: color-mix(in srgb, var(--green) 86%, white 10%);
}
.review-actions button:disabled {
  opacity: .42;
  cursor: default;
}
.commit-review-panel {
  border-color: color-mix(in srgb, var(--green) 20%, var(--theme-backdrop-text) 6%);
  background: color-mix(in srgb, var(--green) 5%, var(--theme-backdrop-text) 4%);
}
.review-status-pill {
  height: 24px;
  border: 1px solid color-mix(in srgb, var(--theme-backdrop-text) 12%, transparent);
  border-radius: 999px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  color: color-mix(in srgb, var(--theme-backdrop-text) 68%, transparent);
  font-size: 11px;
  white-space: nowrap;
}
.review-status-pill.status-pending {
  border-color: color-mix(in srgb, var(--orange) 36%, transparent);
  color: color-mix(in srgb, var(--orange) 84%, white 8%);
}
.review-status-pill.status-approved {
  border-color: color-mix(in srgb, var(--green) 34%, transparent);
  color: color-mix(in srgb, var(--green) 84%, white 8%);
}
.review-status-pill.status-changes_requested {
  border-color: color-mix(in srgb, var(--red) 30%, transparent);
  color: color-mix(in srgb, var(--red) 78%, white 12%);
}
.commit-review-copy {
  display: grid;
  gap: 6px;
  color: color-mix(in srgb, var(--theme-backdrop-text) 72%, transparent);
  font-size: 12px;
  line-height: 1.5;
}
.commit-review-copy strong {
  color: var(--theme-backdrop-text);
  font-size: 13px;
}
.commit-review-copy p {
  margin: 0;
}
.commit-message-field {
  display: grid;
  gap: 5px;
}
.commit-message-field span {
  color: color-mix(in srgb, var(--theme-backdrop-text) 54%, transparent);
  font-size: 11px;
}
.commit-message-field input,
.commit-feedback-box textarea {
  width: 100%;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  padding: var(--space-2);
  font: inherit;
  font-size: 12px;
  line-height: 1.45;
}
.commit-feedback-box {
  display: grid;
  gap: 7px;
}
.commit-feedback-box textarea {
  resize: vertical;
  min-height: 70px;
}
.commit-feedback-box button,
.checkpoint-headline button,
.checkpoint-row button {
  height: 26px;
  border: 1px solid color-mix(in srgb, var(--theme-backdrop-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-backdrop-text) 5%, transparent);
  color: var(--theme-backdrop-text);
  padding: 0 9px;
  font-size: 12px;
}
.commit-review-actions {
  justify-content: flex-start;
}
.review-empty,
.review-error {
  padding: 8px 0;
  color: color-mix(in srgb, var(--theme-backdrop-text) 58%, transparent);
  font-size: 12px;
  line-height: 1.5;
}
.review-error { color: var(--red); }
.review-file-list,
.review-diff-stack {
  display: grid;
}
.review-file-list { gap: 2px; }
.review-diff-stack { gap: 8px; }
.review-file-row {
  min-width: 0;
  min-height: 30px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border-radius: var(--radius-sm);
  padding: 0 4px 0 0;
}
.review-file-row:hover,
.review-file-row.open {
  background: color-mix(in srgb, var(--theme-backdrop-text) 7%, transparent);
}
.review-file-toggle {
  min-width: 0;
  min-height: 30px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0 7px;
  text-align: left;
}
.review-file-name {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-family: var(--font-mono);
  font-size: 12px;
}
.review-file-stat {
  color: color-mix(in srgb, var(--theme-backdrop-text) 56%, transparent);
  font-family: var(--font-mono);
  font-size: 11px;
}
.review-file-undo {
  height: 24px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: color-mix(in srgb, var(--theme-backdrop-text) 58%, transparent);
  padding: 0 8px;
  font-size: 11px;
}
.review-file-row:hover .review-file-undo {
  border-color: color-mix(in srgb, var(--theme-backdrop-text) 12%, transparent);
  color: var(--theme-backdrop-text);
}
.review-file-undo:hover {
  border-color: color-mix(in srgb, var(--red) 38%, transparent);
  color: color-mix(in srgb, var(--red) 86%, white 10%);
}
.review-file-undo:disabled { opacity: .45; }
.review-more {
  width: 100%;
  min-height: 30px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  border: 1px dashed color-mix(in srgb, var(--theme-backdrop-text) 16%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--theme-backdrop-text) 64%, transparent);
  padding: 0 8px;
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.review-more span:first-child {
  min-width: 24px;
  color: var(--theme-backdrop-text);
  font-family: var(--font-mono);
  font-weight: 800;
  text-align: center;
}
.review-more span:last-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.review-more:hover {
  border-style: solid;
  background: color-mix(in srgb, var(--theme-backdrop-text) 6%, transparent);
  color: var(--theme-backdrop-text);
}
.review-diff-file {
  min-width: 0;
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, var(--text)) 12%, transparent));
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--theme-main-text, var(--text)) 3.5%, transparent));
  color: var(--theme-main-text, var(--text));
}
.review-diff-head {
  width: 100%;
  min-height: 32px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 0;
  border-bottom: 1px solid var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, var(--text)) 10%, transparent));

/* =========================================================================
   Toast / notification — single host fed by the global useCoreToast service
   (composables/useCoreToast.ts). Toasts stack top-center, auto-dismiss after
   a kind-dependent duration, and are individually closable. They never cover
   interactive content (fixed strip, no overlay) and never overwrite each
   other the way the old two-slot .error-toast/.notice-toast did.
   ========================================================================= */
.core-toast-host {
  position: fixed;
  top: calc(var(--titlebar-offset, 0px) + 18px);
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toast, 90);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none; /* the strip itself never blocks clicks beneath */
  max-width: min(90vw, 640px);
}
.core-toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
.core-toast--error {
  background: color-mix(in srgb, var(--red) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  color: color-mix(in srgb, var(--red) 58%, var(--theme-main-text, #f2efeb));
}
.core-toast--notice {
  background: color-mix(in srgb, var(--green) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--green) 28%, transparent);
  color: color-mix(in srgb, var(--green) 64%, var(--theme-main-text, #f2efeb));
}
.core-toast--success {
  background: color-mix(in srgb, var(--green) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--green) 28%, transparent);
  color: color-mix(in srgb, var(--green) 64%, var(--theme-main-text, #f2efeb));
}
.core-toast__text {
  overflow-wrap: anywhere;
}
/* 可点击的提示（例如“会话已完成，点此打开”）：文字按钮保持提示原有排版。 */
.core-toast__action {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.core-toast__action:hover,
.core-toast__action:focus-visible {
  text-decoration: underline;
  text-underline-offset: 2px;
}
.core-toast__action:focus-visible {
  outline: 2px solid color-mix(in srgb, currentColor 60%, transparent);
  outline-offset: 2px;
}
.core-toast__dismiss {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  padding: 0;
  background: transparent;
  color: inherit;
  opacity: 0.65;

}
.core-toast__dismiss:hover {
  opacity: 1;
  background: color-mix(in srgb, currentColor 12%, transparent);
}
.core-toast__dismiss svg {
  width: 12px;
  height: 12px;
}
.core-toast-enter-active,
.core-toast-leave-active {
  transition: opacity var(--dur-base) ease, transform var(--dur-base) ease;
}
.core-toast-enter-from,
.core-toast-leave-to {
  opacity: 0;
  transform: translateY(-6px);
}
