@media (max-width: 640px) {
  .workspace-runtime-overlay { display: none; }
  .workspace-shell { --composer-rest-bottom: var(--space-3); }
  /* Drawers become bottom-sheet-style slide-overs with a dimmed backdrop
     (restored from the dropped mobile block — audit 19). */
  .workspace-main {
    /* The surface starts at the physical top so the background continues behind the
       status bar; only its content gives way. The 1px card border becomes a white line
       on the left edge of a phone, so it goes too. */
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: auto;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding-top: calc(var(--space-5) + var(--native-safe-area-top, 0px));
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .workspace-shell--full-bleed .workspace-main {
    padding: 0;
  }
  .send {
    min-width: 44px;
    min-height: 44px;
  }
  .floating-composer {
    top: auto;
    right: var(--space-3);
    bottom: calc(var(--composer-bottom-offset, 0px) + var(--composer-rest-bottom, var(--space-3)));
    left: var(--space-3);
    width: auto;
    transform: none;
  }
  .floating-composer textarea { font-size: 14px; }
  .workspace-shell--workflow .floating-composer,
  .workspace-shell--workflow-interaction-active .floating-composer,
  .workspace-shell--workflow .floating-composer:focus-within,
  .workspace-shell--workflow .composer-root--workflow-has-value .floating-composer,
  .workspace-shell--workflow .composer-root--workflow-stop .floating-composer {
    width: auto;
    max-width: none;
  }
  .empty-session-hero {
    left: 50%;
    width: calc(100% - var(--space-4));
    transform: translateX(-50%);
  }
  /* A session whose composer sits at the bottom anchors the hero above it from
     the viewport edge. */
  .workspace-shell--composer-bottom .empty-session-hero {
    top: auto;
    bottom: calc(
      var(--composer-bottom-offset, 0px) +
      var(--composer-rest-bottom, var(--space-3)) +
      var(--composer-height, 120px) +
      var(--space-3)
    );
  }
  /* A blank session centres the composer through --empty-session-composer-top
     instead, so the hero keeps the shared anchor (its own bottom edge floating
     one step above the composer) — a viewport-relative bottom would drop the
     greeting behind the composer card. */
  .workspace-shell--empty-session .empty-session-hero {
    top: calc(var(--empty-session-composer-top, 50vh) - var(--space-3));
    bottom: auto;
    transform: translate(-50%, -100%);
  }
  .empty-session-logo { --sunday-logo-size: 104px !important; }
  .empty-session-title { font-size: clamp(18px, 5.4vw, 21px); }
  .workspace-shell--empty-session .floating-composer {
    --composer-rest-bottom: var(--space-3);
  }
  .settings-page {
    display: flex;
    flex-direction: column;
  }
  .settings-sidebar {
    flex: 0 0 auto;
    padding: 10px 12px 0;
  }
  .settings-brand { display: none; }
  .settings-sidebar-footer {
    order: -1;
    width: max-content;
    margin: 0 0 8px;
    padding: 0;
    border-top: 0;
  }
  .settings-sidebar .settings-entry {
    min-height: 40px;

  .settings-nav {

    overflow-y: hidden;
  }

  .settings-main {
    min-height: 0;

    border-bottom: 0;
    border-left: 0;

/* =========================================================================
   Message Stream — ChatGPT/Codex-like thread rendering
   ========================================================================= */

.user-row {
  display: flex;
  justify-content: flex-end;
  padding: 2px 0 8px;
}
.user-stack {
  max-width: min(72%, 620px);
  display: grid;
  justify-items: end;
  gap: 6px;
}
.user-bubble {
  max-width: min(72%, 620px);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  border-radius: 20px;
  border-bottom-right-radius: 8px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  color: var(--theme-main-text, #f2efeb);
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--theme-main-text, #fff) 3.5%, transparent);
}
.user-stack .user-bubble {
  max-width: 100%;
}
/* 运行中插入的引导指令：沿用回复标签的元信息配方，标出它不是新的一轮对话 */
.user-guide-label {
  padding-right: 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
/* 引导住在过程区里：形状是用户气泡，位置随过程一起展开/收起 */
.process-guidance {
  display: grid;
  justify-items: end;
  padding: var(--space-1) 0 var(--space-2);
}
/* 待生效的引导（已发出、模型还没接手）：虚线边 + 呼吸，与落位后的实色气泡区分 */
.user-bubble--pending {
  border-style: dashed;
  border-color: color-mix(in srgb, var(--theme-main-text, #fff) 28%, transparent);
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  animation: guidance-pending-breath 1.6s ease-in-out infinite;
}

@keyframes guidance-pending-breath {
  0%, 100% { opacity: .6; }
  50% { opacity: .92; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--pending {
    animation: none;
    opacity: .78;
  }
}
.assistant-row {
  display: flex;
  justify-content: flex-start;
  padding: 2px 0 12px;
}
.assistant-message,
.assistant-reply-bubble {
  width: min(100%, 760px);
  padding: 0 2px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-message--live {
  animation: stream-enter .18s ease-out both;
}
.assistant-meta,
.reply-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex-wrap: wrap;
  min-height: 22px;
  margin-bottom: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
.assistant-label {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}
.assistant-timestamp {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  width: 5ch;
  min-width: 0;
  height: 1.4em;
  overflow: hidden;
  color: color-mix(in srgb, var(--theme-main-text) 38%, transparent);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
  transition: width .2s ease-out;
}
.assistant-timestamp__compact,
.assistant-timestamp__expanded {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  transition: opacity .16s ease-out, transform .2s ease-out;
}
.assistant-timestamp__compact {
  left: 0;
  width: 5ch;
  justify-content: center;
  opacity: 1;
}
.assistant-timestamp__expanded {
  left: 0;
  opacity: 0;
  pointer-events: none;
  transform: scaleX(.26);
  transform-origin: left center;
}
.assistant-timestamp:hover {
  width: 19ch;
}
.assistant-timestamp:hover .assistant-timestamp__compact {
  opacity: 0;
}
.assistant-timestamp:hover .assistant-timestamp__expanded {
  opacity: 1;
  transform: scaleX(1);
}
@media (prefers-reduced-motion: reduce) {
  .assistant-timestamp,
  .assistant-timestamp__compact,
  .assistant-timestamp__expanded {
    transition: none;
  }
}
.assistant-live-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 64%, transparent);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
  text-transform: none;
}
.initial-waiting-indicator {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  padding: 1px 0 4px;
}
.shallow-thinking-pending {
  display: inline-flex;
  align-items: baseline;
  min-width: 0;
  color: color-mix(in srgb, var(--green) 72%, var(--theme-main-text, #fff) 28%);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
}
.shallow-thinking-pending--process {
  margin-left: 22px;
}
.shallow-thinking-pending-row {
  padding: 1px 0 2px;
}
.reasoning-body--pending {
  margin-top: 0;
  margin-bottom: 4px;
  padding-bottom: 0;
}
.shallow-thinking-dots {
  display: inline-flex;
  width: 1.2em;
}
.shallow-thinking-dots span {
  animation: shallow-thinking-dot 1.2s ease-in-out infinite;
}
.shallow-thinking-dots span:nth-child(2) {
  animation-delay: .15s;
}
.shallow-thinking-dots span:nth-child(3) {
  animation-delay: .3s;
}

/* 消息文字区域最下方：输出中三个圆点逐个显现循环 */
.streaming-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}
.streaming-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--theme-main-text) 62%, transparent);
  animation: streaming-dot 1.5s ease-in-out infinite;
}
.streaming-dots span:nth-child(2) {
  animation-delay: .15s;
}
.streaming-dots span:nth-child(3) {
  animation-delay: .3s;
}
@keyframes streaming-dot {
  0% { opacity: 0; }
  12% { opacity: 1; }
  70% { opacity: 1; }
  85%, 100% { opacity: 0; }
}

.assistant-answer {
  margin-top: 10px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-answer:empty {
  display: none;
}
.part-text-content,
.assistant-answer {
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
@media (prefers-reduced-motion: reduce) {
  .shallow-thinking-dots span {
    animation: none;
    opacity: 1;
  }
  .streaming-dots span {
    animation: none;
    opacity: 1;
  }
}

/* Shared process stream; live/complete only add state decoration. */
.process-stream {
  width: 100%;
  display: grid;
  /* An explicit shrinkable column: with the implicit auto track, a tool card
     whose content is wide (a long single-line diff, a long command) forced its
     intrinsic minimum on the track and widened the whole message past the
     thread column, clipping the reply on phones. */
  grid-template-columns: minmax(0, 1fr);
  gap: 7px;
  margin: 7px 0 12px;
  /* user:“去除消息流左侧的竖线 层级关系不再用竖线表示 而是缩进，缩进 2px 即可”
     +(去掉过程区左边的竖线，层级改由缩进表达，一级只缩 2px)。 */
  padding: 10px 0 10px 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  counter-reset: reasoning-step;
}
/* Bounds of the process tree: every box may shrink below its content so the
   scroll containers inside a tool card (output/diff blocks) own the overflow
   instead of the message column. */
.process-stream,
.process-stream &gt; *,
.process-timeline,
.process-timeline &gt; *,
.process-group,
.process-group-body,
.process-group-body &gt; *,
.process-step {
  min-width: 0;
}
.process-stream--live {
  animation: stream-enter .16s ease-out both;
}
.process-stream--complete {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.process-timeline {
  display: grid;
  gap: 5px;
}
.process-step {
  display: grid;
  grid-template-columns: auto minmax(74px, max-content) minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  min-width: 0;
  padding: 1px 0;
  font-size: 12px;
  line-height: 1.45;
}
.process-step-marker {
  width: 7px;
  height: 7px;
  /* 水平不用 auto：在 flex 容器（如 .process-tool-row）里 auto 外边距会
     吞掉所有剩余空间，把红点推到行中间、文字挤到最右侧 */
  margin: 5px 0 0;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
}
.process-step-marker--error {
  background: var(--red, #e5484d);
}
.process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
  font-weight: 680;
  white-space: nowrap;
}
.process-step-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 43%, transparent);
}
.process-step--reasoning .process-step-detail {
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.thread .process-step--reasoning {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 2px 0;
  counter-increment: reasoning-step;
}
.thread .process-step--reasoning + .process-step--reasoning {
  margin-top: 3px;
}
.thread .reasoning-toggle {
  width: 100%;
  min-width: 0;
  min-height: 28px;
  display: grid;
  grid-template-columns: max-content minmax(0, max-content) auto;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 2px 6px 2px 0;
  cursor: pointer;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 74%, transparent);
  font: inherit;
  text-align: left;
  transition: color .14s ease;
}
.thread .process-step--reasoning .process-step-marker {
  display: none;
}
.thread .process-step--reasoning .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 66%, transparent);
  font-size: 12px;
  font-weight: 680;
}
.thread .reasoning-duration {
  min-width: 0;
  max-width: min(240px, 40vw);
  justify-self: start;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-style: normal;
}
.thread .reasoning-body {
  margin: 3px 0 8px 24px;
  max-height: 800px;
  overflow: auto;
  padding: 2px 0 6px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 13px;
  line-height: 1.65;
  font-style: normal;
  text-wrap: pretty;
  opacity: 1;
}
.thread .reasoning-body .process-step-detail {
  display: block;
  overflow: visible;
  color: inherit;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-line-clamp: unset;
}
.process-stream--live .process-step--compact {
  opacity: .62;
}
.process-stream--live .process-step--compact .process-step-detail {
  max-width: 360px;
}
.process-stream--live .process-step--current {
  padding: 4px 0;
}
.process-stream--live .process-step--current .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 82%, transparent);
}
.process-stream--live .process-step--current .process-step-detail {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
}

.process-summary {
  width: fit-content;
  max-width: 100%;
  min-height: 22px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 54%, transparent);
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.process-summary:hover {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
}
/* user:“把过程行那个图标从现在的浅紫色改成文字色与灰色混合” — 使用主题文字色与中性灰各半混合。 */
.process-summary-icon {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in srgb, color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray) 44%, transparent);
  flex: 0 0 auto;
}
.process-summary-icon.part-dot--running {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: part-pulse 1s ease-in-out infinite;
}
.process-summary-icon.part-dot--completed {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
}
.process-summary-icon.part-dot--error {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%);
}
.process-summary-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.process-summary-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 78%, transparent);
  font-weight: 620;
}
.process-summary-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.stream-spinner {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: stream-spin .9s linear infinite;
  flex: 0 0 auto;
}

/* Compatibility for older product-side class names */
.part-inline,
.part-inline--context,
.part-inline--reasoning,
.part-inline--tool,
.part-inline--error,
.part-inline--info {
  color: inherit;
}
/* part-dot 状态点 — 以 main area 文字为底，靠动画/混合区分 */
.part-dot--pending { background: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text, #fff) 30%); }
.part-dot--running {
  width: 9px; height: 9px;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  background: transparent;
  border-radius: 50%;
  animation: stream-spin .9s linear infinite;
}
.part-dot--completed { background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray); }
.part-dot--error { background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%); }

.global-stats-bar {
  margin: 12px auto 0;
  width: fit-content;
  max-width: 100%;
  padding: 5px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 7%, transparent);
}
.global-stats-text {
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 44%, transparent);
}

@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes stream-enter {
  from { opacity: .68; transform: translateY(2px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes part-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}

/* ── Motion: CSS 入场 keyframes（GSAP 离散动效之外的轻量入场统一收敛在此）── */
@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes popover-in {
  from { opacity: 0; transform: translateY(-3px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@keyframes panel-enter {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .workspace-drawer,
  .workspace-main,
  .floating-composer {
    transition-duration: .5s !important;
  }
  .conversation .status.waiting {
    animation: none;
  }
  .settings-panel {
    animation: none;
  }
  /* 折叠展开由 GSAP 驱动（motion/expandPanel.ts），reduced-motion 时直切无动画 */
}

/* Old message summary controls are intentionally hidden. */
.msg-summary,
.summary-label,
.summary-chevron,
.summary-stats,
.summary-stats-inline,
.summary-dot,
.summary-text,
.msg-collapse-control,
.collapse-btn {
  display: none;
}

/* =========================================================================
   Placeholder bubble — pending user message indicator
   ========================================================================= */

.user-bubble--placeholder {
  opacity: .55;
  animation: placeholder-pulse 1.2s ease-in-out infinite;
}

@keyframes placeholder-pulse {
  0%, 100% { opacity: .45; }
  50% { opacity: .75; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--placeholder {
    animation: none;
    opacity: .55;
  }
}

/* ── Floating editor popover（CoreSettings / CorePluginsEditor 共用）── */
.editor-overlay {
  position: absolute;
  inset: 0;
  z-index: var(--z-popover);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  padding: 24px;
}
.editor-popover {
  width: min(560px, 100%);
  max-height: calc(100% - 48px);
  overflow-y: auto;
  border-radius: var(--radius);
  background: var(--settings-card-background, var(--theme-main-background, #111111));
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
  box-shadow: var(--shadow-md);
  padding: 18px 20px;
  color: var(--settings-card-text, var(--settings-main-text, var(--text)));
  /* 弹层在 .settings-main 的 --muted 重映射作用域之外（layout.css），
     自行跟随主题：亮色分支注入 --settings-muted，暗色 fallback 与全局一致 */
  --muted: var(--settings-muted, #a7a29b);
}
.editor-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.editor-popover-head h3 {
  margin: 0;
  font-size: 15px;
}
.editor-popover-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.editor-popover-close:hover {
  background: color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
}

/* ── 启用开关图标按钮（ToggleRight/ToggleLeft，语义化开关）── */
.btn--ghost.is-on {
  color: var(--green);
}

.toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 6px;
  color: var(--muted);
}

.toggle-btn.is-on {
  color: var(--green);
}

/* ── 全局搜索跳转：消息定位高亮渐隐（SessionSearchDialog → locateMessage）──
   class 加在 MessageView 根元素（.message-view）上，动画 2.6s 渐隐 */
.rag-hit-highlight {
  animation: rag-hit-fade 2.6s ease-out;
  border-radius: var(--radius);
}

@keyframes rag-hit-fade {
  0% {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #4f8cff) 70%, transparent),
                0 0 18px color-mix(in srgb, var(--accent, #4f8cff) 40%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) 14%, transparent);
  }
  100% {
    box-shadow: 0 0 0 3px transparent, 0 0 0 transparent;
    background: transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rag-hit-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #4f8cff) 62%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) var(--alpha-hover), transparent);
  }

  .sub-agent-source-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 62%, transparent);
    background: color-mix(in srgb, var(--green) var(--alpha-hover), transparent);
  }
}

/* 顶部条已经给出标题与返回键，左栏不再重复。 */

.settings-page .settings-sidebar-footer {

/* 网格子项默认 min-width:auto：长 URL / 长文本会把列撑破，被右边缘裁掉。

.settings-main,

  white-space: normal;
}

.settings-surface--narrow .settings-nav {

  flex-direction: row;

.settings-surface--narrow .settings-content {

/* user:“还有大文件拆分”+(从 ChatThread.vue 的全局样式块拆出：等待卡与编号行；
   六个文件按原顺序由组件的 &lt;style src&gt; 引入，全局作用域与层叠顺序保持不变)。 */
/* This block has no wrap toggle of its own and a phone cannot comfortably pan a
   long line inside a card, so it wraps at the breakpoint where the toggled
   blocks also default to wrap (`NARROW_VIEWPORT_MAX_WIDTH`). */
@media (max-width: 640px) {
  .tool-output {
    white-space: pre-wrap;
    word-break: break-word;
  }
}

/* Command-run output — the one tool card styled as a dark terminal (all other
   tool cards stay line-based/borderless). Also contains long output lines
   horizontally instead of stretching the message column. */
.command-output {
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #f2efeb) 18%, transparent);
  border-radius: var(--radius-sm);
  background: var(--theme-main-sunken-background, rgba(0, 0, 0, 0.32));
  width: 100%;
  min-width: 0;
  max-width: 100%;
  margin: 0;
  padding: 10px 12px;
  overflow: auto;
  max-height: 320px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--theme-main-text, var(--text));
}
.command-output-command {
  display: block;
  margin-bottom: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #f2efeb) 55%, transparent);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.command-output-result {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.tool-output-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  width: 100%;
  max-width: 100%;
  margin-bottom: 7px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.4;
}
.tool-output-meta span {
  min-width: 0;
  padding: 2px 7px;
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent));
  border-radius: var(--radius-sm);
  background: var(--theme-main-subtle-background, color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent));
  white-space: normal;
  overflow-wrap: anywhere;
}
.tool-output-content {
  margin: 0;
  font: inherit;
  color: inherit;
  white-space: pre;
  word-break: normal;
  min-width: max-content;
  cursor: pointer;
}
.tool-output-content--wrap {
  white-space: pre-wrap;
  word-break: break-word;
  min-width: 0;
}
.tool-output--error {
  border-color: color-mix(in srgb, var(--red) 30%, transparent);
  background: color-mix(in srgb, var(--red) 6%, transparent);
  color: var(--red);
  cursor: pointer;
  user-select: all;
}
.tool-output--error:hover {
  background: color-mix(in srgb, var(--red) 10%, transparent);
}
.tool-card-body--row .tool-output,
.context-tool-output {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.tool-card-body--row .tool-output-meta span,
.context-tool-output .tool-output-meta span {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.tool-card-body--row .tool-output--error {
  background: transparent;
}

.process-step--model-text {
  width: 100%;
  min-width: 0;
  display: grid;
  gap: 6px;
  padding: 2px 0 8px;
}

.process-text-head {
  min-width: 0;
  display: inline-grid;
  grid-template-columns: max-content minmax(0, max-content);
  align-items: center;
  gap: 7px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 12px;
  line-height: 1.35;
  font-weight: 680;
}

.process-text-content {
  display: block;
  min-width: 0;
  margin-left: 20px;
  max-width: 76ch;
  color: var(--theme-main-text, var(--text));
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.checklist-card {
  min-width: 0;
  display: grid;
  gap: 8px;
  padding: 10px 11px;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent);
}

/* The waiting card is a card, not a rail: the ask sentence leads, the numbered
   rows follow, and the pending state rides the icon plus a tinted hairline
   instead of a loud fill. */
.decision-card {
  --decision-attention: color-mix(in srgb, #b49a60 72%, var(--theme-main-text, #fff) 28%);
  min-width: 0;
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent);
  border-radius: var(--radius);
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent));
}

.decision-card-head,
.checklist-card-head {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--space-2);
  align-items: center;
}

.decision-card-icon {
  color: var(--decision-attention);
}

.decision-card-kind {
  min-width: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 11.5px;
  font-weight: 650;
  line-height: 1.35;
}

.decision-card-title {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--theme-main-text, var(--text));
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.45;
}

.decision-card-status {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.decision-card--pending {
  border-color: color-mix(in srgb, var(--decision-attention) 36%, transparent);
}

.decision-card-detail {
  margin: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.decision-options {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-1);
  margin: 0;
  padding: var(--space-2) 0 0;
  border-top: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  list-style: none;
}

/* Numbered rows: the marker sits outside the button, the label is the click
   target, and the consequence stays plain copy the pointer cannot act on.
   `fit-content` keeps a long label from starving the consequence column. */
.decision-option-group {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: auto fit-content(50%) minmax(0, 1fr);
  align-items: baseline;
  column-gap: var(--space-2);
}

.decision-option-index {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
}

.decision-option {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--theme-main-text, var(--text));
  padding: 2px 6px;
  cursor: pointer;
  text-align: left;
  transition: color 160ms ease, background-color 160ms ease;
}

.decision-option:hover {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}

.decision-option:active {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
}

.decision-option:focus-visible,
.decision-guide-toggle:focus-visible,
.decision-guide-submit:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--blue) 78%, transparent);
  outline-offset: 2px;
}

.decision-option--approve {
  color: color-mix(in srgb, var(--green) 82%, var(--theme-main-text, #fff) 18%);
}

.decision-option--approve:hover {
  background: color-mix(in srgb, var(--green) var(--alpha-hover), transparent);
  color: color-mix(in srgb, var(--green) 94%, var(--theme-main-text, #fff) 6%);
}

.decision-option--approve:active {
  background: color-mix(in srgb, var(--green) var(--alpha-active), transparent);
}

.decision-option--deny {
  background: transparent;
  color: color-mix(in srgb, var(--red) 82%, var(--theme-main-text, #fff) 18%);
}

.decision-option--deny:hover {
  background: color-mix(in srgb, var(--red) var(--alpha-hover), transparent);
  color: color-mix(in srgb, var(--red) 94%, var(--theme-main-text, #fff) 6%);
}

.decision-option--deny:active {
  background: color-mix(in srgb, var(--red) var(--alpha-active), transparent);
}

.decision-option-label {
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.35;
}

.decision-option-desc {
  min-width: 0;
  max-width: none;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 11.5px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.decision-guide {
  padding-top: 1px;
}

.decision-guide-toggle {
  width: max-content;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 64%, transparent);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
}

.decision-guide-toggle:hover {
  color: var(--theme-main-text, var(--text));
}

.decision-guide-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-2);
  align-items: end;
  margin-top: var(--space-2);
}

/* Nested answer field: the card owns the main area, so the input sinks into the
   card surface instead of faking a second composer. One row at rest, grown by
   `autoGrowTextarea` as the answer is typed, then scrolling at the five-line
   cap — the same field the composer-side confirmation panel shows. */
.decision-guide-input {
  min-width: 0;
  width: 100%;
  resize: none;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 12%, transparent);
  border-radius: var(--radius-sm);
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--theme-main-text, #fff) 6%, transparent));
  color: var(--theme-main-text, var(--text));
  caret-color: var(--theme-main-text, var(--text));
  padding: 8px var(--space-2);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.45;
  max-height: calc(5 * 1.45em + 16px);
  overflow-y: auto;
}

.decision-guide-input:focus {
  outline: none;
}

.decision-guide-input::placeholder {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 45%, transparent);
}

.decision-guide-submit {
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  padding: 7px var(--space-3);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
  white-space: nowrap;
  cursor: pointer;
  transition: filter 160ms ease-out;
}

.decision-guide-submit:hover:not(:disabled) {
  filter: brightness(.94);
}

.decision-guide-submit:disabled {
  cursor: not-allowed;
  opacity: .45;
}

@media (max-width: 640px) {
  /* Narrow: the consequence drops below its label instead of squeezing the row,
     and the answer field stacks over its submit. */
  .decision-option-group {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .decision-option-desc {
    grid-column: 2;
  }

  .decision-guide-fields {
    grid-template-columns: minmax(0, 1fr);
  }

  .decision-guide-submit {
    width: 100%;
  }
}

.sub-line-block {
  position: relative;
  min-width: 0;
  display: grid;
  gap: 8px;
  margin-left: 4px;
  padding-left: 22px;
}

.sub-line-block::before {
  content: &quot;&quot;;
  position: absolute;
  left: 6px;
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 16%, transparent);
}

/* user:“还有大文件拆分”+(从 ChatThread.vue 的全局样式块拆出：过程分组与流光标题；
   六个文件按原顺序由组件的 &lt;style src&gt; 引入，全局作用域与层叠顺序保持不变)。 */
/* ── Compact process group summary ── */
.process-group-summary {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 4px 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  text-align: inherit;
  cursor: pointer;
  border-radius: 0;
  opacity: 0.8;
  position: relative;
}
.process-group-summary::before {
  content: &quot;&quot;; position: absolute; inset: 0;
  border-radius: 0; background: transparent; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
  mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
}
.process-group-summary:hover {
  opacity: 1;
}
.process-group-summary:hover::before {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}
.process-group-text {
  min-width: 0;
  font-size: 12px;
  line-height: 1.4;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 运行中：分组摘要收缩到文字宽度，流光扫过范围=文字区域 */
.process-group-summary--running .process-group-text {
  justify-self: start;
}
/* user:“去除消息流左侧的竖线 层级关系不再用竖线表示 而是缩进，缩进 2px 即可”
   +(分组展开体同样去掉左边竖线，嵌套层级靠 2px 缩进体现)。 */
.process-group-body {
  padding: 4px 0 4px 2px;
}

.sub-line-heading {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 4px 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  text-align: inherit;
  cursor: pointer;
  border-radius: 0;
  position: relative;
}
.sub-line-heading::before {
  content: &quot;&quot;; position: absolute; inset: 0;
  border-radius: 0; background: transparent; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
  mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
}
.sub-line-heading:hover::before {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}

/* 行标题 + 就地展开箭头：标题点击归右侧分屏，箭头保留原来的展开语义。 */
.sub-line-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-1);
}
.sub-line-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 55%, transparent);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.sub-line-toggle:hover {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--theme-main-text, #fff);
}
.sub-line-toggle:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--blue) 75%, transparent);
  outline-offset: 1px;
}
.sub-line-toggle-icon {
  transition: transform var(--dur-fast) var(--ease-out);
}
.sub-line-toggle-icon.is-open { transform: rotate(180deg); }

/* 面板内部的子代理行：明确不可点——没有指针反馈、没有悬停反馈。 */
.sub-line-heading:disabled,
.tool-card-header:disabled {
  cursor: default;
}
.sub-line-heading:disabled:hover,
.tool-card-header:disabled:hover {
  background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  .sub-line-toggle,
  .sub-line-toggle-icon { transition: none; }
}

.sub-line-title {
  display: inline-block;
  justify-self: start;
  max-width: 100%;
  min-width: 0;
  color: var(--theme-main-text, var(--text));
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

/* 运行态标题流光（工具行 / sub-agent 行通用）：
   v-beam 指令给 running 态标题加 .flow-text，通过 background-clip:text
   与 JS rAF 驱动的 background-position 实现「文字本身渐变流动」。
   为避免旧版 WebView2/Chromium&lt;111 不支持 color-mix 导致渐变整条失效，
   RGB 分量由 JS 从 --theme-main-text 解析后写入 --flow-r/g/b。 */
.process-step--running .process-step-title,
.sub-line--running .sub-line-title,
.process-group-summary--running .process-group-text,
.compaction-step--running .compaction-token-detail {
  color: color-mix(in srgb, var(--theme-main-text, #f2efeb) 58%, transparent);
}
.process-step--running .process-step-title.flow-text,
.sub-line--running .sub-line-title.flow-text,
.process-group-summary--running .process-group-text.flow-text,
.compaction-step--running .compaction-token-detail.flow-text {
  background-image: linear-gradient(
    90deg,
    rgba(var(--flow-r, 242), var(--flow-g, 239), var(--flow-b, 235), 0.18) 0%,
    rgba(var(--flow-r, 242), var(--flow-g, 239), var(--flow-b, 235), 1) 30%,
    rgba(var(--flow-r, 242), var(--flow-g, 239), var(--flow-b, 235), 1) 70%,
    rgba(var(--flow-r, 242), var(--flow-g, 239), var(--flow-b, 235), 0.18) 100%
  );
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  will-change: background-position;
}

/* Thinking/tool titles share one compact recipe. Reasoning keeps its sampled
   semantic tail; tool titles stay as stable action-and-target labels. */
.thread .process-card-header {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  grid-template-areas: &quot;state preview meta&quot;;
  align-items: center;
  column-gap: var(--space-2);
  row-gap: 0;
  min-height: 28px;
  padding: 4px 0;
  overflow: hidden;
  position: relative;
  border-radius: 4px;
  transition: color var(--dur-base) var(--ease-out);
}
.thread .process-card-header::before {
  content: &quot;&quot;;
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: transparent;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), transparent 100%);
  transition: background-color var(--dur-base) var(--ease-out);
}
.thread .process-card-header[aria-expanded]:hover::before {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}
.thread .process-card-header[aria-expanded]:active::before {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
}
.thread .process-card-header[aria-expanded]:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--blue) 72%, transparent);
  outline-offset: 2px;
}
/* user:“把过程行那个图标从现在的浅紫色改成文字色与灰色混合” — 使用主题文字色与中性灰各半混合。 */
.process-card-state-icon {
  grid-area: state;
  align-self: center;
  justify-self: center;
  width: 16px;
  height: 16px;
  margin-top: 0;
  color: color-mix(in srgb, color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray) 72%, transparent);
  transform-origin: center;
  flex: 0 0 auto;
  transition:
    color var(--dur-base) var(--ease-out),
    opacity var(--dur-base) var(--ease-out),
    transform var(--dur-base) var(--ease-out);
}
.process-card-state-icon--running {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: process-card-breathe 1.8s ease-in-out infinite;
}
.process-card-state-icon--pending {
  color: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text, #fff) 30%);
}
.process-card-state-icon--error,
.process-card-state-icon--failed {
  color: color-mix(in srgb, var(--red) 70%, var(--theme-main-text, #fff) 30%);
}
.process-card-state-icon--completed {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  opacity: .72;
  transform: scale(1);
}
.process-card-preview,
.tool-card-header .process-card-preview,
.reasoning-toggle .process-card-preview {
  grid-area: preview;
  min-width: 0;
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 12px;
  font-weight: 560;
  line-height: 1.45;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 70%, transparent);
}
.thread .reasoning-body.process-card-body--preview {
  max-height: calc(3 * 1.65em);
  overflow: auto;
  overscroll-behavior: contain;
  cursor: pointer;
}
.thread .reasoning-body.process-card-body--expanded {
  max-height: calc(5 * 1.65em);
  /* user:“已展开时鼠标悬浮自动增高，最多 15 行；移出恢复原高度”+(高度按当前字号的行高计算，切换只做短过渡，避免频繁跳动)。 */
  transition: max-height 140ms var(--ease-out);

.tool-card-body.process-card-body--expanded .diff-lines,
.tool-card-body.process-card-body--expanded .test-result-output,
.tool-card-body.process-card-body--expanded .tool-output-content,
.tool-card-body.process-card-body--expanded .command-output-result,
.tool-card-body.process-card-body--expanded &gt; .tool-output {

/* user:“已展开时鼠标悬浮自动增高，最多 15 行；移出恢复原高度”+(悬停临时长到内容高度并封顶 15 行，超出仍走内部滚动；未展开态没有悬停规则，悬停不改高度)。 */

.nx-app {

     宿主主题色通过 --theme-main-* / --theme-main-border / --green / --font-* 暴露，
     插件不再自带一套互不相干的色板。 */
  --nx-bg: var(--theme-main-background, #111416);
  --nx-rail: color-mix(in srgb, var(--theme-main-background, #111416) 86%, var(--theme-main-text, #e8eeeb));

  --nx-accent: var(--green, #8ae6bf);

.nx-quick-app {
  /* user:“这个卡片的深色是由卡片右侧栏本身提供的”+(右侧栏已经是毛玻璃卡片；这里只叠半透明胶囊，
     文字跟随 backdrop 主题，不再铺一层 --theme-main-background 的实心面板)。 */
  --nx-text: var(--theme-backdrop-text, var(--theme-main-text, #e8eeeb));
  --nx-muted: color-mix(in srgb, var(--nx-text) 60%, transparent);
  --nx-faint: color-mix(in srgb, var(--nx-text) 40%, transparent);
  --nx-line: color-mix(in srgb, var(--nx-text) 11%, transparent);
  --nx-accent: var(--green, #8ae6bf);
  --nx-accent-ink: color-mix(in srgb, var(--green, #8ae6bf) 18%, #000);
  --nx-panel: transparent;
  --nx-panel-hover: color-mix(in srgb, var(--nx-text) 7%, transparent);
  --nx-input: color-mix(in srgb, var(--nx-text) 5%, transparent);
  display: block;
  height: auto;
  min-height: 0;
  width: 100%;
  max-width: 100%;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  overflow: visible;
}
.nx-pill-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.nx-quick-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 46px;
  padding: 6px 8px 6px 10px;
  border: 1px solid color-mix(in srgb, var(--nx-text) 9%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--nx-text) 4%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--nx-text) 5%, transparent);
  color: var(--nx-text);
  transition:
    border-color 0.16s ease,
    background 0.16s ease;
}
.nx-quick-pill:focus-within {
  border-color: color-mix(in srgb, var(--nx-accent) 42%, var(--nx-line));
}
.nx-quick-pill.is-on {
  border-color: color-mix(in srgb, var(--nx-accent) 30%, transparent);
  background: color-mix(in srgb, var(--nx-accent) 6%, transparent);
}
.nx-pill-icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--nx-text) 6%, transparent);
  color: var(--nx-muted);
}
.nx-quick-pill.is-on .nx-pill-icon {
  background: color-mix(in srgb, var(--nx-accent) 13%, transparent);
  color: var(--nx-accent);
}
.nx-pill-value {
  flex: 1;
  min-width: 0;
  color: var(--nx-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.nx-pill-value.is-live {
  color: var(--nx-accent);
}
.nx-mini-action {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  padding: 0;
  border: 1px solid var(--nx-line);
  border-radius: 50%;
  background: transparent;
  color: var(--nx-muted);
  transition:
    border-color 0.16s ease,
    background 0.16s ease,
    color 0.16s ease;
}
.nx-mini-action:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--nx-accent) 36%, var(--nx-line));
  color: var(--nx-text);
}
.nx-mini-action.is-on,
.nx-mini-action.is-ready {
  border-color: transparent;
  background: var(--nx-accent);
  color: var(--nx-accent-ink);
}
.nx-mini-action:disabled {
  opacity: 0.38;
}
.nx-node-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
}
.nx-node-select {
  width: 100%;
  min-width: 0;
  height: 32px;
  padding: 0 18px 0 2px;
  border: 0;
  background: transparent;
  color: var(--nx-text);
  font-size: 11px;
  text-overflow: ellipsis;
  appearance: none;
  cursor: pointer;
}
.nx-node-select:focus {
  outline: none;
}
.nx-chevron {
  position: absolute;
  right: 2px;
  color: var(--nx-faint);
  pointer-events: none;
}
.nx-download-form {
  display: flex;

  gap: 6px;

  min-width: 0;
}
.nx-download-form &gt; input {

    padding-top: 14px;
  }
  .nx-filter-tabs &gt; button {
    font-size: 11px;
    padding-inline: 8px;
  }
  .nx-task-list {
    padding-block: 0;
  }
  .nx-diagnose-start {
    padding: 24px 16px 18px;
  }
  .nx-diagnose-start &gt; h2 {
    font-size: 17px;
  }
  .nx-diagnose-start &gt; .nx-inline-form {
    margin-top: 18px;
  }
  .nx-diagnose-options {
    gap: 12px;
    font-size: 10px;
  }
  .nx-check-row {
    gap: 8px;
    grid-template-columns: 18px minmax(0, 1fr) auto 47px;
  }
  .nx-check-row strong {
    font-size: 11px;
  }
  .nx-check-row time {
    font-size: 10px;
  }
  .nx-history-row {
    gap: 9px;
  }
  .nx-history-row &gt; span:not(.nx-history-result) {
    display: none;
  }
  .nx-history-row &gt; time {
    font-size: 9px;
  }
  .nx-section-heading &gt; div {
    min-width: 0;
  }
  .nx-section-heading h2 {
    font-size: 13px;
  }
  .nx-section-heading &gt; .nx-button {
    font-size: 11px;
    padding-inline: 9px;
  }
  .nx-schedule-form {
    flex-wrap: wrap;
  }
  .nx-schedule-form &gt; .nx-input:first-child {
    flex-basis: 100%;
  }
  .nx-schedule-row {
    gap: 8px;
  }
  .nx-schedule-row &gt; .nx-button:not(.nx-icon-button) {
    font-size: 10px;
    padding-inline: 5px;
  }
  .nx-schedule-row strong {
    font-size: 11px;
  }
  .nx-settings-rows &gt; div {
    gap: 12px;
  }
  .nx-settings-rows small {
    font-size: 10px;
  }
  .nx-event {
    gap: 8px;
    font-size: 11px;
  }
  .nx-event &gt; time {
    font-size: 9px;
  }
  .nx-rule-row {
    grid-template-columns: minmax(0, 1fr) 96px 24px;
    gap: 5px;
  }
  .nx-rule-row .nx-input {
    font-size: 11px;
    padding-inline: 8px;
  }
  .nx-loading-grid {
    grid-template-columns: 1fr;
  }
  .nx-loading-grid &gt; .nx-skeleton:last-child {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .nx-app * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

  --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;
  --alpha-hover: 8%; --alpha-active: 12%; --alpha-press: 18%;
}

/* user:“专门对小屏或者说分屏状态做一下适配”+(资料、记忆、方案按当前页面宽度切换密度)。 */
/* The shared surface recipe for the two library-shaped full-area views
   (资料库 and 记忆): toolbar, filter tabs, card grid, list rows, reader,
   editor, dialogs and buttons. Every rule is rooted at `.library-surface`,
   so the recipe lives in one place and cannot leak onto the rest of the app.
   Both views render that class on their root element. The `.plan-*` names are
   the shared card/list recipe and are used verbatim by 记忆 too. */

/* user:“合并去重，不仅是要把已知的重复去掉”+(同一份 .library-surface 规则原先连续写了两遍，
   删除重复的一份；保留的这份是资料库与记忆共用的唯一入口配方)。 */
.library-surface {
  display: flex;
  flex-direction: column;
  padding-top: var(--space-4);
  --text: var(--theme-main-text);
}

/* 资料库顶部的三大项切换：和筛选页签同一套配方（同一处方两处用），
   只加一条分界线，把「最外层分区」和分区内部的页签分开。 */
.library-surface .library-sections {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-bottom: var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
}
.library-surface .library-sections button {
  padding: 4px var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 65%, transparent);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .library-sections button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-sections button.active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); font-weight: 600; }
/* ── 资料区的资料库版式（对标 ChatGPT 资料库）：大标题 + 右侧整条工具 ── */
.library-surface .materials-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}
.library-surface .materials-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  flex: 0 0 auto;
}
.library-surface .materials-tools {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1 1 420px;
  min-width: 0;
  justify-content: flex-end;
}
.library-surface .materials-search { flex: 1 1 240px; max-width: 360px; }
.library-surface .materials-new { flex: 0 0 auto; }
/* 一句占用实话：安静一行，不是警报。 */
.library-surface .materials-usage {
  margin: 0 0 var(--space-4);
  font-size: 12px;
  color: color-mix(in srgb, var(--text) 52%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .materials-crumb { margin-bottom: var(--space-3); }

/* 卡片墙：多列瀑布流，图片按自身比例决定高度，读起来像一面墙而不是表格。
   一行放 4~5 张：列宽下限 190px，最多 5 列。 */
.library-surface .materials-grid {
  columns: 190px 5;
  column-gap: var(--space-2);
  padding-bottom: var(--space-4);
}
.library-surface .material-card {
  position: relative;
  display: block;
  break-inside: avoid;
  margin: 0 0 var(--space-2);
  padding: var(--space-2);
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--text) 10%, transparent));
  border-radius: var(--radius);
  background: var(--theme-main-background, color-mix(in srgb, var(--text) 4%, transparent));
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .material-card:hover {
  border-color: color-mix(in srgb, var(--text) 24%, transparent);
  box-shadow: var(--shadow-sm);
}
.library-surface .material-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.library-surface .material-card--selected { border-color: color-mix(in srgb, var(--blue) 60%, transparent); }

/* user:“支持鼠标拖动、触屏滑动连续选中多个条目”+(卡片与行在触屏上竖向仍可滚动，
   横向滑动留给拖选；拖动期间全局禁掉文字选择与长按菜单，免得拖出一手蓝底。) */
.library-surface .material-card,
.library-surface .library-row { touch-action: pan-y; -webkit-touch-callout: none; }
body.library-drag-selecting { user-select: none; -webkit-user-select: none; }
body.library-drag-selecting .library-surface .material-card,
body.library-drag-selecting .library-surface .library-row { cursor: crosshair; }

/* 内容区：有缩略图就看图；没有就自绘一张封面——文档类是一页纸（下缘一条类型
   色带写着扩展名），音视频与图片类是一枚圆底图标。类型色由下面的 data-kind
   映射给出，普通文件保持中性，不再一律是清一色的灰图标。 */
.library-surface .material-thumb {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  overflow: hidden;
  border-radius: calc(var(--radius) - 2px);
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--text) 6%, transparent));
  color: color-mix(in srgb, var(--text) 52%, transparent);
  --cover-accent: color-mix(in srgb, var(--text) 58%, transparent);
}
.library-surface .material-thumb img { display: block; width: 100%; height: auto; }
.library-surface .material-status { position: absolute; top: var(--space-1); right: var(--space-1); }

/* 类型色：语义色固定、不随主题走；没列到的类型（普通文件）保持中性。 */
.library-surface .material-thumb[data-kind=&#x27;pdf&#x27;] { --cover-accent: var(--red); }
.library-surface .material-thumb[data-kind=&#x27;presentation&#x27;] { --cover-accent: var(--orange); }
.library-surface .material-thumb[data-kind=&#x27;spreadsheet&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;document&#x27;] { --cover-accent: var(--blue); }
.library-surface .material-thumb[data-kind=&#x27;code&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;image&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;video&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;audio&#x27;] { --cover-accent: var(--orange); }

.library-surface .material-thumb--cover { min-height: 92px; }
.library-surface .material-cover-icon { color: var(--cover-accent); }
.library-surface .material-cover-ext {
  color: var(--cover-accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
/* 音视频与图片：圆底图标居中，扩展名当小徽标缀在下面。 */
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] { flex-direction: column; gap: var(--space-1); }
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-icon {
  box-sizing: content-box;
  padding: var(--space-2);
  border-radius: 50%;
  background: color-mix(in srgb, var(--cover-accent) 14%, transparent);
}
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-ext {
  padding: 0 var(--space-1);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--cover-accent) 16%, transparent);
}
/* 文档类：图标落在纸上，纸的下缘整条类型色带就是这本书的封面题签。 */
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] { padding-bottom: 22px; }
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] .material-cover-ext {
  position: absolute;
  inset: auto 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  background: color-mix(in srgb, var(--cover-accent) 20%, transparent);
}
/* 视频封面上的播放标记：和状态签同一配方的小圆片，压在缩略图左下角。 */
.library-surface .material-thumb-play {
  position: absolute;
  left: var(--space-1);
  bottom: var(--space-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text) var(--alpha-active), transparent);
  color: color-mix(in srgb, var(--text) 82%, transparent);
}

/* 悬停出现的勾选圈：多选批量操作入口，选中后常驻。 */
.library-surface .material-check {
  position: absolute;
  top: var(--space-1);
  left: var(--space-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--text) 24%, transparent);
  border-radius: 50%;
  background: var(--theme-main-background, transparent);
  color: var(--theme-control-text, currentColor);
  opacity: 0;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.library-surface .material-card:hover .material-check,
.library-surface .material-check:focus-visible,
.library-surface .material-card--selected .material-check { opacity: 1; }
.library-surface .material-check[aria-pressed=&#x27;true&#x27;] {
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  border-color: transparent;
}

.library-surface .material-name {
  margin: var(--space-2) 0 2px;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.45;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-surface .material-meta {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
  font-size: 11.5px;
  color: color-mix(in srgb, var(--text) 45%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .material-star {
  display: inline-flex;
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange);
  cursor: pointer;
}

/* 成果的状态与方案的状态不是一套值，各认各的属性。 */
.library-surface .library-status[data-artifact-status=&#x27;missing&#x27;] { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.library-surface .library-status[data-artifact-status=&#x27;failed&#x27;] { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.library-surface .library-status[data-artifact-status=&#x27;running&#x27;] { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.library-surface .library-status[data-artifact-status=&#x27;completed&#x27;] { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }

/* 选中若干件后的批量动作条：落在底部，不遮挡内容。 */
.library-surface .materials-selection {
  position: sticky;
  bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: fit-content;
  margin: var(--space-2) auto 0;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--theme-main-border);
  border-radius: 999px;
  background: var(--theme-main-background);
  box-shadow: var(--shadow-md);
  font-size: 12.5px;
}

@container app-page (max-width: 640px) {
  .library-surface .materials-title { font-size: 19px; }
  .library-surface .materials-tools { flex-basis: auto; }
  .library-surface .materials-search { max-width: none; }
}

/* 手机没有顶部条，标题与返回键留在版面里；桌面由顶部条承担。 */
.library-surface .library-mobile-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.library-surface .library-back {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 68%, transparent);
  cursor: pointer;
}
.library-surface .library-back:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-head-copy { min-width: 0; }

/* 悬停出现的卡片菜单键 */
.library-surface .card-menu-btn {
  position: absolute;
  top: var(--space-2);
  right: var(--space-2);

.library-surface .plan-card:hover .card-menu-btn, .library-surface .material-card:hover .card-menu-btn, .library-surface .library-row:hover .card-menu-btn, .library-surface .folder-card:hover .card-menu-btn, .library-surface .card-menu-btn:focus-visible { opacity: 1; }

/* ── 方案列表（行） ── */
.library-surface .library-items {

  padding: 0 0 var(--space-5);

  flex-direction: column;

}

.library-surface .library-row .card-menu-btn { top: 50%; margin-top: -13px; }
.library-surface .library-item-top { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; padding-right: var(--space-5); }
.library-surface .library-item-title { flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 阅读子页 ── */

  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-surface .library-editor-meta {
  display: flex;

.library-surface .doc-editor-panes {

.library-surface .library-document h1, .library-surface .library-document h2, .library-surface .library-document h3 {

  letter-spacing: 0;
  line-height: 1.35;
}
