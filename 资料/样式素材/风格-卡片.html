  line-height: 1.5;
  color: var(--theme-main-text, var(--text));
}
.command-output-command {
  display: block;
  margin-bottom: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #f2efeb) 55%, transparent);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.command-output-result {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.tool-output-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  width: 100%;
  max-width: 100%;
  margin-bottom: 7px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.4;
}
.tool-output-meta span {
  min-width: 0;
  padding: 2px 7px;
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent));
  border-radius: var(--radius-sm);
  background: var(--theme-main-subtle-background, color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent));
  white-space: normal;
  overflow-wrap: anywhere;
}
.tool-output-content {
  margin: 0;
  font: inherit;
  color: inherit;
  white-space: pre;
  word-break: normal;
  min-width: max-content;
  cursor: pointer;
}
.tool-output-content--wrap {
  white-space: pre-wrap;
  word-break: break-word;
  min-width: 0;
}
.tool-output--error {
  border-color: color-mix(in srgb, var(--red) 30%, transparent);
  background: color-mix(in srgb, var(--red) 6%, transparent);
  color: var(--red);
  cursor: pointer;
  user-select: all;
}
.tool-output--error:hover {
  background: color-mix(in srgb, var(--red) 10%, transparent);
}
.tool-card-body--row .tool-output,
.context-tool-output {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.tool-card-body--row .tool-output-meta span,
.context-tool-output .tool-output-meta span {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.tool-card-body--row .tool-output--error {
  background: transparent;
}

.process-step--model-text {
  width: 100%;
  min-width: 0;
  display: grid;
  gap: 6px;
  padding: 2px 0 8px;
}

.process-text-head {
  min-width: 0;
  display: inline-grid;
  grid-template-columns: max-content minmax(0, max-content);
  align-items: center;
  gap: 7px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 12px;
  line-height: 1.35;
  font-weight: 680;
}

.process-text-content {
  display: block;
  min-width: 0;
  margin-left: 20px;
  max-width: 76ch;
  color: var(--theme-main-text, var(--text));
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.checklist-card {
  min-width: 0;
  display: grid;
  gap: 8px;
  padding: 10px 11px;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent);
}

/* The waiting card is a card, not a rail: the ask sentence leads, the numbered
   rows follow, and the pending state rides the icon plus a tinted hairline
   instead of a loud fill. */
.decision-card {
  --decision-attention: color-mix(in srgb, #b49a60 72%, var(--theme-main-text, #fff) 28%);
  min-width: 0;
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent);
  border-radius: var(--radius);
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--theme-main-text, #fff) 4%, transparent));
}

.decision-card-head,
.checklist-card-head {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--space-2);
  align-items: center;
}

.decision-card-icon {
  color: var(--decision-attention);
}

.decision-card-kind {
  min-width: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 11.5px;
  font-weight: 650;
  line-height: 1.35;
}

.decision-card-title {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--theme-main-text, var(--text));
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.45;
}

.decision-card-status {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.decision-card--pending {
  border-color: color-mix(in srgb, var(--decision-attention) 36%, transparent);
}

.decision-card-detail {
  margin: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.decision-options {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-1);
  margin: 0;
  padding: var(--space-2) 0 0;
  border-top: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  list-style: none;
}

/* Numbered rows: the marker sits outside the button, the label is the click
   target, and the consequence stays plain copy the pointer cannot act on.
   `fit-content` keeps a long label from starving the consequence column. */
.decision-option-group {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: auto fit-content(50%) minmax(0, 1fr);
  align-items: baseline;
  column-gap: var(--space-2);
}

.decision-option-index {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
}

.decision-option {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--theme-main-text, var(--text));
  padding: 2px 6px;
  cursor: pointer;
  text-align: left;
  transition: color 160ms ease, background-color 160ms ease;
}

.decision-option:hover {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}

.decision-option:active {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
}

.decision-option:focus-visible,
.decision-guide-toggle:focus-visible,
.decision-guide-submit:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--blue) 78%, transparent);
  outline-offset: 2px;
}

.decision-option--approve {
  color: color-mix(in srgb, var(--green) 82%, var(--theme-main-text, #fff) 18%);
}

.decision-option--approve:hover {
  background: color-mix(in srgb, var(--green) var(--alpha-hover), transparent);
  color: color-mix(in srgb, var(--green) 94%, var(--theme-main-text, #fff) 6%);
}

.decision-option--approve:active {
  background: color-mix(in srgb, var(--green) var(--alpha-active), transparent);
}

.decision-option--deny {
  background: transparent;
  color: color-mix(in srgb, var(--red) 82%, var(--theme-main-text, #fff) 18%);
}

.decision-option--deny:hover {
  background: color-mix(in srgb, var(--red) var(--alpha-hover), transparent);
  color: color-mix(in srgb, var(--red) 94%, var(--theme-main-text, #fff) 6%);
}

.decision-option--deny:active {
  background: color-mix(in srgb, var(--red) var(--alpha-active), transparent);
}

.decision-option-label {
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.35;
}

.decision-option-desc {
  min-width: 0;
  max-width: none;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  font-size: 11.5px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.decision-guide {
  padding-top: 1px;
}

.decision-guide-toggle {
  width: max-content;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 64%, transparent);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
}

.decision-guide-toggle:hover {
  color: var(--theme-main-text, var(--text));
}

.decision-guide-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-2);
  align-items: end;
  margin-top: var(--space-2);
}

/* Nested answer field: the card owns the main area, so the input sinks into the
   card surface instead of faking a second composer. One row at rest, grown by
   `autoGrowTextarea` as the answer is typed, then scrolling at the five-line
   cap — the same field the composer-side confirmation panel shows. */
.decision-guide-input {
  min-width: 0;
  width: 100%;
  resize: none;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 12%, transparent);
  border-radius: var(--radius-sm);
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--theme-main-text, #fff) 6%, transparent));
  color: var(--theme-main-text, var(--text));
  caret-color: var(--theme-main-text, var(--text));
  padding: 8px var(--space-2);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.45;
  max-height: calc(5 * 1.45em + 16px);
  overflow-y: auto;
}

.decision-guide-input:focus {
  outline: none;
}

.decision-guide-input::placeholder {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 45%, transparent);
}

.decision-guide-submit {
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  padding: 7px var(--space-3);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
  white-space: nowrap;
  cursor: pointer;
  transition: filter 160ms ease-out;
}

.decision-guide-submit:hover:not(:disabled) {
  filter: brightness(.94);
}

.decision-guide-submit:disabled {
  cursor: not-allowed;
  opacity: .45;
}

@media (max-width: 640px) {
  /* Narrow: the consequence drops below its label instead of squeezing the row,
     and the answer field stacks over its submit. */
  .decision-option-group {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .decision-option-desc {
    grid-column: 2;
  }

  .decision-guide-fields {
    grid-template-columns: minmax(0, 1fr);
  }

  .decision-guide-submit {
    width: 100%;
  }
}

.sub-line-block {
  position: relative;
  min-width: 0;
  display: grid;
  gap: 8px;
  margin-left: 4px;
  padding-left: 22px;
}

.sub-line-block::before {
  content: &quot;&quot;;
  position: absolute;
  left: 6px;
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 16%, transparent);
}

/* user:“还有大文件拆分”+(从 ChatThread.vue 的全局样式块拆出：差异标记与消息操作；
   六个文件按原顺序由组件的 &lt;style src&gt; 引入，全局作用域与层叠顺序保持不变)。 */
/* Diff line markers — follows Claude Code unified diff style */
.diff-line--add {
  background: color-mix(in srgb, var(--green) 7%, var(--theme-main-subtle-background, transparent));
}
.diff-line--add .diff-line-content {
  color: color-mix(in srgb, var(--green) 72%, var(--theme-main-text, #fff) 28%);
}
.diff-line--add .diff-line-num {
  color: color-mix(in srgb, var(--green) 76%, var(--theme-main-text, #fff) 24%);
  font-weight: 700;
}
.diff-line--del {
  background: color-mix(in srgb, var(--red) 7%, var(--theme-main-subtle-background, transparent));
}
.diff-line--del .diff-line-content {
  color: color-mix(in srgb, var(--red) 74%, var(--theme-main-text, #fff) 26%);
}
.diff-line--del .diff-line-num {
  color: color-mix(in srgb, var(--red) 78%, var(--theme-main-text, #fff) 22%);
  font-weight: 700;
}
.diff-line--meta {
  background: color-mix(in srgb, var(--blue) 5%, var(--theme-main-subtle-background, transparent));
}
.diff-line--meta .diff-line-content {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 60%, transparent);
}
@media (max-width: 720px) {
  .process-tool-row {
    gap: 6px;
    padding-inline: 2px;
  }
  .tool-card-body--row {
    margin-left: 24px;
    width: calc(100% - 24px);
  }
  .context-tool-list {
    padding-left: 14px;
  }
  .context-tool-head {
    grid-template-columns: minmax(72px, max-content) minmax(0, 1fr);
  }
}
@media (prefers-reduced-motion: reduce) {
  .process-tool-row,
  .tool-card-body--row {
    animation: none;
    transition: none;
  }
  .reasoning-body,
  .tool-card-body {
    transition: none !important;
  }
}

/* ── Assistant reply hover actions ── */
.assistant-actions {
  display: flex;
  gap: 2px;
  padding: 4px 0 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease-out;
}
.assistant-message:hover .assistant-actions,
.assistant-message:focus-within .assistant-actions {
  opacity: 1;
  pointer-events: auto;
}
.assistant-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 46%, transparent);
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.assistant-action:hover,
.assistant-action:focus-visible {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--theme-main-text, #fff);
}
.assistant-action:active {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
  transform: scale(.96);
}
.assistant-action:focus-visible {
  outline: 2px solid var(--blue, #79bcff);
  outline-offset: 1px;
}
.assistant-action svg {
  width: 15px;
  height: 15px;
}
.assistant-action--copied {
  color: var(--green, #32d17d);
}
@media (prefers-reduced-motion: reduce) {
  .process-card-state-icon--running {
    animation: none;
    transform: none;
    opacity: 1;
  }
  .process-caption-enter-active,
  .process-caption-leave-active {
    transition: none;
  }
  .assistant-actions,
  .assistant-action,
  .process-card-state-icon,
  .thread .process-card-header,
  .thread .process-card-header::before {
    transition: none;
  }
}

/* ── User message hover actions &amp; inline edit ── */
.user-actions {
  display: flex;
  justify-content: flex-end;
  gap: 2px;
  padding: 4px 0 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease-out;
}
.user-row:hover .user-actions,
.user-row:focus-within .user-actions {
  opacity: 1;
  pointer-events: auto;
}
/* Editing takes the message column&#x27;s full width. A textarea&#x27;s intrinsic width
   is its `cols` (20 by default), which otherwise collapses the bubble into a
   narrow strip and forces the text into a scroll box. */
.user-stack--editing {
  width: 100%;
}
.user-bubble.user-bubble--editing {
  display: grid;
  width: 100%;
  max-width: 100%;
  gap: var(--space-2);
}
/* Seamless: the editor borrows the bubble&#x27;s surface and type metrics, so the
   message keeps its position, size and color when editing starts. */
.user-bubble.user-bubble--editing .user-edit-input {
  padding: var(--space-1) 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: inherit;
  caret-color: currentColor;
  font-family: var(--font-sans, inherit);
  font-size: inherit;
  line-height: inherit;
}
.user-edit-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-1);
}
.user-edit-button {
  height: 28px;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 0 var(--space-3);
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 65%, transparent);
  font-size: 12px;
  font-weight: 650;
  font-family: var(--font-sans, inherit);
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.user-edit-button:hover,
.user-edit-button:focus-visible {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--theme-main-text, #fff);
}
.user-edit-button:active {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
}
/* Send is the control-area primary recipe; its paired tokens keep the fill and
   label readable in every theme, unlike a control text on a main-area bubble. */
.user-edit-button--primary,
.user-edit-button--primary:hover,
.user-edit-button--primary:focus-visible,
.user-edit-button--primary:active {
  background: var(--theme-control-background);
  color: var(--theme-control-text);
}
.user-edit-button--primary:hover,
.user-edit-button--primary:focus-visible {
  filter: brightness(.94);
}
.user-edit-button--primary:active {
  filter: brightness(.88);
}
@media (prefers-reduced-motion: reduce) {
  .user-actions,
  .user-edit-button {
    transition: none;
  }
}

/* ── User bubble auto-fold ──
   user:“令用户气泡过长时自动折叠”+
   (超长用户消息默认只保留 6 行并向下渐隐提示还有内容，气泡表面、圆角与配色不变；
    展开/收起按钮放在气泡内右下角，沿用编辑按钮“透明 → 悬停加亮”的配方)。 */
.user-bubble--folded .user-bubble-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 6;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
}
.user-bubble-fold {
  display: block;
  margin: 4px 0 0 auto;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 60%, transparent);
  font-family: var(--font-sans, inherit);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.user-bubble-fold:hover,
.user-bubble-fold:focus-visible {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--theme-main-text, #fff);
}
.user-bubble-fold:active {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-active), transparent);
}
@media (prefers-reduced-motion: reduce) {
  .user-bubble-fold {
    transition: none;
  }
}

/* user:“还有大文件拆分”+(从 ChatThread.vue 的全局样式块拆出：工具卡与重试进度；
   六个文件按原顺序由组件的 &lt;style src&gt; 引入，全局作用域与层叠顺序保持不变)。 */
/* ── Expandable tool cards ── */
.process-stream {
  align-items: stretch;
  counter-reset: reasoning-step;
}
.process-stream .process-step {
  max-width: 100%;
}
.chat-thread .process-step--context,
.chat-thread .process-step--tool {
  display: block !important;
  grid-template-columns: none !important;
}
.process-step--tool {
  display: block;
  width: 100%;
  min-width: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 0;
  box-shadow: none;
  overflow: visible;
}
.process-stream .process-step--tool + .process-step--tool {
  margin-top: 2px;
}
.process-stream .process-step--tool:has(.tool-card-header--command) + .process-step--tool,
.process-stream .process-step--tool + .process-step--tool:has(.tool-card-header--command) {
  margin-top: 8px;
}
.tool-card-header {
  position: relative;
  z-index: 0;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  min-height: 28px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas:
    &quot;marker title&quot;
    &quot;. args&quot;;
  align-items: center;
  column-gap: 6px;
  row-gap: 4px;
  border: none;
  background: none;
  color: inherit;
  cursor: default;
  padding: 1px 0 7px;
  font-size: inherit;
  text-align: left;
  overflow: hidden;
}
.tool-card-header .process-step-marker {
  grid-area: marker;
}
.tool-card-header .process-step-title {
  grid-area: title;
  min-width: 0;
}
.tool-card-header .process-step-title:empty {
  display: none;
}
.tool-card-header.has-detail {
  cursor: pointer;
}
.tool-card-header.has-detail:hover .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 86%, transparent);
}
.process-tool-row {
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: nowrap;
  gap: 8px;
  border-radius: 0;
  background: transparent;
  padding: 4px 6px;
  position: relative;
  transition: color 160ms ease-out;
}
.process-tool-row::before {
  content: &quot;&quot;; position: absolute; inset: 0;
  border-radius: 0; background: transparent; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
  mask-image: linear-gradient(to right, rgba(0,0,0,.2) 0, #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgba(0,0,0,.2) 100%);
}
.process-tool-row .process-step-title {
  flex: 0 1 auto;
}
.process-tool-row.has-detail:hover::before {
  background: color-mix(in srgb, var(--theme-main-text, #fff) var(--alpha-hover), transparent);
}
.process-tool-row:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--blue) 72%, transparent);
  outline-offset: 1px;
}
.tool-row-summary {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
}
.tool-row-args {
  display: none;
}
.tool-row-status {
  flex: 0 0 auto;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 56%, transparent);
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
  white-space: nowrap;
}
.tool-row-status--retry {
  color: var(--orange);
  cursor: pointer;
}

/* ── Model retry progress bar ── */
.model-retry-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 3px 0;
  min-width: 0;
}
.model-retry-bar__label {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 550;
  color: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text));
  white-space: nowrap;
}
.model-retry-bar__track {
  flex: 0 1 auto;
  display: flex;
  gap: 1px;
  height: 4px;
  background: color-mix(in srgb, var(--theme-main-text) 8%, transparent);
  border-radius: 2px;
}
.model-retry-bar__segment {
  flex: 0 0 2px;
  height: 100%;
  background: transparent;
  border-radius: 0.5px;
  transition: background-color 0.2s ease;
}
.model-retry-bar__segment--filled {
  background: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text));
}
.model-retry-bar__detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text) 65%, transparent);
}
.tool-card-header--command .process-step-title {
  grid-area: title;
  font-weight: 400;
}
.process-step--tool .process-step-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
  letter-spacing: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
}
.tool-card-body {
  position: relative;
  z-index: 0;
  clear: both;
  margin-top: 8px;
  padding-left: 0;
  width: 100%;
  min-width: 0;
  overflow: auto;
  max-height: 800px;
  opacity: 1;
}
.tool-card-body--row {
  margin: 2px 0 10px 24px;
  width: calc(100% - 24px);
}
.tool-color--warn + .tool-card-body,
.tool-color--warn .tool-card-body {
  opacity: .82;
}
.process-inline-toggle {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.process-inline-toggle .process-step-title {
  flex: 0 0 auto;
}
.process-inline-toggle .process-step-detail {
  flex: 1 1 auto;
  min-width: 0;
}
.process-detail-panel {
  grid-column: 1 / -1;
  margin: 6px 0 8px 22px;
  position: relative;
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent);
  border-radius: var(--radius-sm);
  background: var(--theme-main-sunken-background, rgba(0, 0, 0, 0.32));
}
.process-detail-panel--error {
  border-color: color-mix(in srgb, var(--red) 32%, transparent);
}
.process-detail-panel pre {
  margin: 0;
  max-height: 260px;
  overflow: auto;
  padding: 28px 10px 9px;
  color: var(--theme-main-text, var(--text));
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.process-detail-copy {
  position: absolute;
  top: 5px;

  background: color-mix(in srgb, var(--theme-main-text, #fff) 6%, transparent);
  color: color-mix(in srgb, var(--theme-main-text, #fff) 70%, transparent);
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}
.process-step--error .process-step-detail {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  word-break: break-word;
}
.process-step--context {
  display: block;
  width: 100%;
  min-width: 0;
}
.context-group-header {
  width: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, max-content) minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
  font-size: inherit;
  cursor: pointer;
  text-align: left;
}
.context-group-header .process-step-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.context-group-header:hover .process-step-title {
  text-decoration: underline;
  text-underline-offset: 2px;
}
.context-tool-list {
  display: grid;
  gap: 2px;
  margin-top: 6px;
  padding-left: 24px;
  min-width: 0;
}
.context-tool-row {
  min-width: 0;
  width: 100%;
  padding: 5px 0 7px;
  overflow: hidden;
}
.context-tool-head {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(84px, max-content) minmax(0, 1fr);

  gap: 8px;

.context-tool-head .tool-args-preview {
  display: none;
}
.context-tool-output {
  margin-top: 4px;
  max-height: 220px;
  overflow: auto;

.tool-output {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  margin: 0;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent));
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, #fff) 10%, transparent));
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--theme-main-text, var(--text));
  max-height: 320px;
  overflow: auto;
}
