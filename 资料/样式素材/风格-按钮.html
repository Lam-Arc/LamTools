  pointer-events: auto;
}

.mc-shelf:hover .mc-shelf-metrics,
.mc-shelf:focus-within .mc-shelf-metrics {
  opacity: 0;
}

@media (hover: none) {
  .mc-shelf-actions {
    display: none;
  }
}

.mc-budget {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  padding: 0 0 6px;
}

.mc-budget--insp {
  justify-content: flex-start;
  padding: 0;
}

.mc-budget-track {
  flex: 0 0 86px;
  height: 2px;
  border-radius: 1px;
  background: color-mix(in srgb, var(--mc-text) 9%, transparent);
  overflow: hidden;
}

.mc-budget--insp .mc-budget-track {
  flex: 1 1 auto;
}

.mc-budget-fill {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: color-mix(in srgb, var(--mc-text) 52%, transparent);
}

.mc-budget-text {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--mc-faint);
  font-variant-numeric: tabular-nums;
}

/* ── 模型瓦片 ───────────────────────────────────────────────────── */
.mc-tiles {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* 卡片外壳承担栅格宽度，卡片本体铺满外壳；开关绝对定位在外壳右上角，
   与卡片按钮是兄弟节点，点开关不会打开检查器。 */
.mc-tile-wrap {
  position: relative;
  flex: 0 0 212px;
  max-width: 212px;
  min-width: 0;
  display: flex;
}

.mc-tile-switch {
  position: absolute;
  top: 6px;
  right: 7px;
  z-index: 1;
}

/* 复用 SundaySwitch 的尺寸变量做一档更小的开关，不动组件本身。 */
.mc-tile-switch.sunday-switch--sm {
  --sunday-w: 28px;
  --sunday-h: 16px;
  --sunday-pad: 2px;
  --sunday-thumb: 10px;
}

.mc-tile {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  max-width: none;
  min-width: 0;
  min-height: 84px;
  padding: 9px 11px 8px;
  display: grid;
  align-content: start;
  gap: 2px;
  border: 1px solid var(--mc-line-soft);
  border-radius: 9px;
  background: var(--mc-cell);
  color: var(--mc-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast, .14s) var(--ease-out, ease), border-color var(--dur-fast, .14s) var(--ease-out, ease);
}

.mc-tile:hover {
  border-color: color-mix(in srgb, var(--mc-text) 16%, transparent);
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), var(--mc-cell));
}

.mc-tile:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--mc-text) 34%, transparent);
  outline-offset: -2px;
}

.mc-tile.is-selected {
  background: color-mix(in srgb, var(--mc-text) var(--alpha-active, 12%), var(--mc-cell));
  box-shadow: inset 2px 0 0 var(--mc-signal);
}

/* 停用卡片不用虚线，虚线留给&quot;添加模型&quot;占位；这里用退后的描边和更暗的底，
   加上右上角关掉的开关表示状态。 */
.mc-tile.is-off {
  border-color: color-mix(in srgb, var(--mc-text) 7%, transparent);
  background: color-mix(in srgb, var(--mc-text) 1.5%, var(--mc-cell));
}

.mc-tile.is-off .mc-tile-name,
.mc-tile.is-off .mc-tile-id,
.mc-tile.is-off .mc-tile-usage,
.mc-tile.is-off .mc-caps {
  opacity: .55;
}

.mc-tile.is-off .mc-tile-spark {
  opacity: .4;
}

.mc-insp-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding-top: 8px;
  border-top: 1px solid var(--mc-line-soft);
}

.mc-tile-top {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  /* 给右上角的启停开关留出位置，长名字不会钻到开关底下。 */
  padding-right: 23px;
}

.mc-tile-name {
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-fallback-dot {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--mc-signal) 62%, transparent);
}

.mc-tile-id {
  overflow: hidden;
  color: var(--mc-faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-tile-foot {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  margin-top: 4px;
}

.mc-caps {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.mc-cap-glyph {
  color: color-mix(in srgb, var(--mc-text) 58%, transparent);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 550;
  line-height: 1;
}

.mc-cap-glyph:first-child {
  color: color-mix(in srgb, var(--mc-text) 72%, transparent);
}

.mc-tile-usage {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9.5px;
  white-space: nowrap;
}

.mc-tile-usage b {
  font-weight: 550;
  color: color-mix(in srgb, var(--mc-text) 64%, transparent);
}

.mc-tile-usage i {
  font-style: normal;
  color: var(--mc-faint);
}

.mc-tile-spark {
  flex: 0 0 auto;
  width: 44px;
  height: 12px;
  margin-left: auto;
  margin-right: 2px;
  overflow: visible;
  pointer-events: none;
}

.mc-tile-spark path {
  fill: none;
  stroke: color-mix(in srgb, var(--mc-signal) 42%, transparent);
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.mc-tile.is-selected .mc-tile-spark path {
  stroke: color-mix(in srgb, var(--mc-signal) 72%, transparent);
}

.mc-shelf-watermark {
  container-type: inline-size;
  flex: 1 1 96px;
  min-width: 0;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: flex-end;
  gap: 2px;
  padding: 0 2px 4px 0;
  color: color-mix(in srgb, var(--mc-text) 10%, transparent);
  user-select: none;
  overflow: hidden;
}

.mc-shelf-watermark b {
  /* 按自身可用宽度缩放，避免 &quot;100%&quot; 这类四字符在这里被 overflow 切掉。 */
  font-size: clamp(22px, 34cqi, 56px);
  font-family: var(--font-mono);
  font-weight: 500;
  line-height: .78;
  letter-spacing: -.055em;
  white-space: nowrap;
}

.mc-shelf-watermark span {
  padding-bottom: 2px;
  color: color-mix(in srgb, var(--mc-text) 24%, transparent);
  font-size: 8px;
  letter-spacing: .08em;
  white-space: nowrap;
}

.mc-tile--slot {
  flex: 0 0 128px;
  max-width: 128px;
  place-content: center;
  gap: 5px;
  min-height: 84px;
  padding: 0;
  border-style: dashed;
  background: transparent;
  color: color-mix(in srgb, var(--mc-text) 38%, transparent);
  font-size: 9.5px;
  font-weight: 600;
}

.mc-tile--slot:hover {
  color: color-mix(in srgb, var(--mc-text) 72%, transparent);
  border-color: color-mix(in srgb, var(--mc-text) 24%, transparent);
  background: color-mix(in srgb, var(--mc-text) 3%, transparent);
}

.mc-tile--new {
  flex: 0 0 52px;
  max-width: 52px;
  place-content: center;
  min-height: 84px;
  padding: 0;
  border-style: dashed;
  background: transparent;
  color: color-mix(in srgb, var(--mc-text) 44%, transparent);
}

.mc-shelf-empty {
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: 0 12px;
  border: 1px dashed var(--mc-line);
  border-radius: 10px;
  color: var(--mc-faint);
  font-size: 10.5px;
}

.mc-group-new {
  align-self: start;
  height: 38px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px dashed var(--mc-line);
  border-radius: 9px;
  background: transparent;
  color: var(--mc-muted);
  font: inherit;
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}

.mc-group-new:hover {
  color: var(--mc-text);
  border-color: color-mix(in srgb, var(--mc-text) 24%, transparent);
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), transparent);
}

.mc-no-result {
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  color: var(--mc-faint);
  font-size: 11px;
}

/* ── 首次接入 ───────────────────────────────────────────────────── */
.mc-first-run {
  display: grid;
  gap: var(--space-4);
  width: min(1120px, 100%);
  margin: auto;
  padding: var(--space-5);
  border: 1px solid var(--mc-line-soft);
  border-radius: var(--radius);
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--mc-text) 6%, transparent), transparent 60%),
    transparent;
}

.mc-first-copy {
  display: grid;
  gap: 3px;
}

.mc-first-copy strong {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.mc-first-copy span {
  color: var(--mc-faint);
  font-size: 10.5px;
}

.mc-preset-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(166px, 1fr));
  gap: var(--space-2);
}

.mc-preset {
  min-height: 58px;
  display: grid;
  align-content: center;
  gap: 3px;
  padding: 0 var(--space-3);
  border: 1px solid var(--mc-line-soft);
  border-radius: 9px;
  background: color-mix(in srgb, var(--mc-text) 2.5%, transparent);
  color: var(--mc-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast, .14s) var(--ease-out, ease), border-color var(--dur-fast, .14s) var(--ease-out, ease);
}

.mc-preset:hover {
  border-color: color-mix(in srgb, var(--mc-text) 20%, transparent);
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), transparent);
}

.mc-preset-label {
  font-size: 12px;
  font-weight: 650;
}

.mc-preset-host {
  color: var(--mc-faint);
  font-family: var(--font-mono);
  font-size: 9px;
}

.mc-preset--custom {
  border-style: dashed;
}

/* ── 检查器 ─────────────────────────────────────────────────────── */
.mc-inspector {
  grid-column: 2;
  grid-row: 1 / 6;
  align-self: start;
  position: sticky;
  top: 0;
  z-index: 4;
  display: grid;
  align-content: start;
  gap: var(--space-3);
  max-height: calc(100dvh - 132px);
  padding: var(--space-4);
  border: 1px solid var(--mc-line);
  border-radius: var(--radius);
  background: var(--mc-cell);
  box-shadow: var(--shadow-md);
  overflow-y: auto;
  scrollbar-width: thin;
}

.mc-insp-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
}

.mc-insp-title {
  min-width: 0;
  display: grid;
  gap: 2px;
}

.mc-insp-kicker {
  color: var(--mc-faint);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.mc-insp-title h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 720;
  line-height: 1.2;
  letter-spacing: -0.015em;
  word-break: break-word;
}

.mc-insp-title code {
  overflow: hidden;
  color: var(--mc-faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-insp-provider {
  display: flex;
}

.mc-insp-provider-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border: 1px solid var(--mc-line-soft);
  border-radius: 7px;
  background: transparent;
  color: color-mix(in srgb, var(--mc-text) 76%, transparent);
  font: inherit;
  font-size: 10.5px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}

.mc-insp-provider-btn:hover {
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), transparent);
}

.mc-insp-provider-state {
  margin-left: auto;
  color: var(--mc-faint);
  font-size: 9px;
  font-weight: 500;
}

.mc-insp-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--mc-line-soft);
  border-bottom: 1px solid var(--mc-line-soft);
}

.mc-insp-metrics &gt; div {
  min-width: 0;
  display: grid;
  gap: 2px;
  padding: 9px 0;
}

.mc-insp-metrics &gt; div + div {
  padding-left: var(--space-3);
  border-left: 1px solid var(--mc-line-soft);
}

.mc-insp-metrics b {
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.mc-insp-metrics small {
  color: var(--mc-faint);
  font-size: 9px;
}

.mc-cap-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.mc-cap {
  min-height: 46px;
  display: grid;
  place-items: center;
  gap: 3px;
  border: 1px solid var(--mc-line-soft);
  border-radius: 8px;
  color: color-mix(in srgb, var(--mc-text) 30%, transparent);
}

.mc-cap.is-on {
  border-color: color-mix(in srgb, var(--mc-text) 18%, transparent);
  background: color-mix(in srgb, var(--mc-text) 3.5%, transparent);
  color: color-mix(in srgb, var(--mc-text) 82%, transparent);
}

.mc-cap span {
  font-size: 9px;
}

.mc-spec {
  display: grid;
  gap: 0;
  margin: 0;
}

.mc-spec &gt; div {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: var(--space-2);
  align-items: baseline;
  padding: 5px 0;
  border-top: 1px solid var(--mc-line-soft);
}

.mc-spec &gt; div:first-child {
  border-top: 0;
}

.mc-spec dt {
  color: var(--mc-faint);
  font-size: 10px;
}

.mc-spec dd {
  margin: 0;
  color: color-mix(in srgb, var(--mc-text) 76%, transparent);
  font-size: 11px;
  line-height: 1.4;
  word-break: break-word;
}

.mc-spec dd.mc-mono {
  font-family: var(--font-mono);
  font-size: 9.5px;
}

.mc-insp-groups {
  display: grid;
  gap: 6px;
}

.mc-insp-label {
  color: var(--mc-faint);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .04em;
}

.mc-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.mc-chip-row .mc-chip {
  height: 23px;
  padding: 0 8px;
  font-size: 9.5px;
}

.mc-insp-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--mc-line-soft);
}

.mc-insp-actions .btn {
  height: 30px;
  min-height: 30px;
  font-size: 10.5px;
}

.mc-insp-actions .mc-danger {
  margin-left: auto;
}

.mc-danger {
  color: color-mix(in srgb, var(--red) 82%, var(--mc-text));
}

.mc-danger:hover {
  color: var(--red);
  border-color: color-mix(in srgb, var(--red) 34%, transparent);
  background: color-mix(in srgb, var(--red) 12%, transparent);
}

.mc-conn {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 8px 9px;
  border: 1px solid var(--mc-line-soft);
  border-radius: 8px;
}

.mc-conn &gt; div {
  min-width: 0;
  display: grid;
  gap: 1px;
}

.mc-conn b {
  font-size: 10.5px;
  font-weight: 650;
}

.mc-conn span {
  overflow: hidden;
  color: var(--mc-faint);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-conn .mc-text-btn {
  margin-left: auto;
  flex: 0 0 auto;
}

.mc-conn[data-state=&quot;ok&quot;] b,
.mc-conn[data-state=&quot;no_model_list&quot;] b {
  color: color-mix(in srgb, var(--green) 76%, var(--mc-text));
}

.mc-conn[data-state=&quot;unauthorized&quot;] b,
.mc-conn[data-state=&quot;unreachable&quot;] b,
.mc-conn[data-state=&quot;error&quot;] b,
.mc-conn[data-state=&quot;invalid&quot;] b {
  color: color-mix(in srgb, var(--red) 80%, var(--mc-text));
}

.mc-conn[data-state=&quot;missing_key&quot;] b,
.mc-conn[data-state=&quot;rate_limited&quot;] b {
  color: color-mix(in srgb, var(--orange) 80%, var(--mc-text));
}

/* ── 表单 ───────────────────────────────────────────────────────── */
.mc-form {
  display: grid;
  gap: 11px;
}

.mc-field {
  min-width: 0;
  display: grid;
  gap: 5px;
}

.mc-field &gt; span {
  display: flex;
  align-items: baseline;
  gap: 4px;
  color: var(--mc-muted);
  font-size: 10px;
  font-weight: 620;
  letter-spacing: .03em;
}

.mc-field &gt; span small {
  color: var(--mc-faint);
  font-size: 8.5px;
  letter-spacing: 0;
}

.mc-field input,
.mc-field textarea {
  width: 100%;
  min-width: 0;
  min-height: 33px;
  padding: 0 9px;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text, var(--mc-text)) 12%, transparent);
  border-radius: var(--radius-sm);
  outline: 0;
  background: color-mix(in srgb, var(--theme-composer-background, #171717) 70%, transparent);
  color: var(--theme-composer-text, var(--mc-text));
  font: inherit;
  font-size: 11.5px;
  caret-color: currentColor;
}

.mc-field textarea {
  min-height: 74px;
  padding: 8px 9px;
  line-height: 1.45;
  resize: vertical;
}

.mc-field input::placeholder,
.mc-field textarea::placeholder {
  color: color-mix(in srgb, var(--theme-composer-text, var(--mc-text)) 40%, transparent);
}

.mc-field input:focus,
.mc-field textarea:focus {
  outline: 0;
}

.mc-field input:disabled {
  opacity: .6;
}

.mc-input-row {
  display: flex;
  align-items: center;
  gap: 4px;
}

.mc-input-row .mc-icon {
  border-color: color-mix(in srgb, var(--mc-text) 10%, transparent);
}

.mc-field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.mc-field-grid--price {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.mc-field--switch {
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  align-self: end;
  min-height: 33px;
}

.mc-field--switch &gt; span {
  order: 1;
}

.mc-field--switch :deep(.sunday-switch) {
  order: 2;
}

.mc-cap-seg :deep(.sunday-segmented__item) {
  padding: 0 10px;
  font-size: 10.5px;
}

.mc-advanced {
  border-top: 1px solid var(--mc-line-soft);
  padding-top: 8px;
  display: grid;
  gap: 10px;
}

.mc-advanced summary {
  color: var(--mc-faint);
  font-size: 9.5px;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.mc-advanced summary::-webkit-details-marker {
  display: none;
}

.mc-advanced summary::before {
  content: &#x27;＋&#x27;;
  margin-right: 5px;
}

.mc-advanced[open] summary::before {
  content: &#x27;－&#x27;;
}

.mc-form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--mc-line-soft);
}

.mc-form-actions .btn {
  height: 30px;
  min-height: 30px;
  font-size: 10.5px;
}

.mc-form-actions .mc-text-btn {
  margin-right: auto;
}

.mc-error {
  margin: 0;
  padding: 5px 8px;
  border-left: 2px solid var(--red);
  background: color-mix(in srgb, var(--red) 10%, transparent);
  color: color-mix(in srgb, var(--red) 86%, var(--mc-text));
  font-size: 10px;
}

.mc-member-list {
  max-height: 46vh;
  display: grid;
  gap: 1px;
  overflow-y: auto;
  border: 1px solid var(--mc-line-soft);
  border-radius: 8px;
}

.mc-member {
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  background: var(--mc-cell);
  cursor: pointer;
}

.mc-member:hover {
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), var(--mc-cell));
}

.mc-member span {
  min-width: 0;
  display: grid;
  gap: 1px;
}

.mc-member b {
  overflow: hidden;
  font-size: 10.5px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-member small {
  overflow: hidden;
  color: var(--mc-faint);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-muted {
  color: var(--mc-faint);
  font-size: 10px;
  padding: 8px;
}

.mc-spin {
  animation: mc-spin 1s linear infinite;
}

@keyframes mc-spin {
  to { transform: rotate(360deg); }
}

@keyframes mc-bar-rise {
  from { transform: scaleY(.08); opacity: .35; }
  to { transform: scaleY(1); opacity: 1; }
}

/* ── 窄面板：检查器改为覆盖层 ───────────────────────────────────── */
.mc.mc--overlay {
  grid-template-columns: minmax(0, 1fr);
}

/* 覆盖层里 top / right / max-height 由内联几何量给值，其余结构由这条规则接管；
   选择器权重 0,2,0 已胜过基础 .mc-inspector，不需要 !important。 */
.mc--overlay .mc-inspector {
  grid-column: 1;
  grid-row: auto;
  position: fixed;
  bottom: auto;
  width: min(348px, calc(100vw - 36px));
  z-index: var(--z-modal, 700);
  box-shadow: var(--shadow-lg);
}

/* 外壳与&quot;添加模型&quot;占位都属于模型位，窄面板下都排两列。 */
.mc--narrow .mc-tile-wrap,
.mc--narrow .mc-tile--slot {
  flex: 1 1 calc(50% - 3px);
  max-width: none;
}

.mc--narrow .mc-search {
  flex: 1 1 100%;
}

.mc--narrow .mc-bar-tools {
  width: 100%;
  justify-content: flex-end;
}

.mc--narrow .mc-signal {
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-2) var(--space-3);
}

.mc--narrow .mc-spark {
  grid-column: 1 / -1;
  grid-row: 2;
  height: 34px;
}

.mc--narrow .mc-shelf-state {
  display: none;
}

.mc--narrow .mc-budget {
  padding-left: 0;
}

@media (prefers-reduced-motion: reduce) {
  .mc-spark-bar,

/* user:&quot;把红换成白，然后用这套组件做成可复用的 sunday 样式并投入使用，注意浅暗色模式与文字颜色，白底必须黑字，反之同理&quot; */
/*
  Sunday interaction controls — the reusable half of the control kit.
  Filled states always use the control pair (solid + text), so a label on a
  filled surface is always the inverse of that surface. Hover/active neutral
  states keep using the shared --alpha-* tokens.
*/

/* ---------- Switch ---------- */

.sunday-switch {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  --sunday-w: 40px;
  --sunday-h: 24px;
  --sunday-pad: 3px;
  --sunday-thumb: 16px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  cursor: pointer;
}

.sunday-switch--sm {
  --sunday-w: 34px;
  --sunday-h: 20px;
  --sunday-pad: 2px;
  --sunday-thumb: 14px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
}

.sunday-switch__input {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.sunday-switch__input:disabled {
  cursor: not-allowed;
}

.sunday-switch__track {
  position: relative;
  flex: none;
  width: var(--sunday-w);
  height: var(--sunday-h);
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) 18%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 6%, transparent);
  transition:
    background-color var(--dur-base) var(--ease-out),
    border-color var(--dur-base) var(--ease-out);
}

.sunday-switch__thumb {
  position: absolute;
  top: var(--sunday-pad);
  left: var(--sunday-pad);
  width: var(--sunday-thumb);
  height: var(--sunday-thumb);
  border-radius: calc(var(--radius-sm) / 2);
  background: color-mix(in srgb, var(--sunday-area-text) 46%, transparent);
  transition:
    transform var(--dur-slow) var(--ease-out),
    background-color var(--dur-base) var(--ease-out);
}

.sunday-switch:hover .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 32%, transparent);
}

.sunday-switch:hover .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 62%, transparent);
}

.sunday-switch__input:checked + .sunday-switch__track {
  border-color: var(--sunday-signal);
  background: var(--sunday-signal);
}

.sunday-switch__input:checked + .sunday-switch__track .sunday-switch__thumb {
  background: var(--sunday-signal-ink);
  transform: translateX(var(--sunday-travel));
}

.sunday-switch:hover .sunday-switch__input:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
  background: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
}

.sunday-switch__input:focus-visible + .sunday-switch__track {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-switch:has(.sunday-switch__input:disabled) {
  cursor: not-allowed;
}

.sunday-switch__input:disabled + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 10%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
}

.sunday-switch__input:disabled + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 44%, transparent);
  transform: translateX(var(--sunday-travel));
}

/* ---------- Segmented ---------- */

.sunday-segmented {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  position: relative;
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  padding: 2px;
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) var(--alpha-active), transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
  isolation: isolate;
}

.sunday-segmented__indicator {
  position: absolute;
  top: 2px;
  left: 0;
  z-index: 0;
  width: 0;
  height: calc(100% - 4px);
  border-radius: calc(var(--radius-sm) - 2px);
  background: var(--sunday-signal);
  opacity: 0;
  pointer-events: none;
}

.sunday-segmented[data-ready=&quot;true&quot;] .sunday-segmented__indicator {
  opacity: 1;
  transition:
    transform var(--dur-slow) var(--ease-emphasized),
    width var(--dur-slow) var(--ease-emphasized),
    opacity var(--dur-fast) linear;
}

.sunday-segmented__item {
  position: relative;
  z-index: 1;
  height: var(--interaction-height-sm);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: color-mix(in srgb, var(--sunday-area-text) 66%, transparent);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out);
}

.sunday-segmented__item:hover {
  color: var(--sunday-area-text);
}

.sunday-segmented__item[aria-checked=&quot;true&quot;] {
  color: var(--sunday-signal-ink);
}

.sunday-segmented__item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-segmented:not([data-ready=&quot;true&quot;]) .sunday-segmented__item[aria-checked=&quot;true&quot;] {
  background: var(--sunday-signal);
  color: var(--sunday-signal-ink);
}

/* ---------- Range ---------- */

.sunday-range {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  display: grid;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
}

.sunday-range--bare {
  display: block;
  flex: 1 1 auto;
  width: auto;
}

.sunday-range__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.sunday-range__label {
  color: color-mix(in srgb, var(--sunday-area-text) 72%, transparent);
  font-size: 12px;
  font-weight: 500;
}

.sunday-range__value {
  color: var(--sunday-area-text);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sunday-range__track {
  position: relative;
  height: 18px;
}

.sunday-range__track::before {
  content: &quot;&quot;;
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
  transform: translateY(-50%);
}

.sunday-range__fill {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--sunday-range-fill, 0%);
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: var(--sunday-signal);
  transform: translateY(-50%);
}

.sunday-range__input {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.sunday-range__input:focus {
  outline: none;
}

.sunday-range__input::-webkit-slider-runnable-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-webkit-slider-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  margin-top: 1px;
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--dur-base) var(--ease-out);
}

.sunday-range__input:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-range__input::-moz-range-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-moz-range-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
}

@supports (-moz-appearance: none) {
  .sunday-range__input:focus-visible {
    border-radius: var(--radius-sm);
    outline: 2px solid var(--blue);
    outline-offset: 4px;
  }
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__label,
.sunday-range:has(.sunday-range__input:disabled) .sunday-range__value {
  color: color-mix(in srgb, var(--sunday-area-text) 45%, transparent);
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__fill {
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
}

.sunday-range__input:disabled {
  cursor: not-allowed;
}

.sunday-range__input:disabled::-webkit-slider-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
  cursor: not-allowed;
}

.sunday-range__input:disabled::-moz-range-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
}

/* ---------- Progress ---------- */

.sunday-progress {
  position: relative;
  width: 100%;
  height: var(--interaction-progress-height);
  overflow: hidden;
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #f2efeb)) 14%, transparent);
}

.sunday-progress__fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  transition: width var(--dur-slow) var(--ease-out);
}

/* ---------- Press feedback for the existing shared buttons ---------- */

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm) {
  transition: transform var(--dur-fast) var(--ease-out);
}

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
  transform: translateY(1px);
}

@media (prefers-reduced-motion: reduce) {
  .sunday-switch__track,
  .sunday-switch__thumb,
  .sunday-segmented__indicator,
  .sunday-segmented__item,
  .sunday-range__input::-webkit-slider-thumb,
  .sunday-progress__fill {
    transition: none;
  }

  :where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
    transform: none;
  }
}

/* user:“合并去重”+(带文案的开关与纯开关共用同一条轨道；文案跟随所在行的颜色) */
.sunday-switch__label {
  margin-inline-start: var(--space-2);
  color: inherit;
  font-size: inherit;
  line-height: 1.3;
  white-space: nowrap;
}

/* user:“把功能相近或者实际相似的样式和组件，统一成一套，并且可复用”+
   (按钮收成一个基件：.btn 管几何与过渡，角色由 .btn--secondary/primary/quiet/ghost/danger 决定；
    原来 .btn--secondary 与 .btn--ghost 两套各写一遍的配方并入这里)。 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  border: 1px solid transparent;
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out),
    filter var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:disabled {
  opacity: .45;
  cursor: default;
}

.btn:not(:disabled):active {
  transform: translateY(1px);
}

.btn--secondary,
.btn--primary,
.btn--quiet {
  min-height: 32px;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13px;
}

.btn--secondary,
.btn--primary {
  background: var(--settings-control-background, var(--theme-control-background, #343331));
  color: var(--settings-control-text, var(--muted));
}

.btn--secondary:hover:not(:disabled),
.btn--primary:hover:not(:disabled) {
  color: var(--settings-control-text, var(--text));
  filter: brightness(1.08);
}

/* 文本式按钮：透明底，文字跟随所在面板，不能用控件文字色，
   否则「亮主区 + 暗控件」的主题下白字会压在浅色面板上。 */
.btn--quiet {
  background: transparent;
  color: var(--settings-main-text, var(--muted));
}

.btn--quiet:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, var(--text)) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
  filter: none;
}

.btn--ghost {
  min-height: 32px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.btn--ghost:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
}

.btn--ghost:active:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-active), transparent);
}

.btn--danger {
  color: color-mix(in srgb, var(--red) 80%, var(--settings-main-text, var(--text)) 20%);
}

.btn--danger:hover:not(:disabled) {
  color: color-mix(in srgb, var(--red) 58%, var(--settings-main-text, var(--theme-main-text, var(--text))));
}

/* user:“还有大文件拆分，以及你的分类是否覆盖了所有样式”+(由 core-settings.css 按区块拆出：模型与供应商资源管理；

/* user:&quot;把红换成白，然后用这套组件做成可复用的 sunday 样式并投入使用，注意浅暗色模式与文字颜色，白底必须黑字，反之同理&quot; */
/*
  Sunday interaction controls — the reusable half of the control kit.
  Filled states always use the control pair (solid + text), so a label on a
  filled surface is always the inverse of that surface. Hover/active neutral
  states keep using the shared --alpha-* tokens.
*/

/* ---------- Switch ---------- */

.sunday-switch {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  --sunday-w: 40px;
  --sunday-h: 24px;
  --sunday-pad: 3px;
  --sunday-thumb: 16px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  cursor: pointer;
}

.sunday-switch--sm {
  --sunday-w: 34px;
  --sunday-h: 20px;
  --sunday-pad: 2px;
  --sunday-thumb: 14px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
}

.sunday-switch__input {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.sunday-switch__input:disabled {
  cursor: not-allowed;
}

.sunday-switch__track {
  position: relative;
  flex: none;
  width: var(--sunday-w);
  height: var(--sunday-h);
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) 18%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 6%, transparent);
  transition:
    background-color var(--dur-base) var(--ease-out),
    border-color var(--dur-base) var(--ease-out);
}

.sunday-switch__thumb {
  position: absolute;
  top: var(--sunday-pad);
  left: var(--sunday-pad);
  width: var(--sunday-thumb);
  height: var(--sunday-thumb);
  border-radius: calc(var(--radius-sm) / 2);
  background: color-mix(in srgb, var(--sunday-area-text) 46%, transparent);
  transition:
    transform var(--dur-slow) var(--ease-out),
    background-color var(--dur-base) var(--ease-out);
}

.sunday-switch:hover .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 32%, transparent);
}

.sunday-switch:hover .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 62%, transparent);
}

.sunday-switch__input:checked + .sunday-switch__track {
  border-color: var(--sunday-signal);
  background: var(--sunday-signal);
}

.sunday-switch__input:checked + .sunday-switch__track .sunday-switch__thumb {
  background: var(--sunday-signal-ink);
  transform: translateX(var(--sunday-travel));
}

.sunday-switch:hover .sunday-switch__input:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
  background: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
}

.sunday-switch__input:focus-visible + .sunday-switch__track {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-switch:has(.sunday-switch__input:disabled) {
  cursor: not-allowed;
}

.sunday-switch__input:disabled + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 10%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
}

.sunday-switch__input:disabled + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 44%, transparent);
  transform: translateX(var(--sunday-travel));
}

/* ---------- Segmented ---------- */

.sunday-segmented {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  position: relative;
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  padding: 2px;
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) var(--alpha-active), transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
  isolation: isolate;
}

.sunday-segmented__indicator {
  position: absolute;
  top: 2px;
  left: 0;
  z-index: 0;
  width: 0;
  height: calc(100% - 4px);
  border-radius: calc(var(--radius-sm) - 2px);
  background: var(--sunday-signal);
  opacity: 0;
  pointer-events: none;
}

.sunday-segmented[data-ready=&quot;true&quot;] .sunday-segmented__indicator {
  opacity: 1;
  transition:
    transform var(--dur-slow) var(--ease-emphasized),
    width var(--dur-slow) var(--ease-emphasized),
    opacity var(--dur-fast) linear;
}

.sunday-segmented__item {
  position: relative;
  z-index: 1;
  height: var(--interaction-height-sm);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: color-mix(in srgb, var(--sunday-area-text) 66%, transparent);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out);
}

.sunday-segmented__item:hover {
  color: var(--sunday-area-text);
}

.sunday-segmented__item[aria-checked=&quot;true&quot;] {
  color: var(--sunday-signal-ink);
}

.sunday-segmented__item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-segmented:not([data-ready=&quot;true&quot;]) .sunday-segmented__item[aria-checked=&quot;true&quot;] {
  background: var(--sunday-signal);
  color: var(--sunday-signal-ink);
}

/* ---------- Range ---------- */

.sunday-range {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  display: grid;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
}

.sunday-range--bare {
  display: block;
  flex: 1 1 auto;
  width: auto;
}

.sunday-range__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.sunday-range__label {
  color: color-mix(in srgb, var(--sunday-area-text) 72%, transparent);
  font-size: 12px;
  font-weight: 500;
}

.sunday-range__value {
  color: var(--sunday-area-text);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sunday-range__track {
  position: relative;
  height: 18px;
}

.sunday-range__track::before {
  content: &quot;&quot;;
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
  transform: translateY(-50%);
}

.sunday-range__fill {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--sunday-range-fill, 0%);
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: var(--sunday-signal);
  transform: translateY(-50%);
}

.sunday-range__input {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.sunday-range__input:focus {
  outline: none;
}

.sunday-range__input::-webkit-slider-runnable-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-webkit-slider-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  margin-top: 1px;
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--dur-base) var(--ease-out);
}

.sunday-range__input:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-range__input::-moz-range-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-moz-range-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
}

@supports (-moz-appearance: none) {
  .sunday-range__input:focus-visible {
    border-radius: var(--radius-sm);
    outline: 2px solid var(--blue);
    outline-offset: 4px;
  }
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__label,
.sunday-range:has(.sunday-range__input:disabled) .sunday-range__value {
  color: color-mix(in srgb, var(--sunday-area-text) 45%, transparent);
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__fill {
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
}

.sunday-range__input:disabled {
  cursor: not-allowed;
}

.sunday-range__input:disabled::-webkit-slider-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
  cursor: not-allowed;
}

.sunday-range__input:disabled::-moz-range-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
}

/* ---------- Progress ---------- */

.sunday-progress {
  position: relative;
  width: 100%;
  height: var(--interaction-progress-height);
  overflow: hidden;
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #f2efeb)) 14%, transparent);
}

.sunday-progress__fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  transition: width var(--dur-slow) var(--ease-out);
}

/* ---------- Press feedback for the existing shared buttons ---------- */

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm) {
  transition: transform var(--dur-fast) var(--ease-out);
}

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
  transform: translateY(1px);
}

@media (prefers-reduced-motion: reduce) {
  .sunday-switch__track,
  .sunday-switch__thumb,
  .sunday-segmented__indicator,
  .sunday-segmented__item,
  .sunday-range__input::-webkit-slider-thumb,
  .sunday-progress__fill {
    transition: none;
  }

  :where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
    transform: none;
  }
}

/* user:“合并去重”+(带文案的开关与纯开关共用同一条轨道；文案跟随所在行的颜色) */
.sunday-switch__label {
  margin-inline-start: var(--space-2);
  color: inherit;
  font-size: inherit;
  line-height: 1.3;
  white-space: nowrap;
}

/* user:“把功能相近或者实际相似的样式和组件，统一成一套，并且可复用”+
   (按钮收成一个基件：.btn 管几何与过渡，角色由 .btn--secondary/primary/quiet/ghost/danger 决定；
    原来 .btn--secondary 与 .btn--ghost 两套各写一遍的配方并入这里)。 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  border: 1px solid transparent;
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out),
    filter var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:disabled {
  opacity: .45;
  cursor: default;
}

.btn:not(:disabled):active {
  transform: translateY(1px);
}

.btn--secondary,
.btn--primary,
.btn--quiet {
  min-height: 32px;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13px;
}

.btn--secondary,
.btn--primary {
  background: var(--settings-control-background, var(--theme-control-background, #343331));
  color: var(--settings-control-text, var(--muted));
}

.btn--secondary:hover:not(:disabled),
.btn--primary:hover:not(:disabled) {
  color: var(--settings-control-text, var(--text));
  filter: brightness(1.08);
}

/* 文本式按钮：透明底，文字跟随所在面板，不能用控件文字色，
   否则「亮主区 + 暗控件」的主题下白字会压在浅色面板上。 */
.btn--quiet {
  background: transparent;
  color: var(--settings-main-text, var(--muted));
}

.btn--quiet:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, var(--text)) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
  filter: none;
}

.btn--ghost {
  min-height: 32px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.btn--ghost:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
}

.btn--ghost:active:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-active), transparent);
}

.btn--danger {
  color: color-mix(in srgb, var(--red) 80%, var(--settings-main-text, var(--text)) 20%);
}

.btn--danger:hover:not(:disabled) {
  color: color-mix(in srgb, var(--red) 58%, var(--settings-main-text, var(--theme-main-text, var(--text))));
}
