:root {
  --theme-main-background: #1B1D22; --theme-main-text: #FBF7F0;
  --theme-main-solid: #f2efeb;
  --theme-main-border: rgba(251, 247, 240, .16);
  --theme-main-soft-background: rgba(255, 255, 255, .045);
  --theme-main-sunken-background: rgba(0, 0, 0, .32);
  --theme-backdrop-text: #f2efeb;
  --theme-composer-background: #22242A; --theme-composer-text: #FBF7F0;
  --theme-control-background: #FBF7F0; --theme-control-text: #2E3138;
  --theme-control-solid: #FBF7F0;
  --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;
  --alpha-hover: 8%; --alpha-active: 12%; --alpha-press: 18%;
}








.study-view { --text: var(--theme-main-text); color: var(--text); display: flex; flex-direction: column; height: 100%; min-height: 0; width: 100%; }
.study-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); }
.study-header {
  width: min(var(--content-width), 100%);
  min-height: 46px;
  margin: 0 auto var(--space-3);
  padding: 0 0 var(--space-3);
  border-bottom: 1px solid color-mix(in srgb, var(--theme-main-text) 8%, transparent);
  color: var(--theme-main-text);
}
.study-header-title {
  min-width: 0;
  flex: 1 1 auto;
  margin: 0;
  overflow: hidden;
  color: var(--theme-main-text);
  font-size: 17px;
  font-weight: 760;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.study-breadcrumbs { min-width: 0; flex: 1 1 auto; display: flex; align-items: center; gap: var(--space-1); overflow: hidden; }
.study-breadcrumbs .btn--ghost { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.study-header-loading {
  flex: 0 0 auto;
  color: color-mix(in srgb, var(--theme-main-text) 65%, transparent);
  font-size: 12px;
}
@media (min-width: 641px) {
  .study-header {
    height: calc(var(--space-6) * 2 + var(--space-4) - var(--space-1) - 1px);
    min-height: 0;
    margin-top: calc(-1 * var(--space-6) - var(--space-4) + var(--space-1));
    margin-bottom: 0;
    padding: 0;
  }
}
.study-view .btn--ghost, .selection-card .btn--ghost, .study-marks .btn--ghost { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border-radius: var(--radius-sm); }
.study-view .btn--ghost, .selection-card .btn--ghost { color: color-mix(in srgb, var(--theme-main-text) 65%, transparent); }
.study-view .btn--ghost:hover:not(:disabled), .selection-card .btn--ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-hover), transparent); color: var(--theme-main-text); }
.study-view .btn--ghost:active:not(:disabled), .selection-card .btn--ghost:active:not(:disabled) { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-active), transparent); }
.study-marks .btn--ghost { color: color-mix(in srgb, var(--theme-backdrop-text) 65%, transparent); }
.study-error { color: var(--red); padding: var(--space-2); overflow-wrap: anywhere; }
.study-graph { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.study-graph .vue-flow { flex: 1; background: var(--theme-main-background); }
.study-graph-meta { position: absolute; left: var(--space-3); top: var(--space-2); z-index: var(--z-background-info); display: flex; align-items: center; gap: var(--space-2); color: color-mix(in srgb, var(--theme-main-text) 65%, transparent); font-size: 11px; pointer-events: none; }
.study-graph-controls { display: flex; gap: var(--space-1); position: absolute; right: var(--space-3); top: var(--space-2); z-index: var(--z-background-info); }
.study-graph-legend { position: absolute; right: var(--space-3); bottom: var(--space-3); z-index: var(--z-stage); display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); max-width: min(440px, calc(100% - var(--space-6))); padding: var(--space-2) var(--space-3); border: 1px solid var(--theme-main-border); border-radius: var(--radius); background: var(--theme-main-background); color: var(--theme-main-text); box-shadow: var(--shadow-sm); font-size: 12px; }
.study-graph-legend strong { font-weight: 700; }
.study-graph-legend-item { display: inline-flex; align-items: center; gap: var(--space-1); color: color-mix(in srgb, var(--theme-main-text) 72%, transparent); }
.study-edge-swatch { display: inline-block; width: var(--space-4); border-top: 1px solid currentColor; }
.study-edge-swatch--advanced { border-top-style: dashed; }
.study-edge-swatch--contains { border-top-style: dotted; }
.study-edge-swatch--related { border-top-style: dashed; }
.study-node {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  max-width: min(240px, 28vw);
  padding: var(--space-1) var(--space-2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text) 82%, transparent);
  cursor: pointer;
  text-align: left;
}
.study-node:hover,
.study-node.is-focused,
.study-node.is-selected {
  border-color: color-mix(in srgb, var(--theme-main-text) 28%, transparent);
  background: color-mix(in srgb, var(--theme-main-text) var(--alpha-hover), transparent);
  color: var(--theme-main-text);
}
.study-node:focus-visible { outline: 2px solid color-mix(in srgb, var(--theme-main-text) 76%, transparent); outline-offset: var(--space-1); }
.study-node-label { min-width: 0; max-width: min(200px, 24vw); overflow-wrap: anywhere; }
.study-node--course {
  position: relative;
  display: grid;
  place-items: center;
  width: calc(var(--space-6) * 3);
  height: calc(var(--space-6) * 3);
  max-width: none;
  padding: 0;
  border-color: transparent;
  border-radius: 50%;
  background: transparent;
  color: var(--theme-main-text);
  text-align: center;
}
.study-node--course:hover,
.study-node--course.is-focused,
.study-node--course.is-selected { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-hover), transparent); }
.study-course-ring { position: absolute; inset: calc(-1 * var(--space-2)); width: calc(var(--space-6) * 3 + var(--space-4)); height: calc(var(--space-6) * 3 + var(--space-4)); overflow: visible; pointer-events: none; transform: rotate(-90deg); }
.study-course-ring-track,
.study-course-ring-value { fill: none; stroke-width: var(--space-1); }
.study-course-ring-track { stroke: color-mix(in srgb, var(--theme-main-text) 18%, transparent); }
.study-course-ring-value { stroke: var(--blue); stroke-linecap: round; }
.study-course-sphere { display: grid; place-items: center; width: calc(var(--space-6) * 3); height: calc(var(--space-6) * 3); padding: var(--space-2); border: 1px solid color-mix(in srgb, var(--theme-main-text) 28%, transparent); border-radius: 50%; background: color-mix(in srgb, var(--theme-main-text) 8%, transparent); box-shadow: var(--shadow-sm); }
.study-course-name { max-width: calc(100% - var(--space-2)); overflow-wrap: anywhere; font-weight: 760; line-height: 1.2; }
.study-course-percentage { color: color-mix(in srgb, var(--theme-main-text) 72%, transparent); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1; }
.study-node-dot {
  display: grid;
  flex: 0 0 var(--space-4);
  place-items: center;
  width: var(--space-4);
  height: var(--space-4);
  border: 1px solid color-mix(in srgb, var(--theme-main-text) 54%, transparent);
  border-radius: 50%;
  color: color-mix(in srgb, var(--theme-main-text) 68%, transparent);
}
.study-node--module .study-node-dot {
  flex-basis: var(--space-5);
  width: var(--space-5);
  height: var(--space-5);
  border-color: color-mix(in srgb, var(--theme-main-text) 80%, transparent);
  color: var(--theme-main-text);
}
.study-node--passed .study-node-dot { border-color: color-mix(in srgb, var(--green) 72%, var(--theme-main-text) 28%); }
.study-node--mastery-low .study-node-dot { color: color-mix(in srgb, var(--red) 78%, var(--theme-main-text) 22%); }
.study-node--mastery-medium .study-node-dot { color: color-mix(in srgb, var(--yellow) 78%, var(--theme-main-text) 22%); }
.study-node--mastery-high .study-node-dot { color: color-mix(in srgb, var(--green) 78%, var(--theme-main-text) 22%); }
.study-node--incomplete .study-node-dot { border-style: dashed; color: color-mix(in srgb, var(--theme-main-text) 46%, transparent); }
.study-graph .study-edge .vue-flow__edge-path { stroke: color-mix(in srgb, var(--theme-main-text) 38%, transparent); stroke-width: 1; }
.study-graph .study-edge--muted { opacity: .2; }
.study-graph .study-edge--emphasized { opacity: 1; }
.study-graph .study-edge--emphasized .vue-flow__edge-path { stroke: color-mix(in srgb, var(--theme-main-text) 82%, transparent); stroke-width: 1.5; }
.study-graph .study-edge--advanced .vue-flow__edge-path { stroke-dasharray: var(--space-3) var(--space-2); }
.study-graph .study-edge--contains .vue-flow__edge-path { stroke-dasharray: var(--space-1) var(--space-2); }
.study-graph .study-edge--related .vue-flow__edge-path { stroke-dasharray: var(--space-1) var(--space-2); stroke-linecap: round; }
.study-graph .vue-flow__handle { width: var(--space-1); height: var(--space-1); border: 0; border-radius: 50%; background: var(--theme-main-text); opacity: .32; }
.study-graph .vue-flow__edge-text { fill: var(--theme-main-text); font-size: 11px; }
.study-graph .vue-flow__edge-textbg { fill: var(--theme-main-soft-background); }
.mastery-low { color: var(--red); }
.mastery-medium { color: var(--yellow); }
.mastery-high { color: var(--green); }
.study-incomplete { color: color-mix(in srgb, var(--theme-main-text) 45%, transparent); }
.study-empty { position: absolute; top: 64px; left: var(--space-3); right: var(--space-3); }
.study-related { position: absolute; left: var(--space-2); bottom: var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); max-width: min(280px, 70%); max-height: 35%; overflow: auto; padding: var(--space-2); border-radius: var(--radius); background: var(--theme-main-background); box-shadow: var(--shadow-sm); font-size: 12px; }
.study-related .btn--ghost { justify-content: flex-start; text-align: left; }
.study-related span { opacity: .65; flex-shrink: 0; }

@media (prefers-reduced-motion: reduce) {
  .study-node,
  .study-node-dot,
  .study-edge,
  .study-edge .vue-flow__edge-path { transition: none; animation: none; }
}

@media (max-width: 640px) {
  .study-breadcrumbs { display: none; }
}

/* Three-layer Markdown notes workspace. Keep the tree and relation rail in
   their host areas; the document itself remains a quiet paper-like surface. */
.study-note-tree { --text: var(--theme-backdrop-text); display: flex; flex-direction: column; min-height: 0; gap: var(--space-2); padding: var(--space-2); color: var(--text); }
.study-note-tree-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-1) var(--space-2); }
.study-note-tree-title { color: var(--text); font-size: 12px; font-weight: 700; }
.study-note-tree .study-note-tree-back { width: 100%; min-height: calc(var(--space-5) + var(--space-4)); }
.study-sidebar-icon-button { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; min-height: 26px; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: color-mix(in srgb, var(--text) 58%, transparent); cursor: pointer; }
.study-sidebar-icon-button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.study-sidebar-icon-button:active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); }
.study-sidebar-icon-button:disabled { opacity: .45; }
.study-note-tree-list { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; margin: 0; padding: 0; list-style: none; }
.study-note-tree-list--nested { margin-inline-start: var(--space-3); }
.study-note-tree-row { display: flex; align-items: center; gap: var(--space-1); width: 100%; min-width: 0; min-height: 29px; padding: var(--space-1) var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; color: color-mix(in srgb, var(--text) 76%, transparent); cursor: pointer; text-align: left; }
.study-note-tree-row:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.study-note-tree-row:active, .study-note-tree-row.is-active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); }
.study-note-tree-row:focus-visible { outline: 2px solid color-mix(in srgb, var(--blue) 72%, transparent); outline-offset: 1px; }
.study-note-tree-toggle { display: inline-flex; flex: 0 0 13px; align-items: center; justify-content: center; color: color-mix(in srgb, var(--text) 54%, transparent); }
.study-note-tree-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.study-note-tree-status, .study-note-tree-error { margin: var(--space-2); color: color-mix(in srgb, var(--text) 58%, transparent); font-size: 12px; line-height: 1.5; }
.study-note-tree-error { color: var(--red); overflow-wrap: anywhere; }
.study-note-workspace-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: 36px; padding: var(--space-1) 0 var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--theme-main-text) 10%, transparent); }
.study-note-workspace-actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-1); min-width: 0; }
.study-note-workspace-actions .btn--ghost { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); color: color-mix(in srgb, var(--theme-main-text) 68%, transparent); }
.study-note-workspace-actions .btn--ghost:hover { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-hover), transparent); color: var(--theme-main-text); }
.study-note-workspace-actions .btn--ghost:active { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-active), transparent); }
.study-note-detail-state, .study-note-empty-state { display: grid; justify-items: center; gap: var(--space-2); padding: var(--space-5) var(--space-3); color: color-mix(in srgb, var(--theme-main-text) 60%, transparent); font-size: 13px; text-align: center; }
.study-note-empty-state p { margin: 0; }
.study-note-detail { min-height: 0; }
.study-note-detail-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0 var(--space-2); }
.study-note-detail-head h2 { min-width: 0; margin: 0; color: var(--theme-main-text); font-size: 18px; font-weight: 760; overflow-wrap: anywhere; }
.study-note-detail-head .btn--ghost { display: inline-flex; align-items: center; gap: var(--space-1); }
.study-note-path { margin: var(--space-1) 0 0; color: color-mix(in srgb, var(--theme-main-text) 48%, transparent); font: 11px var(--font-mono); overflow-wrap: anywhere; }
.study-note-document-layout { display: grid; grid-template-columns: minmax(136px, 180px) minmax(0, 1fr); align-items: start; gap: var(--space-4); }
.study-note-main { min-width: 0; }
.study-note-outline { position: sticky; top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; padding: var(--space-2) 0; border-right: 1px solid color-mix(in srgb, var(--theme-main-text) 10%, transparent); }
.study-note-outline h3, .study-note-locks h3, .study-note-references h3 { display: flex; align-items: center; gap: var(--space-1); margin: 0 0 var(--space-1); color: color-mix(in srgb, var(--theme-main-text) 56%, transparent); font-size: 11px; font-weight: 700; }
.study-note-outline-link { width: 100%; padding: var(--space-1) var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; color: color-mix(in srgb, var(--theme-main-text) 66%, transparent); cursor: pointer; font: inherit; font-size: 12px; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
.study-note-outline-link:hover { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-hover), transparent); color: var(--theme-main-text); }
.study-note-outline-link:active { background: color-mix(in srgb, var(--theme-main-text) var(--alpha-active), transparent); }
.study-note-reading { min-height: 260px; padding: var(--space-3) 0 var(--space-5); }
.study-note-reading .markdown-body { color: var(--theme-main-text); line-height: 1.78; }
.study-note-reading .markdown-body h1, .study-note-reading .markdown-body h2, .study-note-reading .markdown-body h3 { scroll-margin-top: var(--space-4); }
.study-note-editor-shell { min-width: 0; padding: var(--space-3) 0 var(--space-5); }
.study-note-full-editor { display: block; width: 100%; min-height: min(68vh, 720px); padding: var(--space-3); border: 1px solid color-mix(in srgb, var(--theme-main-text) 12%, transparent); border-radius: var(--radius); background: var(--theme-main-sunken-background); color: var(--theme-main-text); font: 14px/1.72 var(--font-mono); resize: vertical; outline: 0; white-space: pre-wrap; tab-size: 2; }
.study-note-full-editor:focus { border-color: color-mix(in srgb, var(--blue) 38%, var(--theme-main-border)); }
.study-note-detail-error { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-1); padding: var(--space-2) 0; color: var(--red); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.study-note-detail-error .btn--ghost { color: var(--orange); }
.study-note-locks { margin: var(--space-3) 0 0; padding: var(--space-2) 0; border-top: 1px solid color-mix(in srgb, var(--theme-main-text) 9%, transparent); }

.study-note-locks li { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; padding: var(--space-1) var(--space-2); border-left: 2px solid color-mix(in srgb, var(--orange) 60%, transparent); color: color-mix(in srgb, var(--theme-main-text) 68%, transparent); font-size: 12px; }
.study-note-lock-quote { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.study-note-references ol { display: flex; flex-direction: column; gap: var(--space-1); margin: 0; padding: 0; list-style: none; }
.study-note-references li { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-1); line-height: 1.45; }
.study-note-reference-index { color: color-mix(in srgb, var(--theme-main-text) 42%, transparent); font-variant-numeric: tabular-nums; }
.study-note-reference-title { color: color-mix(in srgb, var(--theme-main-text) 66%, transparent); }
.study-note-reference-type, .study-note-reference-locator { color: color-mix(in srgb, var(--theme-main-text) 42%, transparent); }
.study-note-relation-graph { --text: var(--theme-backdrop-text); display: flex; flex-direction: column; min-height: 0; padding: var(--space-2); color: var(--text); }
.study-note-relation-graph-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-1) var(--space-2) var(--space-2); color: var(--text); font-size: 12px; font-weight: 700; }

.study-note-graph-svg-edge line { stroke: color-mix(in srgb, var(--text) 30%, transparent); stroke-width: 1.2; stroke-dasharray: 3 3; }
.study-note-graph-svg-node { cursor: pointer; outline: 0; }
.study-note-graph-svg-node circle { fill: color-mix(in srgb, var(--text) 12%, transparent); stroke: color-mix(in srgb, var(--text) 52%, transparent); stroke-width: 1.2; }

/* ── 模型与供应商：工作台终稿 ── */
.settings-card {
  width: min(1180px, calc(100vw - (var(--space-6) * 2)));

/* 内容自适应高度：面板不随视口撑满，超出部分交给设置页滚动。
   原先的 height:100% 链会把工作区压成视口剩余高度，下沿把内容裁掉。 */
:deep(.settings-main--models .settings-content) {
  width: min(1180px, 100%);
}

.models-panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.models-title {
  flex: 0 0 auto;
  align-items: flex-start;
}

.models-workspace {
  flex: 0 0 auto;
  /* 内容再少也保持一个完整工作面；左栏因此不会被压到需要内部滚动。
     两栏都能收缩：就地渲染后设置栏只有主卡宽，任何固定下限都会在窄窗口
     把右栏顶出容器、被主卡的 overflow 裁掉。 */
  min-height: 420px;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(180px, 244px) minmax(0, 1fr);
  align-items: stretch;

  padding: var(--space-5) var(--space-4) var(--space-4);
  border: 0;
  border-right: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 8%, transparent);
  border-radius: 0;
  background: transparent;
  overflow: visible;
}

.provider-rail-head {
  min-height: 36px;
  padding: 0 0 var(--space-2);
}

.provider-picker {
  flex: 0 0 auto;

  align-content: start;
  gap: var(--space-1);

.provider-picker-item {

  gap: var(--space-2);
  padding: var(--space-2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--settings-main-text, var(--theme-main-text, #fff));

  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);

.provider-picker-item:hover {

.provider-picker-item.is-selected {

.provider-picker-mark {

.provider-picker-copy {

.provider-picker-copy strong {

.provider-rail-footer {

  gap: var(--space-3);
  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 9%, transparent);
}

.provider-create-btn {

}

.provider-create-btn:hover {
  border-color: color-mix(in srgb, var(--blue) 40%, transparent);
  background: color-mix(in srgb, var(--blue) 7%, transparent);

}

.provider-rail-links {

}

.provider-rail-links .btn--ghost {

}

.provider-detail {
  min-width: 0;
  height: auto;
  display: grid;
  align-content: start;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5) var(--space-5);
  overflow: visible;
}

.provider-detail-head {
  min-width: 0;

  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-4);
  padding: 0 0 var(--space-3);
  border-bottom: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 12%, transparent);
}

.provider-detail-context {
  margin-bottom: var(--space-1);
}

.provider-detail-identity h2 {
  font-size: 20px;
  font-weight: 720;
}

.provider-url {

}

.provider-head-actions .btn--ghost {
  min-height: 32px;

}

.provider-head-actions .btn--danger {
  color: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 58%, transparent);
}

  color: var(--red);
}

.model-section {
  min-width: 0;
  overflow: visible;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.model-section-head {
  min-width: 0;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);

.model-list {

.model-row {

  border-top: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 8%, transparent);

/* 就地渲染后设置页只剩主卡宽度（窗口 - 左栏 - 设置导航），两栏工作台在
   ~1180 以下就放不下 564px 的下限；低于它改为单栏，而不是被右边缘裁掉。 */
@container app-page (max-width: 1180px) {
  :deep(.settings-main--models .settings-content) {
    width: 100%;
  }

  .models-workspace {
    grid-template-columns: 1fr;
  }

  .provider-rail {
    padding: var(--space-5) 0;
    border-right: 0;
    border-bottom: 1px solid color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) 12%, transparent);

  .provider-rail-footer {
    margin-top: var(--space-4);

  .provider-rail-links {

    flex-wrap: wrap;
  }

  .provider-detail {

  }

  .model-capabilities {

    grid-row: 2;
  }

    grid-column: 2;
    grid-row: 1;
  }

    min-height: 0;

  .model-capabilities,
  .model-row .row-actions {

    grid-row: auto;

    justify-content: flex-start;
    padding-top: var(--space-2);

    align-items: flex-start;
    flex-wrap: wrap;
  }

  .models-empty-copy {
    flex-basis: calc(100% - 56px);
  }

  .models-empty-state--full .btn--secondary {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .model-row,
  .provider-picker-item,
  .provider-create-btn {
    transition: none;
  }
}

.model-row {
  min-height: 72px;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: var(--space-3);
  row-gap: var(--space-1);
  padding: var(--space-2) 0;
  position: relative;
  isolation: isolate;
  background: transparent;
  transition: none;
}

.model-row:hover {

.model-row::before {
  content: &#x27;&#x27;;
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #fff)) var(--alpha-hover), transparent);
  -webkit-mask-image:
    linear-gradient(to right, rgb(0 0 0 / 20%), #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgb(0 0 0 / 20%)),
    linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to right, rgb(0 0 0 / 20%), #000 var(--row-fade), #000 calc(100% - var(--row-fade)), rgb(0 0 0 / 20%)),
    linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
  mask-repeat: no-repeat;
  mask-composite: intersect;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-out);
}

.model-row:hover::before {
  opacity: 0.32;
}

.model-leading {
  grid-column: 1;
  grid-row: 1;
  position: relative;
  gap: var(--space-2);

  font-size: 11px;
}

.model-capability {
  min-height: 22px;
  padding-inline: var(--space-1);
  font-size: 10px;
}

.model-row .btn--ghost {
  min-height: 30px;
  padding-inline: var(--space-1);
  font-size: 11px;
}

.model-row .row-actions {
  flex-wrap: nowrap;
  white-space: nowrap;
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: end;
}

@container app-page (max-width: 980px) {
  .model-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .model-capabilities {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .model-row .row-actions {
    grid-column: 2;
    grid-row: 1;
  }
}

@container app-page (max-width: 799px) {
  .model-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .model-capabilities {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .model-row .row-actions {

@container app-page (max-width: 480px) {

  }

  .model-row {

  .model-capabilities,

@media (prefers-reduced-motion: reduce) {
