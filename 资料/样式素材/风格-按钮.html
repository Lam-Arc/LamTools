@media (max-width: 640px) {
  .workspace-runtime-overlay { display: none; }
  .workspace-shell { --composer-rest-bottom: var(--space-3); }
  /* Drawers become bottom-sheet-style slide-overs with a dimmed backdrop
     (restored from the dropped mobile block — audit 19). */
  .workspace-main {
    /* The surface starts at the physical top so the background continues behind the
       status bar; only its content gives way. The 1px card border becomes a white line
       on the left edge of a phone, so it goes too. */
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: auto;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding-top: calc(var(--space-5) + var(--native-safe-area-top, 0px));
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .workspace-shell--full-bleed .workspace-main {
    padding: 0;
  }
  .send {
    min-width: 44px;
    min-height: 44px;
  }
  .floating-composer {
    top: auto;
    right: var(--space-3);
    bottom: calc(var(--composer-bottom-offset, 0px) + var(--composer-rest-bottom, var(--space-3)));
    left: var(--space-3);
    width: auto;
    transform: none;
  }
  .floating-composer textarea { font-size: 14px; }
  .workspace-shell--workflow .floating-composer,
  .workspace-shell--workflow-interaction-active .floating-composer,
  .workspace-shell--workflow .floating-composer:focus-within,
  .workspace-shell--workflow .composer-root--workflow-has-value .floating-composer,
  .workspace-shell--workflow .composer-root--workflow-stop .floating-composer {
    width: auto;
    max-width: none;
  }
  .empty-session-hero {
    left: 50%;
    width: calc(100% - var(--space-4));
    transform: translateX(-50%);
  }
  /* A session whose composer sits at the bottom anchors the hero above it from
     the viewport edge. */
  .workspace-shell--composer-bottom .empty-session-hero {
    top: auto;
    bottom: calc(
      var(--composer-bottom-offset, 0px) +
      var(--composer-rest-bottom, var(--space-3)) +
      var(--composer-height, 120px) +
      var(--space-3)
    );
  }
  /* A blank session centres the composer through --empty-session-composer-top
     instead, so the hero keeps the shared anchor (its own bottom edge floating
     one step above the composer) — a viewport-relative bottom would drop the
     greeting behind the composer card. */
  .workspace-shell--empty-session .empty-session-hero {
    top: calc(var(--empty-session-composer-top, 50vh) - var(--space-3));
    bottom: auto;
    transform: translate(-50%, -100%);
  }
  .empty-session-logo { --sunday-logo-size: 104px !important; }
  .empty-session-title { font-size: clamp(18px, 5.4vw, 21px); }
  .workspace-shell--empty-session .floating-composer {
    --composer-rest-bottom: var(--space-3);
  }
  .settings-page {
    display: flex;
    flex-direction: column;
  }
  .settings-sidebar {
    flex: 0 0 auto;
    padding: 10px 12px 0;
  }
  .settings-brand { display: none; }
  .settings-sidebar-footer {
    order: -1;
    width: max-content;
    margin: 0 0 8px;
    padding: 0;
    border-top: 0;
  }
  .settings-sidebar .settings-entry {
    min-height: 40px;
    border-color: transparent;
    background: transparent;
  }
  .settings-nav {
    flex: 0 0 auto;
    display: flex;
    gap: 2px;
    padding: 0 0 8px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .settings-nav button {
    flex: 0 0 auto;
    grid-template-columns: 20px auto;
  }
  .settings-main {
    min-height: 0;
    margin: 0;
    padding: 24px 16px 40px;
    border-right: 0;
    border-bottom: 0;
    border-left: 0;
    border-radius: 18px 18px 0 0;
  }
  .provider-head,
  .model-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .provider-head { padding: 10px 0; }
  .model-row { padding-left: 12px; }
}
@media (max-width: 719px) {

/* =========================================================================
   Message Stream — ChatGPT/Codex-like thread rendering
   ========================================================================= */

.user-row {
  display: flex;
  justify-content: flex-end;
  padding: 2px 0 8px;
}
.user-stack {
  max-width: min(72%, 620px);
  display: grid;
  justify-items: end;
  gap: 6px;
}
.user-bubble {
  max-width: min(72%, 620px);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  border-radius: 20px;
  border-bottom-right-radius: 8px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  color: var(--theme-main-text, #f2efeb);
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--theme-main-text, #fff) 3.5%, transparent);
}
.user-stack .user-bubble {
  max-width: 100%;
}
/* 运行中插入的引导指令：沿用回复标签的元信息配方，标出它不是新的一轮对话 */
.user-guide-label {
  padding-right: 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
/* 引导住在过程区里：形状是用户气泡，位置随过程一起展开/收起 */
.process-guidance {
  display: grid;
  justify-items: end;
  padding: var(--space-1) 0 var(--space-2);
}
/* 待生效的引导（已发出、模型还没接手）：虚线边 + 呼吸，与落位后的实色气泡区分 */
.user-bubble--pending {
  border-style: dashed;
  border-color: color-mix(in srgb, var(--theme-main-text, #fff) 28%, transparent);
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  animation: guidance-pending-breath 1.6s ease-in-out infinite;
}

@keyframes guidance-pending-breath {
  0%, 100% { opacity: .6; }
  50% { opacity: .92; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--pending {
    animation: none;
    opacity: .78;
  }
}
.assistant-row {
  display: flex;
  justify-content: flex-start;
  padding: 2px 0 12px;
}
.assistant-message,
.assistant-reply-bubble {
  width: min(100%, 760px);
  padding: 0 2px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-message--live {
  animation: stream-enter .18s ease-out both;
}
.assistant-meta,
.reply-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex-wrap: wrap;
  min-height: 22px;
  margin-bottom: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
.assistant-label {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}
.assistant-timestamp {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  width: 5ch;
  min-width: 0;
  height: 1.4em;
  overflow: hidden;
  color: color-mix(in srgb, var(--theme-main-text) 38%, transparent);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
  transition: width .2s ease-out;
}
.assistant-timestamp__compact,
.assistant-timestamp__expanded {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  transition: opacity .16s ease-out, transform .2s ease-out;
}
.assistant-timestamp__compact {
  left: 0;
  width: 5ch;
  justify-content: center;
  opacity: 1;
}
.assistant-timestamp__expanded {
  left: 0;
  opacity: 0;
  pointer-events: none;
  transform: scaleX(.26);
  transform-origin: left center;
}
.assistant-timestamp:hover {
  width: 19ch;
}
.assistant-timestamp:hover .assistant-timestamp__compact {
  opacity: 0;
}
.assistant-timestamp:hover .assistant-timestamp__expanded {
  opacity: 1;
  transform: scaleX(1);
}
@media (prefers-reduced-motion: reduce) {
  .assistant-timestamp,
  .assistant-timestamp__compact,
  .assistant-timestamp__expanded {
    transition: none;
  }
}
.assistant-live-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 64%, transparent);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
  text-transform: none;
}
.initial-waiting-indicator {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  padding: 1px 0 4px;
}
.shallow-thinking-pending {
  display: inline-flex;
  align-items: baseline;
  min-width: 0;
  color: color-mix(in srgb, var(--green) 72%, var(--theme-main-text, #fff) 28%);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
}
.shallow-thinking-pending--process {
  margin-left: 22px;
}
.shallow-thinking-pending-row {
  padding: 1px 0 2px;
}
.reasoning-body--pending {
  margin-top: 0;
  margin-bottom: 4px;
  padding-bottom: 0;
}
.shallow-thinking-dots {
  display: inline-flex;
  width: 1.2em;
}
.shallow-thinking-dots span {
  animation: shallow-thinking-dot 1.2s ease-in-out infinite;
}
.shallow-thinking-dots span:nth-child(2) {
  animation-delay: .15s;
}
.shallow-thinking-dots span:nth-child(3) {
  animation-delay: .3s;
}

/* 消息文字区域最下方：输出中三个圆点逐个显现循环 */
.streaming-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}
.streaming-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--theme-main-text) 62%, transparent);
  animation: streaming-dot 1.5s ease-in-out infinite;
}
.streaming-dots span:nth-child(2) {
  animation-delay: .15s;
}
.streaming-dots span:nth-child(3) {
  animation-delay: .3s;
}
@keyframes streaming-dot {
  0% { opacity: 0; }
  12% { opacity: 1; }
  70% { opacity: 1; }
  85%, 100% { opacity: 0; }
}

.assistant-answer {
  margin-top: 10px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-answer:empty {
  display: none;
}
.part-text-content,
.assistant-answer {
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
@media (prefers-reduced-motion: reduce) {
  .shallow-thinking-dots span {
    animation: none;
    opacity: 1;
  }
  .streaming-dots span {
    animation: none;
    opacity: 1;
  }
}

/* Shared process stream; live/complete only add state decoration. */
.process-stream {
  width: 100%;
  display: grid;
  /* An explicit shrinkable column: with the implicit auto track, a tool card
     whose content is wide (a long single-line diff, a long command) forced its
     intrinsic minimum on the track and widened the whole message past the
     thread column, clipping the reply on phones. */
  grid-template-columns: minmax(0, 1fr);
  gap: 7px;
  margin: 7px 0 12px;
  /* user:“去除消息流左侧的竖线 层级关系不再用竖线表示 而是缩进，缩进 2px 即可”
     +(去掉过程区左边的竖线，层级改由缩进表达，一级只缩 2px)。 */
  padding: 10px 0 10px 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  counter-reset: reasoning-step;
}
/* Bounds of the process tree: every box may shrink below its content so the
   scroll containers inside a tool card (output/diff blocks) own the overflow
   instead of the message column. */
.process-stream,
.process-stream &gt; *,
.process-timeline,
.process-timeline &gt; *,
.process-group,
.process-group-body,
.process-group-body &gt; *,
.process-step {
  min-width: 0;
}
.process-stream--live {
  animation: stream-enter .16s ease-out both;
}
.process-stream--complete {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.process-timeline {
  display: grid;
  gap: 5px;
}
.process-step {
  display: grid;
  grid-template-columns: auto minmax(74px, max-content) minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  min-width: 0;
  padding: 1px 0;
  font-size: 12px;
  line-height: 1.45;
}
.process-step-marker {
  width: 7px;
  height: 7px;
  /* 水平不用 auto：在 flex 容器（如 .process-tool-row）里 auto 外边距会
     吞掉所有剩余空间，把红点推到行中间、文字挤到最右侧 */
  margin: 5px 0 0;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
}
.process-step-marker--error {
  background: var(--red, #e5484d);
}
.process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
  font-weight: 680;
  white-space: nowrap;
}
.process-step-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 43%, transparent);
}
.process-step--reasoning .process-step-detail {
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.thread .process-step--reasoning {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 2px 0;
  counter-increment: reasoning-step;
}
.thread .process-step--reasoning + .process-step--reasoning {
  margin-top: 3px;
}
.thread .reasoning-toggle {
  width: 100%;
  min-width: 0;
  min-height: 28px;
  display: grid;
  grid-template-columns: max-content minmax(0, max-content) auto;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 2px 6px 2px 0;
  cursor: pointer;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 74%, transparent);
  font: inherit;
  text-align: left;
  transition: color .14s ease;
}
.thread .process-step--reasoning .process-step-marker {
  display: none;
}
.thread .process-step--reasoning .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 66%, transparent);
  font-size: 12px;
  font-weight: 680;
}
.thread .reasoning-duration {
  min-width: 0;
  max-width: min(240px, 40vw);
  justify-self: start;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-style: normal;
}
.thread .reasoning-body {
  margin: 3px 0 8px 24px;
  max-height: 800px;
  overflow: auto;
  padding: 2px 0 6px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 13px;
  line-height: 1.65;
  font-style: normal;
  text-wrap: pretty;
  opacity: 1;
}
.thread .reasoning-body .process-step-detail {
  display: block;
  overflow: visible;
  color: inherit;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-line-clamp: unset;
}
.process-stream--live .process-step--compact {
  opacity: .62;
}
.process-stream--live .process-step--compact .process-step-detail {
  max-width: 360px;
}
.process-stream--live .process-step--current {
  padding: 4px 0;
}
.process-stream--live .process-step--current .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 82%, transparent);
}
.process-stream--live .process-step--current .process-step-detail {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
}

.process-summary {
  width: fit-content;
  max-width: 100%;
  min-height: 22px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 54%, transparent);
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.process-summary:hover {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
}
/* user:“把过程行那个图标从现在的浅紫色改成文字色与灰色混合” — 使用主题文字色与中性灰各半混合。 */
.process-summary-icon {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in srgb, color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray) 44%, transparent);
  flex: 0 0 auto;
}
.process-summary-icon.part-dot--running {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: part-pulse 1s ease-in-out infinite;
}
.process-summary-icon.part-dot--completed {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
}
.process-summary-icon.part-dot--error {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%);
}
.process-summary-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.process-summary-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 78%, transparent);
  font-weight: 620;
}
.process-summary-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.stream-spinner {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: stream-spin .9s linear infinite;
  flex: 0 0 auto;
}

/* Compatibility for older product-side class names */
.part-inline,
.part-inline--context,
.part-inline--reasoning,
.part-inline--tool,
.part-inline--error,
.part-inline--info {
  color: inherit;
}
/* part-dot 状态点 — 以 main area 文字为底，靠动画/混合区分 */
.part-dot--pending { background: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text, #fff) 30%); }
.part-dot--running {
  width: 9px; height: 9px;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  background: transparent;
  border-radius: 50%;
  animation: stream-spin .9s linear infinite;
}
.part-dot--completed { background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray); }
.part-dot--error { background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%); }

.global-stats-bar {
  margin: 12px auto 0;
  width: fit-content;
  max-width: 100%;
  padding: 5px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 7%, transparent);
}
.global-stats-text {
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 44%, transparent);
}

@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes stream-enter {
  from { opacity: .68; transform: translateY(2px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes part-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}

/* ── Motion: CSS 入场 keyframes（GSAP 离散动效之外的轻量入场统一收敛在此）── */
@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes popover-in {
  from { opacity: 0; transform: translateY(-3px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@keyframes panel-enter {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .workspace-drawer,
  .workspace-main,
  .floating-composer {
    transition-duration: .5s !important;
  }
  .conversation .status.waiting {
    animation: none;
  }
  .settings-panel {
    animation: none;
  }
  /* 折叠展开由 GSAP 驱动（motion/expandPanel.ts），reduced-motion 时直切无动画 */
}

/* Old message summary controls are intentionally hidden. */
.msg-summary,
.summary-label,
.summary-chevron,
.summary-stats,
.summary-stats-inline,
.summary-dot,
.summary-text,
.msg-collapse-control,
.collapse-btn {
  display: none;
}

/* =========================================================================
   Placeholder bubble — pending user message indicator
   ========================================================================= */

.user-bubble--placeholder {
  opacity: .55;
  animation: placeholder-pulse 1.2s ease-in-out infinite;
}

@keyframes placeholder-pulse {
  0%, 100% { opacity: .45; }
  50% { opacity: .75; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--placeholder {
    animation: none;
    opacity: .55;
  }
}

/* ── Floating editor popover（CoreSettings / CorePluginsEditor 共用）── */
.editor-overlay {
  position: absolute;
  inset: 0;
  z-index: var(--z-popover);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  padding: 24px;
}
.editor-popover {
  width: min(560px, 100%);
  max-height: calc(100% - 48px);
  overflow-y: auto;
  border-radius: var(--radius);
  background: var(--settings-card-background, var(--theme-main-background, #111111));
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
  box-shadow: var(--shadow-md);
  padding: 18px 20px;
  color: var(--settings-card-text, var(--settings-main-text, var(--text)));
  /* 弹层在 .settings-main 的 --muted 重映射作用域之外（layout.css），
     自行跟随主题：亮色分支注入 --settings-muted，暗色 fallback 与全局一致 */
  --muted: var(--settings-muted, #a7a29b);
}
.editor-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.editor-popover-head h3 {
  margin: 0;
  font-size: 15px;
}
.editor-popover-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.editor-popover-close:hover {
  background: color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
}

/* ── 启用开关图标按钮（ToggleRight/ToggleLeft，语义化开关）── */
.btn--ghost.is-on {
  color: var(--green);
}

.toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 6px;
  color: var(--muted);
}

.toggle-btn.is-on {
  color: var(--green);
}

/* ── 全局搜索跳转：消息定位高亮渐隐（SessionSearchDialog → locateMessage）──
   class 加在 MessageView 根元素（.message-view）上，动画 2.6s 渐隐 */
.rag-hit-highlight {
  animation: rag-hit-fade 2.6s ease-out;
  border-radius: var(--radius);
}

@keyframes rag-hit-fade {
  0% {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #4f8cff) 70%, transparent),
                0 0 18px color-mix(in srgb, var(--accent, #4f8cff) 40%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) 14%, transparent);
  }
  100% {
    box-shadow: 0 0 0 3px transparent, 0 0 0 transparent;
    background: transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rag-hit-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #4f8cff) 62%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) var(--alpha-hover), transparent);
  }

  .sub-agent-source-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 62%, transparent);
    background: color-mix(in srgb, var(--green) var(--alpha-hover), transparent);
  }
}

/* =========================================================================
   整版界面里的设置/插件（就地渲染，不再是悬浮卡片）
   ========================================================================= */
/* 顶部条已经给出标题与返回键，左栏不再重复。 */
.settings-page .settings-brand,
.settings-page .settings-sidebar-footer {
  display: none;
}

/* 网格子项默认 min-width:auto：长 URL / 长文本会把列撑破，被右边缘裁掉。
   设置面板里每一层都允许收缩，长文本自己换行。 */
.settings-main,
.settings-main * {
  min-width: 0;
}

.settings-main :where(code, a, .mono) {
  overflow-wrap: anywhere;
  white-space: normal;
}

/* =========================================================================
   窄的整版界面（设置 / 插件）：导航横排在上，内容整宽、工作台单栏
   ========================================================================= */
.settings-surface--narrow .settings-page {
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-3);
}

.settings-surface--narrow .settings-sidebar {
  width: 100%;
  padding-bottom: var(--space-2);
}

.settings-surface--narrow .settings-nav {
  display: flex;
  flex-direction: row;
  gap: var(--space-1);
  overflow-x: auto;
  padding-bottom: var(--space-1);
}

.settings-surface--narrow .settings-content {
  max-width: none;
}

/* user:“点击任意控件会出现蓝色判断区，隐藏掉”+(触屏默认的点击高亮，以及鼠标/手指点出来的
   焦点框；键盘操作仍然保留 :focus-visible 的可见焦点)。 */
html,
body {
  -webkit-tap-highlight-color: transparent;
}

:where(button, [role=&#x27;button&#x27;], a, summary, [tabindex]):focus:not(:focus-visible) {
  outline: none;
}

:where(button, [role=&#x27;button&#x27;], a, summary) {
  -webkit-tap-highlight-color: transparent;
}

html, body { margin: 0; height: 100%; }
body { display: flex; align-items: center; justify-content: center; background: #1B1D22;
  color: #FBF7F0; font-family: var(--font-sans, system-ui, sans-serif); padding: 10px; box-sizing: border-box; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;button class=&quot;btn-cancel&quot; type=&quot;button&quot;&gt;按钮&lt;/button&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  <figcaption>
    <code>btn-cancel</code>
    <span class="tone">无底 · 描边 · 圆角</span>
    <span class="same">同款 1 个：nx-button</span>
  </figcaption>
</figure><figure class="cell">
  <iframe sandbox="allow-same-origin" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot; /&gt;&lt;style&gt;

:root {
  --theme-main-background: #1B1D22; --theme-main-text: #FBF7F0;
  --theme-main-solid: #f2efeb;
  --theme-main-border: rgba(251, 247, 240, .16);
  --theme-main-soft-background: rgba(255, 255, 255, .045);
  --theme-main-sunken-background: rgba(0, 0, 0, .32);
  --theme-backdrop-text: #f2efeb;
  --theme-composer-background: #22242A; --theme-composer-text: #FBF7F0;
  --theme-control-background: #FBF7F0; --theme-control-text: #2E3138;
  --theme-control-solid: #FBF7F0;
  --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;
  --alpha-hover: 8%; --alpha-active: 12%; --alpha-press: 18%;
}

/* user:“专门对小屏或者说分屏状态做一下适配”+(资料、记忆、方案按当前页面宽度切换密度)。 */
/* The shared surface recipe for the two library-shaped full-area views
   (资料库 and 记忆): toolbar, filter tabs, card grid, list rows, reader,
   editor, dialogs and buttons. Every rule is rooted at `.library-surface`,
   so the recipe lives in one place and cannot leak onto the rest of the app.
   Both views render that class on their root element. The `.plan-*` names are
   the shared card/list recipe and are used verbatim by 记忆 too. */

/* user:“合并去重，不仅是要把已知的重复去掉”+(同一份 .library-surface 规则原先连续写了两遍，
   删除重复的一份；保留的这份是资料库与记忆共用的唯一入口配方)。 */
.library-surface {
  display: flex;
  flex-direction: column;
  padding-top: var(--space-4);
  --text: var(--theme-main-text);
}

/* 资料库顶部的三大项切换：和筛选页签同一套配方（同一处方两处用），
   只加一条分界线，把「最外层分区」和分区内部的页签分开。 */
.library-surface .library-sections {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-bottom: var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
}
.library-surface .library-sections button {
  padding: 4px var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 65%, transparent);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .library-sections button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-sections button.active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); font-weight: 600; }
/* ── 资料区的资料库版式（对标 ChatGPT 资料库）：大标题 + 右侧整条工具 ── */
.library-surface .materials-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}
.library-surface .materials-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  flex: 0 0 auto;
}
.library-surface .materials-tools {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1 1 420px;
  min-width: 0;
  justify-content: flex-end;
}
.library-surface .materials-search { flex: 1 1 240px; max-width: 360px; }
.library-surface .materials-new { flex: 0 0 auto; }
/* 一句占用实话：安静一行，不是警报。 */
.library-surface .materials-usage {
  margin: 0 0 var(--space-4);
  font-size: 12px;
  color: color-mix(in srgb, var(--text) 52%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .materials-crumb { margin-bottom: var(--space-3); }

/* 卡片墙：多列瀑布流，图片按自身比例决定高度，读起来像一面墙而不是表格。
   一行放 4~5 张：列宽下限 190px，最多 5 列。 */
.library-surface .materials-grid {
  columns: 190px 5;
  column-gap: var(--space-2);
  padding-bottom: var(--space-4);
}
.library-surface .material-card {
  position: relative;
  display: block;
  break-inside: avoid;
  margin: 0 0 var(--space-2);
  padding: var(--space-2);
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--text) 10%, transparent));
  border-radius: var(--radius);
  background: var(--theme-main-background, color-mix(in srgb, var(--text) 4%, transparent));
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .material-card:hover {
  border-color: color-mix(in srgb, var(--text) 24%, transparent);
  box-shadow: var(--shadow-sm);
}
.library-surface .material-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.library-surface .material-card--selected { border-color: color-mix(in srgb, var(--blue) 60%, transparent); }

/* user:“支持鼠标拖动、触屏滑动连续选中多个条目”+(卡片与行在触屏上竖向仍可滚动，
   横向滑动留给拖选；拖动期间全局禁掉文字选择与长按菜单，免得拖出一手蓝底。) */
.library-surface .material-card,
.library-surface .library-row { touch-action: pan-y; -webkit-touch-callout: none; }
body.library-drag-selecting { user-select: none; -webkit-user-select: none; }
body.library-drag-selecting .library-surface .material-card,
body.library-drag-selecting .library-surface .library-row { cursor: crosshair; }

/* 内容区：有缩略图就看图；没有就自绘一张封面——文档类是一页纸（下缘一条类型
   色带写着扩展名），音视频与图片类是一枚圆底图标。类型色由下面的 data-kind
   映射给出，普通文件保持中性，不再一律是清一色的灰图标。 */
.library-surface .material-thumb {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  overflow: hidden;
  border-radius: calc(var(--radius) - 2px);
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--text) 6%, transparent));
  color: color-mix(in srgb, var(--text) 52%, transparent);
  --cover-accent: color-mix(in srgb, var(--text) 58%, transparent);
}
.library-surface .material-thumb img { display: block; width: 100%; height: auto; }
.library-surface .material-status { position: absolute; top: var(--space-1); right: var(--space-1); }

/* 类型色：语义色固定、不随主题走；没列到的类型（普通文件）保持中性。 */
.library-surface .material-thumb[data-kind=&#x27;pdf&#x27;] { --cover-accent: var(--red); }
.library-surface .material-thumb[data-kind=&#x27;presentation&#x27;] { --cover-accent: var(--orange); }
.library-surface .material-thumb[data-kind=&#x27;spreadsheet&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;document&#x27;] { --cover-accent: var(--blue); }
.library-surface .material-thumb[data-kind=&#x27;code&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;image&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;video&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;audio&#x27;] { --cover-accent: var(--orange); }

.library-surface .material-thumb--cover { min-height: 92px; }
.library-surface .material-cover-icon { color: var(--cover-accent); }
.library-surface .material-cover-ext {
  color: var(--cover-accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
/* 音视频与图片：圆底图标居中，扩展名当小徽标缀在下面。 */
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] { flex-direction: column; gap: var(--space-1); }
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-icon {
  box-sizing: content-box;
  padding: var(--space-2);
  border-radius: 50%;
  background: color-mix(in srgb, var(--cover-accent) 14%, transparent);
}
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-ext {
  padding: 0 var(--space-1);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--cover-accent) 16%, transparent);
}
/* 文档类：图标落在纸上，纸的下缘整条类型色带就是这本书的封面题签。 */
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] { padding-bottom: 22px; }
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] .material-cover-ext {
  position: absolute;
  inset: auto 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  background: color-mix(in srgb, var(--cover-accent) 20%, transparent);
}
/* 视频封面上的播放标记：和状态签同一配方的小圆片，压在缩略图左下角。 */
.library-surface .material-thumb-play {
  position: absolute;
  left: var(--space-1);
  bottom: var(--space-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text) var(--alpha-active), transparent);
  color: color-mix(in srgb, var(--text) 82%, transparent);
}

/* 悬停出现的勾选圈：多选批量操作入口，选中后常驻。 */
.library-surface .material-check {
  position: absolute;
  top: var(--space-1);

.library-surface .library-head-copy { min-width: 0; }
.library-surface h1 { margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: 0; }
.library-surface .library-title { font-size: 17px; }
.library-surface .library-subtitle { margin: 0; font-size: 12px; color: color-mix(in srgb, var(--text) 62%, transparent); }
.library-surface .library-crumb { display: flex; align-items: center; gap: 2px; margin: 4px 0 0; font-size: 13px; color: color-mix(in srgb, var(--text) 62%, transparent); min-width: 0; overflow: hidden; }

/* 面包屑每一段都可点回去；最后一段是当前位置，不是链接。 */

.library-surface .tab-empty { padding: var(--space-3) 0; }
/* ── 工具栏 ── */

.library-surface .library-search {

/* 视图切换贴住行的右端：搜索在左、切换在右，中间的空档由搜索框自己长。 */

/* ── 筛选页签 ── */

/* ── 方案网格 ── */
.library-surface .plan-grid {

}
.library-surface .plan-card {

  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--text) 10%, transparent));
  border-radius: var(--radius);
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--text) 4%, transparent));

  transition:
  box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .plan-card:hover {

.library-surface .plan-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.library-surface .plan-card-summary {

  overflow: hidden;
}
.library-surface .plan-card-glyph {

  right: var(--space-2);

}
.library-surface .plan-card-title {
  margin: 0;
  font-size: 13.5px;

.library-surface .plan-card-time { margin-left: auto; font-size: 11px; color: color-mix(in srgb, var(--text) 45%, transparent); flex: 0 0 auto; }
.library-surface .plan-card-star { color: var(--orange); flex: 0 0 auto; }

.library-surface .card-menu-btn {

}
.library-surface .plan-card:hover .card-menu-btn, .library-surface .material-card:hover .card-menu-btn, .library-surface .library-row:hover .card-menu-btn, .library-surface .folder-card:hover .card-menu-btn, .library-surface .card-menu-btn:focus-visible { opacity: 1; }
.library-surface .card-menu-btn:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .card-menu-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* ── 方案列表（行） ── */
.library-surface .library-items {

  flex-direction: column;
  gap: 2px;
}
.library-surface .library-row {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: var(--space-2) var(--space-4) var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}
.library-surface .library-row:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); }
.library-surface .library-row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.library-surface .library-row .card-menu-btn { top: 50%; margin-top: -13px; }
.library-surface .library-item-top { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; padding-right: var(--space-5); }
.library-surface .library-item-title { flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library-surface .library-item-bottom { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; padding-right: var(--space-5); }
.library-surface .library-item-summary { flex: 1 1 auto; min-width: 0; color: color-mix(in srgb, var(--text) 62%, transparent); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library-surface .library-item-time { flex: 0 0 auto; color: color-mix(in srgb, var(--text) 45%, transparent); font-size: 11px; font-variant-numeric: tabular-nums; }
/* 状态签：色点（执行中转圈）在前、文字在后，颜色之外再看得出状态。 */

  padding: 1px 7px 1px 6px;

  line-height: 16px;

}
.library-surface .library-status::before {

  border-radius: 50%;

}
.library-surface .library-status[data-plan-status=&#x27;ready&#x27;] { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.library-surface .library-status[data-plan-status=&#x27;executing&#x27;] { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.library-surface .library-status[data-plan-status=&#x27;done&#x27;] { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }

.library-surface .folder-card-name { grid-area: name; font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  margin: 0;
  font-size: 19px;

  letter-spacing: -0.01em;

  text-overflow: ellipsis;

/* ── 文档编辑器：阅读与编辑是同一份文档的两种状态 ──
   源文用正文的字体、字号、行高与宽度（不是等宽代码块），预览用与阅读页相同的
   `.library-document` 排版，所以进出编辑不会&quot;换一个界面&quot;。 */
.library-surface .doc-editor {

  height: 28px;
  padding: 0;
  border: 0;

  color: color-mix(in srgb, var(--text) 65%, transparent);

.library-surface .doc-editor-tool:hover:not(:disabled) { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .doc-editor-tool:disabled { opacity: 0.45; cursor: default; }
.library-surface .doc-editor-toolbar-spacer { flex: 1 1 auto; }
.library-surface .doc-editor-preview-toggle {

  gap: var(--space-1);
  padding: 0 var(--space-2);
  font-size: 11.5px;
}
.library-surface .doc-editor-preview-toggle.active {
  background: color-mix(in srgb, var(--text) var(--alpha-active), transparent);
  color: var(--text);
}
.library-surface .doc-editor-hint {
  flex: 0 0 auto;
  font-size: 11.5px;
  color: color-mix(in srgb, var(--text) 45%, transparent);
}
.library-surface .doc-editor-panes {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-4);
  flex: 1 1 auto;
  min-height: 0;
}
.library-surface .doc-editor-source {
  box-sizing: border-box;
  width: 100%;
  min-height: 320px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  caret-color: var(--theme-composer-text);
  font: inherit;
  font-size: 14px;
  line-height: 1.75;
  resize: none;
  tab-size: 2;
}
/* 输入框不做聚焦态：光标闪动即聚焦指示。 */
.library-surface .doc-editor-source:focus { outline: 0; }
.library-surface .doc-editor-preview {
  min-width: 0;
  overflow-y: auto;
}
.library-surface .doc-editor-preview &gt; .library-document { max-width: none; }
.library-surface .library-document h1, .library-surface .library-document h2, .library-surface .library-document h3 {

.library-surface .library-document &gt; :first-child { margin-top: 0; }
.library-surface .library-document p { margin: 0 0 var(--space-3); }
.library-surface .library-document ul, .library-surface .library-document ol { margin: 0 0 var(--space-3); padding-left: 1.25em; }
.library-surface .library-document li { margin-bottom: 4px; }
.library-surface .library-document li &gt; ul, .library-surface .library-document li &gt; ol { margin-top: 4px; }
.library-surface .library-document code {
  font-family: var(--font-mono);
  font-size: 12.5px;

}
.library-surface .library-document pre {
  margin: 0 0 var(--space-3);

}
.library-surface .library-document pre code { padding: 0; background: none; }
.library-surface .library-document blockquote {
  margin: 0 0 var(--space-3);

.library-surface .library-document hr {

  border: 0;
  border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
}
.library-surface .library-document table { width: 100%; border-collapse: collapse; margin: 0 0 var(--space-3); font-size: 13px; }
.library-surface .library-document th, .library-surface .library-document td { padding: 6px var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent); text-align: left; }
/* ── 按钮：一种配方，两种语气 ── */
.library-surface .library-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px var(--space-3);
  min-height: 28px;
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 78%, transparent);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .library-button:hover:not(:disabled) {

  color: var(--text);

.library-surface .library-button--primary {

}
.library-surface .icon-button {

  min-height: 28px;
  padding: 0;

.library-surface .library-link {

}
/* ── 对话框：与全应用的确认框同一套（描边、底带、遮罩、入场） ── */
.library-surface .dialog-dimmer {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--theme-backdrop-text) 20%, transparent);
}
.library-surface .dialog-card {
  width: min(400px, 100%);

  border: 1px solid var(--theme-main-border);
  border-radius: var(--radius);
  background: var(--theme-main-background);
  color: var(--text);
  box-shadow: var(--shadow-lg);
}
.library-surface .dialog-body {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
}
.library-surface .dialog-title { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
.library-surface .dialog-text { margin: 0; font-size: 13px; line-height: 1.6; color: color-mix(in srgb, var(--text) 68%, transparent); }
.library-surface .dialog-field { display: flex; flex-direction: column; gap: var(--space-1); }
.library-surface .dialog-field span { font-size: 12.5px; color: color-mix(in srgb, var(--text) 68%, transparent); }
.library-surface .dialog-field input {
  box-sizing: border-box;
  width: 100%;
  padding: 7px var(--space-2);
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  font: inherit;
  font-size: 13.5px;
}
.library-surface .dialog-field input:focus { outline: 0; }
.library-surface .dialog-error { margin: 0; color: var(--red); font-size: 12.5px; }
/* 动作落在一条底带上：与对话框正文分开，和确认框同一条分界线。 */
.library-surface .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--theme-main-border);
  background: var(--theme-main-soft-background);
}
.library-surface .dialog-actions .library-button {
  min-width: 72px;
  min-height: 34px;
  justify-content: center;
  font-size: 13px;
  font-weight: 650;
}
.library-surface .library-dialog-enter-active, .library-surface .library-dialog-leave-active { transition: opacity 160ms ease-out; }
.library-surface .library-dialog-enter-active .dialog-card, .library-surface .library-dialog-leave-active .dialog-card { transition: transform 160ms ease-out, opacity 160ms ease-out; }
.library-surface .library-dialog-enter-from, .library-surface .library-dialog-leave-to, .library-surface .library-dialog-enter-from .dialog-card, .library-surface .library-dialog-leave-to .dialog-card { opacity: 0; }
.library-surface .library-dialog-enter-from .dialog-card, .library-surface .library-dialog-leave-to .dialog-card { transform: translateY(8px) scale(.98); }
.library-surface button:disabled { cursor: default; opacity: .5; }
/* 桌面：标题与返回键由顶部条承担，手机头整块收起。 */

}

@media (prefers-reduced-motion: reduce) {

  transition: none;
  }

  .library-surface .library-dialog-enter-active, .library-surface .library-dialog-leave-active, .library-surface .library-dialog-enter-active .dialog-card, .library-surface .library-dialog-leave-active .dialog-card { transition-duration: 0ms; }

  --theme-backdrop-text: #f2efeb;
  --theme-composer-background: #22242A; --theme-composer-text: #FBF7F0;
  --theme-control-background: #FBF7F0; --theme-control-text: #2E3138;
  --theme-control-solid: #FBF7F0;
  --text: #FBF7F0; --blue: #6aa9ff; --red: #e0605a; --green: #4bc07a; --orange: #e2a04a;
  --alpha-hover: 8%; --alpha-active: 12%; --alpha-press: 18%;
}

/* user:“专门对小屏或者说分屏状态做一下适配”+(资料、记忆、方案按当前页面宽度切换密度)。 */
/* The shared surface recipe for the two library-shaped full-area views
   (资料库 and 记忆): toolbar, filter tabs, card grid, list rows, reader,
   editor, dialogs and buttons. Every rule is rooted at `.library-surface`,
   so the recipe lives in one place and cannot leak onto the rest of the app.
   Both views render that class on their root element. The `.plan-*` names are
   the shared card/list recipe and are used verbatim by 记忆 too. */

/* user:“合并去重，不仅是要把已知的重复去掉”+(同一份 .library-surface 规则原先连续写了两遍，
   删除重复的一份；保留的这份是资料库与记忆共用的唯一入口配方)。 */
.library-surface {
  display: flex;
  flex-direction: column;
  padding-top: var(--space-4);
  --text: var(--theme-main-text);
}

/* 资料库顶部的三大项切换：和筛选页签同一套配方（同一处方两处用），
   只加一条分界线，把「最外层分区」和分区内部的页签分开。 */
.library-surface .library-sections {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-bottom: var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
}
.library-surface .library-sections button {
  padding: 4px var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 65%, transparent);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .library-sections button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-sections button.active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); font-weight: 600; }
/* ── 资料区的资料库版式（对标 ChatGPT 资料库）：大标题 + 右侧整条工具 ── */
.library-surface .materials-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}
.library-surface .materials-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  flex: 0 0 auto;
}
.library-surface .materials-tools {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1 1 420px;
  min-width: 0;
  justify-content: flex-end;
}
.library-surface .materials-search { flex: 1 1 240px; max-width: 360px; }
.library-surface .materials-new { flex: 0 0 auto; }
/* 一句占用实话：安静一行，不是警报。 */
.library-surface .materials-usage {
  margin: 0 0 var(--space-4);
  font-size: 12px;
  color: color-mix(in srgb, var(--text) 52%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .materials-crumb { margin-bottom: var(--space-3); }

/* 卡片墙：多列瀑布流，图片按自身比例决定高度，读起来像一面墙而不是表格。
   一行放 4~5 张：列宽下限 190px，最多 5 列。 */
.library-surface .materials-grid {
  columns: 190px 5;
  column-gap: var(--space-2);
  padding-bottom: var(--space-4);
}
.library-surface .material-card {
  position: relative;
  display: block;
  break-inside: avoid;
  margin: 0 0 var(--space-2);
  padding: var(--space-2);
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--text) 10%, transparent));
  border-radius: var(--radius);
  background: var(--theme-main-background, color-mix(in srgb, var(--text) 4%, transparent));
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .material-card:hover {
  border-color: color-mix(in srgb, var(--text) 24%, transparent);
  box-shadow: var(--shadow-sm);
}
.library-surface .material-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.library-surface .material-card--selected { border-color: color-mix(in srgb, var(--blue) 60%, transparent); }

/* user:“支持鼠标拖动、触屏滑动连续选中多个条目”+(卡片与行在触屏上竖向仍可滚动，
   横向滑动留给拖选；拖动期间全局禁掉文字选择与长按菜单，免得拖出一手蓝底。) */
.library-surface .material-card,
.library-surface .library-row { touch-action: pan-y; -webkit-touch-callout: none; }
body.library-drag-selecting { user-select: none; -webkit-user-select: none; }
body.library-drag-selecting .library-surface .material-card,
body.library-drag-selecting .library-surface .library-row { cursor: crosshair; }

/* 内容区：有缩略图就看图；没有就自绘一张封面——文档类是一页纸（下缘一条类型
   色带写着扩展名），音视频与图片类是一枚圆底图标。类型色由下面的 data-kind
   映射给出，普通文件保持中性，不再一律是清一色的灰图标。 */
.library-surface .material-thumb {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  overflow: hidden;
  border-radius: calc(var(--radius) - 2px);
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--text) 6%, transparent));
  color: color-mix(in srgb, var(--text) 52%, transparent);
  --cover-accent: color-mix(in srgb, var(--text) 58%, transparent);
}
.library-surface .material-thumb img { display: block; width: 100%; height: auto; }
.library-surface .material-status { position: absolute; top: var(--space-1); right: var(--space-1); }

/* 类型色：语义色固定、不随主题走；没列到的类型（普通文件）保持中性。 */
.library-surface .material-thumb[data-kind=&#x27;pdf&#x27;] { --cover-accent: var(--red); }
.library-surface .material-thumb[data-kind=&#x27;presentation&#x27;] { --cover-accent: var(--orange); }
.library-surface .material-thumb[data-kind=&#x27;spreadsheet&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;document&#x27;] { --cover-accent: var(--blue); }
.library-surface .material-thumb[data-kind=&#x27;code&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;image&#x27;] { --cover-accent: var(--green); }
.library-surface .material-thumb[data-kind=&#x27;video&#x27;] { --cover-accent: var(--purple); }
.library-surface .material-thumb[data-kind=&#x27;audio&#x27;] { --cover-accent: var(--orange); }

.library-surface .material-thumb--cover { min-height: 92px; }
.library-surface .material-cover-icon { color: var(--cover-accent); }
.library-surface .material-cover-ext {
  color: var(--cover-accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
/* 音视频与图片：圆底图标居中，扩展名当小徽标缀在下面。 */
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] { flex-direction: column; gap: var(--space-1); }
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-icon {
  box-sizing: content-box;
  padding: var(--space-2);
  border-radius: 50%;
  background: color-mix(in srgb, var(--cover-accent) 14%, transparent);
}
.library-surface .material-thumb[data-cover=&#x27;media&#x27;] .material-cover-ext {
  padding: 0 var(--space-1);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--cover-accent) 16%, transparent);
}
/* 文档类：图标落在纸上，纸的下缘整条类型色带就是这本书的封面题签。 */
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] { padding-bottom: 22px; }
.library-surface .material-thumb[data-cover=&#x27;page&#x27;] .material-cover-ext {
  position: absolute;
  inset: auto 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  background: color-mix(in srgb, var(--cover-accent) 20%, transparent);
}
/* 视频封面上的播放标记：和状态签同一配方的小圆片，压在缩略图左下角。 */
.library-surface .material-thumb-play {
  position: absolute;
  left: var(--space-1);
  bottom: var(--space-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text) var(--alpha-active), transparent);
  color: color-mix(in srgb, var(--text) 82%, transparent);
}

/* 悬停出现的勾选圈：多选批量操作入口，选中后常驻。 */
.library-surface .material-check {
  position: absolute;
  top: var(--space-1);
  left: var(--space-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--text) 24%, transparent);
  border-radius: 50%;
  background: var(--theme-main-background, transparent);
  color: var(--theme-control-text, currentColor);
  opacity: 0;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.library-surface .material-card:hover .material-check,
.library-surface .material-check:focus-visible,
.library-surface .material-card--selected .material-check { opacity: 1; }
.library-surface .material-check[aria-pressed=&#x27;true&#x27;] {
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  border-color: transparent;
}

.library-surface .material-name {
  margin: var(--space-2) 0 2px;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.45;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-surface .material-meta {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
  font-size: 11.5px;
  color: color-mix(in srgb, var(--text) 45%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .material-star {
  display: inline-flex;
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange);
  cursor: pointer;
}

/* 成果的状态与方案的状态不是一套值，各认各的属性。 */
.library-surface .library-status[data-artifact-status=&#x27;missing&#x27;] { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.library-surface .library-status[data-artifact-status=&#x27;failed&#x27;] { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.library-surface .library-status[data-artifact-status=&#x27;running&#x27;] { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.library-surface .library-status[data-artifact-status=&#x27;completed&#x27;] { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }

/* 选中若干件后的批量动作条：落在底部，不遮挡内容。 */
.library-surface .materials-selection {
  position: sticky;
  bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: fit-content;
  margin: var(--space-2) auto 0;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--theme-main-border);
  border-radius: 999px;
  background: var(--theme-main-background);
  box-shadow: var(--shadow-md);
  font-size: 12.5px;
}

@container app-page (max-width: 640px) {
  .library-surface .materials-title { font-size: 19px; }
  .library-surface .materials-tools { flex-basis: auto; }
  .library-surface .materials-search { max-width: none; }
}

/* 手机没有顶部条，标题与返回键留在版面里；桌面由顶部条承担。 */
.library-surface .library-mobile-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.library-surface .library-back {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 68%, transparent);
  cursor: pointer;
}
.library-surface .library-back:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-head-copy { min-width: 0; }
.library-surface h1 { margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: 0; }
.library-surface .library-title { font-size: 17px; }
.library-surface .library-subtitle { margin: 0; font-size: 12px; color: color-mix(in srgb, var(--text) 62%, transparent); }
.library-surface .library-crumb { display: flex; align-items: center; gap: 2px; margin: 4px 0 0; font-size: 13px; color: color-mix(in srgb, var(--text) 62%, transparent); min-width: 0; overflow: hidden; }
.library-surface .crumb-sep { margin: 0 2px; color: color-mix(in srgb, var(--text) 40%, transparent); }
/* 面包屑每一段都可点回去；最后一段是当前位置，不是链接。 */
.library-surface .crumb-link {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.library-surface .crumb-link:hover { color: var(--text); text-decoration: underline; }
.library-surface .crumb-link--current { font-weight: 600; color: color-mix(in srgb, var(--text) 88%, transparent); cursor: default; }
.library-surface .crumb-link--current:hover { color: color-mix(in srgb, var(--text) 88%, transparent); text-decoration: none; }
.library-surface .full-area-note { margin: 0; font-size: 13px; line-height: 1.7; color: color-mix(in srgb, var(--text) 62%, transparent); }
.library-surface .full-area-note--error { color: var(--red); }
.library-surface .tab-empty { padding: var(--space-3) 0; }
/* ── 工具栏 ── */
.library-surface .library-toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.library-surface .library-search {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1 1 260px;
  min-width: 0;
  max-width: 460px;
  padding: 0 var(--space-3);
  min-height: 32px;
  border: 1px solid color-mix(in srgb, var(--theme-composer-text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background) 70%, transparent);
  color: var(--theme-composer-text);
}
.library-surface .library-search svg { flex: 0 0 auto; color: color-mix(in srgb, var(--theme-composer-text) 55%, transparent); }
.library-surface .library-search input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--theme-composer-text);
  caret-color: var(--theme-composer-text);
  font: inherit;
  font-size: 13px;
}
.library-surface .library-search input:focus { outline: 0; }
.library-surface .library-search input::placeholder { color: color-mix(in srgb, var(--theme-composer-text) 45%, transparent); }
/* 视图切换贴住行的右端：搜索在左、切换在右，中间的空档由搜索框自己长。 */
.library-surface .library-view-toggle {
  display: inline-flex;
  align-items: stretch;
  gap: 2px;
  flex: 0 0 auto;
  margin-left: auto;
  height: 32px;
  padding: 2px;
  border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  border-radius: var(--radius-sm);
}
.library-surface .library-view-toggle button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: color-mix(in srgb, var(--text) 55%, transparent);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .library-view-toggle button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-view-toggle button.active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); }
/* ── 筛选页签 ── */
.library-surface .filter-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-4); }
.library-surface .filter-tabs button {
  padding: 4px var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 65%, transparent);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.library-surface .filter-tabs button:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .filter-tabs button.active { background: color-mix(in srgb, var(--text) var(--alpha-active), transparent); color: var(--text); font-weight: 600; }
/* ── 方案网格 ── */
.library-surface .plan-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: var(--space-2);
  padding-bottom: var(--space-4);
}
.library-surface .plan-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--theme-main-border, color-mix(in srgb, var(--text) 10%, transparent));
  border-radius: var(--radius);
  background: var(--theme-main-soft-background, color-mix(in srgb, var(--text) 4%, transparent));
  cursor: pointer;
  transition:
  box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .plan-card:hover {
  background: color-mix(in srgb, var(--text) 7%, transparent);
  border-color: color-mix(in srgb, var(--text) 24%, transparent);
  box-shadow: var(--shadow-sm);
}
.library-surface .plan-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
/* 卡片上半是一块「文档头」：一直铺到卡片边缘，和正文之间形成一段实色分层。 */
.library-surface .plan-card-preview {
  position: relative;
  display: flex;
  align-items: flex-start;
  min-height: 76px;
  margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0;
  padding: var(--space-2) var(--space-3);
  border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
  background: var(--theme-main-sunken-background, color-mix(in srgb, var(--text) 6%, transparent));
  overflow: hidden;
}
.library-surface .plan-card-summary {
  margin: 0;
  font-size: 12px;
  line-height: 1.6;
  color: color-mix(in srgb, var(--text) 58%, transparent);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.library-surface .plan-card-glyph {
  position: absolute;
  right: var(--space-2);
  bottom: 6px;
  color: color-mix(in srgb, var(--text) 14%, transparent);
}
.library-surface .plan-card-title {
  margin: 0;
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.45;
  color: var(--text);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
/* 同一行的卡片等高：状态与日期钉在卡底，横向扫过去是一条线。 */
.library-surface .plan-card-foot {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: auto;
  padding-top: var(--space-1);
  min-width: 0;
}
.library-surface .plan-card-time { margin-left: auto; font-size: 11px; color: color-mix(in srgb, var(--text) 45%, transparent); flex: 0 0 auto; }
.library-surface .plan-card-star { color: var(--orange); flex: 0 0 auto; }
/* 悬停出现的卡片菜单键 */
.library-surface .card-menu-btn {
  position: absolute;
  top: var(--space-2);
  right: var(--space-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  border-radius: var(--radius-sm);
  background: var(--theme-main-background, color-mix(in srgb, var(--text) 10%, transparent));
  color: color-mix(in srgb, var(--text) 65%, transparent);
  opacity: 0;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}

.mc {
  --mc-text: var(--settings-main-text, var(--theme-main-text, #fff));
  --mc-line: color-mix(in srgb, var(--mc-text) 11%, transparent);
  --mc-line-soft: color-mix(in srgb, var(--mc-text) 7%, transparent);

  --mc-signal: var(--settings-control-solid, var(--theme-control-solid, #fbf7f0));
  --mc-signal-text: var(--settings-control-text, var(--theme-control-text, #111));
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto auto minmax(0, 1fr);
  align-content: start;
  min-width: 0;
  min-height: clamp(560px, calc(100dvh - 128px), 980px);
  padding: 12px 20px 24px;
  color: var(--mc-text);
}

.mc &gt; * {
  grid-column: 1;
  min-width: 0;
}

.mc-bar { grid-row: 1; }
.mc-chips { grid-row: 2; }
.mc-signal { grid-row: 3; }
.mc-notice { grid-row: 4; }
.mc-wall { grid-row: 5; }

.mc--inspector {
  grid-template-columns: minmax(0, 1fr) 348px;
  column-gap: var(--space-4);
}

.mc--inspector &gt; .mc-bar,
.mc--inspector &gt; .mc-chips,
.mc--inspector &gt; .mc-signal,
.mc--inspector &gt; .mc-notice {
  grid-column: 1;
}

/* ── 命令条 ─────────────────────────────────────────────────────── */
.mc-bar {
  position: relative;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  padding-bottom: var(--space-2);
}

.mc-search {
  flex: 1 1 260px;
  max-width: 360px;
  min-width: 148px;
  height: 32px;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-2) 0 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--theme-composer-background, #171717) 70%, transparent);
  color: var(--theme-composer-text, var(--mc-text));
}

.mc-search &gt; svg {
  flex: 0 0 auto;
  color: color-mix(in srgb, var(--theme-composer-text, var(--mc-text)) 45%, transparent);
}

.mc-search input {

  outline: 0;

  color: inherit;

}

.mc-search input::placeholder {

}

.mc-search-total {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: color-mix(in srgb, var(--theme-composer-text, var(--mc-text)) 46%, transparent);
}

.mc-bar &gt; :deep(.model-catalog-view-toggle) {

}

.mc-bar-tools {
  margin-left: auto;

  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;

}

.mc-bar-tools &gt; :deep(.model-catalog-view-toggle) {

}

.mc-icon {

}

.mc-icon:hover {

  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), transparent);

}

.mc-icon.is-on {

}

.mc-icon:disabled {

}

.mc-icon--xs {

  height: 24px;
  border-color: transparent;
}

.mc-icon-count {

  top: -5px;
  right: -5px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: var(--mc-signal);
  color: var(--mc-signal-text);
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
}

.mc-add-provider {
  height: 32px;
  min-height: 32px;
  padding: 0 var(--space-3);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
}

.mc-filter-pop {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: var(--z-popover, 600);

  padding: var(--space-3);
  border: 1px solid var(--mc-line);

}

.mc-field--inline {
  grid-template-columns: 48px minmax(0, 1fr);

}

.mc-field--inline &gt; span {

}

.mc-text-btn {
  justify-self: start;
  padding: 0;
  border: 0;

  color: var(--mc-muted);
  font: inherit;
  font-size: 10.5px;
  font-weight: 600;

  text-decoration-color: color-mix(in srgb, var(--mc-text) 22%, transparent);
  text-underline-offset: 3px;
}

.mc-text-btn:hover {

}

.mc-text-btn--start {
  display: inline-flex;
  align-items: center;
  gap: 3px;

}

/* ── 供应商筛选轨 ───────────────────────────────────────────────── */
.mc-chips {

  padding: 2px 0 var(--space-3);
}

.mc-chip {
  flex: 0 0 auto;
  height: 26px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: color-mix(in srgb, var(--mc-text) 4%, transparent);
  color: color-mix(in srgb, var(--mc-text) 62%, transparent);
  font: inherit;
  font-size: 10.5px;
  font-weight: 620;
  cursor: pointer;
  transition: background var(--dur-fast, .14s) var(--ease-out, ease), border-color var(--dur-fast, .14s) var(--ease-out, ease), color var(--dur-fast, .14s) var(--ease-out, ease);
}

.mc-chip:hover {
  background: color-mix(in srgb, var(--mc-text) var(--alpha-hover, 8%), transparent);
  color: var(--mc-text);
}

.mc-chip.is-on {
  border-color: color-mix(in srgb, var(--mc-text) 20%, transparent);

}

.mc-chip i {

  font-size: 9px;
  color: var(--mc-faint);
}

}

.mc-chip-name {

  white-space: nowrap;
}

  border-radius: 50%;
  background: color-mix(in srgb, var(--mc-text) 32%, transparent);

}

.mc-led[data-state=&quot;ok&quot;] {
  background: var(--green);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 16%, transparent);
}

.mc-led[data-state=&quot;no_model_list&quot;] {

.mc-led[data-state=&quot;rate_limited&quot;] {

.mc-led[data-state=&quot;unauthorized&quot;],
.mc-led[data-state=&quot;unreachable&quot;],
.mc-led[data-state=&quot;error&quot;],

}

.mc-led[data-state=&quot;group&quot;] {
  background: color-mix(in srgb, var(--mc-text) 24%, transparent);
}

.mc-led[data-state=&quot;unknown&quot;] {
  background: color-mix(in srgb, var(--mc-text) 30%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc-text) 6%, transparent);
}

.mc-signal {

}

.mc-metric b {

}

.mc-metric small {
  font-size: 9px;
  letter-spacing: .06em;
  color: var(--mc-faint);
}

.mc-signal-flag {
  align-self: center;
  padding: 2px 6px;
  border: 1px solid var(--mc-line-soft);
  border-radius: 999px;
  color: var(--mc-faint);
  font-size: 9px;
  white-space: nowrap;
}

.mc-spark {
  position: relative;
  height: 44px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  min-width: 0;
}

.mc-spark-slot {
  position: relative;
  flex: 1 1 0;
  height: 100%;
  display: flex;
  align-items: flex-end;
  min-width: 0;
}

.mc-spark-bar {
  width: 100%;
  height: var(--bar, 2%);

  border-radius: 1px 1px 0 0;
  background: color-mix(in srgb, var(--mc-signal) 46%, transparent);

  transition: background var(--dur-fast, .14s) var(--ease-out, ease);
}

.mc-spark-slot:nth-child(3n) .mc-spark-bar {
  animation-delay: .04s;
}

.mc-spark-slot:nth-child(3n + 1) .mc-spark-bar {
  animation-delay: .02s;
}

.mc-spark-bar.is-empty {

}

.mc-spark-bar.is-hover {

.mc-spark-tip {

  padding: 3px 6px;
  border: 1px solid var(--mc-line);
  border-radius: 5px;
  background: var(--mc-cell);
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  pointer-events: none;
}

.mc-spark-tip b {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
}

.mc-spark-tip i {

  font-size: 8.5px;

}

.mc-range-seg {

  --radius-sm: 999px;
  flex: 0 0 auto;
}

.mc-range-seg :deep(.sunday-segmented__item) {

}

/* ── 提示 ───────────────────────────────────────────────────────── */
.mc-notice {

  color: var(--mc-muted);
}

/* ── 模型墙 ─────────────────────────────────────────────────────── */
.mc-wall {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding-top: var(--space-3);
}

.mc-shelf {
  padding: var(--space-2) 0 var(--space-3);
  border-top: 1px solid var(--mc-line-soft);
}

.mc-shelf:first-child {
  border-top: 0;
  padding-top: 0;
}

.mc-shelf-head {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 34px;
  padding-bottom: var(--space-2);
}

.mc-shelf-mark {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;

.mc-shelf-name {

/* 标题只放名称；地址与连接状态同行，状态作为副标题的一部分，

  min-width: 0;
  display: block;
}

.mc-shelf-title b {
  display: block;
  min-width: 0;
}

.mc-shelf-sub {

.mc-shelf-sub em {
  min-width: 0;
}

.mc-shelf-state {

  white-space: nowrap;
}

.mc-shelf-state[data-state=&quot;ok&quot;],
.mc-shelf-state[data-state=&quot;no_model_list&quot;] {
  color: color-mix(in srgb, var(--green) 72%, var(--mc-text));
}

.mc-shelf-state[data-state=&quot;missing_key&quot;],
.mc-shelf-state[data-state=&quot;rate_limited&quot;] {
  color: color-mix(in srgb, var(--orange) 78%, var(--mc-text));
}

.mc-shelf-state[data-state=&quot;unauthorized&quot;],
.mc-shelf-state[data-state=&quot;unreachable&quot;],
.mc-shelf-state[data-state=&quot;error&quot;],
.mc-shelf-state[data-state=&quot;invalid&quot;] {
  color: color-mix(in srgb, var(--red) 78%, var(--mc-text));
}

.mc-shelf-metrics {
  margin-left: auto;
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  white-space: nowrap;
}

.mc-shelf-metrics b {
  color: color-mix(in srgb, var(--mc-text) 72%, transparent);
  font-weight: 600;
}

.mc-shelf-metrics i {
  color: var(--mc-faint);
  font-style: normal;
}

.mc-shelf-actions {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 1px;

  pointer-events: none;
  transition: opacity var(--dur-fast, .14s) var(--ease-out, ease);

}

.mc-shelf:hover .mc-shelf-actions,
.mc-shelf:focus-within .mc-shelf-actions {
