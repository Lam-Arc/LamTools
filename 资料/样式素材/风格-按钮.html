    gap: 6px;
    padding-inline: 6px;
    font-size: 13px;
  }
  .settings-main { padding: 28px 24px 48px; }
}
@media (max-width: 820px) {
  /* user:“小尺寸时（独屏）标题换到“sunday”那里，不占地”+(会话标题已进标题栏，
     窄窗口不再单独占一行。) */
  .thread-header[data-session-header] { display: none; }
  .floating-composer { width: var(--composer-full-width); }
  .route-purpose-row,
  .command-policy-row {
    grid-template-columns: 1fr;
  }
  .binary-segment {
    width: 100%;
  }
}
@media (max-width: 640px) {
  .workspace-runtime-overlay { display: none; }
  .workspace-shell { --composer-rest-bottom: var(--space-3); }
  /* Drawers become bottom-sheet-style slide-overs with a dimmed backdrop
     (restored from the dropped mobile block — audit 19). */
  .workspace-main {
    /* The surface starts at the physical top so the background continues behind the
       status bar; only its content gives way. The 1px card border becomes a white line
       on the left edge of a phone, so it goes too. */
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: auto;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding-top: calc(var(--space-5) + var(--native-safe-area-top, 0px));
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .workspace-shell--full-bleed .workspace-main {
    padding: 0;
  }
  .send {
    min-width: 44px;
    min-height: 44px;
  }
  .floating-composer {
    top: auto;
    right: var(--space-3);
    bottom: calc(var(--composer-bottom-offset, 0px) + var(--composer-rest-bottom, var(--space-3)));
    left: var(--space-3);
    width: auto;
    transform: none;
  }
  .floating-composer textarea { font-size: 14px; }
  .workspace-shell--workflow .floating-composer,
  .workspace-shell--workflow-interaction-active .floating-composer,
  .workspace-shell--workflow .floating-composer:focus-within,
  .workspace-shell--workflow .composer-root--workflow-has-value .floating-composer,
  .workspace-shell--workflow .composer-root--workflow-stop .floating-composer {
    width: auto;
    max-width: none;
  }
  .empty-session-hero {
    left: 50%;
    width: calc(100% - var(--space-4));
    transform: translateX(-50%);
  }
  /* A session whose composer sits at the bottom anchors the hero above it from
     the viewport edge. */
  .workspace-shell--composer-bottom .empty-session-hero {
    top: auto;
    bottom: calc(
      var(--composer-bottom-offset, 0px) +
      var(--composer-rest-bottom, var(--space-3)) +
      var(--composer-height, 120px) +
      var(--space-3)
    );
  }
  /* A blank session centres the composer through --empty-session-composer-top
     instead, so the hero keeps the shared anchor (its own bottom edge floating
     one step above the composer) — a viewport-relative bottom would drop the
     greeting behind the composer card. */
  .workspace-shell--empty-session .empty-session-hero {
    top: calc(var(--empty-session-composer-top, 50vh) - var(--space-3));
    bottom: auto;
    transform: translate(-50%, -100%);
  }
  .empty-session-logo { --sunday-logo-size: 104px !important; }
  .empty-session-title { font-size: clamp(18px, 5.4vw, 21px); }
  .workspace-shell--empty-session .floating-composer {
    --composer-rest-bottom: var(--space-3);
  }
  .settings-page {
    display: flex;
    flex-direction: column;
  }
  .settings-sidebar {
    flex: 0 0 auto;
    padding: 10px 12px 0;
  }
  .settings-brand { display: none; }
  .settings-sidebar-footer {
    order: -1;
    width: max-content;
    margin: 0 0 8px;
    padding: 0;
    border-top: 0;
  }
  .settings-sidebar .settings-entry {
    min-height: 40px;
    border-color: transparent;
    background: transparent;
  }
  .settings-nav {
    flex: 0 0 auto;
    display: flex;
    gap: 2px;
    padding: 0 0 8px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .settings-nav button {
    flex: 0 0 auto;
    grid-template-columns: 20px auto;
  }
  .settings-main {
    min-height: 0;
    margin: 0;
    padding: 24px 16px 40px;
    border-right: 0;
    border-bottom: 0;
    border-left: 0;
    border-radius: 18px 18px 0 0;
  }
  .provider-head,
  .model-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .provider-head { padding: 10px 0; }
  .model-row { padding-left: 12px; }
}
@media (max-width: 719px) {
  .settings-page {
    display: flex;
    flex-direction: column;
  }
  .settings-sidebar {
    flex: 0 0 auto;
    padding: 10px 12px 0;
  }
  .settings-brand { display: none; }
  .settings-sidebar-footer {
    order: -1;
    width: max-content;
    margin: 0 0 8px;
    padding: 0;
    border-top: 0;
  }
  .settings-sidebar .settings-entry {
    min-height: 40px;
    border-color: transparent;
    background: transparent;
  }
  .settings-nav {
    flex: 0 0 auto;
    display: flex;

  }
  .settings-nav button {

  }
  .settings-main {
    /* The sheet is a single column on phones: the main pane has to take the
       rest of the page, otherwise the card stops mid-screen and leaves a bare

    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    padding: 24px 16px 40px;
    border-right: 0;
    border-bottom: 0;

@media (max-width: 480px) {
  .floating-composer { border-radius: var(--radius-lg); }

/* =========================================================================
   Message Stream — ChatGPT/Codex-like thread rendering
   ========================================================================= */

.user-row {
  display: flex;
  justify-content: flex-end;
  padding: 2px 0 8px;
}
.user-stack {
  max-width: min(72%, 620px);
  display: grid;
  justify-items: end;
  gap: 6px;
}
.user-bubble {
  max-width: min(72%, 620px);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  border-radius: 20px;
  border-bottom-right-radius: 8px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 9%, transparent);
  color: var(--theme-main-text, #f2efeb);
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--theme-main-text, #fff) 3.5%, transparent);
}
.user-stack .user-bubble {
  max-width: 100%;
}
/* 运行中插入的引导指令：沿用回复标签的元信息配方，标出它不是新的一轮对话 */
.user-guide-label {
  padding-right: 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
/* 引导住在过程区里：形状是用户气泡，位置随过程一起展开/收起 */
.process-guidance {
  display: grid;
  justify-items: end;
  padding: var(--space-1) 0 var(--space-2);
}
/* 待生效的引导（已发出、模型还没接手）：虚线边 + 呼吸，与落位后的实色气泡区分 */
.user-bubble--pending {
  border-style: dashed;
  border-color: color-mix(in srgb, var(--theme-main-text, #fff) 28%, transparent);
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  animation: guidance-pending-breath 1.6s ease-in-out infinite;
}

@keyframes guidance-pending-breath {
  0%, 100% { opacity: .6; }
  50% { opacity: .92; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--pending {
    animation: none;
    opacity: .78;
  }
}
.assistant-row {
  display: flex;
  justify-content: flex-start;
  padding: 2px 0 12px;
}
.assistant-message,
.assistant-reply-bubble {
  width: min(100%, 760px);
  padding: 0 2px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-message--live {
  animation: stream-enter .18s ease-out both;
}
.assistant-meta,
.reply-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex-wrap: wrap;
  min-height: 22px;
  margin-bottom: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-size: 11px;
  font-weight: 720;
  letter-spacing: .045em;
  text-transform: uppercase;
}
.assistant-label {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}
.assistant-timestamp {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  width: 5ch;
  min-width: 0;
  height: 1.4em;
  overflow: hidden;
  color: color-mix(in srgb, var(--theme-main-text) 38%, transparent);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
  transition: width .2s ease-out;
}
.assistant-timestamp__compact,
.assistant-timestamp__expanded {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  transition: opacity .16s ease-out, transform .2s ease-out;
}
.assistant-timestamp__compact {
  left: 0;
  width: 5ch;
  justify-content: center;
  opacity: 1;
}
.assistant-timestamp__expanded {
  left: 0;
  opacity: 0;
  pointer-events: none;
  transform: scaleX(.26);
  transform-origin: left center;
}
.assistant-timestamp:hover {
  width: 19ch;
}
.assistant-timestamp:hover .assistant-timestamp__compact {
  opacity: 0;
}
.assistant-timestamp:hover .assistant-timestamp__expanded {
  opacity: 1;
  transform: scaleX(1);
}
@media (prefers-reduced-motion: reduce) {
  .assistant-timestamp,
  .assistant-timestamp__compact,
  .assistant-timestamp__expanded {
    transition: none;
  }
}
.assistant-live-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 64%, transparent);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
  text-transform: none;
}
.initial-waiting-indicator {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  padding: 1px 0 4px;
}
.shallow-thinking-pending {
  display: inline-flex;
  align-items: baseline;
  min-width: 0;
  color: color-mix(in srgb, var(--green) 72%, var(--theme-main-text, #fff) 28%);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
}
.shallow-thinking-pending--process {
  margin-left: 22px;
}
.shallow-thinking-pending-row {
  padding: 1px 0 2px;
}
.reasoning-body--pending {
  margin-top: 0;
  margin-bottom: 4px;
  padding-bottom: 0;
}
.shallow-thinking-dots {
  display: inline-flex;
  width: 1.2em;
}
.shallow-thinking-dots span {
  animation: shallow-thinking-dot 1.2s ease-in-out infinite;
}
.shallow-thinking-dots span:nth-child(2) {
  animation-delay: .15s;
}
.shallow-thinking-dots span:nth-child(3) {
  animation-delay: .3s;
}

/* 消息文字区域最下方：输出中三个圆点逐个显现循环 */
.streaming-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}
.streaming-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--theme-main-text) 62%, transparent);
  animation: streaming-dot 1.5s ease-in-out infinite;
}
.streaming-dots span:nth-child(2) {
  animation-delay: .15s;
}
.streaming-dots span:nth-child(3) {
  animation-delay: .3s;
}
@keyframes streaming-dot {
  0% { opacity: 0; }
  12% { opacity: 1; }
  70% { opacity: 1; }
  85%, 100% { opacity: 0; }
}

.assistant-answer {
  margin-top: 10px;
  color: var(--theme-main-text, #f2efeb);
}
.assistant-answer:empty {
  display: none;
}
.part-text-content,
.assistant-answer {
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
@media (prefers-reduced-motion: reduce) {
  .shallow-thinking-dots span {
    animation: none;
    opacity: 1;
  }
  .streaming-dots span {
    animation: none;
    opacity: 1;
  }
}

/* Shared process stream; live/complete only add state decoration. */
.process-stream {
  width: 100%;
  display: grid;
  /* An explicit shrinkable column: with the implicit auto track, a tool card
     whose content is wide (a long single-line diff, a long command) forced its
     intrinsic minimum on the track and widened the whole message past the
     thread column, clipping the reply on phones. */
  grid-template-columns: minmax(0, 1fr);
  gap: 7px;
  margin: 7px 0 12px;
  /* user:“去除消息流左侧的竖线 层级关系不再用竖线表示 而是缩进，缩进 2px 即可”
     +(去掉过程区左边的竖线，层级改由缩进表达，一级只缩 2px)。 */
  padding: 10px 0 10px 2px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
  counter-reset: reasoning-step;
}
/* Bounds of the process tree: every box may shrink below its content so the
   scroll containers inside a tool card (output/diff blocks) own the overflow
   instead of the message column. */
.process-stream,
.process-stream &gt; *,
.process-timeline,
.process-timeline &gt; *,
.process-group,
.process-group-body,
.process-group-body &gt; *,
.process-step {
  min-width: 0;
}
.process-stream--live {
  animation: stream-enter .16s ease-out both;
}
.process-stream--complete {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.process-timeline {
  display: grid;
  gap: 5px;
}
.process-step {
  display: grid;
  grid-template-columns: auto minmax(74px, max-content) minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  min-width: 0;
  padding: 1px 0;
  font-size: 12px;
  line-height: 1.45;
}
.process-step-marker {
  width: 7px;
  height: 7px;
  /* 水平不用 auto：在 flex 容器（如 .process-tool-row）里 auto 外边距会
     吞掉所有剩余空间，把红点推到行中间、文字挤到最右侧 */
  margin: 5px 0 0;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
}
.process-step-marker--error {
  background: var(--red, #e5484d);
}
.process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
  font-weight: 680;
  white-space: nowrap;
}
.process-step-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 43%, transparent);
}
.process-step--reasoning .process-step-detail {
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.thread .process-step--reasoning {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 2px 0;
  counter-increment: reasoning-step;
}
.thread .process-step--reasoning + .process-step--reasoning {
  margin-top: 3px;
}
.thread .reasoning-toggle {
  width: 100%;
  min-width: 0;
  min-height: 28px;
  display: grid;
  grid-template-columns: max-content minmax(0, max-content) auto;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 2px 6px 2px 0;
  cursor: pointer;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 74%, transparent);
  font: inherit;
  text-align: left;
  transition: color .14s ease;
}
.thread .process-step--reasoning .process-step-marker {
  display: none;
}
.thread .process-step--reasoning .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 66%, transparent);
  font-size: 12px;
  font-weight: 680;
}
.thread .reasoning-duration {
  min-width: 0;
  max-width: min(240px, 40vw);
  justify-self: start;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 42%, transparent);
  font-style: normal;
}
.thread .reasoning-body {
  margin: 3px 0 8px 24px;
  max-height: 800px;
  overflow: auto;
  padding: 2px 0 6px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 62%, transparent);
  font-size: 13px;
  line-height: 1.65;
  font-style: normal;
  text-wrap: pretty;
  opacity: 1;
}
.thread .reasoning-body .process-step-detail {
  display: block;
  overflow: visible;
  color: inherit;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-line-clamp: unset;
}
.process-stream--live .process-step--compact {
  opacity: .62;
}
.process-stream--live .process-step--compact .process-step-detail {
  max-width: 360px;
}
.process-stream--live .process-step--current {
  padding: 4px 0;
}
.process-stream--live .process-step--current .process-step-title {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 82%, transparent);
}
.process-stream--live .process-step--current .process-step-detail {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 58%, transparent);
}

.process-summary {
  width: fit-content;
  max-width: 100%;
  min-height: 22px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 54%, transparent);
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.process-summary:hover {
  color: color-mix(in srgb, var(--theme-main-text, #fff) 72%, transparent);
}
/* user:“把过程行那个图标从现在的浅紫色改成文字色与灰色混合” — 使用主题文字色与中性灰各半混合。 */
.process-summary-icon {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in srgb, color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray) 44%, transparent);
  flex: 0 0 auto;
}
.process-summary-icon.part-dot--running {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: part-pulse 1s ease-in-out infinite;
}
.process-summary-icon.part-dot--completed {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
}
.process-summary-icon.part-dot--error {
  background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%);
}
.process-summary-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.process-summary-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 78%, transparent);
  font-weight: 620;
}
.process-summary-detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, transparent);
}

.stream-spinner {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  animation: stream-spin .9s linear infinite;
  flex: 0 0 auto;
}

/* Compatibility for older product-side class names */
.part-inline,
.part-inline--context,
.part-inline--reasoning,
.part-inline--tool,
.part-inline--error,
.part-inline--info {
  color: inherit;
}
/* part-dot 状态点 — 以 main area 文字为底，靠动画/混合区分 */
.part-dot--pending { background: color-mix(in srgb, var(--orange) 70%, var(--theme-main-text, #fff) 30%); }
.part-dot--running {
  width: 9px; height: 9px;
  border: 2px solid color-mix(in srgb, var(--theme-main-text, #fff) 14%, transparent);
  border-top-color: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray);
  background: transparent;
  border-radius: 50%;
  animation: stream-spin .9s linear infinite;
}
.part-dot--completed { background: color-mix(in srgb, var(--theme-main-text, #fff) 50%, gray); }
.part-dot--error { background: color-mix(in srgb, var(--theme-main-text, #fff) 30%, var(--red) 70%); }

.global-stats-bar {
  margin: 12px auto 0;
  width: fit-content;
  max-width: 100%;
  padding: 5px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--theme-main-text, #fff) 5%, transparent);
  border: 1px solid color-mix(in srgb, var(--theme-main-text, #fff) 7%, transparent);
}
.global-stats-text {
  font-size: 11px;
  color: color-mix(in srgb, var(--theme-main-text, #fff) 44%, transparent);
}

@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes stream-enter {
  from { opacity: .68; transform: translateY(2px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes part-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}

/* ── Motion: CSS 入场 keyframes（GSAP 离散动效之外的轻量入场统一收敛在此）── */
@keyframes stream-spin {
  to { transform: rotate(360deg); }
}
@keyframes popover-in {
  from { opacity: 0; transform: translateY(-3px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@keyframes panel-enter {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .workspace-drawer,
  .workspace-main,
  .floating-composer {
    transition-duration: .5s !important;
  }
  .conversation .status.waiting {
    animation: none;
  }
  .settings-panel {
    animation: none;
  }
  /* 折叠展开由 GSAP 驱动（motion/expandPanel.ts），reduced-motion 时直切无动画 */
}

/* Old message summary controls are intentionally hidden. */
.msg-summary,
.summary-label,
.summary-chevron,
.summary-stats,
.summary-stats-inline,
.summary-dot,
.summary-text,
.msg-collapse-control,
.collapse-btn {
  display: none;
}

/* =========================================================================
   Placeholder bubble — pending user message indicator
   ========================================================================= */

.user-bubble--placeholder {
  opacity: .55;
  animation: placeholder-pulse 1.2s ease-in-out infinite;
}

@keyframes placeholder-pulse {
  0%, 100% { opacity: .45; }
  50% { opacity: .75; }
}

@media (prefers-reduced-motion: reduce) {
  .user-bubble--placeholder {
    animation: none;
    opacity: .55;
  }
}

/* ── Floating editor popover（CoreSettings / CorePluginsEditor 共用）── */
.editor-overlay {
  position: absolute;
  inset: 0;
  z-index: var(--z-popover);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  padding: 24px;
}
.editor-popover {
  width: min(560px, 100%);
  max-height: calc(100% - 48px);
  overflow-y: auto;
  border-radius: var(--radius);
  background: var(--settings-card-background, var(--theme-main-background, #111111));
  border: 1px solid color-mix(in srgb, var(--settings-main-text, #fff) 14%, transparent);
  box-shadow: var(--shadow-md);
  padding: 18px 20px;
  color: var(--settings-card-text, var(--settings-main-text, var(--text)));
  /* 弹层在 .settings-main 的 --muted 重映射作用域之外（layout.css），
     自行跟随主题：亮色分支注入 --settings-muted，暗色 fallback 与全局一致 */
  --muted: var(--settings-muted, #a7a29b);
}
.editor-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.editor-popover-head h3 {
  margin: 0;
  font-size: 15px;
}
.editor-popover-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.editor-popover-close:hover {
  background: color-mix(in srgb, var(--settings-main-text, #fff) 10%, transparent);
}

/* ── 启用开关图标按钮（ToggleRight/ToggleLeft，语义化开关）── */
.btn--ghost.is-on {
  color: var(--green);
}

.toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 6px;
  color: var(--muted);
}

.toggle-btn.is-on {
  color: var(--green);
}

/* ── 全局搜索跳转：消息定位高亮渐隐（SessionSearchDialog → locateMessage）──
   class 加在 MessageView 根元素（.message-view）上，动画 2.6s 渐隐 */
.rag-hit-highlight {
  animation: rag-hit-fade 2.6s ease-out;
  border-radius: var(--radius);
}

@keyframes rag-hit-fade {
  0% {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #4f8cff) 70%, transparent),
                0 0 18px color-mix(in srgb, var(--accent, #4f8cff) 40%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) 14%, transparent);
  }
  100% {
    box-shadow: 0 0 0 3px transparent, 0 0 0 transparent;
    background: transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rag-hit-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #4f8cff) 62%, transparent);
    background: color-mix(in srgb, var(--accent, #4f8cff) var(--alpha-hover), transparent);
  }

  .sub-agent-source-highlight {
    animation: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 62%, transparent);
    background: color-mix(in srgb, var(--green) var(--alpha-hover), transparent);
  }
}

/* =========================================================================
   整版界面里的设置/插件（就地渲染，不再是悬浮卡片）
   ========================================================================= */
/* 顶部条已经给出标题与返回键，左栏不再重复。 */
.settings-page .settings-brand,
.settings-page .settings-sidebar-footer {
  display: none;
}

/* 网格子项默认 min-width:auto：长 URL / 长文本会把列撑破，被右边缘裁掉。
   设置面板里每一层都允许收缩，长文本自己换行。 */
.settings-main,
.settings-main * {
  min-width: 0;
}

.settings-main :where(code, a, .mono) {
  overflow-wrap: anywhere;
  white-space: normal;
}

/* =========================================================================
   窄的整版界面（设置 / 插件）：导航横排在上，内容整宽、工作台单栏
   ========================================================================= */
.settings-surface--narrow .settings-page {
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-3);
}

.settings-surface--narrow .settings-sidebar {
  width: 100%;
  padding-bottom: var(--space-2);
}

.settings-surface--narrow .settings-nav {
  display: flex;
  flex-direction: row;
  gap: var(--space-1);
  overflow-x: auto;
  padding-bottom: var(--space-1);
}

.settings-surface--narrow .settings-content {
  max-width: none;
}

/* user:“点击任意控件会出现蓝色判断区，隐藏掉”+(触屏默认的点击高亮，以及鼠标/手指点出来的
   焦点框；键盘操作仍然保留 :focus-visible 的可见焦点)。 */
html,
body {
  -webkit-tap-highlight-color: transparent;
}

:where(button, [role=&#x27;button&#x27;], a, summary, [tabindex]):focus:not(:focus-visible) {
  outline: none;
}

:where(button, [role=&#x27;button&#x27;], a, summary) {
  -webkit-tap-highlight-color: transparent;
}

/* user:&quot;把红换成白，然后用这套组件做成可复用的 sunday 样式并投入使用，注意浅暗色模式与文字颜色，白底必须黑字，反之同理&quot; */
/*
  Sunday interaction controls — the reusable half of the control kit.
  Filled states always use the control pair (solid + text), so a label on a
  filled surface is always the inverse of that surface. Hover/active neutral
  states keep using the shared --alpha-* tokens.
*/

/* ---------- Switch ---------- */

.sunday-switch {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  --sunday-w: 40px;
  --sunday-h: 24px;
  --sunday-pad: 3px;
  --sunday-thumb: 16px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  cursor: pointer;
}

.sunday-switch--sm {
  --sunday-w: 34px;
  --sunday-h: 20px;
  --sunday-pad: 2px;
  --sunday-thumb: 14px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
}

.sunday-switch__input {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.sunday-switch__input:disabled {
  cursor: not-allowed;
}

.sunday-switch__track {
  position: relative;
  flex: none;
  width: var(--sunday-w);
  height: var(--sunday-h);
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) 18%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 6%, transparent);
  transition:
    background-color var(--dur-base) var(--ease-out),
    border-color var(--dur-base) var(--ease-out);
}

.sunday-switch__thumb {
  position: absolute;
  top: var(--sunday-pad);
  left: var(--sunday-pad);
  width: var(--sunday-thumb);
  height: var(--sunday-thumb);
  border-radius: calc(var(--radius-sm) / 2);
  background: color-mix(in srgb, var(--sunday-area-text) 46%, transparent);
  transition:
    transform var(--dur-slow) var(--ease-out),
    background-color var(--dur-base) var(--ease-out);
}

.sunday-switch:hover .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 32%, transparent);
}

.sunday-switch:hover .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 62%, transparent);
}

.sunday-switch__input:checked + .sunday-switch__track {
  border-color: var(--sunday-signal);
  background: var(--sunday-signal);
}

.sunday-switch__input:checked + .sunday-switch__track .sunday-switch__thumb {
  background: var(--sunday-signal-ink);
  transform: translateX(var(--sunday-travel));
}

.sunday-switch:hover .sunday-switch__input:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
  background: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
}

.sunday-switch__input:focus-visible + .sunday-switch__track {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-switch:has(.sunday-switch__input:disabled) {
  cursor: not-allowed;
}

.sunday-switch__input:disabled + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 10%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
}

.sunday-switch__input:disabled + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 44%, transparent);
  transform: translateX(var(--sunday-travel));
}

/* ---------- Segmented ---------- */

.sunday-segmented {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  position: relative;
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  padding: 2px;
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) var(--alpha-active), transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
  isolation: isolate;
}

.sunday-segmented__indicator {
  position: absolute;
  top: 2px;
  left: 0;
  z-index: 0;
  width: 0;
  height: calc(100% - 4px);
  border-radius: calc(var(--radius-sm) - 2px);
  background: var(--sunday-signal);
  opacity: 0;
  pointer-events: none;
}

.sunday-segmented[data-ready=&quot;true&quot;] .sunday-segmented__indicator {
  opacity: 1;
  transition:
    transform var(--dur-slow) var(--ease-emphasized),
    width var(--dur-slow) var(--ease-emphasized),
    opacity var(--dur-fast) linear;
}

.sunday-segmented__item {
  position: relative;
  z-index: 1;
  height: var(--interaction-height-sm);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: color-mix(in srgb, var(--sunday-area-text) 66%, transparent);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out);
}

.sunday-segmented__item:hover {
  color: var(--sunday-area-text);
}

.sunday-segmented__item[aria-checked=&quot;true&quot;] {
  color: var(--sunday-signal-ink);
}

.sunday-segmented__item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-segmented:not([data-ready=&quot;true&quot;]) .sunday-segmented__item[aria-checked=&quot;true&quot;] {
  background: var(--sunday-signal);
  color: var(--sunday-signal-ink);
}

/* ---------- Range ---------- */

.sunday-range {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  display: grid;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
}

.sunday-range--bare {
  display: block;
  flex: 1 1 auto;
  width: auto;
}

.sunday-range__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.sunday-range__label {
  color: color-mix(in srgb, var(--sunday-area-text) 72%, transparent);
  font-size: 12px;
  font-weight: 500;
}

.sunday-range__value {
  color: var(--sunday-area-text);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sunday-range__track {
  position: relative;
  height: 18px;
}

.sunday-range__track::before {
  content: &quot;&quot;;
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
  transform: translateY(-50%);
}

.sunday-range__fill {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--sunday-range-fill, 0%);
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: var(--sunday-signal);
  transform: translateY(-50%);
}

.sunday-range__input {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.sunday-range__input:focus {
  outline: none;
}

.sunday-range__input::-webkit-slider-runnable-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-webkit-slider-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  margin-top: 1px;
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--dur-base) var(--ease-out);
}

.sunday-range__input:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-range__input::-moz-range-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-moz-range-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
}

@supports (-moz-appearance: none) {
  .sunday-range__input:focus-visible {
    border-radius: var(--radius-sm);
    outline: 2px solid var(--blue);
    outline-offset: 4px;
  }
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__label,
.sunday-range:has(.sunday-range__input:disabled) .sunday-range__value {
  color: color-mix(in srgb, var(--sunday-area-text) 45%, transparent);
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__fill {
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
}

.sunday-range__input:disabled {
  cursor: not-allowed;
}

.sunday-range__input:disabled::-webkit-slider-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
  cursor: not-allowed;
}

.sunday-range__input:disabled::-moz-range-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
}

/* ---------- Progress ---------- */

.sunday-progress {
  position: relative;
  width: 100%;
  height: var(--interaction-progress-height);
  overflow: hidden;
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #f2efeb)) 14%, transparent);
}

.sunday-progress__fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  transition: width var(--dur-slow) var(--ease-out);
}

}

/* user:“把功能相近或者实际相似的样式和组件，统一成一套，并且可复用”+

.btn {

  align-items: center;

  font: inherit;
  white-space: nowrap;

  transition:

    color var(--dur-fast) var(--ease-out),

  cursor: default;
}

.btn:not(:disabled):active {

}

.btn--secondary,
.btn--primary,
.btn--quiet {
  min-height: 32px;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13px;
}

.btn--secondary,
.btn--primary {
  background: var(--settings-control-background, var(--theme-control-background, #343331));
  color: var(--settings-control-text, var(--muted));
}

.btn--secondary:hover:not(:disabled),

/* 文本式按钮：透明底，文字跟随所在面板，不能用控件文字色，
   否则「亮主区 + 暗控件」的主题下白字会压在浅色面板上。 */
.btn--quiet {
  background: transparent;
  color: var(--settings-main-text, var(--muted));
}

.btn--quiet:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, var(--text)) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
  filter: none;
}

.btn--ghost {
  min-height: 32px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.btn--ghost:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
}

.btn--ghost:active:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-active), transparent);
}

.btn--danger {
  color: color-mix(in srgb, var(--red) 80%, var(--settings-main-text, var(--text)) 20%);
}

.btn--danger:hover:not(:disabled) {
  color: color-mix(in srgb, var(--red) 58%, var(--settings-main-text, var(--theme-main-text, var(--text))));
}

.library-surface .library-item-top { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; padding-right: var(--space-5); }

  text-overflow: ellipsis;

  gap: 4px;
  padding: 5px var(--space-3);

.library-surface .icon-button:hover:not(:disabled) { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }
.library-surface .library-link {

/* ── 对话框：与全应用的确认框同一套（描边、底带、遮罩、入场） ── */
.library-surface .dialog-dimmer {

.library-surface .dialog-field input {

.library-surface .dialog-error { margin: 0; color: var(--red); font-size: 12.5px; }
/* 动作落在一条底带上：与对话框正文分开，和确认框同一条分界线。 */

.library-surface .library-dialog-enter-from, .library-surface .library-dialog-leave-to, .library-surface .library-dialog-enter-from .dialog-card, .library-surface .library-dialog-leave-to .dialog-card { opacity: 0; }

.library-surface button:disabled { cursor: default; opacity: .5; }
/* 桌面：标题与返回键由顶部条承担，手机头整块收起。 */

@media (prefers-reduced-motion: reduce) {
  .library-surface .library-row, .library-surface .plan-card, .library-surface .folder-card, .library-surface .library-button, .library-surface .filter-tabs button, .library-surface .library-view-toggle button, .library-surface .card-menu-btn {
  transition: none;
  }

/* user:&quot;把红换成白，然后用这套组件做成可复用的 sunday 样式并投入使用，注意浅暗色模式与文字颜色，白底必须黑字，反之同理&quot; */
/*
  Sunday interaction controls — the reusable half of the control kit.
  Filled states always use the control pair (solid + text), so a label on a
  filled surface is always the inverse of that surface. Hover/active neutral
  states keep using the shared --alpha-* tokens.
*/

/* ---------- Switch ---------- */

.sunday-switch {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  --sunday-w: 40px;
  --sunday-h: 24px;
  --sunday-pad: 3px;
  --sunday-thumb: 16px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  cursor: pointer;
}

.sunday-switch--sm {
  --sunday-w: 34px;
  --sunday-h: 20px;
  --sunday-pad: 2px;
  --sunday-thumb: 14px;
  --sunday-travel: calc(var(--sunday-w) - 2px - (var(--sunday-pad) * 2) - var(--sunday-thumb));
}

.sunday-switch__input {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.sunday-switch__input:disabled {
  cursor: not-allowed;
}

.sunday-switch__track {
  position: relative;
  flex: none;
  width: var(--sunday-w);
  height: var(--sunday-h);
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) 18%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 6%, transparent);
  transition:
    background-color var(--dur-base) var(--ease-out),
    border-color var(--dur-base) var(--ease-out);
}

.sunday-switch__thumb {
  position: absolute;
  top: var(--sunday-pad);
  left: var(--sunday-pad);
  width: var(--sunday-thumb);
  height: var(--sunday-thumb);
  border-radius: calc(var(--radius-sm) / 2);
  background: color-mix(in srgb, var(--sunday-area-text) 46%, transparent);
  transition:
    transform var(--dur-slow) var(--ease-out),
    background-color var(--dur-base) var(--ease-out);
}

.sunday-switch:hover .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 32%, transparent);
}

.sunday-switch:hover .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 62%, transparent);
}

.sunday-switch__input:checked + .sunday-switch__track {
  border-color: var(--sunday-signal);
  background: var(--sunday-signal);
}

.sunday-switch__input:checked + .sunday-switch__track .sunday-switch__thumb {
  background: var(--sunday-signal-ink);
  transform: translateX(var(--sunday-travel));
}

.sunday-switch:hover .sunday-switch__input:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
  background: color-mix(in srgb, var(--sunday-signal) 92%, var(--sunday-signal-ink));
}

.sunday-switch__input:focus-visible + .sunday-switch__track {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-switch:has(.sunday-switch__input:disabled) {
  cursor: not-allowed;
}

.sunday-switch__input:disabled + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 10%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
}

.sunday-switch__input:disabled + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track {
  border-color: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 12%, transparent);
}

.sunday-switch__input:disabled:checked + .sunday-switch__track .sunday-switch__thumb {
  background: color-mix(in srgb, var(--sunday-area-text) 44%, transparent);
  transform: translateX(var(--sunday-travel));
}

/* ---------- Segmented ---------- */

.sunday-segmented {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  position: relative;
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  padding: 2px;
  border: 1px solid color-mix(in srgb, var(--sunday-area-text) var(--alpha-active), transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sunday-area-text) 4%, transparent);
  isolation: isolate;
}

.sunday-segmented__indicator {
  position: absolute;
  top: 2px;
  left: 0;
  z-index: 0;
  width: 0;
  height: calc(100% - 4px);
  border-radius: calc(var(--radius-sm) - 2px);
  background: var(--sunday-signal);
  opacity: 0;
  pointer-events: none;
}

.sunday-segmented[data-ready=&quot;true&quot;] .sunday-segmented__indicator {
  opacity: 1;
  transition:
    transform var(--dur-slow) var(--ease-emphasized),
    width var(--dur-slow) var(--ease-emphasized),
    opacity var(--dur-fast) linear;
}

.sunday-segmented__item {
  position: relative;
  z-index: 1;
  height: var(--interaction-height-sm);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: color-mix(in srgb, var(--sunday-area-text) 66%, transparent);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out);
}

.sunday-segmented__item:hover {
  color: var(--sunday-area-text);
}

.sunday-segmented__item[aria-checked=&quot;true&quot;] {
  color: var(--sunday-signal-ink);
}

.sunday-segmented__item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-segmented:not([data-ready=&quot;true&quot;]) .sunday-segmented__item[aria-checked=&quot;true&quot;] {
  background: var(--sunday-signal);
  color: var(--sunday-signal-ink);
}

/* ---------- Range ---------- */

.sunday-range {
  --sunday-signal: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  --sunday-signal-ink: var(--settings-control-text, var(--theme-control-text, #2e3138));
  --sunday-area-text: var(--settings-main-text, var(--theme-main-text, #f2efeb));
  display: grid;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
}

.sunday-range--bare {
  display: block;
  flex: 1 1 auto;
  width: auto;
}

.sunday-range__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.sunday-range__label {
  color: color-mix(in srgb, var(--sunday-area-text) 72%, transparent);
  font-size: 12px;
  font-weight: 500;
}

.sunday-range__value {
  color: var(--sunday-area-text);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sunday-range__track {
  position: relative;
  height: 18px;
}

.sunday-range__track::before {
  content: &quot;&quot;;
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
  transform: translateY(-50%);
}

.sunday-range__fill {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--sunday-range-fill, 0%);
  height: var(--interaction-track);
  border-radius: var(--interaction-track-radius);
  background: var(--sunday-signal);
  transform: translateY(-50%);
}

.sunday-range__input {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.sunday-range__input:focus {
  outline: none;
}

.sunday-range__input::-webkit-slider-runnable-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-webkit-slider-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  margin-top: 1px;
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--dur-base) var(--ease-out);
}

.sunday-range__input:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.sunday-range__input::-moz-range-track {
  height: 18px;
  background: transparent;
}

.sunday-range__input::-moz-range-thumb {
  box-sizing: border-box;
  width: var(--interaction-thumb);
  height: var(--interaction-thumb);
  border: 1.5px solid var(--sunday-signal-ink);
  border-radius: 50%;
  background: var(--sunday-signal);
  cursor: pointer;
}

@supports (-moz-appearance: none) {
  .sunday-range__input:focus-visible {
    border-radius: var(--radius-sm);
    outline: 2px solid var(--blue);
    outline-offset: 4px;
  }
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__label,
.sunday-range:has(.sunday-range__input:disabled) .sunday-range__value {
  color: color-mix(in srgb, var(--sunday-area-text) 45%, transparent);
}

.sunday-range:has(.sunday-range__input:disabled) .sunday-range__fill {
  background: color-mix(in srgb, var(--sunday-area-text) 16%, transparent);
}

.sunday-range__input:disabled {
  cursor: not-allowed;
}

.sunday-range__input:disabled::-webkit-slider-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
  cursor: not-allowed;
}

.sunday-range__input:disabled::-moz-range-thumb {
  border-color: color-mix(in srgb, var(--sunday-area-text) 24%, transparent);
  background: color-mix(in srgb, var(--sunday-area-text) 8%, transparent);
}

/* ---------- Progress ---------- */

.sunday-progress {
  position: relative;
  width: 100%;
  height: var(--interaction-progress-height);
  overflow: hidden;
  border-radius: var(--interaction-track-radius);
  background: color-mix(in srgb, var(--settings-main-text, var(--theme-main-text, #f2efeb)) 14%, transparent);
}

.sunday-progress__fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--settings-control-solid, var(--theme-control-solid, var(--theme-control-background, #fbf7f0)));
  transition: width var(--dur-slow) var(--ease-out);
}

/* ---------- Press feedback for the existing shared buttons ---------- */

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm) {
  transition: transform var(--dur-fast) var(--ease-out);
}

:where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
  transform: translateY(1px);
}

@media (prefers-reduced-motion: reduce) {
  .sunday-switch__track,
  .sunday-switch__thumb,
  .sunday-segmented__indicator,
  .sunday-segmented__item,
  .sunday-range__input::-webkit-slider-thumb,
  .sunday-progress__fill {
    transition: none;
  }

  :where(.btn--secondary, .btn--ghost, .btn-primary, .btn-primary-sm):not(:disabled):active {
    transform: none;
  }
}

/* user:“合并去重”+(带文案的开关与纯开关共用同一条轨道；文案跟随所在行的颜色) */
.sunday-switch__label {
  margin-inline-start: var(--space-2);
  color: inherit;
  font-size: inherit;
  line-height: 1.3;
  white-space: nowrap;
}

/* user:“把功能相近或者实际相似的样式和组件，统一成一套，并且可复用”+
   (按钮收成一个基件：.btn 管几何与过渡，角色由 .btn--secondary/primary/quiet/ghost/danger 决定；
    原来 .btn--secondary 与 .btn--ghost 两套各写一遍的配方并入这里)。 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  border: 1px solid transparent;
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out),
    filter var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:disabled {
  opacity: .45;
  cursor: default;
}

.btn:not(:disabled):active {
  transform: translateY(1px);
}

.btn--secondary,
.btn--primary,
.btn--quiet {
  min-height: 32px;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13px;
}

.btn--secondary,
.btn--primary {
  background: var(--settings-control-background, var(--theme-control-background, #343331));
  color: var(--settings-control-text, var(--muted));
}

.btn--secondary:hover:not(:disabled),
.btn--primary:hover:not(:disabled) {
  color: var(--settings-control-text, var(--text));
  filter: brightness(1.08);
}

/* 文本式按钮：透明底，文字跟随所在面板，不能用控件文字色，
   否则「亮主区 + 暗控件」的主题下白字会压在浅色面板上。 */
.btn--quiet {
  background: transparent;
  color: var(--settings-main-text, var(--muted));
}

.btn--quiet:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, var(--text)) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
  filter: none;
}

.btn--ghost {
  min-height: 32px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.btn--ghost:hover:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-hover), transparent);
  color: var(--settings-main-text, var(--text));
}

.btn--ghost:active:not(:disabled) {
  background: color-mix(in srgb, var(--settings-main-text, #fff) var(--alpha-active), transparent);
}

.btn--danger {
  color: color-mix(in srgb, var(--red) 80%, var(--settings-main-text, var(--text)) 20%);
}

.btn--danger:hover:not(:disabled) {
  color: color-mix(in srgb, var(--red) 58%, var(--settings-main-text, var(--theme-main-text, var(--text))));
}
