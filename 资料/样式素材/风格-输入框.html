/* user:“什么是这个样式的样式？什么是这个素材库的样式？我把素材库本身当成素材了怎么办？”
   +(每份素材都放进一个独立舞台，舞台有明确的边框、底色和类型角标；
   资料库自己的类名绝不允许在舞台里留下底色与描边，只保留它带来的变量)。 */

.library-surface .style-view {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: var(--space-5);
}

/* ── 顶部 ── */
.library-surface .style-view .style-head {
  display: flex;
  align-items: flex-end;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.library-surface .style-view .style-head-copy { min-width: 0; }
.library-surface .style-view .style-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.library-surface .style-view .style-usage {
  margin: 3px 0 0;
  font-size: 12px;
  color: color-mix(in srgb, var(--text) 50%, transparent);
  font-variant-numeric: tabular-nums;
}
.library-surface .style-view .style-tools {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1 1 360px;
  min-width: 0;
  justify-content: flex-end;
}
.library-surface .style-view .style-tools .library-view-toggle { margin-left: 0; }
.library-surface .style-view .style-search { flex: 0 1 300px; margin-left: auto; }

/* ── 一级分类：挑哪一类。选中项反色，比描边更容易一眼认出 ── */
.library-surface .style-view .style-tagbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: var(--space-3);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
}
.library-surface .style-view .style-tagbar button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
  border-radius: 999px;
  background: transparent;
  color: color-mix(in srgb, var(--text) 74%, transparent);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.library-surface .style-view .style-tagbar button:hover {
  background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent);
  color: var(--text);
}
.library-surface .style-view .style-tagbar button.active {
  background: var(--text);
  border-color: var(--text);
  color: var(--theme-main-background);
  font-weight: 600;
}
.library-surface .style-view .style-tag-count {
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, currentColor 55%, transparent);
}

/* ── 二级：同一类里的变体 ── */
.library-surface .style-view .style-variants {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin: var(--space-3) 0 0;
}
.library-surface .style-view .style-variants button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 5%, transparent);
  color: color-mix(in srgb, var(--text) 62%, transparent);
  font-size: 11.5px;
  cursor: pointer;
}
.library-surface .style-view .style-variants button:hover { color: var(--text); }
.library-surface .style-view .style-variants button.active {
  border-color: color-mix(in srgb, var(--text) 28%, transparent);
  color: var(--text);
  font-weight: 600;
}

/* ── 分区 ── */
.library-surface .style-view .style-group { margin-top: var(--space-5); }
.library-surface .style-view .style-group-head {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.library-surface .style-view .style-group-head h2 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.library-surface .style-view .style-group-count {
  font-size: 11px;
  color: color-mix(in srgb, var(--text) 38%, transparent);
  font-variant-numeric: tabular-nums;
}

.library-surface .style-view .style-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: var(--space-3);
  align-items: start;
}
.library-surface .style-view .style-grid--wide {
  grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
}

.library-surface .style-view .style-more {
  margin-top: var(--space-2);
  padding: 4px 10px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 6%, transparent);
  color: color-mix(in srgb, var(--text) 56%, transparent);
  font-size: 11.5px;
  cursor: pointer;
}
.library-surface .style-view .style-more:hover { color: var(--text); background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); }

/* ── 一张卡：上舞台，下名字 ── */
.library-surface .style-view .spec-card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
  cursor: pointer;
}
.library-surface .style-view .spec-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: var(--radius); }

.library-surface .style-view .spec-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 76px;
  padding: 16px 12px 8px;
  border: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
  border-radius: 10px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--text) 6%, transparent), transparent 46%),
    color-mix(in srgb, #000 34%, var(--theme-main-background));
  /* contain:paint 让舞台成为固定定位后代的包含块：样本里任何 position:fixed
     的规则都会被关在这只盒子里，跑不出去盖住整页。 */
  contain: layout paint;
  overflow: hidden;
  isolation: isolate;
  transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.library-surface .style-view .spec-card:hover .spec-stage {
  border-color: color-mix(in srgb, var(--text) 30%, transparent);
  box-shadow: var(--shadow-sm);
}
.library-surface .style-view .spec-stage--composite { height: 230px; align-items: flex-start; justify-content: flex-start; }
.library-surface .style-view .spec-stage--motion { height: 118px; }

/* 角标：这一格里放的是什么，写在舞台自己的角上。 */
.library-surface .style-view .spec-stage-tag {
  position: absolute;
  top: 7px;
  left: 10px;
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: color-mix(in srgb, var(--text) 30%, transparent);
  pointer-events: none;
  z-index: 2;
}

.library-surface .style-view .spec-live {
  width: 100%;
  max-height: 66px;
  overflow: hidden;
  text-align: center;
  /* 中文默认逐字断行，盒子一窄就竖排；样本里禁止，宁可溢出也不要看起来像坏了。 */
  word-break: keep-all;
  overflow-wrap: normal;
}
.library-surface .style-view .spec-stage--composite .spec-live {
  max-height: 200px;
  text-align: left;
}
.library-surface .style-view .spec-live .style-specimen-host {
  display: block;
  width: 100%;
  text-align: center;
}
.library-surface .style-view .spec-stage--composite .spec-live .style-specimen-host { text-align: left; }

/* 祖先层只保留「让选择器匹配」的作用：变量继续继承，视觉一律清空。 */
.style-chain-anchor {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  padding: 0 !important;
  margin: 0 !important;
  position: static !important;
  inset: auto !important;
  display: block !important;
  width: auto !important;
  height: auto !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-width: none !important;
  max-height: none !important;
  overflow: visible !important;
  transform: none !important;
  color: inherit !important;
  font: inherit !important;
  text-align: inherit !important;
}

.library-surface .style-view .spec-foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
  padding: 0 2px;
  min-width: 0;
}
.library-surface .style-view .spec-name {
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.library-surface .style-view .spec-class {
  flex: 0 0 auto;
  max-width: 58%;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--text) 40%, transparent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.library-surface .style-view .spec-replay {
  position: absolute;
  right: 8px;
  bottom: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--theme-main-background) 70%, transparent);
  color: color-mix(in srgb, var(--text) 70%, transparent);
  cursor: pointer;
  z-index: 2;
}
.spec-replay--big { right: 12px; bottom: 12px; width: auto; height: 28px; padding: 0 12px; gap: 6px; border-radius: 999px; font-size: 11.5px; }

/* 关键帧演示方块：没有元素在用时也能看这段动效。 */
.motion-frames-demo {
  width: 44px;
  height: 44px;
  margin: 0 auto;
  border-radius: 10px;
  background: var(--blue);
}

/* ── 索引：给 Agent 的看法 ── */
.library-surface .style-view .style-index { margin-top: var(--space-3); overflow: auto; max-height: 72vh; }
.library-surface .style-view .style-index-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
  font-size: 12px;
  color: color-mix(in srgb, var(--text) 52%, transparent);
}
.library-surface .style-view .style-index table { width: 100%; border-collapse: collapse; font-size: 12px; }
.library-surface .style-view .style-index th {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 6px 8px;
  border-bottom: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
  background: var(--theme-main-background);
  text-align: left;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--text) 46%, transparent);
  white-space: nowrap;
}
.library-surface .style-view .style-index td {
  padding: 6px 8px;
  border-bottom: 1px solid color-mix(in srgb, var(--text) 6%, transparent);
  vertical-align: top;
}
.library-surface .style-view .style-index tbody tr:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
.library-surface .style-view .style-index code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: color-mix(in srgb, var(--text) 84%, transparent);
}
.library-surface .style-view .style-index-file {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--text) 34%, transparent);
  white-space: nowrap;
}

/* ── 详情 ── */
.style-sheet {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  justify-content: flex-end;
}
.style-sheet-scrim {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, #000 48%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  animation: style-scrim-in var(--dur-base) var(--ease-out);
}
.style-sheet-body {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(1180px, 96vw);
  height: 100%;
  background: var(--theme-main-background);
  color: var(--theme-main-text);
  border-left: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  box-shadow: var(--shadow-lg);
  animation: style-sheet-in var(--dur-slow) var(--ease-out);
}
.style-sheet-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
}
.style-sheet-copy { min-width: 0; flex: 1 1 auto; }
.style-sheet-kicker {
  margin: 0 0 2px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: color-mix(in srgb, var(--text) 42%, transparent);
}
.style-sheet-title { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.style-sheet-actions { display: flex; gap: var(--space-1); flex: 0 0 auto; }
.style-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: color-mix(in srgb, var(--text) 66%, transparent);
  cursor: pointer;
}
.style-icon-btn:hover { background: color-mix(in srgb, var(--text) var(--alpha-hover), transparent); color: var(--text); }

.style-sheet-main {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.85fr);
  flex: 1 1 auto;
  min-height: 0;
}
.style-sheet-canvas {
  padding: var(--space-5);
  overflow: auto;
  border-right: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
}
.style-sheet-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 240px;
  padding: 28px 22px;
  border: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
  border-radius: 12px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--text) 6%, transparent), transparent 46%),
    color-mix(in srgb, #000 34%, var(--theme-main-background));
  overflow: auto;
  position: relative;
  contain: layout paint;
}
.style-sheet-stage--composite { align-items: flex-start; justify-content: flex-start; max-height: 520px; }
.style-sheet-stage .spec-live--big { max-height: none; width: 100%; }
.style-sheet-stage--composite .spec-live--big { text-align: left; }

.style-sheet-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: var(--space-3); }
.style-tag-chip {
  padding: 2px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 7%, transparent);
  font-size: 11px;
  color: color-mix(in srgb, var(--text) 66%, transparent);
}

/* 组合的部件：一行一个，右边是同标签的其他原子，点一下就换。 */
.style-parts { margin-top: var(--space-5); }
.style-parts h3 {
  margin: 0 0 var(--space-2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 46%, transparent);
}
.style-part-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 4px var(--space-3);
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--text) 7%, transparent);
}
.style-part-name { font-size: 12px; font-weight: 600; }
.style-part-class {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--text) 38%, transparent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.style-part-alts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.style-part-alts button {
  padding: 3px 9px;
  border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
  border-radius: 999px;
  background: transparent;
  color: color-mix(in srgb, var(--text) 62%, transparent);
  font-size: 11px;
  cursor: pointer;
}
.style-part-alts button:hover { color: var(--text); border-color: color-mix(in srgb, var(--text) 30%, transparent); }
.style-part-alts button.active { background: var(--text); border-color: var(--text); color: var(--theme-main-background); font-weight: 600; }

.style-sheet-side {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-5);
  overflow: auto;
}
.style-block { min-width: 0; }
.style-block h3 {
  margin: 0 0 var(--space-2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 46%, transparent);
}
.style-class-line code {
  display: block;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--text) 6%, transparent);
  font-family: var(--font-mono);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.style-hint { margin: 6px 0 10px; font-size: 11.5px; line-height: 1.5; color: color-mix(in srgb, var(--text) 46%, transparent); }
.style-states { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; }
.style-state-chip {
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--blue) 16%, transparent);
  color: var(--blue);
  font-size: 11px;
  font-family: var(--font-mono);
}
.style-rule {
  margin: 0;
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--theme-main-sunken-background, color-mix(in srgb, #000 34%, transparent));
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.style-feedback { display: flex; flex-direction: column; gap: var(--space-2); }
.style-feedback textarea {
  width: 100%;
  box-sizing: border-box;
  resize: vertical;
  padding: var(--space-2) var(--space-3);
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--text) 4%, transparent);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.55;
}
.style-feedback textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.style-notes { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.style-notes li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-2);
  border-left: 2px solid color-mix(in srgb, var(--blue) 55%, transparent);
  background: color-mix(in srgb, var(--text) 3%, transparent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 12.5px;
}
.style-notes time { font-size: 10.5px; color: color-mix(in srgb, var(--text) 38%, transparent); }

.style-receipt {
  position: fixed;
  left: 50%;
  bottom: 32px;
  z-index: var(--z-toast);
  margin: 0;
  padding: var(--space-2) var(--space-4);
  border-radius: 999px;
  background: var(--theme-control-background);
  color: var(--theme-control-text);
  font-size: 12.5px;
  box-shadow: var(--shadow-md);
  transform: translateX(-50%);
}

@keyframes style-sheet-in {
  from { opacity: 0; transform: translateX(26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes style-scrim-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.style-sheet-enter-active, .style-sheet-leave-active { transition: opacity var(--dur-base) var(--ease-out); }
.style-sheet-enter-from, .style-sheet-leave-to { opacity: 0; }
.style-toast-enter-active, .style-toast-leave-active { transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.style-toast-enter-from, .style-toast-leave-to { opacity: 0; transform: translate(-50%, 8px); }

@container app-page (max-width: 960px) {
  .style-sheet-body { width: 100vw; }
  .style-sheet-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 1fr) auto; }
  .style-sheet-canvas { border-right: 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent); }
  .style-sheet-side { max-height: 46vh; }
}
@container app-page (max-width: 640px) {
  .library-surface .style-view .style-title { font-size: 19px; }
  .library-surface .style-view .style-tools { flex-basis: auto; }
  .library-surface .style-view .style-search { max-width: none; }
  .library-surface .style-view .style-grid,
  .library-surface .style-view .style-grid--wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .library-surface .style-view .spec-stage { height: 104px; }
  .style-sheet-head { padding: var(--space-3) var(--space-4); }
  .style-sheet-canvas, .style-sheet-side { padding: var(--space-4); }
}

@media (prefers-reduced-motion: reduce) {
  .style-sheet-body, .style-sheet-scrim { animation: none; }
}

/* ── 资料卡：标签、评分、样式缩略图 ─────────────────────────────────── */

.library-surface .material-css-preview {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  overflow: hidden;
  background: color-mix(in srgb, #000 26%, var(--theme-main-background));
  text-align: center;
  word-break: keep-all;
}
.library-surface .material-css-preview .style-specimen-item {
  contain: layout paint;
  overflow: hidden;
  max-height: 34px;
  border-radius: var(--radius-sm);
}
.library-surface .material-css-preview .style-specimen-item &gt; * { max-width: 100%; }
.library-surface .material-thumb:has(.material-css-preview) { min-height: 118px; }
.library-surface .material-thumb:has(.material-css-preview) .material-status { z-index: 2; }

.library-surface .material-meta-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: var(--space-2);
}
.library-surface .material-tag {
  padding: 1px 7px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--blue) 16%, transparent);
  color: var(--blue);
  font-size: 10px;
  cursor: pointer;
}
.library-surface .material-tag:hover { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.library-surface .material-rating { display: inline-flex; margin-left: auto; }
.library-surface .material-rating-star {
  padding: 0 1px;
  border: 0;
  background: none;
  color: color-mix(in srgb, var(--text) 22%, transparent);
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}
.library-surface .material-rating-star.is-on { color: var(--orange); }

.library-surface .material-tag-filter { margin-top: calc(var(--space-3) * -1); }
.library-surface .material-tag-filter button { font-size: 11px; padding: 3px 10px; }

.library-surface .material-tag-entry { position: relative; display: inline-flex; }
.library-surface .material-tag-input {
  width: 58px;
  height: 18px;
  padding: 0 7px;

}

  padding: 2px 8px;

  height: 100%;

  transform: scale(1);

.library-surface .material-thumb:has(.material-html-preview) { min-height: 128px; }


/* user:“人只做观测和选用”+(卡片上标出被取用次数，选中的几件并排比。) */

.workspace-main.nx-plugin-full {

}

}

}
.workspace-main.nx-plugin-full .split-content-toolbar {

}
.workspace-main.nx-plugin-full .split-plugin-page__host {

.workspace-main.nx-plugin-full .nx-mount {

}
.nx-host &gt; .split-content-toolbar {

  padding: 0;
}

.nx-app {
  /* user:“把这个颜色跟 Sunday 本身主题内的那些颜色来接壤”+(页面与宿主同文档，直接继承主题变量；没有变量时退回石墨绿)。
     宿主主题色通过 --theme-main-* / --theme-main-border / --green / --font-* 暴露，
     插件不再自带一套互不相干的色板。 */
  --nx-bg: var(--theme-main-background, #111416);
  --nx-rail: color-mix(in srgb, var(--theme-main-background, #111416) 86%, var(--theme-main-text, #e8eeeb));
  --nx-panel: color-mix(in srgb, var(--theme-main-background, #111416) 92%, var(--theme-main-text, #e8eeeb));
  --nx-panel-hover: color-mix(in srgb, var(--theme-main-background, #111416) 84%, var(--theme-main-text, #e8eeeb));
  --nx-input: color-mix(in srgb, var(--theme-main-background, #111416) 78%, var(--theme-main-text, #e8eeeb));
  --nx-text: var(--theme-main-text, #e8eeeb);
  --nx-muted: color-mix(in srgb, var(--theme-main-text, #e8eeeb) 62%, transparent);
  --nx-faint: color-mix(in srgb, var(--theme-main-text, #e8eeeb) 42%, transparent);
  --nx-line: var(--theme-main-border, color-mix(in srgb, var(--theme-main-text, #e8eeeb) 14%, transparent));
  --nx-accent: var(--green, #8ae6bf);
  --nx-accent-ink: color-mix(in srgb, var(--green, #8ae6bf) 18%, #000);
  --nx-error: var(--red, #ef9c9f);
  --nx-warning: var(--orange, var(--nx-warning));
  display: flex;
  height: 100%;
  min-height: 360px;
  width: 100%;
  overflow: hidden;
  background: var(--nx-bg);
  color: var(--nx-text);
  font-family: var(--font-sans, Inter, &quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif);
  font-size: 13px;
  line-height: 1.5;
  container: nx-shell/inline-size;
  border-radius: 0;
  text-align: left;
}
.nx-app * {
  box-sizing: border-box;
}
.nx-app button,
.nx-app input,
.nx-app select,
.nx-app textarea {
  font: inherit;
}
.nx-app button {
  cursor: pointer;
}
.nx-app button:disabled {
  cursor: default;
  opacity: 0.42;
}
.nx-app svg {
  flex-shrink: 0;
  vertical-align: middle;
}
.nx-app h1,
.nx-app h2,
.nx-app h3,
.nx-app p {
  margin: 0;
}
.nx-app h2 {
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.nx-app h3 {
  font-size: 13px;
  font-weight: 600;
}
.nx-app button:focus-visible,
.nx-app a:focus-visible {
  outline: 2px solid var(--nx-accent);
  outline-offset: 3px;
}
.nx-app input:focus-visible,
.nx-app textarea:focus-visible,
.nx-app select:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--nx-accent) 65%, transparent);
  outline-offset: 1px;
}
.nx-app ::selection {
  background: #315846;
  color: var(--nx-text);
}
.nx-sidebar {
  width: 88px;
  flex: 0 0 88px;
  background: var(--nx-rail);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 22px 12px 16px;
  border-right: 1px solid var(--nx-line);
}
.nx-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  color: var(--nx-accent);
  padding-bottom: 24px;
}
.nx-brand span {
  font-size: 10px;
  letter-spacing: 0.02em;
  color: var(--nx-muted);
  font-weight: 550;
}
.nx-sidebar nav {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  flex-direction: column;
  gap: 5px;
}
.nx-nav-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 53px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--nx-muted);
  transition:
    background 0.16s ease,
    color 0.16s ease;
}
.nx-nav-item span {
  font-size: 11px;
}
.nx-nav-item:hover {
  background: color-mix(in srgb, var(--nx-text) 6%, transparent);
  color: var(--nx-text);
}
.nx-nav-item.is-active {
  background: color-mix(in srgb, var(--nx-accent) 11%, transparent);
  color: var(--nx-accent);
}
.nx-nav-item.is-active::before {
  content: &quot;&quot;;
  position: absolute;
  top: 13px;
  bottom: 13px;
  left: 0;
  width: 2px;
  border-radius: 2px;
  background: var(--nx-accent);
}
.nx-nav-divider {
  height: 1px;
  background: var(--nx-line);
  margin: 14px 8px;
}
.nx-sidebar-foot {
  margin-top: auto;
  padding-top: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 10px;
  color: var(--nx-faint);
}
.nx-live-dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  background: var(--nx-accent);
  border-radius: 50%;
  flex: 0 0 auto;
}
.nx-live-dot.is-offline {
  background: var(--nx-faint);
}
.nx-workspace {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.nx-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 22px 30px 18px;
  border-bottom: 1px solid var(--nx-line);
  flex-shrink: 0;
}
.nx-header h1 {
  font-size: 25px;
  font-weight: 620;
  line-height: 1.3;
  letter-spacing: -0.035em;
}
.nx-header p {
  font-size: 12px;
  color: var(--nx-faint);
  margin-top: 5px;
}
.nx-header-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}
.nx-live-label {
  display: flex;
  gap: 7px;
  align-items: center;
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-working {
  font-size: 12px;
  color: var(--nx-muted);
}
.nx-content {
  min-height: 0;
  flex: 1;
  overflow: auto;
  padding: 20px 30px 30px;
}
.nx-content &gt; * {
  width: 100%;
  min-width: 0;
  max-width: 1180px;
  margin-inline: auto;
}
.nx-eyebrow {
  display: block;
  margin-bottom: 6px;
  color: var(--nx-faint);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
}
.nx-page-enter-active,
.nx-page-leave-active {
  transition:
    opacity 0.18s ease,
    transform 0.18s ease;
}
.nx-page-enter-from {
  opacity: 0;
  transform: translateY(6px);
}
.nx-page-leave-to {
  opacity: 0;
  transform: translateY(-4px);
}
/* ── 首页：一条数值条 + 三个快捷块 ─────────────────────────────── */
.nx-home {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.nx-stat-bar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  overflow: hidden;
  border: 1px solid var(--nx-line);
  border-radius: 16px;
  background: var(--nx-panel);
}
.nx-stat {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  padding: 15px 20px;
}
.nx-stat + .nx-stat {
  border-left: 1px solid var(--nx-line);
}
.nx-stat &gt; span {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-stat &gt; strong {
  overflow: hidden;
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.025em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nx-stat[data-stat=&quot;download&quot;] &gt; strong {
  color: var(--nx-accent);
}
.nx-home-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.nx-quick-card {
  display: flex;
  flex-direction: column;
  gap: 15px;
  min-height: 236px;
  padding: 20px;

  border-radius: 18px;
  background: var(--nx-panel);

}
.nx-quick-card.is-on {
  border-color: color-mix(in srgb, var(--nx-accent) 34%, var(--nx-line));
}
.nx-quick-head {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.nx-quick-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 12px;
  background: var(--nx-input);
  color: var(--nx-muted);
}
.nx-route-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--nx-accent) 12%, transparent);
  color: var(--nx-accent);
}
.nx-quick-card.is-on .nx-quick-icon {
  background: color-mix(in srgb, var(--nx-accent) 14%, transparent);
  color: var(--nx-accent);
}
.nx-quick-title {
  flex: 1;
  min-width: 0;
}
.nx-quick-title h2 {
  font-size: 14px;
}
.nx-quick-title p {
  margin-top: 1px;
  color: var(--nx-faint);
  font-size: 10px;
}
.nx-quick-state {
  padding: 3px 8px;
  border: 1px solid var(--nx-line);
  border-radius: 999px;
  color: var(--nx-muted);
  font-size: 10px;
  white-space: nowrap;
}
.nx-quick-state.is-live {
  border-color: transparent;
  background: color-mix(in srgb, var(--nx-accent) 14%, transparent);
  color: var(--nx-accent);
}
.nx-quick-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.nx-quick-main &gt; strong {
  overflow: hidden;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nx-quick-main &gt; p {
  overflow: hidden;
  color: var(--nx-muted);
  font-size: 11px;
  text-overflow: ellipsis;

}
.nx-quick-actions {
  display: flex;
  align-items: center;
  gap: 8px;

}
.nx-quick-actions &gt; .nx-button:first-child {
  flex: 1;

}
.nx-quick-link {
  gap: 3px;
  padding-inline: 8px;
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-quick-actions--stack {
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}
.nx-home-download {
  display: flex;
  gap: 8px;
  min-width: 0;
}
.nx-home-download &gt; .nx-input {
  flex: 1;
  min-width: 0;
  min-height: 38px;
}
.nx-home-download &gt; .nx-button {
  width: 40px;
  min-height: 38px;
  padding: 0;
  justify-content: center;
}
.nx-home-download + .nx-quick-link {
  align-self: flex-start;
}
.nx-kicker {
  display: block;
  color: var(--nx-faint);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
}
.nx-proxy-top {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
  gap: 14px;
}
.nx-subscribe-summary {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 13px;
}
.nx-subscribe-copy h3 {
  margin-top: 6px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.nx-subscribe-copy p {
  max-width: 52ch;
  margin-top: 5px;
  color: var(--nx-muted);
  font-size: 12px;
}
.nx-subscribe-summary &gt; .nx-button {
  margin-top: auto;
}
.nx-proxy-connection {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.nx-proxy-connection-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nx-proxy-connection-row .nx-control-copy {
  flex: 1;
  min-width: 0;
}
.nx-proxy-connection-row .nx-control-copy strong {
  font-size: 14px;
  font-weight: 600;
}
.nx-proxy-connection-row .nx-control-copy p {
  margin-top: 3px;
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-accel-page {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.nx-accel-control {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 0 20px;
  overflow: hidden;
  padding: 26px 28px;
  border: 1px solid var(--nx-line);
  border-radius: 20px;
  background:
    radial-gradient(
      90% 180% at 0% 50%,
      color-mix(in srgb, var(--nx-accent) 13%, transparent),
      transparent 60%
    ),
    var(--nx-panel);
}
.nx-accel-control.is-on {
  border-color: color-mix(in srgb, var(--nx-accent) 38%, var(--nx-line));
}
.nx-accel-orb {
  display: grid;
  grid-row: 1 / span 2;
  place-items: center;
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  border: 1px solid var(--nx-line);
  border-radius: 18px;
  background: var(--nx-input);
  color: var(--nx-muted);
}
.nx-accel-control.is-on .nx-accel-orb {
  border-color: transparent;
  background: var(--nx-accent);
  color: var(--nx-accent-ink);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--nx-accent) 14%, transparent);
}
.nx-accel-copy {
  min-width: 0;
}
.nx-accel-copy h2 {
  margin-top: 5px;
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -0.03em;
}
.nx-accel-copy p {
  max-width: 62ch;
  margin-top: 4px;
  color: var(--nx-muted);
  font-size: 12px;
}
.nx-accel-control &gt; .nx-button {
  grid-column: 2;
  justify-self: start;
  margin-top: 14px;
}
.nx-button.nx-large {
  min-height: 46px;
  padding-inline: 24px;
  font-size: 14px;
  white-space: nowrap;
}
.nx-accel-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.85fr);
  gap: 20px;
  align-items: stretch;
}
.nx-accel-facts {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.nx-fact {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--nx-line);
}
.nx-fact &gt; span {
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-fact &gt; strong {
  font-size: 12px;
  font-weight: 550;
  text-align: right;
}
.nx-fact-link {
  gap: 4px;
  padding: 0;
  color: var(--nx-accent);
  font-size: 11px;
}
.nx-accel-facts .nx-help {
  margin-top: auto;
}
.nx-accel-lower {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
  gap: 20px;
  align-items: start;
}
.nx-accel-lower.nx-single {
  grid-template-columns: minmax(0, 1fr);
}

.nx-view-stack,
.nx-dashboard {
  display: grid;
  gap: 20px;
  min-width: 0;
}
.nx-dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.75fr) minmax(218px, 1fr);
  gap: 20px;
  align-items: start;
}
.nx-dashboard-main,
.nx-dashboard-side {
  display: grid;
  gap: 20px;
  min-width: 0;
}
.nx-dashboard-hero {
  align-items: stretch;
  grid-template-columns: minmax(0, 1.8fr) minmax(238px, 0.95fr);
}
.nx-dashboard-tiles {
  grid-template-columns: minmax(0, 1.35fr) minmax(185px, 0.82fr) minmax(190px, 0.9fr);
}
.nx-dashboard-lower {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
.nx-accelerate-card {
  display: flex;
  flex-direction: column;
}
.nx-switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.nx-switch-row strong {
  font-size: 13px;
  font-weight: 550;
}
.nx-switch-row p {
  margin-top: 4px;
  font-size: 11px;
  color: var(--nx-muted);
  overflow-wrap: anywhere;
}
.nx-accelerate-card &gt; .nx-help {
  margin-top: 15px;
  font-size: 10px;
  color: var(--nx-faint);
}
.nx-accelerate-state {
  margin-top: 4px;
  color: var(--nx-muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.nx-accelerate-card .nx-block {
  width: 100%;
  min-height: 44px;
  margin-top: 15px;
  font-size: 14px;
}
.nx-line-card {
  display: flex;
  flex-direction: column;
}
.nx-line-current {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.nx-line-current strong {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.nx-line-delay {
  color: var(--nx-accent);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.nx-line-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 5px;
  color: var(--nx-faint);
  font-size: 11px;
}
.nx-line-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: auto;
  padding-top: 17px;
}
.nx-line-select select {
  max-width: 150px;
}
.nx-line-actions .nx-button {
  margin-left: auto;
}
.nx-line-off {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}
.nx-line-off p {
  color: var(--nx-muted);
  font-size: 12px;
}
.nx-donut-row {
  display: flex;
  align-items: center;
  gap: 18px;
}
.nx-donut {
  position: relative;
  display: grid;
  place-items: center;
  width: 78px;
  height: 78px;
  flex: 0 0 78px;
  border-radius: 50%;
}
.nx-donut::after {
  content: &quot;&quot;;
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  background: var(--nx-panel);
}
.nx-donut span {
  position: relative;
  z-index: 1;
  color: var(--nx-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.nx-traffic-legend {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.nx-traffic-legend &gt; div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nx-traffic-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--nx-muted);
  font-size: 11px;
}
.nx-traffic-legend strong {
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.nx-legend-down svg {
  color: var(--nx-accent);
}
.nx-legend-up svg {
  color: #8f9a94;
}
.nx-traffic-card &gt; .nx-help {
  margin-top: 15px;
  color: var(--nx-faint);
  font-size: 10px;
}
.nx-two-columns {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(230px, 1fr);
  gap: 20px;
  align-items: start;
}
.nx-panel {
  border: 1px solid var(--nx-line);
  background: var(--nx-panel);
  border-radius: 16px;
  padding: 20px;
  min-width: 0;
}
.nx-panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
  min-height: 22px;
}
.nx-panel-heading &gt; div {
  min-width: 0;
}
.nx-panel-heading .nx-kicker + h2 {
  margin-top: 4px;
}
.nx-panel-heading h2 {
  display: flex;
  gap: 9px;
  align-items: center;
  color: var(--nx-text);
}
.nx-panel-heading h2 &gt; svg {
  color: var(--nx-muted);
}
.nx-section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.nx-section-heading p {
  font-size: 12px;
  color: var(--nx-muted);
  margin-top: 5px;
}
.nx-subtle,
.nx-help {
  color: var(--nx-muted);
  font-size: 12px;
}
.nx-help {
  line-height: 1.7;
  max-width: 70ch;
}
.nx-panel &gt; .nx-help + .nx-button {
  margin-top: 14px;
}
.nx-empty-inline {
  padding: 20px 0 6px;
  color: var(--nx-faint);
  font-size: 12px;
}
.nx-button {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 34px;
  padding: 7px 12px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: none;
  color: var(--nx-text);
  font-size: 12px;
  font-weight: 550;
  line-height: 1.4;
  white-space: nowrap;
  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease;

.nx-button svg {

.nx-primary {
  background: var(--nx-accent);
  color: var(--nx-accent-ink);
  border-color: var(--nx-accent);
}
.nx-primary:hover:not(:disabled) {
  filter: brightness(0.94);
}
.nx-primary:active:not(:disabled) {
  filter: brightness(0.88);
}
.nx-secondary {
  background: #252d29;
  border-color: #37463d;

.nx-checkbox {

.nx-list-toolbar {

.nx-filter-tabs {

.nx-filter-tabs &gt; button {

.nx-file-icon {

.nx-task-title {

.nx-task-meta {

.nx-meta-divider {

.nx-task-controls {

.nx-task-details {

.nx-small-select {

.nx-small-select select {

}
.nx-state-error {

}
.nx-diagnose-start {

}
.nx-diagnose-symbol {

.nx-diagnose-start &gt; h2 {

.nx-diagnose-start &gt; p {

}
.nx-diagnose-start &gt; .nx-inline-form {

.nx-diagnose-options {

}
.nx-diagnose-options &gt; label {

  align-items: center;

}
.nx-diagnose-options input {

.nx-report-heading {

  margin-bottom: 20px;
}
.nx-result-icon {

.nx-result-icon.is-failure {

}
.nx-report-heading h2 {

}
.nx-report-heading p {
  font-size: 11px;
  color: var(--nx-muted);
  margin-top: 4px;
}
.nx-check-list {
  display: grid;
  gap: 0;
}
.nx-check-row {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto 66px;
  align-items: center;
  gap: 11px;
  min-height: 47px;

}
.nx-check-row:last-child {
  border-bottom: 0;
}
.nx-check-status {
  display: grid;

}
.nx-check-status.is-failure {

}
.nx-check-row strong {

.nx-check-row &gt; span:not(.nx-check-status) {

}
.nx-check-row time {

  color: var(--nx-faint);

}
.nx-report-advice {

  color: var(--nx-muted);

}
.nx-report-detail-button {
  font-size: 11px;
  padding-left: 0;
  margin-top: 10px;
}
.nx-check-evidence {

  gap: 14px;
}
.nx-check-evidence &gt; div {

  background: var(--nx-input);

  min-width: 0;
}
.nx-check-evidence strong {
  font-size: 11px;
  font-weight: 500;
  color: var(--nx-muted);
}
.nx-check-evidence p {
  font-size: 11px;
  line-height: 1.7;

}
.nx-history &gt; .nx-section-heading {
  padding-bottom: 10px;
}
.nx-history-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 2px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--nx-line);
  text-align: left;
  color: var(--nx-text);
}
.nx-history-row:hover {
  background: color-mix(in srgb, var(--nx-text) 3%, transparent);
}
.nx-history-row &gt; strong {
  font-size: 12px;
  font-weight: 500;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nx-history-row &gt; span:not(.nx-history-result),
.nx-history-row &gt; time {
  font-size: 10px;
  color: var(--nx-faint);
}
.nx-history-result {
  color: var(--nx-accent);
}
.nx-history-result.is-failure {
  color: var(--nx-warning);
}
.nx-diagnose-empty {
  font-size: 12px;
  padding-block: 28px;
}
.nx-diagnose-pending &gt; p {
  font-size: 12px;
  color: var(--nx-muted);
  margin-block: 15px;
}
.nx-skeleton {
  background: linear-gradient(100deg, var(--nx-line) 20%, #303b33 45%, var(--nx-line) 70%);
  background-size: 220% 100%;
  border-radius: 8px;
  animation: nx-loading-sheen 1.6s ease infinite;
}
.nx-skeleton-title {
  height: 15px;
  width: 180px;
}
.nx-skeleton-row {
  height: 35px;
  width: 100%;
  margin-block: 10px;
}
.nx-loading-banner {
  height: 100px;
}
.nx-loading-grid {
  display: grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 20px;
  margin-top: 20px;
}
.nx-loading-chart {
  height: 250px;
}
.nx-loading &gt; p {
  font-size: 12px;
  color: var(--nx-muted);
  margin-top: 18px;
}
.nx-loading &gt; .nx-button {
  margin-top: 14px;
}
.nx-interface-list {
  padding-block: 0;
}
.nx-interface {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 16px;
  padding: 22px 0;
  border-bottom: 1px solid var(--nx-line);
}
.nx-interface:last-child {
  border: 0;
}
.nx-interface strong {
  font-size: 13px;
  font-weight: 500;
}
.nx-interface dl {
  display: grid;
  gap: 7px;
  margin: 10px 0 0;
}
.nx-interface dl &gt; div {
  display: flex;
  gap: 18px;
  font-size: 11px;
  min-width: 0;
}
.nx-interface dt {
  min-width: 52px;
  color: var(--nx-faint);
}
.nx-interface dd {
  margin: 0;
  color: var(--nx-muted);
  overflow-wrap: anywhere;
}
.nx-query-result {
  border-top: 1px solid var(--nx-line);
  padding-top: 14px;
}
.nx-query-address {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  margin-top: 8px;
}
.nx-rule-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(100px, 0.65fr) 30px;
  gap: 8px;
}
.nx-table-panel {
  padding: 0;
  overflow: hidden;
}
.nx-table-scroll {
  overflow: auto;
  max-width: 100%;
}
.nx-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
  white-space: nowrap;
  text-align: left;
}
.nx-table th {
  font-size: 10px;
  color: var(--nx-faint);
  font-weight: 450;
  padding: 13px 17px;
  border-bottom: 1px solid var(--nx-line);
}
.nx-table td {
  padding: 14px 17px;
  border-bottom: 1px solid #29312c;
  color: var(--nx-muted);
}
.nx-table tr:last-child td {
  border-bottom: 0;
}
.nx-table td strong {
  font-size: 12px;
  font-weight: 500;
  color: var(--nx-text);
  display: block;
  max-width: 180px;
  text-overflow: ellipsis;
  overflow: hidden;
}
.nx-table td small {
  font-size: 10px;
  color: var(--nx-faint);
  display: block;
  margin-top: 3px;
}
.nx-table tbody tr:hover {
  background: #202822;
}
.nx-table .nx-data-cell {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.nx-protocol {
  font-size: 10px;
  color: var(--nx-faint);
  padding: 2px 5px;
  border: 1px solid #39433c;
  border-radius: 4px;
}
.nx-connection-state {
  font-size: 11px;
  color: var(--nx-faint);
}
.nx-connection-state.is-live {
  color: #9bc9ac;
}
.nx-table-loading {
  padding: 10px 18px;
}
.nx-load-more {
  width: 100%;
  border-top: 1px solid var(--nx-line);
  border-radius: 0;
  min-height: 39px;
  font-size: 11px;
}
.nx-application-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  padding-block: 8px;
}
.nx-application-actions p {
  color: var(--nx-muted);
  font-size: 11px;
  margin: 6px 0 13px;
}
.nx-transaction-list &gt; .nx-panel-heading {
  margin-bottom: 5px;
}
.nx-transaction {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px 0;
  border-bottom: 1px solid var(--nx-line);
}
.nx-transaction:last-child {
  border-bottom: 0;
}
.nx-transaction-icon {
  color: var(--nx-faint);
}
.nx-transaction &gt; div {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.nx-transaction strong {
  font-size: 12px;
  font-weight: 500;
}
.nx-transaction p,
.nx-transaction small {
  font-size: 10px;
  color: var(--nx-faint);
  display: block;
  margin-top: 3px;
}
.nx-status-text {
  font-size: 10px;
  color: var(--nx-muted);
  white-space: nowrap;
}
.nx-status-text.is-warning {
  color: var(--nx-warning);
}
.nx-schedule-form {
  margin-top: 15px;
}
.nx-schedule-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid var(--nx-line);
}
.nx-schedule-row:last-child {
  border-bottom: 0;
}
.nx-schedule-row &gt; div {
  flex: 1;
  min-width: 0;
}
.nx-schedule-row strong {
  font-size: 12px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.nx-schedule-row small {
  display: block;
  color: var(--nx-faint);
  font-size: 10px;
  margin-top: 4px;
}
.nx-settings-rows {
  padding-block: 0;
}
.nx-settings-rows &gt; div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 20px 0;
  border-bottom: 1px solid var(--nx-line);
}
.nx-settings-rows &gt; div:last-child {
  border: 0;
}
.nx-settings-rows strong {
  font-size: 12px;
  font-weight: 500;
  display: block;
}
.nx-settings-rows small {
  font-size: 11px;
  color: var(--nx-muted);
  display: block;
  margin-top: 5px;
}
.nx-host .plugin-page-instance {
  height: 100%;
}
.nx-quick-app {
  /* user:“这个卡片的深色是由卡片右侧栏本身提供的”+(右侧栏已经是毛玻璃卡片；这里只叠半透明胶囊，
     文字跟随 backdrop 主题，不再铺一层 --theme-main-background 的实心面板)。 */
  --nx-text: var(--theme-backdrop-text, var(--theme-main-text, #e8eeeb));
  --nx-muted: color-mix(in srgb, var(--nx-text) 60%, transparent);
  --nx-faint: color-mix(in srgb, var(--nx-text) 40%, transparent);
  --nx-line: color-mix(in srgb, var(--nx-text) 11%, transparent);
  --nx-accent: var(--green, #8ae6bf);
  --nx-accent-ink: color-mix(in srgb, var(--green, #8ae6bf) 18%, #000);
  --nx-panel: transparent;
  --nx-panel-hover: color-mix(in srgb, var(--nx-text) 7%, transparent);
  --nx-input: color-mix(in srgb, var(--nx-text) 5%, transparent);
  display: block;
  height: auto;
  min-height: 0;
  width: 100%;
  max-width: 100%;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  overflow: visible;
}
.nx-pill-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.nx-quick-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 46px;
  padding: 6px 8px 6px 10px;
  border: 1px solid color-mix(in srgb, var(--nx-text) 9%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--nx-text) 4%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--nx-text) 5%, transparent);
  color: var(--nx-text);
  transition:
    border-color 0.16s ease,
    background 0.16s ease;
}
.nx-quick-pill:focus-within {
  border-color: color-mix(in srgb, var(--nx-accent) 42%, var(--nx-line));
}
.nx-quick-pill.is-on {
  border-color: color-mix(in srgb, var(--nx-accent) 30%, transparent);
  background: color-mix(in srgb, var(--nx-accent) 6%, transparent);
}
.nx-pill-icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--nx-text) 6%, transparent);
  color: var(--nx-muted);
}
.nx-quick-pill.is-on .nx-pill-icon {
  background: color-mix(in srgb, var(--nx-accent) 13%, transparent);
  color: var(--nx-accent);
}
.nx-pill-value {
  flex: 1;
  min-width: 0;
  color: var(--nx-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.nx-pill-value.is-live {
  color: var(--nx-accent);
}
.nx-mini-action {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  padding: 0;
  border: 1px solid var(--nx-line);
  border-radius: 50%;
  background: transparent;
  color: var(--nx-muted);
  transition:
    border-color 0.16s ease,
    background 0.16s ease,
    color 0.16s ease;
}
.nx-mini-action:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--nx-accent) 36%, var(--nx-line));
  color: var(--nx-text);
}
.nx-mini-action.is-on,
.nx-mini-action.is-ready {
  border-color: transparent;
  background: var(--nx-accent);
  color: var(--nx-accent-ink);
}
.nx-mini-action:disabled {
  opacity: 0.38;
}
.nx-node-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
}
.nx-node-select {
  width: 100%;
  min-width: 0;
  height: 32px;
  padding: 0 18px 0 2px;
  border: 0;
  background: transparent;
  color: var(--nx-text);
  font-size: 11px;
  text-overflow: ellipsis;
  appearance: none;
  cursor: pointer;
}
.nx-node-select:focus {
  outline: none;
}
.nx-chevron {
  position: absolute;
  right: 2px;
  color: var(--nx-faint);
  pointer-events: none;
}
.nx-download-form {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.nx-download-form &gt; input {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 2px;
  border: 0;
  background: transparent;
  color: var(--nx-text);
  font-size: 11px;
  outline: none;
}
.nx-download-form &gt; input::placeholder {
  color: var(--nx-faint);
}
.nx-quick-error,
.nx-quick-note {
  margin: 8px 4px 0 !important;
  font-size: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.nx-quick-error {
  color: var(--nx-error);
}
.nx-quick-note {
  color: var(--nx-accent);
}
@keyframes nx-loading-sheen {
  to {
    background-position: -220% 0;
  }
}
@container nx-shell (max-width:850px) {
  .nx-sidebar {
    width: 76px;
    flex-basis: 76px;
    padding-inline: 9px;
  }
  .nx-header {
    padding: 23px 22px 20px;
  }
  .nx-content {
    padding: 0 22px 24px;
  }
  .nx-notice {
    margin-inline: 22px;
  }
  .nx-panel {
    padding: 17px;
  }
  .nx-dashboard-grid {
    gap: 16px;
    grid-template-columns: minmax(0, 1.65fr) minmax(205px, 1fr);
  }
  .nx-dashboard-hero {
    grid-template-columns: minmax(0, 1.5fr) minmax(210px, 1fr);
  }
  .nx-dashboard-tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .nx-dashboard-lower {
    grid-template-columns: minmax(0, 1fr);
  }
  .nx-stat-bar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .nx-stat:nth-child(3) {
    border-top: 1px solid var(--nx-line);
    border-left: 0;
  }
  .nx-stat:nth-child(4) {
    border-top: 1px solid var(--nx-line);
  }
  .nx-home-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .nx-quick-card {
    min-height: 0;
  }
  .nx-proxy-top {
    grid-template-columns: minmax(0, 1fr);
  }
  .nx-accel-control {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .nx-accel-control &gt; .nx-button {
    grid-column: 1 / -1;
    width: 100%;
  }
  .nx-accel-grid,
  .nx-accel-lower {
