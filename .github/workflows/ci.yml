name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check whitespace
        run: git diff --check

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('members/writer/backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          cd members/writer/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Check Python syntax
        run: |
          cd members/writer/backend
          python -m py_compile app/main.py

      - name: Run backend tests
        run: |
          cd members/writer/backend
          export PYTHONPATH="$GITHUB_WORKSPACE/core/src"
          export LAMWRITER_DATA_DIR="$RUNNER_TEMP/lamwriter-data"
          export LAMWRITER_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/lamwriter-data/lamwriter.db"
          pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            core/ui/package-lock.json
            members/writer/frontend/package-lock.json

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        run: |
          cd core/ui
          npm ci
          cd ../../members/writer/frontend
          npm ci

      - name: Lint core UI
        run: |
          cd core/ui
          npm run typecheck

      - name: Build core UI
        run: |
          cd core/ui
          npm run build

      - name: Lint writer frontend
        run: |
          cd members/writer/frontend
          npm run lint

      - name: Build writer frontend
        run: |
          cd members/writer/frontend
          npm run build

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          cd members/writer/backend
          pip install -r requirements.txt

      - name: Run security check
        run: |
          pip install bandit
          bandit -r members/writer/backend/app -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
