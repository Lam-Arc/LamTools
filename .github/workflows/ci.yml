name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check whitespace
        run: git diff --check

      - name: Install Core backend (editable) + test deps
        run: |
          cd core
          pip install -e ".[dev]"

      - name: Run Core backend tests
        run: |
          cd core
          pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: core/ui/package-lock.json

      - name: Check whitespace
        run: git diff --check

      - name: Install Core UI dependencies
        run: |
          cd core/ui
          npm ci

      - name: Typecheck Core UI
        run: |
          cd core/ui
          npm run typecheck

      - name: Run Core UI contract tests
        run: |
          cd core/ui
          npm run test:contract

      - name: Build Core UI
        run: |
          cd core/ui
          npm run build

  mobile-android:
    # The Android app must consume the shared Rust Agent core. This job keeps
    # frontend-only provider loops from returning and compiles the real Tauri
    # Android host whenever shared repository code changes.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: core/mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install mobile dependencies
        run: |
          cd core/mobile
          npm ci

      - name: Verify shared Rust boundary and mobile contracts
        run: |
          cd core/mobile
          npm test -- --reporter=dot
          npm run typecheck
          npm run build
          cd ../..
          cargo test --manifest-path core/runtime-rs/Cargo.toml

      - name: Build Tauri Android debug APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd core/mobile
          npm run tauri -- android build --apk --target aarch64 --debug --ci
          test -n "$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"

  desktop-linux:
    # Keep a pinned Ubuntu image for the native WebKit/Tauri toolchain. The
    # packaging script owns Node, Python, Rust, sidecar, and bundle setup.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            ca-certificates \
            file \
            pkg-config \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            desktop-file-utils \
            appstream \
            squashfs-tools \
            libfuse2 \
            xvfb \
            xauth \
            dbus-x11

      - name: Build and validate Linux sidecar and bundles
        run: |
          bash scripts/package-linux.sh

      - name: Verify standard Linux artifact paths
        run: |
          test -x artifacts/linux-x64/sidecar/LamCore
          test -n "$(find core/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name 'Sunday_*_amd64.AppImage' -print -quit)"
          test -n "$(find core/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name 'Sunday_*_amd64.deb' -print -quit)"
