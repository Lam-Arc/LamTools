name: Build & Release

# 自动打包发布：
#   - 推 tag v*（如 v0.2.4）：构建并发布到 GitHub Releases
#   - 手动触发（workflow_dispatch）：仅构建验证，产物上传为 Actions artifact，
#     不上传 Release（避免分支 ref 被当成 tag 名）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 0. tag ↔ 版本号一致性校验 ----------
      # 发布前断言 tag（v0.3.0）与 5 处版本号同步，杜绝"漏跑 bump-version 后
      # 0.2.3 的安装包挂到 v0.3.0 Release 名下"的错版发布（audit 14 S2 —
      # 错版会让 update.check 提示死循环）。
      # 仅 tag 触发时执行：workflow_dispatch（构建验证）的 ref 是分支名
      # （如 main），校验会因 "not a vX.Y.Z tag" 自杀——手动触发不发布，
      # 无需版本断言（2026-08-17 实测发现）。
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match '^v\d+\.\d+\.\d+$')) {
            Write-Error "Tag '$tag' is not a vX.Y.Z tag"
            exit 1
          }
          $expected = $tag.Substring(1)
          $files = @{
            'core/src/lamtools_core/__init__.py' = '__version__ = "([^"]+)"'
            'core/desktop/src-tauri/tauri.conf.json' = '"version"\s*:\s*"([^"]+)"'
            'core/desktop/src-tauri/Cargo.toml' = '^version\s*=\s*"([^"]+)"'
            'core/desktop/package.json' = '"version"\s*:\s*"([^"]+)"'
            'core/pyproject.toml' = '^version\s*=\s*"([^"]+)"'
          }
          $failed = $false
          foreach ($file in $files.Keys) {
            if (-not (Test-Path $file)) {
              Write-Error "Version file missing: $file"
              $failed = $true
              continue
            }
            $content = Get-Content $file -Raw
            $match = [regex]::Match($content, $files[$file], [System.Text.RegularExpressions.RegexOptions]::Multiline)
            if (-not $match.Success) {
              Write-Error "Version pattern not found in $file"
              $failed = $true
              continue
            }
            $actual = $match.Groups[1].Value
            if ($actual -ne $expected) {
              Write-Error "Version mismatch in ${file}: expected $expected, found $actual"
              $failed = $true
            } else {
              Write-Host "OK $file = $actual"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All 5 version locations match tag $tag"

      # ---------- 1. 前端构建 ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            core/ui/package-lock.json
            core/desktop/package-lock.json

      - name: Install core/ui dependencies (desktop imports ui sources)
        run: |
          cd core/ui
          npm ci

      - name: Build Core Desktop frontend
        run: |
          cd core/desktop
          npm ci
          npm run build

      # ---------- 2. Python 后端 PyInstaller 打包 ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies + PyInstaller
        run: |
          pip install -e "core[desktop]"
          pip install pyinstaller

      - name: Bundle backend with PyInstaller
        # spec: core/lamtools-core-backend.spec（路径相对 spec 所在目录，cd core 后执行；
        # 与本地 scripts/package.ps1 使用同一份 spec，杜绝双 spec 漂移）
        run: |
          cd core
          python -m PyInstaller lamtools-core-backend.spec --clean --noconfirm

      - name: Verify bundled plugin boundary
        shell: pwsh
        run: |
          $plugins = "core/dist/LamCore/_internal/resources/plugins/bundled"
          foreach ($name in @("emotion-ball-pet", "workflow")) {
            $excluded = "$plugins/$name"
            if (Test-Path -LiteralPath $excluded) {
              Write-Error "Excluded bundled plugin must not be embedded in the installer: $excluded"
              exit 1
            }
          }
          foreach ($name in @("git", "imagegen", "websearch")) {
            $required = "$plugins/$name"
            if (-not (Test-Path -LiteralPath $required)) {
              Write-Error "Required bundled plugin is missing: $required"
              exit 1
            }
          }
          Write-Host "Bundled plugin boundary OK (desktop pet and workflow excluded)"

      - name: Smoke-test backend binary
        # desktop_backend.py 不解析参数（--help 会被忽略直接起 uvicorn），所以
        # 用「启动 + 轮询 /api/health」真冒烟：FastAPI 装配、hiddenimports、
        # 默认配置播种（LAMTOOLS_HOME）任一缺失都会导致 health 不通 → 失败。
        shell: pwsh
        run: |
          $port = Get-Random -Minimum 5300 -Maximum 5900
          $env:LAMCORE_PORT = "$port"
          $env:LAMTOOLS_HOME = "$env:TEMP\lamcore-smoke-$PID"
          $p = Start-Process -FilePath "core/dist/LamCore/LamCore.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { Write-Host "Backend exited early (code $($p.ExitCode))"; break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Error "Backend smoke test failed — binary cannot boot (deps / hiddenimports / data missing)"
              exit 1
            }
            Write-Host "Backend smoke test OK (health 200 after $($i + 1)s)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Smoke-test WebSocket handshake
        # 捕获「打包缺 websockets/wsproto 库」类回归：REST health 正常但
        # WebSocket 握手被拒（HTTP 200 而非 101）时，前端会报
        # "Core App Server socket failed" 且供应商管理全不可用。
        shell: pwsh
        run: |
          python -c "import websockets" 2>$null
          if ($LASTEXITCODE -ne 0) { pip install websockets }
          python scripts/verify-backend-ws.py --exe "core/dist/LamCore/LamCore.exe" --port $((Get-Random -Minimum 5300 -Maximum 5900))
          if ($LASTEXITCODE -ne 0) {
            Write-Error "WebSocket smoke test failed — missing websockets/wsproto in bundle?"
            exit 1
          }

      # ---------- 3. Tauri 只构建应用，不调用官方 NSIS bundler ----------
      - name: Build Tauri application executable
        run: |
          cd core/desktop
          npx tauri build --no-bundle

      # ---------- 4. 项目自有 Inno Setup 安装器 ----------
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.6.1 --allow-downgrade --no-progress --yes

      - name: Stage app payload and build Sunday installer
        shell: pwsh
        run: |
          $version = (Get-Content "core/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $releaseDir = [System.IO.Path]::GetFullPath("core/desktop/src-tauri/target/release")
          $stageDir = Join-Path $releaseDir "sunday-installer/stage"
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $releaseDir "lamcore.exe") -Destination (Join-Path $stageDir "lamcore.exe")
          Copy-Item -LiteralPath "core/dist/LamCore" -Destination (Join-Path $stageDir "lamcore-backend") -Recurse

          $outputDir = Join-Path $releaseDir "bundle/inno"
          & "core/desktop/installer/build-installer.ps1" -Version $version -SourceRoot $stageDir -OutputDir $outputDir
          $installer = Join-Path $outputDir "Sunday_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-Error "Sunday installer was not produced at $installer"
            exit 1
          }
          Write-Host "Installer: $installer ($([math]::Round((Get-Item $installer).Length / 1MB, 1)) MB)"

      # ---------- 4.5 安装 / 运行 / 升级 / 卸载真冒烟 ----------
      - name: Smoke Sunday installer lifecycle and data preservation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "sunday-installed"
          $installer = Get-ChildItem "core/desktop/src-tauri/target/release/bundle/inno/Sunday_*_x64-setup.exe" -ErrorAction Stop | Select-Object -First 1
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $p = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Installer exited nonzero ($($p.ExitCode))"; exit 1 }
          if (-not (Test-Path (Join-Path $installDir "lamcore.exe"))) {
            Write-Error "lamcore.exe missing after install"
            exit 1
          }
          if (-not (Test-Path (Join-Path $installDir "lamcore-backend/LamCore.exe"))) {
            Write-Error "Bundled backend missing after install"
            exit 1
          }
          Write-Host "Installed to $installDir"

          $app = Start-Process -FilePath (Join-Path $installDir "lamcore.exe") -PassThru
          $port = $null
          $ok = $false
          try {
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($app.HasExited) { Write-Host "lamcore.exe exited early (code $($app.ExitCode))"; break }
              if (-not $port) {
                $log = Join-Path $installDir ".lam\backend.log"
                if (Test-Path $log) {
                  $m = Select-String -Path $log -Pattern "Starting LamCore backend on 127\.0\.0\.1:(\d+)" | Select-Object -Last 1
                  if ($m -and $m.Matches.Count -gt 0) { $port = [int]$m.Matches[0].Groups[1].Value }
                }
              }
              if ($port) {
                try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $ok = $true; break }
                } catch { }
              }
            }
            if (-not $ok) {
              Write-Error "Installed app health failed — Sunday cannot boot its bundled backend"
              exit 1
            }
            Write-Host "Installed Sunday health OK on port $port after $($i + 1)s"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $installPrefix = $installDir.TrimEnd('\') + '\'
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installPrefix, [System.StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

          # A same-AppId upgrade must never erase green-mode user data.
          New-Item -ItemType Directory -Path (Join-Path $installDir ".lam") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $installDir "lam_projects") -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $installDir ".lam/upgrade-marker.txt") -Value "keep"
          Set-Content -LiteralPath (Join-Path $installDir "lam_projects/upgrade-marker.txt") -Value "keep"
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { Write-Error "Upgrade exited nonzero ($($upgrade.ExitCode))"; exit 1 }
          foreach ($marker in @(".lam/upgrade-marker.txt", "lam_projects/upgrade-marker.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $marker))) {
              Write-Error "Upgrade removed user data: $marker"
              exit 1
            }
          }

          # Default uninstall removes program files/shortcuts but keeps user data.
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "unins*.exe" -File | Select-Object -First 1
          if (-not $uninstaller) { Write-Error "Inno uninstaller was not registered"; exit 1 }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { Write-Error "Uninstaller exited nonzero ($($uninstall.ExitCode))"; exit 1 }
          if (Test-Path -LiteralPath (Join-Path $installDir "lamcore.exe")) {
            Write-Error "Uninstaller left the Sunday executable behind"
            exit 1
          }
          foreach ($marker in @(".lam/upgrade-marker.txt", "lam_projects/upgrade-marker.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $marker))) {
              Write-Error "Uninstaller removed preserved user data: $marker"
              exit 1
            }
          }
          Remove-Item -LiteralPath $installDir -Recurse -Force
          Write-Host "Install, launch, in-place upgrade, uninstall, and data-preservation checks passed"

      # ---------- 5. 上传 ----------
      # tag 触发 → 发布到 GitHub Releases；手动触发 → 仅作为构建产物保留
      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: core/desktop/src-tauri/target/release/bundle/inno/Sunday_*_x64-setup.exe
          generate_release_notes: true
          # 同一 tag 重复构建时更新资产但不重复追加 notes
          update_release_body: false
          fail_on_unmatched_files: true

      - name: Upload installer as build artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sunday-installer
          path: core/desktop/src-tauri/target/release/bundle/inno/Sunday_*_x64-setup.exe

  build-linux:
    # package-linux.sh builds the native x64 sidecar and Tauri bundles. Windows
    # remains in the separate job above, including its repository-owned Inno path.
    # Waiting for it also gives the two tag uploads one deterministic Release
    # creator and preserves the existing Windows release sequence.
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            ca-certificates \
            file \
            pkg-config \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            desktop-file-utils \
            appstream \
            squashfs-tools \
            libfuse2 \
            xvfb \
            xauth \
            dbus-x11

      - name: Build Linux sidecar and bundles
        run: |
          bash scripts/package-linux.sh

      - name: Verify standard Linux artifact paths and sidecar
        run: |
          test -x artifacts/linux-x64/sidecar/LamCore
          test -n "$(find core/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name 'Sunday_*_amd64.AppImage' -print -quit)"
          test -n "$(find core/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name 'Sunday_*_amd64.deb' -print -quit)"

      # Tag runs add both Linux assets to the same release created by the
      # Windows job. Manual runs remain validation-only and upload artifacts.
      - name: Upload Linux bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/desktop/src-tauri/target/release/bundle/appimage/Sunday_*_amd64.AppImage
            core/desktop/src-tauri/target/release/bundle/deb/Sunday_*_amd64.deb
          generate_release_notes: false
          update_release_body: false
          fail_on_unmatched_files: true

      - name: Upload Linux bundles as build artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sunday-linux-x64
          path: |
            core/desktop/src-tauri/target/release/bundle/appimage/Sunday_*_amd64.AppImage
            core/desktop/src-tauri/target/release/bundle/deb/Sunday_*_amd64.deb
