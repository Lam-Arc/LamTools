name: Build & Release

# 自动打包发布：
#   - 推 tag v*（如 v0.2.4）：构建并发布到 GitHub Releases
#   - 手动触发（workflow_dispatch）：仅构建验证，产物上传为 Actions artifact，
#     不上传 Release（避免分支 ref 被当成 tag 名）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 0. tag ↔ 版本号一致性校验 ----------
      # 发布前断言 tag（v0.3.0）与 5 处版本号同步，杜绝"漏跑 bump-version 后
      # 0.2.3 的安装包挂到 v0.3.0 Release 名下"的错版发布（audit 14 S2 —
      # 错版会让 update.check 提示死循环）。
      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match '^v\d+\.\d+\.\d+$')) {
            Write-Error "Tag '$tag' is not a vX.Y.Z tag"
            exit 1
          }
          $expected = $tag.Substring(1)
          $files = @{
            'core/src/lamtools_core/__init__.py' = '__version__ = "([^"]+)"'
            'core/desktop/src-tauri/tauri.conf.json' = '"version"\s*:\s*"([^"]+)"'
            'core/desktop/src-tauri/Cargo.toml' = '^version\s*=\s*"([^"]+)"'
            'core/desktop/package.json' = '"version"\s*:\s*"([^"]+)"'
            'core/pyproject.toml' = '^version\s*=\s*"([^"]+)"'
          }
          $failed = $false
          foreach ($file in $files.Keys) {
            if (-not (Test-Path $file)) {
              Write-Error "Version file missing: $file"
              $failed = $true
              continue
            }
            $content = Get-Content $file -Raw
            $match = [regex]::Match($content, $files[$file], [System.Text.RegularExpressions.RegexOptions]::Multiline)
            if (-not $match.Success) {
              Write-Error "Version pattern not found in $file"
              $failed = $true
              continue
            }
            $actual = $match.Groups[1].Value
            if ($actual -ne $expected) {
              Write-Error "Version mismatch in $file: expected $expected, found $actual"
              $failed = $true
            } else {
              Write-Host "OK $file = $actual"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All 5 version locations match tag $tag"

      # ---------- 1. 前端构建 ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            core/ui/package-lock.json
            core/desktop/package-lock.json

      - name: Install core/ui dependencies (desktop imports ui sources)
        run: |
          cd core/ui
          npm ci

      - name: Build Core Desktop frontend
        run: |
          cd core/desktop
          npm ci
          npm run build

      # ---------- 2. Python 后端 PyInstaller 打包 ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies + PyInstaller
        run: |
          pip install -e "core[desktop]"
          pip install pyinstaller

      - name: Bundle backend with PyInstaller
        # spec: core/lamtools-core-backend.spec（路径相对 spec 所在目录，cd core 后执行；
        # 与本地 scripts/package.ps1 使用同一份 spec，杜绝双 spec 漂移）
        run: |
          cd core
          python -m PyInstaller lamtools-core-backend.spec --clean --noconfirm

      - name: Smoke-test backend binary
        # desktop_backend.py 不解析参数（--help 会被忽略直接起 uvicorn），所以
        # 用「启动 + 轮询 /api/health」真冒烟：FastAPI 装配、hiddenimports、
        # 默认配置播种（LAMTOOLS_HOME）任一缺失都会导致 health 不通 → 失败。
        shell: pwsh
        run: |
          $port = Get-Random -Minimum 5300 -Maximum 5900
          $env:LAMCORE_PORT = "$port"
          $env:LAMTOOLS_HOME = "$env:TEMP\lamcore-smoke-$PID"
          $p = Start-Process -FilePath "core/dist/LamCore/LamCore.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { Write-Host "Backend exited early (code $($p.ExitCode))"; break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Error "Backend smoke test failed — binary cannot boot (deps / hiddenimports / data missing)"
              exit 1
            }
            Write-Host "Backend smoke test OK (health 200 after $($i + 1)s)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      # ---------- 3. 后端资源复制进 Tauri ----------
      - name: Copy backend into src-tauri resources
        shell: pwsh
        run: |
          $ResourceDir = "core/desktop/src-tauri/lamcore-backend"
          if (Test-Path $ResourceDir) { Remove-Item -Recurse -Force $ResourceDir }
          Copy-Item -Recurse "core/dist/LamCore" $ResourceDir
          Write-Host "Backend copied to $ResourceDir"

      # ---------- 4. Tauri 打包 NSIS 安装包 ----------
      - name: Build Tauri installer
        run: |
          cd core/desktop
          npx tauri build

      - name: Verify installer produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem "core/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "NSIS installer was not produced — tauri build failed silently?"
            exit 1
          }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

      # ---------- 5. 上传 ----------
      # tag 触发 → 发布到 GitHub Releases；手动触发 → 仅作为构建产物保留
      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: core/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload installer as build artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lamcore-installer
          path: core/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
