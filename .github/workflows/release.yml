name: Build & Release

# 自动打包发布：推一个 v*.*.* 标签即可触发
# 用法：git tag v0.2.2 && git push origin v0.2.2
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. 前端构建 ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            core/ui/package-lock.json
            core/desktop/package-lock.json

      - name: Install core/ui dependencies (desktop imports ui sources)
        run: |
          cd core/ui
          npm ci

      - name: Build Core Desktop frontend
        run: |
          cd core/desktop
          npm ci
          npm run build

      # ---------- 2. Python 后端 PyInstaller 打包 ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies + PyInstaller
        run: |
          pip install -e "core[desktop]"
          pip install pyinstaller

      - name: Bundle backend with PyInstaller
        # spec 位于 core/ 下，路径为相对 spec 所在目录（desktop_backend.py 等），cd core 后执行
        run: |
          cd core
          python -m PyInstaller lamtools-core-backend.spec --clean --noconfirm

      # ---------- 3. 后端资源复制进 Tauri ----------
      - name: Copy backend into src-tauri resources
        shell: pwsh
        run: |
          $ResourceDir = "core/desktop/src-tauri/lamcore-backend"
          if (Test-Path $ResourceDir) { Remove-Item -Recurse -Force $ResourceDir }
          Copy-Item -Recurse "core/dist/LamCore" $ResourceDir
          Write-Host "Backend copied to $ResourceDir"

      # ---------- 4. Tauri 打包 NSIS 安装包 ----------
      - name: Build Tauri installer
        run: |
          cd core/desktop
          npx tauri build

      # ---------- 5. 上传安装包到 Release ----------
      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            core/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          generate_release_notes: true
          # 同一 tag 重复构建时更新已有 Release 而非追加重复 notes
          update_release_body: false
          fail_on_unmatched_files: false
