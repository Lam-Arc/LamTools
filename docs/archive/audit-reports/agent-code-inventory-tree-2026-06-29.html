<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LamTools Agent 功能树</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #262625;
      --panel-2: #1d1e1e;
      --panel-3: #30302f;
      --line: #3b3a38;
      --text: #f2efeb;
      --muted: #b8b2aa;
      --faint: #8b857d;
      --green: #32d17d;
      --blue: #79bcff;
      --orange: #ff9142;
      --purple: #bd8cff;
      --red: #f5555d;
      --radius-sm: 6px;
      --radius: 12px;
      --radius-lg: 18px;
      --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
      --shadow: 0 18px 48px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      letter-spacing: 0;
    }

    body {
      overflow-x: hidden;
    }

    #tree-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 18% 20%, rgba(121, 188, 255, .11), transparent 31%),
        radial-gradient(circle at 80% 18%, rgba(50, 209, 125, .08), transparent 29%),
        linear-gradient(135deg, #111111 0%, #171717 45%, #101010 100%);
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 28px;
    }

    .shell {
      width: min(1240px, 100%);
      min-height: calc(100vh - 56px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
    }

    .side,
    .main {
      border: 1px solid rgba(242, 239, 235, .11);
      background: rgba(29, 30, 30, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .side {
      border-radius: var(--radius);
      padding: 18px;
      align-self: start;
      position: sticky;
      top: 28px;
      max-height: calc(100vh - 56px);
      overflow: auto;
    }

    .main {
      border-radius: var(--radius);
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(121, 188, 255, .4);
      background: linear-gradient(145deg, rgba(121, 188, 255, .18), rgba(50, 209, 125, .12));
      display: grid;
      place-items: center;
      font: 700 14px var(--font-mono);
      color: var(--blue);
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .side-section {
      padding-top: 16px;
      border-top: 1px solid rgba(242, 239, 235, .1);
      margin-top: 16px;
    }

    .side-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-list {
      display: grid;
      gap: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(242, 239, 235, .07);
      color: var(--muted);
      font-size: 13px;
    }

    .metric strong {
      color: var(--text);
      font-weight: 650;
    }

    .nav-stack {
      display: grid;
      gap: 8px;
    }

    .nav-button {
      width: 100%;
      border: 1px solid rgba(242, 239, 235, .12);
      border-radius: 8px;
      background: rgba(38, 38, 37, .8);
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      border-color: rgba(121, 188, 255, .55);
      background: rgba(48, 48, 47, .9);
      outline: none;
      transform: translateY(-1px);
    }

    .nav-button.active {
      border-color: rgba(50, 209, 125, .62);
      background: rgba(50, 209, 125, .12);
    }

    .nav-button span:last-child {
      color: var(--muted);
      font: 600 12px var(--font-mono);
    }

    .topbar {
      min-height: 84px;
      border-bottom: 1px solid rgba(242, 239, 235, .1);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(17, 17, 17, .42);
    }

    .crumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .crumb {
      border: 1px solid rgba(242, 239, 235, .13);
      background: rgba(38, 38, 37, .72);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .crumb:hover,
    .crumb:focus-visible {
      border-color: rgba(121, 188, 255, .56);
      outline: none;
    }

    .crumb.current {
      color: var(--green);
      cursor: default;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tool-button {
      border: 1px solid rgba(242, 239, 235, .13);
      background: rgba(38, 38, 37, .8);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font: 600 13px var(--font-sans);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .tool-button:hover,
    .tool-button:focus-visible {
      border-color: rgba(121, 188, 255, .55);
      background: rgba(48, 48, 47, .9);
      outline: none;
      transform: translateY(-1px);
    }

    .content {
      padding: 24px;
      flex: 1;
      overflow: auto;
    }

    .view-head {
      display: grid;
      gap: 9px;
      margin-bottom: 22px;
      max-width: 860px;
    }

    .view-kicker {
      color: var(--blue);
      font: 700 12px var(--font-mono);
    }

    .view-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.12;
      font-weight: 760;
      text-wrap: balance;
    }

    .view-copy {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 72ch;
      text-wrap: pretty;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    .tree-stage {
      border: 1px solid rgba(242, 239, 235, .12);
      border-radius: var(--radius);
      background: rgba(17, 17, 17, .38);
      overflow: hidden;
    }

    .tree-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(242, 239, 235, .08);
      color: var(--muted);
      font-size: 13px;
    }

    .tree-toolbar strong {
      color: var(--text);
      font-weight: 650;
    }

    .tree-wrap {
      min-height: 520px;
      overflow: auto;
    }

    .tree-svg {
      display: block;
      width: 100%;
      min-width: 820px;
      height: 560px;
    }

    .tree-link {
      fill: none;
      stroke: rgba(184, 178, 170, .42);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: linkDraw .42s ease forwards;
    }

    .tree-node {
      cursor: pointer;
      outline: none;
    }

    .tree-hit {
      fill: transparent;
      pointer-events: all;
    }

    .tree-node circle {
      fill: rgba(38, 38, 37, .96);
      stroke: rgba(242, 239, 235, .2);
      stroke-width: 1.3;
      transition: r .18s ease, stroke .18s ease, fill .18s ease;
    }

    .tree-node[data-tone="blue"] circle { stroke: rgba(121, 188, 255, .72); }
    .tree-node[data-tone="green"] circle { stroke: rgba(50, 209, 125, .72); }
    .tree-node[data-tone="orange"] circle { stroke: rgba(255, 145, 66, .72); }
    .tree-node[data-tone="purple"] circle { stroke: rgba(189, 140, 255, .72); }

    .tree-node:hover circle,
    .tree-node:focus-visible circle {
      r: 12;
      fill: rgba(48, 48, 47, 1);
      stroke-width: 2;
    }

    .tree-node.root circle {
      r: 13;
      fill: rgba(121, 188, 255, .12);
    }

    .tree-node-label {
      fill: var(--text);
      font: 650 14px var(--font-sans);
      dominant-baseline: middle;
      pointer-events: none;
    }

    .tree-node-meta {
      fill: var(--muted);
      font: 600 11px var(--font-mono);
      dominant-baseline: middle;
      pointer-events: none;
    }

    .tree-node-path {
      fill: var(--faint);
      font: 600 10px var(--font-mono);
      dominant-baseline: middle;
      pointer-events: none;
    }

    .tree-node-enter {
      opacity: 0;
      animation: nodeIn .28s ease forwards;
    }

    .small-detail-panel {
      border-top: 1px solid rgba(242, 239, 235, .08);
      background: rgba(17, 17, 17, .34);
    }

    .small-detail-row {
      display: grid;
      grid-template-columns: minmax(180px, .65fr) minmax(0, 1.35fr);
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid rgba(242, 239, 235, .07);
      align-items: start;
    }

    .small-detail-row:first-child {
      border-top: 0;
    }

    .small-detail-title {
      color: var(--text);
      font-weight: 680;
      line-height: 1.45;
    }

    .small-detail-paths {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .card {
      position: relative;
      border: 1px solid rgba(242, 239, 235, .12);
      border-radius: var(--radius);
      background: rgba(38, 38, 37, .78);
      padding: 16px;
      min-height: 160px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: auto 14px 12px auto;
      width: 34px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      opacity: .36;
      transform: scaleX(.35);
      transform-origin: right;
      transition: transform .2s ease, opacity .2s ease;
    }

    .card:hover,
    .card:focus-visible {
      border-color: rgba(121, 188, 255, .56);
      background: rgba(48, 48, 47, .9);
      transform: translateY(-3px);
      outline: none;
    }

    .card:hover::after,
    .card:focus-visible::after {
      opacity: .72;
      transform: scaleX(1);
    }

    .card[data-tone="green"] { color: var(--green); }
    .card[data-tone="blue"] { color: var(--blue); }
    .card[data-tone="orange"] { color: var(--orange); }
    .card[data-tone="purple"] { color: var(--purple); }

    .card-index {
      color: currentColor;
      font: 700 12px var(--font-mono);
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0;
      color: var(--text);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 720;
      text-wrap: balance;
    }

    .card-meta {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .card-count {
      position: absolute;
      top: 14px;
      right: 14px;
      color: var(--text);
      background: rgba(17, 17, 17, .45);
      border: 1px solid rgba(242, 239, 235, .1);
      border-radius: 999px;
      padding: 4px 8px;
      font: 650 12px var(--font-mono);
    }

    .small-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .small-card {
      border: 1px solid rgba(242, 239, 235, .12);
      border-radius: var(--radius);
      background: rgba(38, 38, 37, .78);
      padding: 15px;
      min-height: 144px;
      display: grid;
      gap: 10px;
      align-content: start;
      animation: itemIn .24s ease both;
    }

    .small-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      color: var(--text);
    }

    .path-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .path-chip {
      max-width: 100%;
      border: 1px solid rgba(242, 239, 235, .11);
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(17, 17, 17, .48);
      color: var(--muted);
      font: 600 11px / 1.35 var(--font-mono);
      overflow-wrap: anywhere;
    }

    .judgement {
      color: var(--faint);
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
    }

    .risk-panel {
      margin-top: 22px;
      border: 1px solid rgba(242, 239, 235, .12);
      border-radius: var(--radius);
      background: rgba(17, 17, 17, .42);
      overflow: hidden;
    }

    .risk-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) 86px minmax(0, .8fr);
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid rgba(242, 239, 235, .08);
      color: var(--muted);
      font-size: 13px;
      align-items: center;
    }

    .risk-row:first-child {
      border-top: 0;
      color: var(--text);
      background: rgba(242, 239, 235, .04);
      font-weight: 650;
    }

    .risk-path {
      font-family: var(--font-mono);
      overflow-wrap: anywhere;
    }

    .fade-enter {
      animation: viewIn .24s ease both;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(8px);
        filter: blur(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes nodeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes linkDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (max-width: 880px) {
      .app {
        padding: 12px;
      }

      .shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .side {
        position: static;
        max-height: none;
      }

      .main {
        min-height: 70vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .content {
        padding: 18px;
      }

      .view-title {
        font-size: 26px;
      }

      .risk-row {
        grid-template-columns: 1fr;
      }

      .tree-wrap {
        min-height: 360px;
      }

      .tree-svg {
        min-width: 100%;
        height: 420px;
      }

      .small-detail-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="tree-canvas" aria-hidden="true"></canvas>
  <div class="app">
    <div class="shell">
      <aside class="side" aria-label="导航与统计">
        <div class="brand">
          <div class="mark">LT</div>
          <div>
            <h1 class="brand-title">Agent 功能树</h1>
            <p class="brand-subtitle">基于 2026-06-29 代码功能底图</p>
          </div>
        </div>

        <div class="metric-list" aria-label="覆盖概览">
          <div class="metric"><span>大类</span><strong>4</strong></div>
          <div class="metric"><span>中类</span><strong>21</strong></div>
          <div class="metric"><span>小类</span><strong>101</strong></div>
          <div class="metric"><span>重点</span><strong>Agent 核心能力</strong></div>
        </div>

        <div class="side-section">
          <p class="side-label">大类快速进入</p>
          <div id="side-nav" class="nav-stack"></div>
        </div>

        <div class="side-section">
          <p class="side-label">交互规则</p>
          <div class="metric-list">
            <div class="metric"><span>点击大类</span><strong>进入中类</strong></div>
            <div class="metric"><span>点击中类</span><strong>查看小类</strong></div>
            <div class="metric"><span>返回</span><strong>面包屑</strong></div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <nav id="crumbs" class="crumbs" aria-label="层级导航"></nav>
          <div class="toolbar">
            <button class="tool-button" id="reset-btn" type="button">回到大类</button>
            <button class="tool-button" id="inventory-btn" type="button">打开原始清单</button>
          </div>
        </header>
        <section class="content">
          <div id="view"></div>
        </section>
      </main>
    </div>
  </div>

        parts.push(`<button class="crumb ${state.level === "category" ? "current" : ""}" data-crumb="category" type="button">${category.title}</button>`);
      }
      if (mid) {
        parts.push(`<button class="crumb current" data-crumb="mid" type="button">${mid.title}</button>`);
      }
      crumbs.innerHTML = parts.join("");
      crumbs.querySelector('[data-crumb="root"]')?.addEventListener("click", enterRoot);
      crumbs.querySelector('[data-crumb="category"]')?.addEventListener("click", () => enterCategory(state.categoryId));
    }

    function renderRoot() {
      view.innerHTML = `
        <div class="fade-enter">
          <div class="view-head">
            <div class="view-kicker">Level 1</div>
            <h2 class="view-title">LamTools Agent 代码功能总览</h2>
            <p class="view-copy">四个大类覆盖模型调用前、中、后，以及运行维护相关代码。点击树上的大类节点进入中类，再点击中类进入小类。</p>
          </div>
          ${renderTreeStage({
            title: "大类树",
            meta: "根节点 -> 4 个大类",
            root: { id: "root-node", title: "LamTools Agent", meta: "4 大类", tone: "blue" },
            children: DATA.map(category => ({
              id: category.id,
              title: category.title,
              meta: `${category.mids.length} 中类 / ${countSmalls(category)} 小类`,
              note: category.summary,
              tone: category.tone,
              action: "category"
            }))
          })}
          <section class="risk-panel" aria-label="最大文件信号">
            <div class="risk-row"><span>最大文件信号</span><span>行数</span><span>功能区</span></div>
            ${RISKS.map(row => `
              <div class="risk-row">
                <span class="risk-path">${row[0]}</span>
                <span>${row[1]}</span>
                <span>${row[2]}</span>
              </div>
            `).join("")}
          </section>
        </div>
      `;
      bindTreeNodes();
    }

    function renderCategory(category) {
      view.innerHTML = `
        <div class="fade-enter">
          <div class="view-head">
            <div class="view-kicker">Level 2</div>
            <h2 class="view-title">${category.title}</h2>
            <p class="view-copy">${category.summary} 本层显示所有中类节点，点击任一中类进入对应小类树。</p>
          </div>
          ${renderTreeStage({
            title: `${category.title} 中类树`,
            meta: `1 个大类 -> ${category.mids.length} 个中类`,
            root: { id: category.id, title: category.title, meta: `${countSmalls(category)} 小类`, tone: category.tone },
            children: category.mids.map(mid => ({
              id: mid.id,
              title: mid.title,
              meta: `${mid.smalls.length} 小类`,
              note: mid.summary,
              tone: category.tone,
              action: "mid"
            }))
          })}
        </div>
      `;
      bindTreeNodes();
    }

    function renderMid(category, mid) {
      view.innerHTML = `
        <div class="fade-enter">
          <div class="view-head">
            <div class="view-kicker">Level 3</div>
            <h2 class="view-title">${mid.title}</h2>
            <p class="view-copy">${mid.summary}</p>
          </div>
          ${renderTreeStage({
            title: `${mid.title} 小类树`,
            meta: `1 个中类 -> ${mid.smalls.length} 个小类`,
            root: { id: mid.id, title: mid.title, meta: category.title, tone: category.tone },
            children: mid.smalls.map((small, index) => ({
              id: `small-${index}`,
              title: small.title,
              meta: `${small.paths.length} 路径`,
              note: small.paths[0] || "",
              tone: category.tone,
              action: "small"
            }))
          })}
          <section class="small-detail-panel" aria-label="小类路径明细">
            ${mid.smalls.map(small => `
              <div class="small-detail-row">
                <div class="small-detail-title">${small.title}</div>
                <div class="small-detail-paths">
                  ${small.paths.map(path => `<span class="path-chip">${path}</span>`).join("")}
                </div>
              </div>
            `).join("")}
          </section>
        </div>
      `;
    }

    function renderTreeStage({ title, meta, root, children }) {
      const narrow = window.matchMedia("(max-width: 680px)").matches;
      const width = narrow ? 360 : 940;
      const height = narrow ? Math.max(390, 126 + children.length * 62) : Math.max(500, 122 + children.length * 64);
      const rootX = narrow ? 72 : 170;
      const rootY = height / 2;
      const childX = narrow ? 190 : width - 330;
      const step = children.length > 1 ? Math.min(narrow ? 58 : 74, (height - 130) / (children.length - 1)) : 0;
      const firstY = children.length > 1 ? rootY - ((children.length - 1) * step) / 2 : rootY;
      const nodes = [
        { ...root, x: rootX, y: rootY, root: true },
        ...children.map((child, index) => ({
          ...child,
          x: childX,
          y: firstY + index * step,
          index
        }))
      ];
      const links = children.map((child, index) => {
        const y = firstY + index * step;
        const midX = rootX + (childX - rootX) * .52;
        return `<path class="tree-link" style="animation-delay:${index * 28}ms" d="M ${rootX + 14} ${rootY} C ${midX} ${rootY}, ${midX} ${y}, ${childX - 14} ${y}" />`;
      }).join("");

      return `
        <section class="tree-stage">
          <div class="tree-toolbar">
            <strong>${title}</strong>
            <span>${meta}</span>
          </div>
          <div class="tree-wrap">
            <svg class="tree-svg" style="height:${height}px" viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}">
              <g>${links}</g>
              <g>
                ${nodes.map((node, index) => renderTreeNode(node, index)).join("")}
              </g>
            </svg>
          </div>
        </section>
      `;
    }

    function renderTreeNode(node, index) {
      const classes = `tree-node tree-node-enter ${node.root ? "root" : ""}`;
      const actionAttrs = node.action && node.action !== "small"
        ? `data-tree-action="${node.action}" data-tree-id="${node.id}"`
        : "";
      const note = node.note ? truncateText(node.note, node.action === "small" ? 62 : 74) : "";
      const textX = node.root ? -18 : 20;
      const anchor = node.root ? "end" : "start";
      const metaY = note ? 20 : 18;
      const pathY = note ? 38 : 0;
      const hitX = node.root ? -250 : -18;
      const hitWidth = node.root ? 270 : 360;
      return `
        <g tabindex="${node.action === "small" ? "-1" : "0"}" class="${classes}" data-tone="${node.tone || "blue"}" transform="translate(${node.x} ${node.y})" style="animation-delay:${Math.min(index * 34, 220)}ms" ${actionAttrs}>
          <rect class="tree-hit" x="${hitX}" y="-25" width="${hitWidth}" height="56" rx="10"></rect>
          <circle r="${node.root ? 13 : 9}"></circle>
          <text class="tree-node-label" x="${textX}" y="-6" text-anchor="${anchor}">${escapeHtml(node.title)}</text>
          <text class="tree-node-meta" x="${textX}" y="${metaY}" text-anchor="${anchor}">${escapeHtml(node.meta || "")}</text>
          ${note ? `<text class="tree-node-path" x="${textX}" y="${pathY}" text-anchor="${anchor}">${escapeHtml(note)}</text>` : ""}
        </g>
      `;
    }

    function bindTreeNodes() {
      view.querySelectorAll("[data-tree-action]").forEach(node => {
        bindEnter(node, () => {
          const action = node.dataset.treeAction;
          const id = node.dataset.treeId;
          if (action === "category") enterCategory(id);
          if (action === "mid") enterMid(state.categoryId, id);
        });
      });
    }

    function truncateText(text, max) {
      return text.length > max ? `${text.slice(0, max - 1)}...` : text;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function bindEnter(element, callback) {
      element.addEventListener("click", callback);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          callback();
        }
      });
    }

    function enterRoot() {
      state.level = "root";
      state.categoryId = null;
      state.midId = null;
      render();
    }

    function enterCategory(categoryId) {
      if (!categoryId) return;
      state.level = "category";
      state.categoryId = categoryId;
      state.midId = null;
      render();
    }

    function enterMid(categoryId, midId) {
      state.level = "mid";
      state.categoryId = categoryId;
      state.midId = midId;
      render();
    }

    function render() {
      const category = categoryById(state.categoryId);
      const mid = midById(category, state.midId);
      renderCrumbs();
      renderSideNav();
      if (state.level === "mid" && category && mid) {
        renderMid(category, mid);
      } else if (state.level === "category" && category) {
        renderCategory(category);
      } else {
        renderRoot();
      }
      updateScene();
    }

    resetBtn.addEventListener("click", enterRoot);
    inventoryBtn.addEventListener("click", () => {
      window.location.href = "agent-code-inventory-2026-06-29.md";
    });
    let lastNarrowLayout = window.matchMedia("(max-width: 680px)").matches;

    const canvas = document.querySelector("#tree-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 15);

    const group = new THREE.Group();
    scene.add(group);

    const palette = {
      blue: new THREE.Color("#79bcff"),
      green: new THREE.Color("#32d17d"),
      orange: new THREE.Color("#ff9142"),
      purple: new THREE.Color("#bd8cff"),
      muted: new THREE.Color("#726e68")
    };

    const nodes = [];
    const lines = [];
    let targets = [];

    function makeNode(size, color) {
      const geometry = new THREE.SphereGeometry(size, 24, 16);
      const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .78 });
      const mesh = new THREE.Mesh(geometry, material);
      group.add(mesh);
      nodes.push(mesh);
      return mesh;
    }

    function makeLine(color) {
      const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: .28 });
      const line = new THREE.Line(geometry, material);
      group.add(line);
      lines.push(line);
      return line;
    }

    for (let i = 0; i < 28; i += 1) {
      makeNode(i === 0 ? .14 : .075, palette.muted);
      if (i > 0) makeLine(palette.muted);
    }

    function levelItems() {
      if (state.level === "mid") {
        const category = categoryById(state.categoryId);
        const mid = midById(category, state.midId);
        return {
          tone: category?.tone || "blue",
          count: Math.min(24, Math.max(6, mid?.smalls.length || 6)),
          radius: 5.6
        };
      }
      if (state.level === "category") {
        const category = categoryById(state.categoryId);
        return {
          tone: category?.tone || "blue",
          count: Math.min(24, Math.max(7, category?.mids.length || 7)),
          radius: 5
        };
      }
      return { tone: "blue", count: 12, radius: 4.4 };
    }

    function updateScene() {
      const spec = levelItems();
      const color = palette[spec.tone] || palette.blue;
      targets = [];
      targets.push({ x: 0, y: 0, z: 0, visible: true, color });
      for (let i = 1; i < nodes.length; i += 1) {
        const visible = i <= spec.count;
        const angle = ((i - 1) / Math.max(spec.count, 1)) * Math.PI * 2;
        const wave = Math.sin(i * 1.7 + spec.count) * .65;
        targets.push({
          x: Math.cos(angle) * (spec.radius + wave),
          y: Math.sin(angle) * (spec.radius * .62 + wave * .22),
          z: Math.sin(angle * 2.1) * 1.15,
          visible,
          color
        });
      }
      nodes.forEach((node, index) => {
        node.material.color.copy(index === 0 ? color : color.clone().lerp(palette.muted, .22));
      });
      lines.forEach(line => line.material.color.copy(color));
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      const nextNarrowLayout = window.matchMedia("(max-width: 680px)").matches;
      if (nextNarrowLayout !== lastNarrowLayout) {
        lastNarrowLayout = nextNarrowLayout;
        render();
      }
    }

    function animate(time) {
      const t = time * .001;
      nodes.forEach((node, index) => {
        const target = targets[index] || { x: 0, y: 0, z: 0, visible: false };
        node.position.x += (target.x - node.position.x) * .045;
        node.position.y += (target.y - node.position.y) * .045;
        node.position.z += (target.z - node.position.z) * .045;
        node.material.opacity += ((target.visible ? (index === 0 ? .82 : .66) : 0) - node.material.opacity) * .05;
        node.scale.setScalar((target.visible ? 1 : .2) + Math.sin(t * 1.8 + index) * .025);
      });

      lines.forEach((line, index) => {
        const child = nodes[index + 1];
        const root = nodes[0];
        const visible = (targets[index + 1]?.visible ?? false);
        line.material.opacity += ((visible ? .22 : 0) - line.material.opacity) * .05;
        const positions = line.geometry.attributes.position;
        positions.setXYZ(0, root.position.x, root.position.y, root.position.z);
        positions.setXYZ(1, child.position.x, child.position.y, child.position.z);
        positions.needsUpdate = true;
      });

      group.rotation.z = Math.sin(t * .12) * .035;
      group.rotation.y = Math.sin(t * .16) * .08;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    render();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
